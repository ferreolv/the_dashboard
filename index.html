<script>
/* Read the recovery secret before external resources load. Keep it in memory,
   and remove it from the address and its current history entry immediately. */
function captureDashboardRecoveryLink(){
  if(!/^#\/?reset-password(?:\?|$)/.test(location.hash))return null;
  const query=location.hash.split("?")[1]||"";
  const candidate=new URLSearchParams(query).get("token")||"";
  history.replaceState(history.state,"",location.pathname+location.search+"#/reset-password");
  return {token:/^[A-Za-z0-9_-]{32,512}$/.test(candidate)?candidate:""};
}
let dashboardRecoveryLink=captureDashboardRecoveryLink();
</script>

  /* ===== Daylight v2 design system ===== */
  :root { --canvas:#eef0f2; --text:#17182c; --muted:#727589; --line:rgba(23,24,44,.08); --panel:rgba(255,255,255,.82); --shadow:0 1px 2px rgba(18,22,46,.03),0 16px 48px rgba(38,45,82,.07); --radius:22px; --ease:cubic-bezier(.22,1,.36,1); }
  html { background:var(--canvas); overflow-x:hidden; }
  body { max-width:100%; overflow-x:hidden; color:var(--text); background:#e6eae7 !important; }
  body.theme-neutral { background:#e6eae7 !important; }
  body.theme-atmospheric { background:radial-gradient(circle at 8% 0%,rgba(255,187,135,.27),transparent 28%),radial-gradient(circle at 94% 16%,rgba(150,137,255,.24),transparent 30%),linear-gradient(145deg,#fff1e6,#f4f0ff 54%,#e9f7ff) !important; }
  body.theme-aurora { background:radial-gradient(circle at 12% 8%,rgba(255,140,200,.50),transparent 34%),radial-gradient(circle at 88% 16%,rgba(120,150,255,.48),transparent 36%),radial-gradient(circle at 62% 94%,rgba(110,232,220,.44),transparent 42%),linear-gradient(140deg,#fdeefb,#eef0ff 50%,#e6fbff) !important; background-attachment:fixed !important; }
  body.theme-sunset { background:radial-gradient(circle at 14% 6%,rgba(255,178,116,.52),transparent 36%),radial-gradient(circle at 86% 20%,rgba(255,126,150,.44),transparent 40%),radial-gradient(circle at 70% 96%,rgba(255,205,140,.40),transparent 42%),linear-gradient(150deg,#fff3e8,#ffe9ef 55%,#fff7ec) !important; background-attachment:fixed !important; }
  body.theme-ocean { background:radial-gradient(circle at 12% 10%,rgba(118,200,255,.46),transparent 36%),radial-gradient(circle at 90% 18%,rgba(120,160,255,.42),transparent 40%),radial-gradient(circle at 70% 94%,rgba(126,240,214,.42),transparent 42%),linear-gradient(150deg,#edf7ff,#eafaff 55%,#f0fff8) !important; background-attachment:fixed !important; }
  body.theme-paper { background:#f2ece2 !important; }

  button,input,textarea { -webkit-tap-highlight-color:transparent; }
  button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid rgba(99,102,241,.22); outline-offset:2px; }
  .wrap { width:100%; max-width:1800px; margin:0 auto; padding:18px clamp(16px,3vw,42px) 72px; box-sizing:border-box; }

  .topbar { position:sticky; top:12px; z-index:110; max-width:1396px; margin:0 auto 34px; min-height:58px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:8px 9px 8px 12px; background:rgba(255,255,255,.90); border:1px solid rgba(255,255,255,.96); border-radius:18px; box-shadow:0 12px 38px rgba(34,39,72,.12),inset 0 0 0 1px rgba(23,24,44,.05); backdrop-filter:blur(24px) saturate(1.3); }
  .brand { display:flex; align-items:center; gap:10px; min-width:150px; }
  .brandMark { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; color:#fff; background:linear-gradient(145deg,#6d5dfc,#4a3ad8); box-shadow:0 7px 18px rgba(79,70,229,.25); font-size:15px; font-weight:800; letter-spacing:-.04em; }
  .brandName { font-size:14px; font-weight:800; letter-spacing:-.025em; }
  .topnav { display:flex; align-items:center; padding:3px; border-radius:12px; background:rgba(23,24,44,.045); }
  .navbtn { border:0; background:transparent; color:var(--muted); border-radius:9px; padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; transition:color .2s,background .2s,box-shadow .2s; }
  .navbtn.active { color:var(--text); background:#fff; box-shadow:0 1px 3px rgba(23,24,44,.10); }
  .topActions { display:flex; align-items:center; gap:7px; }
  .actionBtn { height:38px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 13px; border:1px solid var(--line); border-radius:11px; color:#4c4f64; background:rgba(255,255,255,.76); font-size:11.5px; font-weight:700; cursor:pointer; transition:transform .2s var(--ease),box-shadow .2s,background .2s; }
  .actionBtn:hover { transform:translateY(-1px); background:#fff; box-shadow:0 7px 18px rgba(23,24,44,.09); }
  .actionBtn.primary { color:#fff; border-color:#17182c; background:#17182c; box-shadow:0 7px 18px rgba(23,24,44,.18); }
  .actionBtn.active { color:#fff; background:#6257e7; border-color:#6257e7; }
  .actionBtn svg { width:15px; height:15px; stroke-width:1.9; }

  .dashboardHero { max-width:1800px; margin:0 auto 24px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
  .heroCopy { min-width:0; }
  .heroEyebrow { color:#7a7d91; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:7px; }
  .dashboardHero h1 { margin:0; color:#16172a; font-size:clamp(30px,4vw,48px); line-height:1.03; letter-spacing:-.052em; font-weight:750; }
  .heroStatus { margin:10px 0 0; color:#777a8e; font-size:13px; line-height:1.45; }
  .heroSummary { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
  .progressOrb { --p:0; width:76px; height:76px; border-radius:50%; display:grid; place-items:center; position:relative; background:conic-gradient(#6257e7 calc(var(--p)*1%),rgba(98,87,231,.10) 0); box-shadow:inset 0 0 0 1px rgba(98,87,231,.08); }
  .progressOrb::before { content:""; position:absolute; inset:6px; border-radius:50%; background:#fff; box-shadow:0 4px 14px rgba(23,24,44,.06); }
  .progressValue { position:relative; z-index:1; font-size:15px; font-weight:800; letter-spacing:-.03em; }
  .metric { min-width:82px; padding:11px 13px; background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.9); border-radius:14px; box-shadow:0 7px 24px rgba(23,24,44,.05); }
  .metricValue { display:block; font-size:16px; font-weight:800; letter-spacing:-.035em; }
  .metricLabel { display:block; margin-top:2px; color:#85889a; font-size:9.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .heroClock { color:#5a5d70; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }

  .grid { gap:16px; grid-auto-rows:104px; max-width:1800px; }
  .tile { isolation:isolate; border-radius:var(--radius); padding:17px 18px 18px; color:var(--ink); background:var(--tileBg); border:1px solid rgba(255,255,255,.78); box-shadow:var(--glow),var(--shadow); transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s,background .5s var(--ease),color .35s; }
  .tile::before { content:""; position:absolute; z-index:-1; left:18px; right:18px; top:0; height:2px; border-radius:0 0 4px 4px; background:var(--accent); opacity:.0; transform:scaleX(.55); transition:opacity .25s,transform .35s var(--ease); }
  .tile.completed::before { opacity:.85; transform:scaleX(1); background:rgba(255,255,255,.92); }
  .tile.completed { border-color:rgba(255,255,255,.24); box-shadow:var(--glow),0 18px 48px rgba(28,32,65,.13); }
  .tile.completed .ldot { background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.14); }
  .tile.completed .lbl,.tile.completed .muted,.tile.completed .link { color:var(--lbl); }
  .tile.completed .qopt { color:#fff; background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.20); }
  .tile.completed .qopt.correct { color:#14532d; background:#dcfce7; border-color:#86efac; }
  .tile.completed .qopt.wrong { color:#7f1d1d; background:#fee2e2; border-color:#fca5a5; }
  .tile.completed input,.tile.completed textarea { color:#fff; }
  .tile.completed input::placeholder,.tile.completed textarea::placeholder { color:rgba(255,255,255,.62); }
  .tbody { scrollbar-width:none!important; -ms-overflow-style:none; }
  .tbody::-webkit-scrollbar,.chatLog::-webkit-scrollbar,.ovl::-webkit-scrollbar { display:none!important; width:0!important; height:0!important; }
  .chatLog,.ovl { scrollbar-width:none; }
  a,.link,.qretry { text-decoration:none!important; }
  .link { display:inline-flex; align-items:center; gap:5px; color:var(--accentDark); }
  .link:hover { opacity:.68; }
  .tile input,.tile textarea,.tile select { color:var(--ink)!important; -webkit-text-fill-color:var(--ink); caret-color:var(--accent); }
  .tile input::placeholder,.tile textarea::placeholder { color:var(--dim)!important; -webkit-text-fill-color:var(--dim); opacity:1; }
  .mindTree { display:flex; flex-direction:column; gap:8px; padding:4px 0; }
  .mindNode { position:relative; margin-left:calc(var(--depth,0) * 15px); }
  .mindNode::before { content:""; position:absolute; left:-10px; top:0; bottom:0; width:1px; background:linear-gradient(var(--mindAccent,#6257e7),transparent); opacity:.28; }
  .mindNodeHead { display:flex; align-items:center; gap:8px; min-height:30px; font-size:13px; font-weight:800; letter-spacing:-.01em; }
  .mindNodeDot { width:7px; height:7px; flex:none; border-radius:50%; background:var(--mindAccent,#6257e7); box-shadow:0 0 0 4px color-mix(in srgb,var(--mindAccent,#6257e7) 12%,transparent); }
  .mindEntries { display:flex; flex-direction:column; gap:5px; margin:2px 0 7px 15px; }
  .mindEntry { display:flex; align-items:flex-start; gap:10px; padding:8px 10px; border-radius:10px; background:rgba(98,87,231,.045); color:#34364a; font-size:12.5px; line-height:1.42; }
  .mindEntry span { flex:1; }

  /* Candy mode: playful reward, disciplined system */
  body { background:radial-gradient(circle at 6% 2%,rgba(170,145,255,.20),transparent 26%),radial-gradient(circle at 96% 12%,rgba(107,216,255,.20),transparent 25%),radial-gradient(circle at 48% 100%,rgba(255,151,195,.13),transparent 30%),#f8f7ff; }
  .dashboardHero h1 { color:#201c3c; }
  .progressOrb { background:conic-gradient(#7c5cff calc(var(--p)*1%),rgba(159,138,255,.16) 0); box-shadow:0 10px 26px rgba(111,85,237,.13),inset 0 0 0 1px rgba(98,87,231,.10); }
  .metric { border-color:rgba(255,255,255,.96); box-shadow:0 9px 24px rgba(74,62,133,.07); }
  .metric:nth-child(2) { background:linear-gradient(145deg,#fff,#f2edff); }
  .metric:nth-child(3) { background:linear-gradient(145deg,#fff,#fff0f6); }
  .metric:nth-child(4) { background:linear-gradient(145deg,#fff,#ebf8ff); }
  .grid { gap:14px; }
  .tile { border-radius:24px; border:1.5px solid rgba(255,255,255,.82); box-shadow:var(--glow),0 9px 0 -6px color-mix(in srgb,var(--candyShadow) 18%,transparent),0 18px 42px rgba(58,45,105,.075); }
  .tile::after { content:""; position:absolute; z-index:-1; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(circle at 88% 4%,rgba(255,255,255,.62),transparent 25%),linear-gradient(115deg,rgba(255,255,255,.20),transparent 30%); opacity:.72; }
  .tile:not(.editing):hover { transform:translateY(-4px) scale(1.004); border-color:rgba(255,255,255,.98); box-shadow:var(--glow),0 12px 0 -7px color-mix(in srgb,var(--candyShadow) 25%,transparent),0 25px 52px rgba(60,44,111,.13); }
  .tile.completed { animation:candyPop .52s var(--ease) both; box-shadow:var(--glow),0 12px 0 -7px color-mix(in srgb,var(--candyShadow) 48%,transparent),0 25px 54px rgba(50,37,97,.16); }

  /* Universal widget contract

  .tile{

  /* ===== Liquid-glass polish (ui-ux-pro-max pass) ==============================
     Keeps each tile's own hue: light frosted glass at rest → vivid glass when
     ticked. A faint hue tint + two-layer specular highlight + inner depth make
     the surface read as real refracting glass rather than flat translucency. */
  /* Near-clear glass: the background shows through; colour lives in a faint tint
     + the luminous rim. Thin border; the bright edge comes from the ::before ring. */
  .tile{
    background:color-mix(in srgb,var(--accent) 8%,rgba(255,255,255,.12))!important;
    border:1px solid color-mix(in srgb,var(--accent) 20%,rgba(255,255,255,.45))!important;
    -webkit-backdrop-filter:blur(14px) saturate(180%) brightness(1.06)!important;
    backdrop-filter:blur(14px) saturate(180%) brightness(1.06)!important;
    box-shadow:
      inset 0 -10px 24px color-mix(in srgb,var(--accent) 10%,transparent),
      inset 0 0 20px rgba(255,255,255,.10),
      0 14px 34px rgba(26,26,54,.14),
      0 2px 6px rgba(26,26,54,.07)!important;
  }
  /* No hard rim line — the edge is the clean 1px border. */
  .tile::before{ display:none!important; }
  /* A single soft sheen from the top — a broad glow, never a sharp line. */
  .tile::after{
    opacity:.8!important;
    background:radial-gradient(140% 95% at 74% -30%,rgba(255,255,255,.5),transparent 58%)!important;
  }
  .tile:not(.editing):hover{border-color:color-mix(in srgb,var(--accent) 12%,rgba(255,255,255,.7))!important}
  /* Completed: vivid but still glassy — a translucent hue fill with a bright white rim. */
  .tile.completed{
    background:linear-gradient(150deg,
      color-mix(in srgb,var(--accent) 78%,rgba(255,255,255,.20)),
      color-mix(in srgb,var(--accent) 64%,var(--accentDark)))!important;
    border-color:rgba(255,255,255,.5)!important;
    box-shadow:
      inset 0 -16px 32px color-mix(in srgb,var(--accent) 34%,transparent),
      0 16px 38px color-mix(in srgb,var(--accent) 30%,transparent),
      0 2px 6px rgba(26,26,54,.10)!important;
  }
  .tile.completed::after{
    opacity:.9!important;
    background:radial-gradient(140% 95% at 74% -28%,rgba(255,255,255,.55),transparent 56%)!important;
  }
  /* Accessibility: a clear keyboard-focus ring in the tile's hue (skill priority #1). */
  .tile a:focus-visible,.tile button:focus-visible,.tile input:focus-visible,
  .tile textarea:focus-visible,.tile select:focus-visible,.tile [tabindex]:focus-visible,
  .navbtn:focus-visible,.actionBtn:focus-visible,.pill:focus-visible{
    outline:2.5px solid color-mix(in srgb,var(--accent) 72%,#fff)!important;
    outline-offset:2px!important;
  }
  .tile.completed a:focus-visible,.tile.completed button:focus-visible,
  .tile.completed input:focus-visible,.tile.completed [tabindex]:focus-visible{
    outline-color:rgba(255,255,255,.92)!important;
  }
  /* Honour reduced-motion for the hover lift and any looping animation. */
  @media (prefers-reduced-motion:reduce){
    .tile:not(.editing):hover{transform:none!important}
    .tile,.tile *{animation-duration:.001ms!important;animation-iteration-count:1!important}
  }
  /* Weather: stretch the single grid row to the full tile height so the two
     cards fill it instead of hugging the top. */
  .tile[data-tileid="weather"] .weatherSplit{flex:1 1 auto!important;height:auto!important;grid-template-rows:minmax(0,1fr)!important;align-content:stretch!important;align-items:stretch!important}
  .tile[data-tileid="weather"] .weatherNow,.tile[data-tileid="weather"] .wtomorrow{height:100%!important}
  .tile[data-tileid="weather"] .weatherNow{display:flex!important;align-items:center!important;gap:14px!important}
  .tile[data-tileid="weather"] .wtomorrow{justify-content:center!important}
  /* Habits: ONE authoritative layout that overrides every earlier fixed-width /
     flex rule. A uniform auto-fill grid — every circle is identical, they stack
     neatly and wrap to as many per row as the tile width allows, at any column
     span. auto-fill (not auto-fit) keeps circles from stretching when few. */
  .tile[data-tileid="habits"] .hgrid{
    display:grid!important;
    grid-template-columns:repeat(auto-fill,minmax(clamp(62px,19cqi,92px),1fr))!important;
    gap:clamp(7px,2.6cqi,13px)!important;
    align-content:start!important;justify-content:start!important;
    width:100%!important;height:auto!important;overflow:visible!important;
  }
  .tile[data-tileid="habits"] .hsq{
    width:auto!important;min-width:0!important;max-width:none!important;
    height:auto!important;min-height:0!important;max-height:none!important;
    flex:initial!important;flex-basis:auto!important;
    aspect-ratio:1/1!important;border-radius:50%!important;
  }
  .tile[data-tileid="habits"] .hsq .hicon{font-size:clamp(20px,7.5cqi,31px)!important}
  .tile[data-tileid="habits"] .hsq .hname{font-size:clamp(10px,2.7cqi,13px)!important;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* the plus/add cell follows the same footprint so the grid stays even */
  .tile[data-tileid="habits"] .hsq.plus{aspect-ratio:1/1!important}
  /* Stats tile: a compact push-up trend as a line-with-dots (scatter) chart.
     Takes less vertical room than the old bars and reads the trend at a glance. */
  .tile[data-tileid="weekly"] .chartSec{min-height:0}
  .tile[data-tileid="weekly"] .pushLine{min-height:46px;max-height:88px}
  .tile.completed[data-tileid="weekly"] .pushLinePath{stroke:#fff!important;opacity:.9}
  .tile.completed[data-tileid="weekly"] .pushDot{background:#fff!important;box-shadow:none!important}
  .tile.completed[data-tileid="weekly"] .pushDot.today{background:var(--accent)!important;border-color:#fff!important}
  .tile.completed[data-tileid="weekly"] .pushDotVal{color:#fff!important}

  /* ============================================================
     Design boost — pushups (1×1), goals, weather, stats.
     Every rule is checked in BOTH the pastel (undone) and vivid
     (.completed) states so contrast holds either way.
     ============================================================ */

  /* --- Push-ups: a clean vertical layout for the 1-wide tile — a count hero
         above a compact button pad. Short (1×1) → one button row; taller → 2×2. --- */
  .tile[data-tileid="pushups"][data-cols="1"] .pushWrap{flex-direction:column!important;align-items:stretch!important;justify-content:center!important;gap:8px!important;padding:2px 0!important}
  .tile[data-tileid="pushups"][data-cols="1"] .pushCount{text-align:center!important;letter-spacing:-.045em;line-height:.82!important}
  .tile[data-tileid="pushups"][data-cols="1"] .pushBtns{display:grid!important;gap:5px!important;width:100%!important;flex:none!important;align-self:stretch!important;height:auto!important}
  .tile[data-tileid="pushups"][data-cols="1"] .pushBtns .puBtn{width:100%!important;min-width:0!important;height:auto!important;font-weight:850!important;border-radius:11px!important}
  .tile[data-tileid="pushups"][data-cols="1"] .pushBtns .puReset{width:100%!important;flex:none!important}
  /* short 1×1: number moderate, all four controls in a single row */
  .tile[data-tileid="pushups"][data-cols="1"][data-rows="1"] .pushCount{font-size:clamp(22px,22cqi,34px)!important}
  .tile[data-tileid="pushups"][data-cols="1"][data-rows="1"] .pushBtns{grid-template-columns:repeat(4,1fr)!important}
  .tile[data-tileid="pushups"][data-cols="1"][data-rows="1"] .pushBtns .puBtn{min-height:27px!important;padding:4px 2px!important;font-size:11px!important}
  /* taller 1-wide (1×2+): big hero number, a 2×2 pad, and a "reps" cue */
  .tile[data-tileid="pushups"][data-cols="1"]:not([data-rows="1"]) .pushCount{font-size:clamp(34px,32cqi,54px)!important}
  .tile[data-tileid="pushups"][data-cols="1"]:not([data-rows="1"]) .pushCount::after{content:"reps today";display:block;margin-top:6px;font:900 8.5px/1 'Nunito',sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.62}
  .tile[data-tileid="pushups"][data-cols="1"]:not([data-rows="1"]) .pushBtns{grid-template-columns:1fr 1fr!important}
  .tile[data-tileid="pushups"][data-cols="1"]:not([data-rows="1"]) .pushBtns .puBtn{min-height:33px!important;padding:6px 4px!important;font-size:12.5px!important}

  /* --- Goals: built-in, airy day groups. No boxy cards — days are separated by
         hairlines and generous spacing; "Today" is set apart by an accent header;
         future days get a quiet collapsible add instead of a full input. --- */
  .tile[data-tileid="goals"] .goalDay{padding:0 0 14px!important;margin:0 0 14px!important;background:none!important;border:0!important;border-bottom:1px solid color-mix(in srgb,var(--accent) 14%,var(--hair))!important;box-shadow:none!important;border-radius:0!important}
  .tile[data-tileid="goals"] .goalDay:last-child{margin-bottom:0!important;padding-bottom:0!important;border-bottom:0!important}
  .tile[data-tileid="goals"] .goalDayHead{align-items:center;margin-bottom:7px}
  .tile[data-tileid="goals"] .goalDayHead .lbl{font-size:11px;font-weight:850;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
  .tile[data-tileid="goals"] .goalDay:first-child .goalDayHead .lbl{color:var(--accentDark);font-size:12.5px}
  .tile[data-tileid="goals"] .goalDayHead .muted{padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,rgba(255,255,255,.35));color:var(--accentDark);font-weight:850;font-size:10px!important;opacity:1}
  .tile[data-tileid="goals"] .goalRow{align-items:center;gap:10px;padding:5px 2px;border-radius:9px}
  .tile[data-tileid="goals"] .goalRow+.goalRow{margin-top:1px}
  .tile[data-tileid="goals"] .goalRow.done .goalText{opacity:.6;text-decoration:line-through}
  .tile[data-tileid="goals"] .goalTick{flex:none;border-radius:7px}
  .tile[data-tileid="goals"] .goalInputRow{margin-top:8px}
  /* quiet collapsible add for non-today days */
  .goalAddGhost{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:4px 4px;border:0;background:none;color:var(--dim);font:800 11.5px/1 'Nunito',sans-serif;letter-spacing:.02em;cursor:pointer;opacity:.7;transition:opacity .15s,color .15s}
  .goalAddGhost:hover{opacity:1;color:var(--accentDark)}
  .tile.completed[data-tileid="goals"] .goalDay{border-bottom-color:rgba(255,255,255,.22)!important}

  .tile.completed[data-tileid="goals"] .goalAddGhost{color:rgba(255,255,255,.8)!important}

  /* --- Weather: seat the icon in a soft disc, strengthen the reading,
         give the panels a gentle luminous fill. --- */
  .tile[data-tileid="weather"]:not([data-rows="1"]) .weatherEmoji{display:grid;place-items:center;width:clamp(46px,18cqi,66px);height:clamp(46px,18cqi,66px);border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6),color-mix(in srgb,var(--accent) 16%,rgba(255,255,255,.2)));box-shadow:inset 0 1px 2px rgba(255,255,255,.6),0 4px 12px color-mix(in srgb,var(--accent) 16%,transparent)}
  .tile[data-tileid="weather"] .weatherReading .wbig{font-weight:900;letter-spacing:-.03em;color:var(--accentDark)}

  .tile.completed[data-tileid="weather"]:not([data-rows="1"]) .weatherEmoji{background:rgba(255,255,255,.20);box-shadow:inset 0 1px 2px rgba(255,255,255,.4)}
  .tile.completed[data-tileid="weather"] .weatherReading .wbig{color:#fff!important}
  .tile.completed[data-tileid="weather"] .weatherNow,.tile.completed[data-tileid="weather"] .wtomorrow{background:rgba(255,255,255,.14)!important;border-color:rgba(255,255,255,.3)!important}

  /* --- Stats: richer achievement cards with a clear number hierarchy. --- */
  .tile[data-tileid="weekly"] .wrevAch{gap:9px}

  .tile[data-tileid="habits"] .habitControl>button:focus-visible{outline:2px solid currentColor;outline-offset:3px}

  /* Dashboard finish: quiet navigation, readable fields, and colour-led tiles. */

  .heroSummary .progressOrb::before{inset:4px;background:#edf0ed;box-shadow:none}

  .tile{border:2px solid color-mix(in srgb,var(--accent) 60%,rgba(255,255,255,.45))!important;border-radius:21px!important;background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.12))!important;box-shadow:0 4px 17px rgba(34,40,36,.065),inset 0 1px 1px rgba(255,255,255,.5)!important;font-weight:600;transition:background .2s,border-color .2s,box-shadow .2s,color .2s}

.miniCalNav svg{width:17px;height:17px}.tile[data-tileid="agenda"] button.miniCalToday{flex:none!important;width:36px!important;min-width:36px!important;max-width:36px!important;background:transparent!important;opacity:.6}
.tile[data-tileid="agenda"] .miniCalWeek span{font-size:10px!important;font-weight:700;padding:2px 0 8px!important;border:0!important;opacity:.5}
.tile[data-tileid="agenda"] .miniCalGrid{gap:3px 0}
.tile[data-tileid="agenda"] button.miniCalDay{display:flex!important;flex-direction:column;align-items:center;justify-content:center;min-height:36px!important;height:36px!important;padding:0!important;border:0!important;border-radius:10px!important;background:transparent!important;overflow:visible;box-shadow:none!important}
.tile[data-tileid="agenda"] button.miniCalDay:hover{background:rgba(255,255,255,.32)!important}
.tile[data-tileid="agenda"] .miniCalNum{width:27px!important;height:27px!important;margin:0!important;font-size:12px!important;font-weight:700;line-height:1}

.tile[data-tileid="agenda"] .miniCalDay.selected{background:rgba(255,255,255,.4)!important;box-shadow:inset 0 0 0 1px var(--ink)!important}
.tile[data-tileid="agenda"] .miniCalEvents{display:flex;flex-direction:row;justify-content:center;gap:2px;min-height:4px;margin:0}
.miniCalDot{display:block;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.45}.miniCalDot.due{opacity:1}.miniCalDot.done{opacity:.2}
.tile[data-tileid="agenda"] .agendaItems{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile[data-tileid="agenda"] .taskRow{padding:8px 0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;gap:8px}
.tile[data-tileid="agenda"] .taskRow.calendarSelected{box-shadow:inset 2px 0 currentColor!important;padding-left:10px!important}
.tile[data-tileid="agenda"] .taskRow.later{opacity:.65}.tile[data-tileid="agenda"] .taskMain{min-height:44px!important;min-width:0;flex:1;padding:0!important}
.tile[data-tileid="agenda"] .agName{font-size:14px!important;font-weight:700}.tile[data-tileid="agenda"] .agSub{font-size:11px!important;opacity:.6;margin-top:2px}.tile[data-tileid="agenda"] .agWhen{font-size:10px!important;font-weight:650;padding:0!important;border:0!important;background:transparent!important;white-space:normal;max-width:58px;text-align:right}
.tile[data-tileid="agenda"] .taskAddLink{align-self:flex-end}
@container (min-width:520px){.tile[data-tileid="agenda"] .taskAgenda{grid-template-columns:minmax(240px,1fr) minmax(0,1fr);gap:24px!important}.tile[data-tileid="agenda"] .agendaItems{padding-top:8px}}
@media(prefers-reduced-motion:reduce){.tile[data-tileid] :is(button,a).widgetIconButton{transition:none}}

.grid>.tile[data-tileid]{grid-row:span var(--tile-span-rows)!important}

.philoWorkspace[hidden]{display:none!important}.philoPreviewAction{align-self:flex-start;margin-top:4px}.tileFootMinimal{min-height:0!important;margin-top:6px!important}.tileFootMinimal:has(>span:empty):not(:has(.tileSaveState)){display:none!important}

/* Compact utilities keep their authored proportions without losing touch targets. */
.grid>.tile[data-tileid="breathing"][data-rows] .breathCard{align-items:center!important}
.grid>.tile[data-family="small"] .tileMount{display:flex;flex-direction:column;justify-content:center}
@media(max-width:639px){
 .grid>.curatedTile:not(.editing):not(.cornerOutside)[data-expandable] .tileMount{padding-top:18px}
 .grid>.curatedTile:not(.editing):not(.cornerOutside)[data-family="small"] .tileMount{padding-top:4px}
 .grid>.curatedTile[data-tileid="timer"] .tileMount{padding-top:6px!important}
 .grid>.curatedTile[data-tileid="music"] .tileMount{padding-top:10px!important}
 .grid>.tile[data-tileid="timer"] .content{padding:0!important}
 .grid>.tile[data-tileid="breathing"][data-rows] .breathStage,.grid>.tile[data-tileid="breathing"][data-rows] .breathProgress{width:52px!important;height:52px!important;min-height:0!important}
 .grid>.tile[data-tileid="breathing"] .breathCount{font-size:20px!important}
 .grid>.tile[data-tileid="breathing"] .breathPhase{font-size:14px!important}
}

.tile[data-tileid="shopping"] .shoppingPicked{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px}
.tile[data-tileid] .shopChip{display:flex;align-items:center;width:100%!important;height:auto!important;min-height:44px!important;flex:0 0 auto!important;box-sizing:border-box;padding:0 6px!important;border:0!important;background:rgba(255,255,255,.12)!important;box-shadow:none!important}
.tile[data-tileid] .shopChip>.del{position:static!important;inset:auto!important;width:44px!important;min-width:44px!important;max-width:44px!important;height:44px!important;min-height:44px!important;flex:0 0 44px!important;margin:0!important;transform:none!important}
.tile[data-tileid] button.shopItemToggle{display:flex;align-items:center;gap:10px;min-height:44px!important;flex:1;min-width:0;max-width:100%;padding:4px 6px!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:var(--ink)!important;text-align:left;font:inherit;cursor:pointer;transform:none!important}
.tile[data-tileid] .shopItemToggle>span:last-child{display:block!important;flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;font-size:16px!important}.tile[data-tileid] .shopChip.done .shopItemToggle{opacity:.5}
.tile[data-tileid] .healthMetric{border:0!important;border-radius:0!important;background:transparent!important;padding:6px 0!important;box-shadow:none!important}.tile[data-tileid] .healthGrid{gap:16px!important}.tile[data-tileid] .healthMetric span{font-weight:600!important}
/* ================= tile identity pass =================
   Each tile's own design carries its identity; controls are intrinsic, not pills. */

/* --- Word as a dictionary entry --- */
.dictEntry{display:flex;flex-direction:column;min-height:0}
.dictHeadline{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.dictWord{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:clamp(21px,9cqi,27px);font-weight:700;letter-spacing:-.01em;color:var(--accentDark);line-height:1.05}
.dictIpa{font-size:12.5px;color:var(--dim);font-weight:600}
.dictPos{font-family:Georgia,serif;font-style:italic;font-size:12.5px;color:var(--accent);margin-top:2px;padding-bottom:7px;border-bottom:1px solid var(--hair)}
.dictSense{display:flex;gap:8px;margin:8px 0 0;font-size:13.8px;line-height:1.5}
.dictNum{font-family:Georgia,serif;font-weight:700;color:var(--accent);font-size:13px;flex:none}
.dictXlat{margin:7px 0 2px;font-size:13px;line-height:1.45}
.dictLangTag{display:inline-block;font:800 8.5px/1 'Nunito',sans-serif;letter-spacing:.08em;color:var(--accentDark);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:5px;padding:3px 5px;margin-right:7px;vertical-align:1px}
.dictXlatDef{color:var(--dim)}
.tile.completed .dictWord,.tile.completed .dictPos,.tile.completed .dictNum,.tile.completed .dictLangTag{color:#fff!important}
.tile.completed .dictLangTag{background:rgba(255,255,255,.2)}
.tile.completed .dictIpa,.tile.completed .dictXlatDef{color:rgba(255,255,255,.76)!important}

/* --- Music: the big bold note IS the link --- */
.musicCard{display:flex;gap:14px;align-items:flex-start;min-height:0}
a.musicNote,.tile a.musicNote{flex:none;display:grid;place-items:center;width:clamp(54px,26cqi,84px);height:clamp(54px,26cqi,84px);min-height:0;border-radius:26px;font:900 clamp(32px,17cqi,52px)/1 Georgia,serif;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent) 55%,var(--accentDark));box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.35);text-decoration:none;transform:rotate(-6deg);transition:transform .25s ease,box-shadow .25s ease;padding:0;border:0}
a.musicNote:hover{transform:rotate(-6deg) scale(1.06)}
a.musicNote:active{transform:rotate(-6deg) scale(.94)}
a.musicNote.matching{animation:musicPulse 1.1s ease-in-out infinite}
@keyframes musicPulse{50%{transform:rotate(-6deg) scale(.96);opacity:.82}}
.musicMeta{min-width:0;flex:1}
.musicComposer{font-size:12px;color:var(--dim);margin-top:2px}
.tile.completed a.musicNote{background:rgba(255,255,255,.95)!important;color:var(--accentDark)!important;box-shadow:0 10px 22px -12px rgba(0,0,0,.35)}
.tile.completed .musicComposer,.tile.completed .musicWhy{color:rgba(255,255,255,.78)!important}
.tile[data-cols="1"] .musicCard{flex-direction:column;align-items:center;text-align:center}

/* --- Recall: a real flashcard deck --- */
.recallDeck{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.recallCard3d{position:relative;flex:1;min-height:118px;perspective:900px;-webkit-tap-highlight-color:transparent}
.tile button.recallCard3d,.tile.completed button.recallCard3d,button.recallCard3d{min-height:118px;height:auto;border:none!important;border-radius:17px!important;background:transparent!important;box-shadow:none!important;padding:0;font:inherit;color:inherit;cursor:pointer}
.tile button.recallCard3d:hover{background:transparent!important;border:none!important;transform:none;filter:none}
.recallFace{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:12px 14px;border-radius:17px;background:linear-gradient(160deg,rgba(255,255,255,.72),color-mix(in srgb,var(--accent) 10%,rgba(255,255,255,.4)));border:1px solid color-mix(in srgb,var(--accent) 26%,#fff);box-shadow:0 3px 0 -1px color-mix(in srgb,var(--accent) 24%,#fff),0 7px 0 -3px color-mix(in srgb,var(--accent) 15%,#fff),0 14px 22px -12px color-mix(in srgb,var(--accent) 38%,transparent);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s cubic-bezier(.2,.75,.3,1.08);overflow:hidden}
.recallFace.recallFront{transform:rotateY(0)}
.recallFace.recallBackface{transform:rotateY(180deg)}
.recallCard3d.flipped .recallFront{transform:rotateY(-180deg)}
.recallCard3d.flipped .recallBackface{transform:rotateY(0)}
.recallTag{font:800 9px/1 'Nunito',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 7px;border-radius:99px}
.recallPrompt{font-size:14.5px;font-weight:750;line-height:1.35;color:var(--ink,#1d2030);display:block;overflow:hidden}
.recallAnswerBig{font-size:15.5px;font-weight:850;color:var(--accentDark);line-height:1.3}
.recallDetail{font-size:12px;line-height:1.4;color:var(--dim,#667);display:block;overflow:hidden;max-height:4.3em}
.recallMetaRow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.recallCount{font:800 11px/1 'Nunito',sans-serif;color:var(--dim,#667);letter-spacing:.04em}
.tile button.recallBack,button.recallBack{min-height:0;width:28px;height:28px;border:none!important;border-radius:9px!important;background:color-mix(in srgb,var(--accent) 10%,transparent)!important;box-shadow:none!important;color:var(--accentDark)!important;padding:0;font-size:13px;cursor:pointer;display:grid;place-items:center;flex:none}
.tile button.recallBack:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)!important;border:none!important;transform:none}
.tile.completed button.recallBack{background:rgba(255,255,255,.16)!important;color:#fff!important}
.recallBackSpacer{width:28px;height:28px;flex:none}
.recallSegs{display:flex;gap:4px;flex:none}
.recallSeg{flex:1;height:4px;border-radius:99px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.recallSeg.on{background:var(--accent)}
.recallSeg.cur{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.recallDeck .recallRatings{margin-top:0}
.recallDone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accentDark);font-weight:750;min-height:84px}
.recallDoneGlyph{font-size:24px}
.tile.completed .recallFace{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);box-shadow:0 3px 0 -1px rgba(255,255,255,.22),0 7px 0 -3px rgba(255,255,255,.12)}
.tile.completed .recallPrompt,.tile.completed .recallAnswerBig,.tile.completed .recallDone{color:#fff}
.tile.completed .recallTag{color:#fff;background:rgba(255,255,255,.18)}
.tile.completed .recallDetail{color:rgba(255,255,255,.75)}
.tile.completed .recallSeg{background:rgba(255,255,255,.25)}
.tile.completed .recallSeg.on{background:#fff}
.tile.completed .recallCount{color:rgba(255,255,255,.8)}
.recallDeck.big{gap:12px}
.recallDeck.big .recallCard3d,.tile button.recallCard3d:where(.recallDeck.big *){min-height:230px}
.recallDeck.big .recallPrompt{font-size:17.5px}
.recallDeck.big .recallAnswerBig{font-size:19px}
.recallDeck.big .recallDetail{font-size:13.5px;max-height:9em}
.recallDeck.big .recallRating{flex-direction:column;gap:3px}
.recallWhen{font:700 10px/1.1 'Nunito',sans-serif;color:var(--dim,#667)}
.recallSource{font-size:12px;color:var(--dim,#778);margin:2px 2px 0;text-align:center}

/* --- Breathing: the circle is the button --- */
.tile button.breathOrb,.tile.completed button.breathOrb{min-height:0;padding:0;border:none!important;border-radius:50%!important;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 46%,white),var(--accent) 58%,var(--accentDark))!important;color:#fff!important;box-shadow:0 14px 32px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.66)!important;cursor:pointer;font:inherit}
.tile button.breathOrb:hover{background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 46%,white),var(--accent) 58%,var(--accentDark))!important;border:none!important;transform:scale(calc(var(--breath-scale,.78) * 1.04));filter:none}
.tile button.breathOrb.inhale,.tile button.breathOrb.exhale{box-shadow:0 18px 38px color-mix(in srgb,var(--accent) calc(18% + var(--breath-amount,0) * 22%),transparent),inset 0 1px 0 rgba(255,255,255,.72)!important}
.tile button.breathOrb.idle{box-shadow:0 12px 24px color-mix(in srgb,var(--accent) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.66)!important}
button.breathOrb:focus-visible{outline:2px solid var(--accentDark);outline-offset:4px}

/* --- Deutsch vocab rows: article + word, gloss, French-respelled pronunciation --- */
.deRow{display:flex;flex-direction:column;gap:1px;padding:6px 0;border-bottom:1px solid var(--hair)}
.deRow:last-child{border-bottom:none}
.deWords{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.deTerm{font-weight:800;font-size:14px;color:var(--accentDark)}
.deFr{font-size:12.8px;color:var(--dim);text-align:right}
.dePron{font-size:11px;font-style:italic;color:color-mix(in srgb,var(--accent) 70%,var(--dim))}
.tile.completed .deTerm{color:#fff}
.tile.completed .deFr{color:rgba(255,255,255,.78)}
.tile.completed .dePron{color:rgba(255,255,255,.62)}

/* --- Movies: a strip of film in the dark --- */
.movieCard{display:flex;flex-direction:column;flex:1;min-height:0;gap:10px}
.movieStrip{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:84px;border-radius:14px;background:linear-gradient(165deg,color-mix(in srgb,var(--accentDark) 82%,#000),color-mix(in srgb,var(--accentDark) 55%,#000));padding:8px 10px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 22px -14px color-mix(in srgb,var(--accentDark) 80%,#000)}
.movieSprockets{display:block;height:7px;flex:none;background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.75) 6px 14px,transparent 14px 20px);border-radius:2px}
.movieFrame{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:0;padding:3px 6px}
.movieNowTitle,.tile .movieNowTitle{font-weight:900;font-size:clamp(15px,7cqi,19px);line-height:1.15;color:#fff!important;letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.movieUpNext,.tile .movieUpNext{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.58)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .movieStrip .movieAddInput{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.25)!important;color:#fff!important;-webkit-text-fill-color:#fff!important;text-align:center}
.tile .movieStrip .movieAddInput::placeholder{color:rgba(255,255,255,.6)!important;-webkit-text-fill-color:rgba(255,255,255,.6)!important}
.movieQueueN{font:800 11px/1 'Nunito',sans-serif;color:var(--accent,#D62839);width:16px;flex:none;text-align:right}
.movieList{display:flex;flex-direction:column;gap:2px}
.movieManager .movieAddInput{margin-bottom:8px}
.tile.completed .movieStrip{background:rgba(20,8,10,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}

/* ================= tile identity pass, round 2 ================= */
.tile[data-tileid="movie"] .content{display:flex;flex-direction:column}
.tile[data-tileid="recall"] .content{display:flex;flex-direction:column}

/* --- Events as admission tickets: stub with the big day count, perforation,
       then the plan itself. Alternating tilt keeps the pile playful. --- */
.eventHero.eventTicket{display:flex;align-items:stretch;gap:0;padding:0;border-radius:13px;overflow:visible;
  -webkit-mask:radial-gradient(circle 7px at 74px 0,transparent 96%,#000 100%),radial-gradient(circle 7px at 74px 100%,transparent 96%,#000 100%);
  -webkit-mask-composite:source-in;mask:radial-gradient(circle 7px at 74px 0,transparent 96%,#000 100%),radial-gradient(circle 7px at 74px 100%,transparent 96%,#000 100%);mask-composite:intersect}
.eventTicket.tiltA{transform:rotate(-.7deg)}
.eventTicket.tiltB{transform:rotate(.7deg)}
/* Tickets read horizontally, so they stack — overriding the 2-up event grid. */
.eventList.eventComposition:has(.eventTicket){display:flex!important;flex-direction:column;grid-template-columns:none!important;gap:10px!important}
.tileFocusSurface .eventComposition:has(.eventTicket){grid-template-columns:none!important}
.eventComposition .eventHero.eventTicket{padding:0!important}
.eventTicket::after{display:none}
.ticketStub{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:10px 6px;background:color-mix(in srgb,var(--accent) 16%,rgba(255,255,255,.3));border-right:2px dashed color-mix(in srgb,var(--accent) 45%,#fff)}
.ticketStub strong{font-size:clamp(22px,9cqi,32px);line-height:.95;letter-spacing:-.04em;color:var(--accentDark);font-weight:900}
.ticketStub span{font-size:8.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.ticketBody{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 30px 9px 11px}
.eventTicket .eventTitle{font-size:14px;font-weight:800;line-height:1.2}
.eventTicket .eventDate{margin-top:0}
.eventTicket .eventType{padding:3px 7px;font-size:8px}
.ticketDel{position:absolute;top:6px;right:6px}
.tile.completed .ticketStub{background:rgba(255,255,255,.16);border-right-color:rgba(255,255,255,.6)}
.tile.completed .ticketStub strong{color:#fff}
.tile.completed .ticketStub span{color:rgba(255,255,255,.75)}

/* --- Note as ruled paper: faint lines, a red margin, writing straight on it. --- */
.tile[data-tileid="note"] .notearea{
  background:
    linear-gradient(90deg,transparent 27px,rgba(224,82,110,.5) 27px,rgba(224,82,110,.5) 28.5px,transparent 28.5px),
    repeating-linear-gradient(to bottom,transparent 0 20.5px,color-mix(in srgb,var(--accent) 30%,transparent) 20.5px 21.5px,transparent 21.5px 22px),
    rgba(255,255,255,.88)!important;
  background-position:0 0,0 5px,0 0!important;
  line-height:22px!important;padding:5px 12px 10px 38px!important;
  border-radius:4px 14px 14px 4px!important;font-size:14px}
.tile.completed[data-tileid="note"] .notearea{background:
    linear-gradient(90deg,transparent 27px,rgba(224,82,110,.5) 27px,rgba(224,82,110,.5) 28.5px,transparent 28.5px),
    repeating-linear-gradient(to bottom,transparent 0 20.5px,color-mix(in srgb,var(--accent) 38%,transparent) 20.5px 21.5px,transparent 21.5px 22px),
    rgba(255,255,255,.9)!important;background-position:0 0,0 5px,0 0!important}

/* --- Philosophy: the day's question set like a quotation. --- */
.philoQ{position:relative;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-style:italic;font-size:16.5px;line-height:1.45;font-weight:600;color:var(--accentDark);padding:12px 2px 0 27px;margin-bottom:12px}
.philoQ::before{content:"\201C";position:absolute;left:-3px;top:-8px;font-family:Georgia,serif;font-style:normal;font-weight:700;font-size:56px;line-height:1;color:color-mix(in srgb,var(--accent) 50%,transparent);pointer-events:none}
.tile.completed .philoQ{color:#fff}
.tile.completed .philoQ::before{color:rgba(255,255,255,.45)}

/* --- Push-ups: the add buttons are weight plates, sized by what they add. --- */

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useLayoutEffect } = React;

/* colour sets: p=pastel(undone), v=vivid(done), d=dark accent (labels on pastel) */

/* Every dashboard tile shares the same reversible full-colour presentation.
   Whether a tile is completed by a task control or by tapping an informative
   surface is decided by the tile itself; the visual system never opts out. */
const TASK = new Set(Object.keys(COL));
const uid=()=> (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2);

function themeVars(id, done){
  const c=COL[id]||{p:'#e6e6ea',v:'#666666',d:'#444444'};
  const complete=TASK.has(id)&&done;
  const rgb=hex=>hex.match(/[a-f0-9]{2}/gi).map(value=>parseInt(value,16));
  const hue=rgb(c.v), dark=rgb(c.d);
  const inkBase=complete?[4,8,12]:[15,23,32], inkMix=complete?.1:.3;
  const ink=dark.map((value,i)=>Math.round(value*inkMix+inkBase[i]*(1-inkMix)));
  const depth=hue.map((value,i)=>Math.round(value*.18+[12,21,30][i]*.82));
  return {
    '--bg':c.p,'--accent':c.v,'--accentDark':'rgb('+ink.join(',')+')',
    '--glass-rgb':hue.join(','),'--glass-depth':depth.join(','),'--glass-ink':'rgb('+ink.join(',')+')',
    '--ink':'rgb('+ink.join(',')+')','--lbl':'rgb('+ink.join(',')+')',
    '--dim':'rgba('+ink.join(',')+',.82)',
    '--hair':'rgba('+ink.join(',')+','+(complete?'.18':'.15')+')',
    '--field':'rgba(255,255,255,.08)',
    '--fieldbd':'rgba('+ink.join(',')+',.2)',
    '--tickbd':'rgba('+ink.join(',')+',.4)',
    '--tickfill':'rgba('+depth.join(',')+',.88)',
    '--tickmark':'#fff','--btnbg':'rgba(255,255,255,.1)',
    '--btnbd':'rgba('+ink.join(',')+',.18)',
    '--glow':'0 16px 40px -25px '+c.v,'--candyShadow':c.v
  };
}

/* localStorage */
const load=(k,fb)=>{ try{ const v=localStorage.getItem("fefe_"+k); return v==null?fb:JSON.parse(v); }catch{ return fb; } };
const save=(k,val)=>{ try{ localStorage.setItem("fefe_"+k, JSON.stringify(val)); schedulePush(); }catch(e){} };
const getKey=()=> (localStorage.getItem("fefe_apiKey")||"").trim();

/* ---- cross-device sync (JSONBlob) ----
   Whole-state snapshot under a secret blob id. The Anthropic API key is NEVER synced. */
const SYNC_URL="https://fefe-sync.fefedashboard.workers.dev";
/* Shared community daily content: one server-side key generates word/knowledge/spanish/
   music/news/brainflex/philo-prompt once a day for EVERYONE (see worker/shared-content.js).
   These tiles then need no personal API key. Set to "" to disable and fall back to per-user
   generation. Weather, academic, and philosophy chat stay per-user. */
const SHARED_URL="https://fefe-sync.fefedashboard.workers.dev";
const SHARED_KEYS=new Set(["word","worth","spanish","german","music","world","brainflex","philo","gmat"]);
/* Garmin (and any scripted health source) push daily summaries to this token-keyed
   store; the dashboard pulls them in on load and merges into the local health log.
   Its own little Worker — separate from sync so a script write can never clobber the
   whole-state snapshot. See worker/health-ingest.js. Set to "" to disable. */
const HEALTH_URL="https://fefe-health.fefedashboard.workers.dev";
const getHealthToken=()=> localStorage.getItem("fefe_healthToken")||"";
const SYNC_EXCLUDE=new Set(["fefe_apiKey","fefe_garminKey","fefe_syncId","fefe_syncStamp","fefe_healthToken","fefe_accountToken","fefe_accountEmail","fefe_deviceDisplay"]);
const getSyncId=()=> localStorage.getItem("fefe_syncId")||"";
const ACCOUNT_TOKEN_KEY="fefe_accountToken";
const ACCOUNT_EMAIL_KEY="fefe_accountEmail";
const getAccountToken=()=>localStorage.getItem(ACCOUNT_TOKEN_KEY)||"";
const accountRequest=async(path,body)=>{ const r=await fetch(SYNC_URL+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",...(getAccountToken()?{Authorization:`Bearer ${getAccountToken()}`}:{})},...(body?{body:JSON.stringify(body)}:{})}); const data=await r.json().catch(()=>({})); if(!r.ok) throw new Error(data.error||`server returned ${r.status}`); return data; };
const DEFAULT_LOCATION={name:"Sydney",region:"NSW",country:"Australia",latitude:-33.8688,longitude:151.2093,timezone:"Australia/Sydney"};
const defaultAgendaRecurring=()=>[
  {id:uid(),label:"Suggest app improvement / recommendation to the creator",everyDays:1,lastDone:addDays(todayKey,-1),source:"default"}
];
const defaultAgendaEvents=()=>[];
const getLocationProfile=()=>{
  const raw=load("location",null);
  if(!raw||typeof raw!=="object") return DEFAULT_LOCATION;
  const latitude=Number(raw.latitude), longitude=Number(raw.longitude);
  return {
    name:String(raw.name||DEFAULT_LOCATION.name),
    region:String(raw.region||""),
    country:String(raw.country||DEFAULT_LOCATION.country),
    latitude:Number.isFinite(latitude)?latitude:DEFAULT_LOCATION.latitude,
    longitude:Number.isFinite(longitude)?longitude:DEFAULT_LOCATION.longitude,
    timezone:String(raw.timezone||DEFAULT_LOCATION.timezone)
  };
};
function zonedParts(date,timeZone){
  const parts=new Intl.DateTimeFormat("en-GB",{timeZone,weekday:"long",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(date);
  const pick=type=>parts.find(p=>p.type===type)?.value||"";
  return { weekday:pick("weekday"), year:Number(pick("year")), month:Number(pick("month")), day:Number(pick("day")), hour:Number(pick("hour")), minute:Number(pick("minute")) };
}
function formatLongDateInZone(date,timeZone){
  return new Intl.DateTimeFormat("en-GB",{timeZone,weekday:"long",day:"numeric",month:"long"}).format(date);
}
function formatClockInZone(date,timeZone){
  const p=zonedParts(date,timeZone);
  return `${pad(p.hour)}:${pad(p.minute)}`;
}
function logicalDateKeyInZone(date,timeZone){
  const p=zonedParts(date,timeZone);
  const local=new Date(p.year,p.month-1,p.day);
  if(p.hour<1) local.setDate(local.getDate()-1);
  return dateKey(local);
}
function collectState(){ const o={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf("fefe_")===0&&!SYNC_EXCLUDE.has(k)) o[k]=localStorage.getItem(k); } return o; }
let _pushT=null;
/* Don't upload before this session has taken the latest cloud state at least once,
   so a device can never push its stale local data over a newer cloud version. */
let _pulledOnce=false;
let _syncReadOK=false;
let _syncIssue=null;
function schedulePush(){ const id=getSyncId(), token=getAccountToken(); if(!id&&!token) return; if(token&&!_pulledOnce) return; clearTimeout(_pushT);
  _pushT=setTimeout(async()=>{ try{ const stamp=Date.now();
    const r=token?await fetch(SYNC_URL+"/account/data",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({updatedAt:stamp,data:collectState()})}):await fetch(SYNC_URL+"/data",{method:"POST",headers:{"Content-Type":"application/json","X-Sync-Code":id},body:JSON.stringify({updatedAt:stamp,data:collectState()})});
    if(r.ok){ const out=await r.json().catch(()=>null);
      /* The server may keep a newer version and reject this push — trust its updatedAt. */
      localStorage.setItem("fefe_syncStamp",String(out&&out.updatedAt!=null?out.updatedAt:stamp)); }
  }catch(e){} },3500); }
async function pullSync(){ _syncReadOK=false;_syncIssue=null;const id=getSyncId(), token=getAccountToken(); if(!id&&!token){ _pulledOnce=true; _syncReadOK=true; return false; }
  try{ const r=token?await fetch(SYNC_URL+"/account/data",{headers:{Authorization:`Bearer ${token}`}}):await fetch(SYNC_URL+"/data",{headers:{"X-Sync-Code":id}}); if(!r.ok){ _syncIssue={state:r.status===401||r.status===403?"signin_required":"sync_pending",message:"Account service returned HTTP "+r.status};return false; } const doc=await r.json();
    _pulledOnce=true; _syncReadOK=true;
    const local=Number(localStorage.getItem("fefe_syncStamp")||0);
    if(doc&&doc.data&&((doc.updatedAt&&doc.updatedAt>local)||(!local&&Object.keys(doc.data).length>0))){
      for(const [k,v] of Object.entries(doc.data)){if(k.indexOf("fefe_")===0&&!SYNC_EXCLUDE.has(k))await adoptSyncedValue(k,v);}
      localStorage.setItem("fefe_syncStamp",String(doc.updatedAt)); return true; }
  }catch(e){_syncIssue={state:navigator.onLine===false?"offline":"sync_pending"};}
  return false; }
/* Pull the token's health days from the ingest store. Returns a {date:entry} map or null.
   Read-only: it never writes back, so it can't disturb anything the script pushed. */
async function pullHealth(token){ const t=(token||getHealthToken()).trim(); if(!t||!HEALTH_URL) return null;
  try{ const r=await fetch(HEALTH_URL+"/health",{headers:{"X-Health-Token":t}}); if(!r.ok) return null;
    const doc=await r.json(); return doc&&doc.days&&typeof doc.days==="object"?doc.days:null;
  }catch(e){ return null; } }

/* dates — the "logical day" rolls over at 01:00, not midnight, so a late night
   doesn't quietly become tomorrow while you're still awake. */
const pad=n=>String(n).padStart(2,"0");
const dateKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const formatDateKey=key=>{ const [y,m,d]=String(key||"").split("-").map(Number); return y&&m&&d?`${pad(d)}/${pad(m)}/${y}`:""; };
const WEEKDAY_NAMES=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const parseDateKey=value=>{
  const s=String(value||"").trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return "";
};
function addDays(key,n){ const [y,m,d]=key.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dateKey(dt); }
function daysBetween(fromKey,toKey){ const [ay,am,ad]=fromKey.split("-").map(Number); const [by,bm,bd]=toKey.split("-").map(Number); return Math.round((new Date(by,bm-1,bd)-new Date(ay,am-1,ad))/86400000); }
const logicalDateKey=(d=new Date())=>{ const dt=new Date(d); if(dt.getHours()<1) dt.setDate(dt.getDate()-1); return dateKey(dt); };
const todayKey=logicalDateKeyInZone(new Date(),getLocationProfile().timezone);
const isWeeHours=(d=new Date())=>d.getHours()===0;

/* DAILY_CONTENT_CONTRACT_START */
// A daily result is a validated record, never a truthy placeholder. First success wins.
const dailyText=value=>typeof value==="string"&&value.trim().length>0;
const dailyQuiz=q=>!!q&&dailyText(q.prompt)&&Array.isArray(q.options)&&q.options.length>=2&&q.options.every(dailyText)&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length;
function validDailyTile(key,value){
  if(!value||typeof value!=="object") return false;
  switch(key){
    case "word": return dailyText(value.term_en)&&dailyText(value.def_en)&&dailyText(value.term_fr)&&!!value.quiz&&Array.isArray(value.quiz.options)&&value.quiz.options.length>=2&&value.quiz.options.every(dailyText)&&Number.isInteger(value.quiz.answer)&&value.quiz.answer>=0&&value.quiz.answer<value.quiz.options.length;
    case "worth": return dailyText(value.title)&&dailyText(value.story)&&Array.isArray(value.quiz)&&value.quiz.length>0&&value.quiz.every(dailyQuiz);
    case "spanish": return dailyText(value.tema)&&dailyText(value.punto)&&Array.isArray(value.vocab)&&value.vocab.length>0&&value.vocab.every(v=>v&&dailyText(v.es)&&dailyText(v.en))&&Array.isArray(value.quiz)&&value.quiz.length>0&&value.quiz.every(dailyQuiz);
    case "german": return dailyText(value.thema)&&dailyText(value.punkt)&&Array.isArray(value.vocab)&&value.vocab.length>0&&value.vocab.every(v=>v&&dailyText(v.de)&&dailyText(v.fr))&&Array.isArray(value.quiz)&&value.quiz.length>0&&value.quiz.every(dailyQuiz);
    case "music": return dailyText(value.title)&&dailyText(value.artist)&&dailyText(value.why);
    case "world": return Array.isArray(value)&&value.length>0&&value.every(v=>v&&dailyText(v.headline)&&dailyText(v.summary));
    case "weather": return !!value.tomorrow&&[value.temp,value.code,value.hi,value.lo,value.tomorrow.hi,value.tomorrow.lo,value.tomorrow.code].every(v=>typeof v==="number"&&Number.isFinite(v))&&dailyText(value.place);
    case "brainflex": return dailyText(value.format)&&dailyText(value.prompt)&&dailyText(value.solution);
    case "philo": return dailyText(value.theme)&&dailyText(value.question);
    case "academic": return dailyText(value.concept)&&dailyText(value.explain)&&Array.isArray(value.quiz)&&value.quiz.length>0&&value.quiz.every(dailyQuiz);
    case "gmat": return Array.isArray(value)&&value.length>0&&value.every(q=>dailyQuiz(q)&&dailyText(q.explain));
    default: return false;
  }
}
function mergeDailyContent(existing,incoming){
  const next={...(existing&&typeof existing==="object"&&!Array.isArray(existing)?existing:{})};
  Object.entries(incoming||{}).forEach(([key,value])=>{if(!validDailyTile(key,next[key])&&validDailyTile(key,value))next[key]=value;});
  return next;
}
const dailyRequestKeys=(keys,content)=>[...new Set(keys)].filter(key=>!validDailyTile(key,(content||{})[key]));
const DAILY_CONTENT_KEYS=["word","worth","spanish","german","music","world","weather","brainflex","philo","academic","gmat"];
/* DAILY_CONTENT_CONTRACT_END */
/* DAILY_UX_CONTRACT_START */
const DAILY_TILE_LABELS={word:"Word",worth:"Knowledge",spanish:"Español",german:"Deutsch",music:"Song",world:"World news",weather:"Weather",brainflex:"Brainflex",philo:"Philosophy",academic:"Study",gmat:"GMAT lesson",account:"Account",settings:"Daily content",brain:"Memory",answers:"Quiz answers"};
const DAILY_SETUP_STATES=new Set(["disabled","personal_key","missing_key","invalid_key","missing_course","server_unconfigured","service_update","browser_lock_unavailable","signin_required"]);
function dailyIssueInfo(key,state,message="",personalOverride=false){
  const personal=key==="academic"||personalOverride;
  const info={

function dailyRefreshPlan(keys,content,status,hydrated=true,busy=false){
  const unique=[...new Set(keys)], missing=dailyRequestKeys(unique,content);
  const blocked=missing.filter(key=>DAILY_SETUP_STATES.has(status[key]?.state));
  const loadable=missing.filter(key=>!blocked.includes(key));
  const failed=loadable.filter(key=>status[key]&&!["missing","ready"].includes(status[key].state));
  let label=!hydrated?"Reconnect":busy?"Loading tiles…":!unique.length?"No daily tiles":!missing.length?"All saved ✓":!loadable.length?"Finish setup ("+blocked.length+")":failed.length?"Retry "+loadable.length+" tile"+(loadable.length===1?"":"s"):missing.length===unique.length&&!blocked.length?"Load all tiles":"Load missing ("+loadable.length+")";
  const detail=!hydrated?"Check your saved account day before loading content.":!missing.length?"All daily tiles on Today are saved. Nothing will be replaced.":"Loads "+loadable.length+" missing tile"+(loadable.length===1?"":"s")+" on Today. "+blocked.length+" need setup. Saved content and progress are kept.";
  return {label,detail,missing,loadable,blocked,failed};
}
function dailyRequestFailure(error){
  if(error?.dailyState)return {state:error.dailyState,message:error.message};
  if(error?.name==="TimeoutError"||error?.name==="AbortError")return {state:"timeout"};
  if(error?.name==="QuotaExceededError"||error?.name==="SecurityError")return {state:"storage_error"};
  if(error?.message==="browser_lock_unavailable")return {state:"browser_lock_unavailable"};
  if(error?.message==="wrong_day")return {state:"service_update"};
  if(error?.message==="invalid_content")return {state:"invalid_content"};
  return {state:typeof navigator!=="undefined"&&navigator.onLine===false?"offline":"error",message:"Couldn’t connect to the content service. Check the connection and retry."};
}
async function readDailyResponse(response){
  if(response.status===401||response.status===403)throw Object.assign(new Error("Your account session was rejected (HTTP "+response.status+")."),{dailyState:"signin_required"});
  const doc=await response.json().catch(()=>{throw Object.assign(new Error("Unreadable service response (HTTP "+response.status+")."),{dailyState:"bad_response"});});
  if(!response.ok&&!doc?.status){
    const state=response.status===401||response.status===403?"signin_required":response.status===404||response.status===405?"service_update":response.status===429?"rate_limit":"service_error";
    throw Object.assign(new Error("The daily service returned HTTP "+response.status+". Retry shortly; if it continues, check the service deployment."),{dailyState:state});
  }
  return doc;
}

// Web Locks serialize this browser's tabs. The server serializes shared and account content.
async function withDailyLock(day,key,task){
  if(!navigator.locks) throw new Error("browser_lock_unavailable");
  return navigator.locks.request("fefe:daily:"+day,task);
}
function storeDailyContent(day,incoming){
  const next=mergeDailyContent(load("daily:"+day,{}),incoming);
  // A failed disk write must never be shown as a saved, replaceable result.
  localStorage.setItem("fefe_daily:"+day,JSON.stringify(next)); schedulePush(); return next;
}
async function adoptSyncedValue(key,value){
  if(key.startsWith("fefe_daily:")){
    const apply=()=>{try{const old=JSON.parse(localStorage.getItem(key)||"{}");localStorage.setItem(key,JSON.stringify(mergeDailyContent(old,JSON.parse(value))));}catch{}};
    if(navigator.locks)await navigator.locks.request("fefe:daily:"+key.slice(11),apply);else apply();
  }else localStorage.setItem(key,String(value));
}

/* Claude API (browser key) */
function extractJSON(text){ if(!text) return null; let t=text.replace(/```json|```/g,"").trim(); const s=[t.indexOf("{"),t.indexOf("[")].filter(i=>i>=0); const a=s.length?Math.min(...s):-1; const b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]")); if(a===-1||b===-1) return null; try{ return JSON.parse(t.slice(a,b+1)); }catch{ return null; } }
function clean(s){ if(s==null) return ""; return String(s)
  .replace(/【[^】]*】/g,"").replace(/\[[0-9]+\]/g,"").replace(/\((?:https?:[^)]+)\)/g,"")
  .replace(/https?:\/\/\S+/g,"").replace(/[*_`#>\\]+/g,"").replace(/\s+([.,;:!?])/g,"$1")
  .replace(/\s{2,}/g," ").trim(); }
async function callClaude(system,user,opts={}){
  const key=getKey(); if(!key) throw new Error("no-key");
  const body={ model:opts.model||"claude-haiku-4-5-20251001", max_tokens:opts.max||600, system, messages:[{role:"user",content:user}] };
  const res=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST",
    headers:{ "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true" },
    body:JSON.stringify(body) });
  if(!res.ok)throw Object.assign(new Error("Claude returned HTTP "+res.status),{dailyState:[401,403].includes(res.status)?"invalid_key":res.status===429?"rate_limit":"service_error"});
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

/* Philosophy chat — a real back-and-forth, kept on a stronger model since it's low-volume and quality-sensitive. */
async function philoReply(question,history,mode="standard"){
  const key=getKey(); if(!key) throw new Error("no-key");
  const philosopher=mode&&mode!=="standard"?philoModeLabel(mode):"";
  const system=philosopher
    ? `You are reconstructing ${philosopher}'s philosophical response to a live conversation. Do not roleplay theatrically or invent views. Use only claims, arguments, distinctions, and likely extensions that are well grounded in ${philosopher}'s primary texts or widely accepted scholarship. If ${philosopher} has no clear basis for answering the user's exact claim, say that the textual basis is unclear, then offer only a careful nearby distinction if one is genuinely grounded. Defend ${philosopher}'s opposition as ${philosopher} plausibly would, but never fabricate a counterargument. Keep replies tight: 3-6 sentences, conversational, no bullet lists, no headers, no "in conclusion." You may imitate the philosopher's argumentative style at a high level, but do not invent quotations. End every answer with a short parenthetical source note naming the relevant work(s), e.g. "(Sources: ...)." Today's question under discussion: "${question}"`
    : `You are a Socratic philosophical interlocutor of exceptional range — able to argue from inside almost any tradition (analytic, continental, ancient, Buddhist, pragmatist, existentialist, etc.) without personally championing one school. Your job is not to lecture or hand over a tidy theory. It is to sharpen the other person's OWN thinking and keep digging below the surface: press on unexamined assumptions, raise a real objection or counterexample to what they just said, occasionally steelman a view they haven't considered, and — when it genuinely fits — name a specific real philosopher (and their actual position) who agrees or disagrees with what they've said, briefly and correctly. Never let them settle too comfortably into an answer that merely feels obvious to them; that comfort is usually an unexamined bias, and surfacing it gently is part of the point. Keep replies tight: 3-6 sentences, conversational, no bullet lists, no headers, no "in conclusion." Ask at most one sharp follow-up per reply. Today's question under discussion: "${question}"`;
/* The philosophy chat survives model retirements: try the preferred stronger model,
   then fall back on a 4xx (retired/unknown id) instead of failing the whole chat. */
const PHILO_CHAT_MODELS=["claude-sonnet-4-5-20250929","claude-haiku-4-5-20251001"];
  let lastErr=null;
  for(const model of PHILO_CHAT_MODELS){
    const body={ model, max_tokens:420, system, messages:history.map(h=>({role:h.role,content:h.text})) };
    const res=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST",
      headers:{ "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify(body) });
    if(res.ok){
      const data=await res.json();
      return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    }
    lastErr=new Error("API "+res.status);
    if(res.status!==400&&res.status!==404) throw lastErr;
  }
  throw lastErr||new Error("API");
}

/* Apple catalog matching must be conservative: a search result is never accepted merely because
   it came first. Title and the complete recording credit (performers and/or composer) are scored
   separately, which also handles classical recordings whose Apple "artist" is not the composer. */
const musicNorm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
const MUSIC_NOISE=new Set(["a","an","the","and","feat","featuring","with","version","edit","remaster","remastered","mono","stereo"]);
const musicTokens=s=>new Set(musicNorm(s).split(/\s+/).filter(w=>w&&!MUSIC_NOISE.has(w)));
const musicOverlap=(a,b)=>{
  const aa=musicTokens(a),bb=musicTokens(b); if(!aa.size||!bb.size) return 0;
  let hit=0; aa.forEach(w=>{ if(bb.has(w)) hit++; });
  return hit/Math.max(aa.size,bb.size);
};
const appleMusicSearchUrl=m=>`https://music.apple.com/fr/search?term=${encodeURIComponent([m.title,m.artist,m.composer].filter(Boolean).join(" "))}`;
/* geo.music.apple.com redirects to the listener's own storefront, so a matched track
   opens the exact song in-app instead of dead-ending on a foreign-country page. */
const appleGeoUrl=url=>String(url||"").replace(/^https:\/\/music\.apple\.com\//,"https://geo.music.apple.com/");
async function resolveMusicTrack(m){
  const title=String(m&&m.title||"").trim(), artist=String(m&&m.artist||"").trim(), composer=String(m&&m.composer||"").trim();
  if(!title) return null;
  const signature=musicNorm([title,artist,composer].join(" | "));
  const cached=load("musicMatches",{});
  if(cached[signature]&&cached[signature].url) return cached[signature];
  const queries=[`${title} ${artist} ${composer}`,`${title} ${artist}`,`${title} ${composer}`].map(q=>q.trim()).filter((q,i,a)=>q&&a.indexOf(q)===i);
  const candidates=new Map();
  for(const q of queries){
    try{
      const api=`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&country=fr&media=music&entity=song&limit=25`;
      const response=await fetch(api); if(!response.ok) continue;
      const data=await response.json();
      (data.results||[]).forEach(track=>{ if(track.trackViewUrl) candidates.set(String(track.trackId||track.trackViewUrl),track); });
    }catch(e){}
  }
  const expectedCredits=[artist,composer].filter(Boolean).join(" ");
  const scored=[...candidates.values()].map(track=>{
    const wanted=musicNorm(title), found=musicNorm(track.trackName);
    const titleOverlap=musicOverlap(title,track.trackName);
    const titleScore=wanted===found?100:(wanted&&found&&(wanted.includes(found)||found.includes(wanted))?88:titleOverlap*80);
    const catalogCredits=[track.artistName,track.composerName,track.collectionArtistName].filter(Boolean).join(" ");
    const wantedCredit=musicNorm(expectedCredits), foundCredit=musicNorm(catalogCredits);
    const creditOverlap=musicOverlap(expectedCredits,catalogCredits);
    const creditScore=!wantedCredit?12:(wantedCredit===foundCredit?38:(wantedCredit.includes(foundCredit)||foundCredit.includes(wantedCredit)?32:creditOverlap*30));
    return {track,titleScore,creditScore,score:titleScore+creditScore};
  }).sort((a,b)=>b.score-a.score);
  const best=scored[0];
  if(!best||best.titleScore<70||best.creditScore<10) return null;
  const match={
    url:appleGeoUrl(best.track.trackViewUrl),
    trackId:best.track.trackId||"",
    catalogTitle:best.track.trackName||title,
    catalogArtist:best.track.artistName||artist,
    catalogComposer:best.track.composerName||composer,
    catalogMatched:true
  };
  const nextCache={...cached,[signature]:match};
  const trimmed=Object.fromEntries(Object.entries(nextCache).slice(-80));
  save("musicMatches",trimmed);
  return match;
}

/* World briefing — pulls real, free RSS headlines via our own Worker (same origin, no CORS),
   then Claude only summarizes/cleans that provided text (no web_search tool = far cheaper). */
const RSS_FEEDS=[
  "https://feeds.bbci.co.uk/news/world/rss.xml",
  "https://feeds.skynews.com/feeds/rss/world.xml",
  "https://www.france24.com/en/rss",
];
async function fetchRssHeadlines(){
  const results=await Promise.allSettled(RSS_FEEDS.map(async url=>{
    let r=null; const candidates=[SYNC_URL+"/rss?url="+encodeURIComponent(url),url,"https://api.allorigins.win/raw?url="+encodeURIComponent(url)];
    for(const candidate of candidates){ try{ const attempt=await fetch(candidate); if(attempt.ok){ r=attempt; break; } }catch(e){} }
    if(!r) throw new Error("bad feed");
    const text=await r.text();
    const doc=new DOMParser().parseFromString(text,"text/xml");
    return [...doc.querySelectorAll("item")].slice(0,10).map(it=>({
      title:(it.querySelector("title")?.textContent||"").trim(),
      desc:(it.querySelector("description")?.textContent||"").replace(/<[^>]+>/g," ").trim(),
    })).filter(x=>x.title);
  }));
  const all=[]; const seen=new Set();
  results.forEach(r=>{ if(r.status==="fulfilled") r.value.forEach(it=>{
    const key=it.title.toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(" ").slice(0,6).join(" ");
    if(key && !seen.has(key)){ seen.add(key); all.push(it); }
  }); });
  return all.length ? all : null;
}
async function genWorld(avoid){
  const items=await fetchRssHeadlines();
  if(!items || items.length===0) return null;
  const raw=items.slice(0,16).map((it,i)=>`${i+1}. ${it.title} — ${it.desc}`).join("\n");
  const out=await callClaude("You output ONLY a valid JSON array, no markdown.",
    `Here are today's raw news headlines from several wire services (may include near-duplicates covering the same event):\n${raw}\n\nPick the 5 most important DISTINCT stories — if two items describe the same event, count that as one. Avoid re-covering stories already picked recently: ${(avoid||[]).join(" | ")||"none"}. For each pick write a "headline" (max 9 words, your own words) and a "summary" (2-3 sentences) covering what happened AND why it matters, using only the information given above. Do not end the summary with a generic closing line that just restates the obvious (e.g. "this shows/highlights/underscores…") — add a closing thought only if it's genuinely non-obvious insight; otherwise stop after the facts. Plain prose only — NO markdown, NO citation numbers, NO URLs, NO special symbols. JSON array of {"headline":"","summary":""}.`, {max:950});
  const arr=extractJSON(out); return Array.isArray(arr)?arr:null;
}

async function fetchWeather(profile=getLocationProfile()){
  const lat=Number(profile.latitude), lon=Number(profile.longitude);
  const tz=encodeURIComponent(profile.timezone||"auto");
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=${tz}&forecast_days=2`,{signal:AbortSignal.timeout(25000)});
  if(!r.ok)throw Error("weather_unavailable");
  const d=await r.json();
  const temp=Math.round(d.current.temperature_2m);
