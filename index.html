<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#E4E4E9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Dashboard" />
<link rel="manifest" href="dashboard.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
<title>Fefe · Daily Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family:'Nunito',system-ui,sans-serif; color:#17182c;
    background:linear-gradient(145deg,#f2efff,#e8f7ff 48%,#fff1f7); min-height:100vh; -webkit-font-smoothing:antialiased; }
  body.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  .wrap { padding: 20px clamp(12px,3vw,32px) 48px; }

  .hero { display:flex; justify-content:space-between; align-items:center; gap:14px; max-width:1320px; margin:0 auto 18px; flex-wrap:wrap; }
  .heroL { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .clock { font:800 38px/1 'Nunito',sans-serif; letter-spacing:-0.02em; color:#1d2030; }
  .heroMeta { display:flex; flex-direction:column; gap:2px; }
  .greet { font-size:18px; font-weight:700; color:#1d2030; }
  .subro { font:700 9.5px/1.3 'Nunito',monospace; letter-spacing:.15em; text-transform:uppercase; color:rgba(29,32,48,0.5); }
  .heroR { display:flex; align-items:center; gap:9px; }
  .hbtn { font:700 11px/1 'Nunito',monospace; letter-spacing:.06em; text-transform:uppercase; color:#1d2030; background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:99px; padding:10px 15px; cursor:pointer; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,0.05); transition:all .15s; }
  .hbtn:hover { box-shadow:0 4px 14px rgba(0,0,0,0.1); transform:translateY(-1px); }
  .hbtn.active { background:#1d2030; color:#fff; }
  .hbtn.hbtnGen { background:#1d2030; color:#fff; border-color:#1d2030; }
  .hbtn.hbtnGen:hover { background:#33384d; }
  .hbtn.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(29,32,48,.55);} 50%{ box-shadow:0 0 0 10px rgba(29,32,48,0);} }

  .streakbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:5px; }
  .chipx { font:700 10.5px/1 'Nunito',monospace; padding:6px 9px; border-radius:99px; background:#fff; border:1px solid rgba(0,0,0,.08); color:rgba(29,32,48,.75); }

  .weatherSplit { display:grid; grid-template-columns:1.2fr 1fr; align-items:center; height:100%; gap:14px; }
  .wtomorrow { display:flex; flex-direction:column; justify-content:center; gap:3px; padding-left:14px; border-left:1px solid var(--hair); min-height:58px; }

  .wordcard { display:flex; flex-direction:column; gap:0; container-type:inline-size; }
  .wcTerm { font-size:clamp(20px, 6cqi, 30px); font-weight:800; line-height:1.05; letter-spacing:-0.01em; }
  .wcIpa { font-size:clamp(11px, 2.6cqi, 13px); }
  .wcDef { font-size:clamp(13px, 3.2cqi, 15px); line-height:1.4; margin:6px 0 0; }
  .wcFr { margin-top:9px; padding-top:9px; border-top:1px solid var(--hair); }
  .wcTermFr { font-size:clamp(14px, 3.8cqi, 17px); font-weight:700; }
  .wcDefFr { font-size:clamp(12px, 3cqi, 14px); }
  @supports not (container-type:inline-size){
    .wcTerm { font-size:22px; } .wcIpa { font-size:12px; } .wcDef { font-size:13.5px; }
    .wcTermFr { font-size:15px; } .wcDefFr { font-size:13px; }
  }

  .wrev { display:flex; flex-direction:column; gap:14px; height:100%; }
  .wrevSection { padding:11px 12px; background:var(--field); border:1px solid var(--fieldbd); border-radius:12px; }
  .wrevTitle { font:700 12px/1.2 'Nunito',sans-serif; letter-spacing:.02em; }
  .wrevMeta { font:600 12px/1.3 'Nunito',monospace; opacity:.8; margin-top:2px; }
  .wrevAxis { display:flex; justify-content:space-between; margin-top:2px; font:700 9px/1 'Nunito',monospace; opacity:.55; letter-spacing:.05em; }
  .wrevRow { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .wrevHabits { margin-top:8px; display:flex; flex-direction:column; gap:5px; }
  .wrevHrow { display:flex; align-items:center; gap:9px; font-size:13px; }
  .wrevHname { flex:1; }
  .wrevHflame { font:700 11.5px/1 'Nunito',monospace; opacity:.85; min-width:38px; text-align:right; }
  .pillBtn { font:700 10.5px/1 'Nunito',monospace; padding:6px 10px; border-radius:99px; border:1px solid var(--btnbd); background:var(--btnbg); color:var(--ink); cursor:pointer; }
  .pillBtn:hover { filter:brightness(1.1); }
  .wrevAch { display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:8px; }
  .achCard { background:var(--field); border:1px solid var(--fieldbd); border-radius:12px; padding:11px 10px; text-align:center; }
  .achCard.achGold { background:linear-gradient(135deg, #FDE68A, #F59E0B); color:#452901; border-color:#f0b13a; }
  .achN { font:800 22px/1 'Nunito',sans-serif; }
  .achL { font:700 10px/1.2 'Nunito',monospace; letter-spacing:.06em; margin-top:4px; opacity:.85; text-transform:uppercase; }

  .pill.primary { background:var(--tickfill); color:var(--tickmark); border-color:var(--tickfill); }
  .pill:disabled { opacity:.55; cursor:default; }

  .settings { max-width:1320px; margin:0 auto 16px; background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:18px; padding:16px 18px; box-shadow:0 6px 20px rgba(0,0,0,0.06); }
  .settings h3 { margin:0 0 4px; font-size:15px; }
  .settings p { margin:0 0 8px; color:rgba(29,32,48,0.6); font-size:12.5px; line-height:1.5; }
  .settings .lab { font-size:11px; font-weight:700; color:rgba(29,32,48,0.7); margin:12px 0 5px; text-transform:uppercase; letter-spacing:.05em; }
  .srow { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .sinput { flex:1; min-width:220px; background:#f3f3f6; border:1px solid rgba(0,0,0,0.1); border-radius:10px; padding:10px 12px; color:#1d2030; font-size:13.5px; outline:none; font-family:inherit; }
  .sinput:focus { border-color:#4F46E5; }
  .savebtn { background:#1d2030; color:#fff; border:none; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; font-family:inherit; }
  .savebtn:hover { background:#33384d; }
  .ghostbtn { background:#fff; color:rgba(29,32,48,0.8); border:1px solid rgba(0,0,0,0.12); border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .hint { color:rgba(29,32,48,0.5); font-size:12px; }
  .settingsGrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:16px; }
  .settingsCard { min-width:0; padding:16px 17px; border:1px solid rgba(31,36,55,.08); border-radius:18px; background:rgba(255,255,255,.78); }
  .settingsCard h4 { margin:0 0 4px; font-size:15px; line-height:1.2; color:#23263a; }
  .settingsCard p { margin:0 0 10px; }
  .settingsCard .lab:first-of-type { margin-top:0; }
  .settingsHelp { margin-top:10px; padding:11px 12px; border:1px dashed rgba(31,36,55,.12); border-radius:14px; background:rgba(250,251,255,.84); }
  .settingsList { margin:8px 0 0; padding-left:18px; color:rgba(29,32,48,.72); font-size:12.5px; line-height:1.5; }
  .settingsList li+li { margin-top:4px; }
  .placeResults { display:flex; flex-direction:column; gap:7px; margin-top:10px; }
  .placeOption { width:100%; padding:10px 12px; border:1px solid rgba(31,36,55,.08); border-radius:14px; background:rgba(255,255,255,.78); color:#25283a; text-align:left; cursor:pointer; }
  .placeOption b { display:block; font-size:13px; }
  .placeOption span { display:block; margin-top:3px; color:#7a7f90; font-size:11.5px; }
  .locationBadge { display:inline-flex; align-items:center; gap:7px; padding:8px 11px; border-radius:999px; border:1px solid rgba(31,36,55,.08); background:rgba(255,255,255,.82); font-size:12px; font-weight:750; color:#2a2d40; }

  .shoppingCard { display:flex; flex-direction:column; gap:9px; min-height:100%; }
  .shoppingPicked { display:flex; flex-wrap:wrap; gap:6px; min-height:28px; }
  .shopChip { display:inline-flex; align-items:center; gap:5px; max-width:100%; min-height:27px; padding:4px 8px; border:1px solid var(--fieldbd); border-radius:999px; background:var(--field); color:var(--accentDark); font-size:10.5px; font-weight:850; line-height:1; }
  .shopChip.done { background:var(--accent); border-color:var(--accent); color:#fff; text-decoration:line-through; }
  .shopChip button { display:grid; place-items:center; width:16px; height:16px; border:0; border-radius:50%; background:rgba(255,255,255,.55); color:inherit; cursor:pointer; font:900 11px/1 'Nunito',sans-serif; }
  .shopShelf { display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px; }
  .shopIcon { display:grid; place-items:center; min-width:0; aspect-ratio:1; border:1px solid var(--fieldbd); border-radius:12px; background:rgba(255,255,255,.48); color:var(--accentDark); cursor:pointer; font-size:20px; transition:transform .16s ease,background .16s ease,border-color .16s ease,color .16s ease; }
  .shopIcon:hover { transform:translateY(-1px); background:rgba(255,255,255,.82); }
  .shopIcon.on { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 18%,transparent); }
  .shopOther { display:grid; grid-template-columns:minmax(0,1fr) 36px; gap:7px; margin-top:auto; }
  .healthCard { display:flex; flex-direction:column; gap:10px; min-height:100%; }
  .healthTop { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .healthMain { display:flex; flex-direction:column; gap:2px; }
  .healthDate { color:var(--dim); font-size:10.5px; font-weight:800; }
  .healthSteps { color:var(--accentDark); font-size:clamp(25px,8cqi,42px); line-height:.95; font-weight:950; letter-spacing:-.06em; }
  .healthSteps span { font-size:11px; letter-spacing:0; font-weight:850; }
  .healthSync { min-height:30px!important; padding:5px 10px!important; font-size:10.5px!important; white-space:nowrap; }
  .healthGrid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
  .healthMetric { min-width:0; padding:8px 9px; border:1.5px solid color-mix(in srgb,var(--accent) 30%,#fff); border-radius:18px; background:color-mix(in srgb,var(--accent) 8%,rgba(255,255,255,.28)); }
  .healthMetric b { display:block; color:var(--accentDark); font-size:15px; line-height:1.05; }
  .healthMetric span { display:block; margin-top:2px; color:var(--dim); font-size:9.5px; font-weight:850; }
  .healthWorkout { padding:8px 10px; border-radius:18px; border:1.5px solid color-mix(in srgb,var(--accent) 24%,#fff); color:var(--accentDark); font-size:11px; font-weight:850; line-height:1.25; }
  .healthHint { margin-top:auto; color:var(--dim); font-size:11px; line-height:1.35; }
  .tile.completed .healthDate,.tile.completed .healthMetric span,.tile.completed .healthHint{color:rgba(255,255,255,.78)!important}
  .tile.completed .healthSteps,.tile.completed .healthMetric b,.tile.completed .healthWorkout{color:#fff!important}
  .tile.completed .healthMetric,.tile.completed .healthWorkout{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.13)}
  @container (max-width:260px){ .healthGrid{grid-template-columns:1fr 1fr}.healthSync{white-space:normal}.healthTop{align-items:stretch}.healthSteps{font-size:28px} }
  .libraryIntro { max-width:1320px; margin:0 auto 14px; padding:15px 17px; border-radius:16px; background:rgba(255,255,255,.72); border:1px solid rgba(0,0,0,.07); display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .libraryIntro h2 { margin:0 0 3px; font-size:18px; }
  .libraryIntro p { margin:0; color:rgba(29,32,48,.62); font-size:12.5px; line-height:1.45; max-width:760px; }
  .tileManage { font:700 9.5px/1 'Nunito',monospace; text-transform:uppercase; letter-spacing:.05em; border:1px solid var(--btnbd); border-radius:99px; padding:7px 9px; background:var(--btnbg); color:var(--ink); cursor:pointer; }
  .tileManage.on { background:var(--tickfill); color:var(--tickmark); border-color:var(--tickfill); }

  .edithint { max-width:1320px; margin:0 auto 12px; color:rgba(29,32,48,0.6); font-size:12.5px; display:flex; align-items:center; gap:8px; }

  .grid { max-width:1320px; margin:0 auto; display:grid; gap:13px; grid-auto-rows:112px; grid-auto-flow:row dense; }
  @media (max-width:639px){ .grid{ grid-auto-rows:auto !important; } .tile{ min-height:118px; } }

  .tile { position:relative; border-radius:20px; padding:14px 15px; overflow:hidden; height:100%; display:flex; flex-direction:column;
    background:var(--bg); color:var(--ink);
    box-shadow: var(--glow), 0 4px 16px rgba(0,0,0,0.07);
    transition: background .45s ease, box-shadow .45s ease, transform .18s ease; }
  .tile:not(.editing):hover { transform:translateY(-2px); box-shadow: var(--glow), 0 10px 26px rgba(0,0,0,0.12); }
  .tile.lift { transform:scale(1.045); z-index:60; box-shadow:0 18px 44px rgba(0,0,0,0.28); opacity:0.97; pointer-events:none; }
  .tile.editing:not(.lift) { animation:jiggle .42s ease-in-out infinite; touch-action:none; }
  .tile.editing.lift { touch-action:none; }
  @keyframes jiggle { 0%,100%{transform:rotate(-0.4deg);} 50%{transform:rotate(0.4deg);} }

  .tilehead { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; flex:none; }
  .ldot { width:6px; height:6px; border-radius:99px; background:var(--lbl); }
  .lbl { font:700 10px/1.3 'Nunito',monospace; letter-spacing:.15em; text-transform:uppercase; color:var(--lbl); }
  .tbody { flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--fieldbd) transparent; }
  .tbody::-webkit-scrollbar { width:4px; }
  .tbody::-webkit-scrollbar-track { background:transparent; }
  .tbody::-webkit-scrollbar-thumb { background:var(--fieldbd); border-radius:9px; }
  .tbody::-webkit-scrollbar-thumb:hover { background:var(--tickbd); }
  .content { height:100%; }
  .content.locked { pointer-events:none; opacity:0.82; }
  .topright { position:absolute; top:11px; right:11px; z-index:4; display:flex; gap:6px; }
  .iconbtn { background:var(--btnbg); border:1px solid var(--btnbd); color:var(--ink); border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; justify-content:center; transition:all .15s; }
  .iconbtn:hover { filter:brightness(1.1); }
  .iconbtn.warn { background:#DC2626; border-color:#DC2626; color:#fff; }

  .draghandle { position:absolute; top:8px; left:8px; right:auto; z-index:5; width:36px; height:30px; border-radius:10px; cursor:grab; touch-action:none;
    background:rgba(255,255,255,.92); border:1px solid var(--line); box-shadow:0 5px 15px rgba(23,24,44,.10);
    display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(3,1fr); place-items:center; gap:3px; padding:7px 11px; }
  .draghandle:active { cursor:grabbing; }
  .draghandle .gd { width:3.5px; height:3.5px; border-radius:99px; background:#85889a; opacity:.9; }
  .resizeH { position:absolute; right:7px; bottom:7px; z-index:7; width:30px; height:30px; cursor:nwse-resize; touch-action:none;
    display:flex; align-items:flex-end; justify-content:flex-end; border-radius:10px; padding:0 6px 6px 0;
    background:rgba(255,255,255,.92); border:1px solid var(--line); box-shadow:0 5px 15px rgba(23,24,44,.10); }
  .resizeH::after { content:""; width:15px; height:15px; border-right:3px solid #85889a; border-bottom:3px solid #85889a; border-bottom-right-radius:4px; opacity:0.85; }
  .sizebadge { position:absolute; left:11px; bottom:9px; z-index:6; font:700 10px/1 'Nunito',monospace; color:var(--ink); opacity:0.55; }

  .tick { width:19px; height:19px; flex:none; border:1.6px solid var(--tickbd); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:var(--tickmark); cursor:pointer; font-weight:800; background:transparent; transition:all .18s; }
  .tick.on { background:var(--tickfill); border-color:var(--tickfill); }
  .tick.sm { width:16px; height:16px; font-size:10px; }
  .trow { display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px solid var(--hair); }
  .trow:last-child { border-bottom:none; }
  .del { background:none; border:none; color:var(--dim); font-size:17px; cursor:pointer; line-height:1; padding:0 2px; opacity:0.7; }
  .del:hover { opacity:1; }
  .muted { color:var(--dim); }
  .addrow { display:flex; gap:7px; margin-top:2px; }
  .addinput { flex:1; min-width:0; background:var(--field); border:1px solid var(--fieldbd); border-radius:9px; padding:9px 12px; color:var(--ink); font-size:14px; outline:none; font-family:inherit; }
  .addinput::placeholder { color:var(--dim); }
  .addinput[type=date],.addinput[type=time]{ }
  .addbtn { background:var(--tickfill); color:var(--tickmark); border:none; border-radius:9px; width:38px; font-size:20px; font-weight:700; cursor:pointer; flex:none; }

  .hgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:8px; container-type:inline-size; }
  .hsq { position:relative; aspect-ratio:1/1; border-radius:14px; border:1.6px solid var(--tickbd); background:var(--field);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
    font-family:inherit; color:var(--ink); padding:6px; transition:all .2s; overflow:hidden; }
  .hsq .hicon { font-size:24px; line-height:1; }
  .hsq .hname { font-weight:700; font-size:12px; line-height:1.15; text-align:center; overflow-wrap:anywhere; }
  .hsq .hstreak { font:700 10px/1 'Nunito',monospace; opacity:.75; min-height:10px; }
  .hsq.on { background:var(--tickfill); color:var(--tickmark); border-color:var(--tickfill); }
  .hsq.on::after { content:""; position:absolute; inset:10px; pointer-events:none; opacity:.9;
    background:
      linear-gradient(to top right, transparent 46.5%, currentColor 46.5%, currentColor 53.5%, transparent 53.5%),
      linear-gradient(to top left,  transparent 46.5%, currentColor 46.5%, currentColor 53.5%, transparent 53.5%); }
  .hsq .hdel { position:absolute; top:2px; right:7px; font-size:13px; opacity:.45; line-height:1; }
  .hsq .hdel:hover { opacity:1; }
  .hsq.plus { border-style:dashed; font-size:22px; color:var(--dim); background:transparent; }
  .hsq.editing2 { padding:6px; }
  .hinput { width:100%; background:transparent; border:none; outline:none; color:var(--ink); font-family:inherit; font-size:12.5px; font-weight:700; text-align:center; }
  .hinput::placeholder { color:var(--dim); }
  .pill { display:inline-flex; align-items:center; gap:6px; font:700 11.5px/1 'Nunito',monospace; color:var(--ink); background:var(--btnbg); border:1px solid var(--btnbd); border-radius:99px; padding:8px 13px; text-decoration:none; cursor:pointer; transition:filter .15s; }
  .pill:hover { filter:brightness(1.08); }
  .mark { display:inline-flex; align-items:center; gap:7px; font:700 11.5px/1 'Nunito',sans-serif; border:1px solid var(--btnbd); background:var(--btnbg); color:var(--ink); border-radius:99px; padding:7px 12px; cursor:pointer; transition:all .2s; }
  .mark.on { background:var(--tickfill); color:var(--tickmark); border-color:var(--tickfill); }

  .qprompt { font-size:13.5px; font-weight:700; margin:9px 0 7px; color:var(--ink); }
  .qopts { display:flex; flex-wrap:wrap; gap:7px; }
  .qopt { font:600 13px/1.25 'Nunito',sans-serif; color:var(--ink); background:var(--btnbg); border:1px solid var(--btnbd); border-radius:10px; padding:8px 12px; cursor:pointer; transition:all .18s; }
  .qopt:hover:not(:disabled) { filter:brightness(1.08); }
  .qopt:disabled { cursor:default; }
  .qopt.correct { background:#16a34a; color:#fff; border-color:#16a34a; }
  .qopt.wrong { background:#dc2626; color:#fff; border-color:#dc2626; text-decoration:line-through; }
  .qopt.dim { opacity:0.4; }
  .qexplain { font-size:12.5px; line-height:1.45; color:var(--dim); margin:8px 0 0; }

  .story p { font-size:13.2px; line-height:1.6; margin:0 0 8px; color:var(--ink); }
  .insight { background:var(--field); border-left:3px solid var(--lbl); border-radius:8px; padding:9px 12px; font-size:13px; line-height:1.45; margin:4px 0 10px; color:var(--ink); }

  .reviewItem { padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--hair); }
  .reviewItem:last-child { border-bottom:none; margin-bottom:0; }
  .rtitle { font-size:11px; color:var(--dim); margin:0 0 6px; font-weight:700; }

  /* ---- philosophy chat ---- */

  /* ===== Daylight v2 design system ===== */
  :root { --canvas:#f7f8fc; --text:#17182c; --muted:#727589; --line:rgba(23,24,44,.08); --panel:rgba(255,255,255,.82); --shadow:0 1px 2px rgba(18,22,46,.03),0 16px 48px rgba(38,45,82,.07); --radius:22px; --ease:cubic-bezier(.22,1,.36,1); }
  html { background:var(--canvas); overflow-x:hidden; }
  body { max-width:100%; overflow-x:hidden; color:var(--text); background:radial-gradient(circle at 8% 0%,rgba(111,93,255,.08),transparent 28%),radial-gradient(circle at 94% 16%,rgba(31,182,255,.07),transparent 24%),var(--canvas); }
  button,input,textarea { -webkit-tap-highlight-color:transparent; }
  button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid rgba(99,102,241,.22); outline-offset:2px; }
  .wrap { max-width:1480px; margin:0 auto; padding:18px clamp(16px,3vw,42px) 72px; }

  .topbar { position:sticky; top:12px; z-index:110; max-width:1396px; margin:0 auto 34px; min-height:58px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:8px 9px 8px 12px; background:rgba(255,255,255,.90); border:1px solid rgba(255,255,255,.96); border-radius:18px; box-shadow:0 12px 38px rgba(34,39,72,.12),inset 0 0 0 1px rgba(23,24,44,.05); backdrop-filter:blur(24px) saturate(1.3); }
  .brand { display:flex; align-items:center; gap:10px; min-width:150px; }
  .brandMark { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; color:#fff; background:linear-gradient(145deg,#6d5dfc,#4a3ad8); box-shadow:0 7px 18px rgba(79,70,229,.25); font-size:15px; font-weight:800; letter-spacing:-.04em; }
  .brandName { font-size:14px; font-weight:800; letter-spacing:-.025em; }
  .topnav { display:flex; align-items:center; padding:3px; border-radius:12px; background:rgba(23,24,44,.045); }
  .navbtn { border:0; background:transparent; color:var(--muted); border-radius:9px; padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; transition:color .2s,background .2s,box-shadow .2s; }
  .navbtn.active { color:var(--text); background:#fff; box-shadow:0 1px 3px rgba(23,24,44,.10); }
  .topActions { display:flex; align-items:center; gap:7px; }
  .actionBtn { height:38px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 13px; border:1px solid var(--line); border-radius:11px; color:#4c4f64; background:rgba(255,255,255,.76); font-size:11.5px; font-weight:700; cursor:pointer; transition:transform .2s var(--ease),box-shadow .2s,background .2s; }
  .actionBtn:hover { transform:translateY(-1px); background:#fff; box-shadow:0 7px 18px rgba(23,24,44,.09); }
  .actionBtn.primary { color:#fff; border-color:#17182c; background:#17182c; box-shadow:0 7px 18px rgba(23,24,44,.18); }
  .actionBtn.active { color:#fff; background:#6257e7; border-color:#6257e7; }
  .actionBtn svg { width:15px; height:15px; stroke-width:1.9; }

  .dashboardHero { max-width:1320px; margin:0 auto 24px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
  .heroCopy { min-width:0; }
  .heroEyebrow { color:#7a7d91; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:7px; }
  .dashboardHero h1 { margin:0; color:#16172a; font-size:clamp(30px,4vw,48px); line-height:1.03; letter-spacing:-.052em; font-weight:750; }
  .heroStatus { margin:10px 0 0; color:#777a8e; font-size:13px; line-height:1.45; }
  .heroSummary { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
  .progressOrb { --p:0; width:76px; height:76px; border-radius:50%; display:grid; place-items:center; position:relative; background:conic-gradient(#6257e7 calc(var(--p)*1%),rgba(98,87,231,.10) 0); box-shadow:inset 0 0 0 1px rgba(98,87,231,.08); }
  .progressOrb::before { content:""; position:absolute; inset:6px; border-radius:50%; background:#fff; box-shadow:0 4px 14px rgba(23,24,44,.06); }
  .progressValue { position:relative; z-index:1; font-size:15px; font-weight:800; letter-spacing:-.03em; }
  .metric { min-width:82px; padding:11px 13px; background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.9); border-radius:14px; box-shadow:0 7px 24px rgba(23,24,44,.05); }
  .metricValue { display:block; font-size:16px; font-weight:800; letter-spacing:-.035em; }
  .metricLabel { display:block; margin-top:2px; color:#85889a; font-size:9.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .heroClock { color:#5a5d70; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }

  .grid { gap:16px; grid-auto-rows:104px; max-width:1320px; }
  .tile { isolation:isolate; border-radius:var(--radius); padding:17px 18px 18px; color:var(--ink); background:var(--tileBg); border:1px solid rgba(255,255,255,.78); box-shadow:var(--glow),var(--shadow); transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s,background .5s var(--ease),color .35s; }
  .tile::before { content:""; position:absolute; z-index:-1; left:18px; right:18px; top:0; height:2px; border-radius:0 0 4px 4px; background:var(--accent); opacity:.0; transform:scaleX(.55); transition:opacity .25s,transform .35s var(--ease); }
  .tile.completed::before { opacity:.85; transform:scaleX(1); background:rgba(255,255,255,.92); }
  .tile.completed { border-color:rgba(255,255,255,.24); box-shadow:var(--glow),0 18px 48px rgba(28,32,65,.13); }
  .tile.completed .ldot { background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.14); }
  .tile.completed .lbl,.tile.completed .muted,.tile.completed .link { color:var(--lbl); }
  .tile.completed .qopt { color:#fff; background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.20); }
  .tile.completed .qopt.correct { color:#14532d; background:#dcfce7; border-color:#86efac; }
  .tile.completed .qopt.wrong { color:#7f1d1d; background:#fee2e2; border-color:#fca5a5; }
  .tile.completed input,.tile.completed textarea { color:#fff; }
  .tile.completed input::placeholder,.tile.completed textarea::placeholder { color:rgba(255,255,255,.62); }
  .tbody { scrollbar-width:none!important; -ms-overflow-style:none; }
  .tbody::-webkit-scrollbar,.chatLog::-webkit-scrollbar,.ovl::-webkit-scrollbar { display:none!important; width:0!important; height:0!important; }
  .chatLog,.ovl { scrollbar-width:none; }
  a,.link,.qretry { text-decoration:none!important; }
  .link { display:inline-flex; align-items:center; gap:5px; color:var(--accentDark); }
  .link:hover { opacity:.68; }
  .tile input,.tile textarea,.tile select { color:var(--ink)!important; -webkit-text-fill-color:var(--ink); caret-color:var(--accent); }
  .tile input::placeholder,.tile textarea::placeholder { color:var(--dim)!important; -webkit-text-fill-color:var(--dim); opacity:1; }
  .mindTree { display:flex; flex-direction:column; gap:8px; padding:4px 0; }
  .mindNode { position:relative; margin-left:calc(var(--depth,0) * 15px); }
  .mindNode::before { content:""; position:absolute; left:-10px; top:0; bottom:0; width:1px; background:linear-gradient(var(--mindAccent,#6257e7),transparent); opacity:.28; }
  .mindNodeHead { display:flex; align-items:center; gap:8px; min-height:30px; font-size:13px; font-weight:800; letter-spacing:-.01em; }
  .mindNodeDot { width:7px; height:7px; flex:none; border-radius:50%; background:var(--mindAccent,#6257e7); box-shadow:0 0 0 4px color-mix(in srgb,var(--mindAccent,#6257e7) 12%,transparent); }
  .mindEntries { display:flex; flex-direction:column; gap:5px; margin:2px 0 7px 15px; }
  .mindEntry { display:flex; align-items:flex-start; gap:10px; padding:8px 10px; border-radius:10px; background:rgba(98,87,231,.045); color:#34364a; font-size:12.5px; line-height:1.42; }
  .mindEntry span { flex:1; }

  /* Candy mode: playful reward, disciplined system */
  body { background:radial-gradient(circle at 6% 2%,rgba(170,145,255,.20),transparent 26%),radial-gradient(circle at 96% 12%,rgba(107,216,255,.20),transparent 25%),radial-gradient(circle at 48% 100%,rgba(255,151,195,.13),transparent 30%),#f8f7ff; }
  .dashboardHero h1 { color:#201c3c; }
  .progressOrb { background:conic-gradient(#7c5cff calc(var(--p)*1%),rgba(159,138,255,.16) 0); box-shadow:0 10px 26px rgba(111,85,237,.13),inset 0 0 0 1px rgba(98,87,231,.10); }
  .metric { border-color:rgba(255,255,255,.96); box-shadow:0 9px 24px rgba(74,62,133,.07); }
  .metric:nth-child(2) { background:linear-gradient(145deg,#fff,#f2edff); }
  .metric:nth-child(3) { background:linear-gradient(145deg,#fff,#fff0f6); }
  .metric:nth-child(4) { background:linear-gradient(145deg,#fff,#ebf8ff); }
  .grid { gap:14px; }
  .tile { border-radius:24px; border:1.5px solid rgba(255,255,255,.82); box-shadow:var(--glow),0 9px 0 -6px color-mix(in srgb,var(--candyShadow) 18%,transparent),0 18px 42px rgba(58,45,105,.075); }
  .tile::after { content:""; position:absolute; z-index:-1; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(circle at 88% 4%,rgba(255,255,255,.62),transparent 25%),linear-gradient(115deg,rgba(255,255,255,.20),transparent 30%); opacity:.72; }
  .tile:not(.editing):hover { transform:translateY(-4px) scale(1.004); border-color:rgba(255,255,255,.98); box-shadow:var(--glow),0 12px 0 -7px color-mix(in srgb,var(--candyShadow) 25%,transparent),0 25px 52px rgba(60,44,111,.13); }
  .tile.completed { animation:candyPop .52s var(--ease) both; box-shadow:var(--glow),0 12px 0 -7px color-mix(in srgb,var(--candyShadow) 48%,transparent),0 25px 54px rgba(50,37,97,.16); }
  .tile.completed::after { background:radial-gradient(circle at 88% 5%,rgba(255,255,255,.36),transparent 24%),linear-gradient(115deg,rgba(255,255,255,.18),transparent 32%); opacity:1; }
  .tilehead { margin-bottom:9px; }
  .ldot { width:8px; height:8px; box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 13%,transparent); }
  .lbl { font-size:11px; font-weight:800; letter-spacing:-.005em; }
  .tile .content { font-size:13.5px; }
  .tile .muted { line-height:1.48; }
  .addinput,.notearea,.sinput,.bigtextarea,.chatInput,.timerInput { background:rgba(255,255,255,.58); border-color:rgba(255,255,255,.70); box-shadow:inset 0 1px 0 rgba(255,255,255,.64); }
  .addbtn,.pill.primary,.chatSend { box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 7px 16px color-mix(in srgb,var(--accent,#765cff) 28%,transparent); }

  /* Note is a compact writing card: hidden scrollbar, writing left, actions stacked right. */

  /* Universal widget contract
     One completion treatment, one delete language, and deliberate compact
     summaries instead of controls being sliced by a resized tile. */
  .tile{
    min-width:0;min-height:0;overflow:hidden;

  .tile .tbody,.tile .content{min-width:0;min-height:0;max-width:100%}

  /* Full colour is intentionally deeper than the accent itself so white type
     remains readable for yellow, mint, cyan, and other light tile identities. */
  .tile.completed{

      radial-gradient(circle at 88% 4%,rgba(255,255,255,.22),transparent 28%),
      linear-gradient(150deg,

  }

  }

  .tile[data-tileid="shopping"] .shopShelf{
    display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 77px)/12);align-items:center;gap:7px;
    width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 0 5px;

  }
  .tile[data-tileid="shopping"] .shopShelf::-webkit-scrollbar{display:none}
  .tile[data-tileid="shopping"] .shopIcon{

  @media (min-width:640px){
  .tile[data-tileid="agenda"][data-rows="1"] .miniCalendar,

  }

  .tile[data-tileid="agenda"][data-rows="3"] .agName{font-size:11.5px}
  .tile[data-tileid="agenda"][data-rows="3"] .agSub{display:none}
  .tile[data-tileid="agenda"][data-rows="3"] .taskAddLink{

  .tile[data-tileid="events"][data-rows="1"] .eventHero:not(:first-child){display:none}

  @container tile (max-width:250px){

  }

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useLayoutEffect } = React;

/* colour sets: p=pastel(undone), v=vivid(done), d=dark accent (labels on pastel) */
const COL = {
  goals:    {p:"#FFF2CC", v:"#F0A500", d:"#8A5200"},
  word:     {p:"#E5F7FF", v:"#00A6D6", d:"#006A8A"},
  worth:    {p:"#DDF7F0", v:"#00C2A3", d:"#067563"},

  music:    {p:"#E2EDFF", v:"#2F7BFF", d:"#2450BE"},
  habits:   {p:"#D6F7EA", v:"#0FC087", d:"#0A7B58"},
  pushups:  {p:"#FFE2ED", v:"#FF3F79", d:"#A81C4C"},
  weather:  {p:"#DDF4FF", v:"#00B4DC", d:"#0E6E8C"},
  world:    {p:"#E8F5DF", v:"#64B82E", d:"#3D7A16"},
  recall:   {p:"#FFE5FA", v:"#F846D0", d:"#A02391"},
  weekly:   {p:"#DCF6E5", v:"#10C46E", d:"#0C7544"},
  note:     {p:"#E8F6D8", v:"#7ED43F", d:"#4C8319"},
  birthdays:{p:"#FFE3F0", v:"#FF4FA3", d:"#AC2A6C"},
  timer:    {p:"#E3EBFF", v:"#4A6BFF", d:"#2A45BE"},
  breathing:{p:"#DCF7F6", v:"#0DB9B1", d:"#08736E"},
  agenda:   {p:"#FFEADD", v:"#FF6A3D", d:"#B44223"},
  events:   {p:"#FFF3D6", v:"#FFB000", d:"#9A5B00"},
  brain:    {p:"#DDF7FA", v:"#00BFD4", d:"#0E7684"},
  academic: {p:"#E0F4E5", v:"#2CC05E", d:"#1C7440"},
  gmat:     {p:"#FFE1D8", v:"#F05A36", d:"#A7341B"},
  brainflex:{p:"#FFF0D8", v:"#FF9A2E", d:"#B0560F"},
  philo:    {p:"#E8F4FF", v:"#178FE5", d:"#0B5D99"},
  people:   {p:"#DDF8F3", v:"#10C2A0", d:"#0C7A66"},
  shopping: {p:"#FFF6D8", v:"#F2B705", d:"#7A5A00"},
  health:   {p:"#E1F7EC", v:"#18B96E", d:"#0C7042"},
};
/* Every dashboard tile shares the same reversible full-colour presentation.
   Whether a tile is completed by a task control or by tapping an informative

/* dates — the "logical day" rolls over at 01:00, not midnight, so a late night
   doesn't quietly become tomorrow while you're still awake. */
const pad=n=>String(n).padStart(2,"0");
const dateKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const formatDateKey=key=>{ const [y,m,d]=String(key||"").split("-").map(Number); return y&&m&&d?`${pad(d)}/${pad(m)}/${y}`:""; };
const parseDateKey=value=>{
  const s=String(value||"").trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return "";
};
function addDays(key,n){ const [y,m,d]=key.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dateKey(dt); }
function daysBetween(fromKey,toKey){ const [ay,am,ad]=fromKey.split("-").map(Number); const [by,bm,bd]=toKey.split("-").map(Number); return Math.round((new Date(by,bm-1,bd)-new Date(ay,am-1,ad))/86400000); }
const logicalDateKey=(d=new Date())=>{ const dt=new Date(d); if(dt.getHours()<1) dt.setDate(dt.getDate()-1); return dateKey(dt); };
const todayKey=logicalDateKey();

function extractJSON(text){ if(!text) return null; let t=text.replace(/```json|```/g,"").trim(); const s=[t.indexOf("{"),t.indexOf("[")].filter(i=>i>=0); const a=s.length?Math.min(...s):-1; const b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]")); if(a===-1||b===-1) return null; try{ return JSON.parse(t.slice(a,b+1)); }catch{ return null; } }
function clean(s){ if(s==null) return ""; return String(s)
  .replace(/【[^】]*】/g,"").replace(/\[[0-9]+\]/g,"").replace(/\((?:https?:[^)]+)\)/g,"")
  .replace(/https?:\/\/\S+/g,"").replace(/[*_`#>\\]+/g,"").replace(/\s+([.,;:!?])/g,"$1")
  .replace(/\s{2,}/g," ").trim(); }
async function callClaude(system,user,opts={}){
  const key=getKey(); if(!key) throw new Error("no-key");
  const body={ model:opts.model||"claude-haiku-4-5-20251001", max_tokens:opts.max||600, system, messages:[{role:"user",content:user}] };
  const res=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST",
    headers:{ "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true" },
    body:JSON.stringify(body) });
  if(!res.ok) throw new Error("API "+res.status);

}

/* Resolve a direct Apple Music track link via the free iTunes Search API (with proxy fallback).
   Tries a few query phrasings and prefers a result whose artist actually matches, since obscure
   tracks often miss on the first exact-string search. If everything misses, callers fall back
   to a plain Apple Music search link rather than a dead one. */
async function resolveMusicUrl(m){
  const clean=s=>String(s||"").replace(/["“”]/g,"").replace(/\s*[\(\[]feat\.[^)\]]*[\)\]]/gi,"").trim();
  const title=clean(m.title), artist=clean(m.artist);
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  const variants=[`${title} ${artist}`, title, `${artist} ${title.split(" ").slice(0,3).join(" ")}`].filter(Boolean);
  for(const q of variants){
    const term=encodeURIComponent(q);
    const api=`https://itunes.apple.com/search?term=${term}&entity=song&limit=5`;
    for(const u of [api, "https://api.allorigins.win/raw?url="+encodeURIComponent(api)]){
      try{
        const r=await fetch(u); if(!r.ok) continue; const d=await r.json();
        const results=d.results||[];
        const hit=results.find(t=>t.trackViewUrl && norm(t.artistName).includes(norm(artist).slice(0,6))) || results[0];
        if(hit&&hit.trackViewUrl) return hit.trackViewUrl;
      }catch(e){}
    }
  }
  return null;
}

    for(const candidate of candidates){ try{ const attempt=await fetch(candidate); if(attempt.ok){ r=attempt; break; } }catch(e){} }
    if(!r) throw new Error("bad feed");
    const text=await r.text();
    const doc=new DOMParser().parseFromString(text,"text/xml");
    return [...doc.querySelectorAll("item")].slice(0,10).map(it=>({
      title:(it.querySelector("title")?.textContent||"").trim(),
      desc:(it.querySelector("description")?.textContent||"").replace(/<[^>]+>/g," ").trim(),
    })).filter(x=>x.title);
  }));
  const all=[]; const seen=new Set();
  results.forEach(r=>{ if(r.status==="fulfilled") r.value.forEach(it=>{
    const key=it.title.toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(" ").slice(0,6).join(" ");
    if(key && !seen.has(key)){ seen.add(key); all.push(it); }
  }); });
  return all.length ? all : null;
}

async function fetchWeather(profile=getLocationProfile()){

/* iCloud / vCard (.vcf) birthday import — fully local, no network */
function parseVcf(text){
  const out=[];
  const unfold=String(text).replace(/\r\n/g,"\n").replace(/\n[ \t]/g,"");
  const blocks=unfold.split(/BEGIN:VCARD/i);
  for(const blk of blocks){
    if(!/BDAY/i.test(blk)) continue;
    let name="";
    const fn=blk.match(/(?:^|\n)FN[^:\n]*:([^\n]+)/i);
    if(fn) name=fn[1].trim();
    if(!name){ const nrow=blk.match(/(?:^|\n)N[^:\n]*:([^\n]+)/i); if(nrow){ const p=nrow[1].split(";"); name=((p[1]||"")+" "+(p[0]||"")).trim(); } }
    const bM=blk.match(/(?:^|\n)BDAY[^:\n]*:([^\n]+)/i);
    if(!name||!bM) continue;
    const val=bM[1].split("T")[0].trim();
    const noYear = /^--/.test(val) || val.slice(0,4)==="1604";
    const digits=val.replace(/[^0-9]/g,"");
    let mo,da;
    if(noYear && digits.length>=4){ mo=+digits.slice(-4,-2); da=+digits.slice(-2); }
    else if(digits.length===8){ mo=+digits.slice(4,6); da=+digits.slice(6,8); }
    else if(digits.length===6){ mo=+digits.slice(2,4); da=+digits.slice(4,6); }
    else if(digits.length===4){ mo=+digits.slice(0,2); da=+digits.slice(2,4); }
    else continue;
    if(name && mo>=1 && mo<=12 && da>=1 && da<=31) out.push({name, month:mo, day:da});
  }
  return out;
}

async function extractCourseFile(file){
  if(!file) return "";
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib) throw new Error("PDF reader unavailable. Check internet, then try again.");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const pages=[];
    for(let i=1;i<=pdf.numPages;i++){ const page=await pdf.getPage(i); const content=await page.getTextContent(); pages.push(content.items.map(x=>x.str).join(" ")); }
    return pages.join("\n\n");
  }
  if(file.type.startsWith("text/")||/\.(txt|md|csv)$/i.test(file.name)) return file.text();
  throw new Error("Use PDF, TXT, Markdown or CSV. DOCX support can be added next.");
}

/* FSRS-6 spaced repetition — default parameters, 90% desired retention. */
const LEGACY_RECALL_INTERVALS=[1,3,7,16,35,90];
const FSRS_W=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const FSRS_RETENTION=.9;
const FSRS_RATINGS=[
  {value:1,name:"Again",face:"😵"},
  {value:2,name:"Hard",face:"😕"},
  {value:3,name:"Good",face:"🙂"},
  {value:4,name:"Easy",face:"😄"}
];
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
const initialStability=rating=>Math.max(.01,FSRS_W[rating-1]);
const initialDifficulty=rating=>clamp(FSRS_W[4]-Math.exp(FSRS_W[5]*(rating-1))+1,1,10);
const nextDifficulty=(difficulty,rating)=>{
  const damped=difficulty-FSRS_W[6]*(rating-3)*(10-difficulty)/9;
  return clamp(FSRS_W[7]*initialDifficulty(4)+(1-FSRS_W[7])*damped,1,10);
};
const fsrsRetrievability=(elapsed,stability)=>{
  const factor=Math.pow(.9,-1/FSRS_W[20])-1;
  return Math.pow(1+factor*Math.max(0,elapsed)/Math.max(.01,stability),-FSRS_W[20]);
};
const fsrsInterval=stability=>{
  const factor=Math.pow(.9,-1/FSRS_W[20])-1;
  return clamp(Math.round(stability/factor*(Math.pow(FSRS_RETENTION,-1/FSRS_W[20])-1)),1,36500);
};
const recallStateFor=item=>{
  if(item.fsrs&&item.fsrs.version===6) return item.fsrs;
  const legacyLevel=clamp(Number(item.level)||0,0,LEGACY_RECALL_INTERVALS.length-1);
  const legacyInterval=LEGACY_RECALL_INTERVALS[legacyLevel];
  return {
    version:6,
    state:"review",
    stability:legacyInterval,
    difficulty:initialDifficulty(3),
    reps:Math.max(1,Number(item.seen)||1),
    lapses:0,
    lastReview:addDays(item.nextReview||todayKey,-legacyInterval),
    scheduledDays:legacyInterval,
    desiredRetention:FSRS_RETENTION,
    migratedFrom:"fixed-ladder"
  };
};
const newRecallItem=data=>({
  ...data,
  level:0,
  seen:1,
  nextReview:addDays(todayKey,1),
  fsrs:{version:6,state:"new",stability:0,difficulty:0,reps:0,lapses:0,lastReview:null,scheduledDays:1,desiredRetention:FSRS_RETENTION}
});
const scheduleRecall=(item,rating,reviewDate=todayKey)=>{
  const old=recallStateFor(item);
  const isNew=old.state==="new"||!old.stability;
  const elapsed=isNew?0:Math.max(0,daysBetween(old.lastReview||reviewDate,reviewDate));
  const retrievability=isNew?1:fsrsRetrievability(elapsed,old.stability);
  let stability,difficulty;
  if(isNew){
    stability=initialStability(rating);
    difficulty=initialDifficulty(rating);
  }else{
    difficulty=nextDifficulty(old.difficulty,rating);
    if(elapsed===0){
      let increase=Math.exp(FSRS_W[17]*(rating-3+FSRS_W[18]))*Math.pow(old.stability,-FSRS_W[19]);
      if(rating>=3) increase=Math.max(1,increase);
      stability=old.stability*increase;
    }else if(rating===1){
      stability=Math.min(
        FSRS_W[11]*Math.pow(difficulty,-FSRS_W[12])*(Math.pow(old.stability+1,FSRS_W[13])-1)*Math.exp(FSRS_W[14]*(1-retrievability)),
        old.stability
      );
    }else{
      const hardPenalty=rating===2?FSRS_W[15]:1;
      const easyBonus=rating===4?FSRS_W[16]:1;
      stability=old.stability*(1+Math.exp(FSRS_W[8])*(11-difficulty)*Math.pow(old.stability,-FSRS_W[9])*(Math.exp(FSRS_W[10]*(1-retrievability))-1)*hardPenalty*easyBonus);
    }
  }
  stability=clamp(stability,.01,36500);
  const scheduledDays=fsrsInterval(stability);
  const fsrs={
    version:6,
    state:"review",
    stability,
    difficulty,
    reps:(old.reps||0)+1,
    lapses:(old.lapses||0)+(rating===1?1:0),
    lastReview:reviewDate,
    scheduledDays,
    desiredRetention:FSRS_RETENTION
  };
  const review={date:reviewDate,rating,elapsedDays:elapsed,scheduledDays,stability,difficulty,retrievability};
  return {...item,fsrs,seen:(item.seen||1)+1,nextReview:addDays(reviewDate,scheduledDays),reviewLog:[...(item.reviewLog||[]),review]};
};
const humanInterval=days=>days===1?"tomorrow":days<7?`in ${days} days`:days<14?"in 1 week":days<60?`in ${Math.round(days/7)} weeks`:days<730?`in ${Math.round(days/30)} months`:`in ${Math.round(days/365)} years`;

const defaultGmatState=()=>({version:1,examDate:"",weeklyGoal:180,history:[],sessions:[],memory:{},mocks:[]});
const gmatStateOf=state=>({...defaultGmatState(),...(state||{}),history:Array.isArray(state&&state.history)?state.history:[],sessions:Array.isArray(state&&state.sessions)?state.sessions:[],memory:(state&&state.memory)||{},mocks:Array.isArray(state&&state.mocks)?state.mocks:[]});
const gmatHistoryFor=(state,id)=>gmatStateOf(state).history.filter(h=>h.questionId===id);
const gmatQuestionPriority=(state,q)=>{
  const s=gmatStateOf(state), history=gmatHistoryFor(s,q.id), attempts=history.length;
  const correct=history.filter(h=>h.correct).length, accuracy=attempts?correct/attempts:0;
  const average=attempts?history.reduce((sum,h)=>sum+(h.seconds||q.target),0)/attempts:q.target;
  const last=attempts?history[history.length-1]:null;
  const memory=s.memory[q.skill], due=!memory||!memory.nextReview||memory.nextReview<=todayKey;
  const seenToday=history.some(h=>h.date===todayKey);
  const stableNoise=(q.id.split("").reduce((n,ch)=>n+ch.charCodeAt(0),0)+Number(todayKey.slice(-2)))%17/100;
  return (attempts?0:3)+(1-accuracy)*3+Math.max(0,average/q.target-1)*1.4+(due?2.2:0)+(last&&!last.correct?1.2:0)-(seenToday?3:0)+stableNoise;
};
const gmatStats=(state,section)=>{
  const rows=gmatStateOf(state).history.filter(h=>!section||h.section===section);
  const correct=rows.filter(h=>h.correct).length;
  const seconds=rows.reduce((sum,h)=>sum+(h.seconds||0),0);
  return {attempts:rows.length,correct,accuracy:rows.length?Math.round(correct/rows.length*100):0,average:rows.length?Math.round(seconds/rows.length):0};
};
const buildGmatSession=(state,mode="daily",section=null)=>{
  const s=gmatStateOf(state);
  let pool=GMAT_QUESTIONS.filter(q=>!section||q.section===section);
  if(mode==="repair"){
    const wrongIds=[...s.history].reverse().filter(h=>!h.correct).map(h=>h.questionId);
    const unique=[...new Set(wrongIds)];
    const repair=unique.map(id=>GMAT_QUESTIONS.find(q=>q.id===id)).filter(Boolean);
    if(repair.length) return repair.slice(0,5);
  }
  const ranked=[...pool].sort((a,b)=>gmatQuestionPriority(s,b)-gmatQuestionPriority(s,a));
  if(section) return ranked.slice(0,Math.min(6,ranked.length));
  const picks=Object.keys(GMAT_SECTIONS).map(key=>ranked.find(q=>q.section===key)).filter(Boolean);
  ranked.forEach(q=>{ if(picks.length<5&&!picks.some(p=>p.id===q.id))picks.push(q); });
  return picks;
};
const gmatFocusQuestion=state=>[...GMAT_QUESTIONS].sort((a,b)=>gmatQuestionPriority(state,b)-gmatQuestionPriority(state,a))[0];

function weekCount(log,id){ let c=0; for(let d=0;d<7;d++){ const k=addDays(todayKey,-d); if(log[k]&&log[k][id]) c++; } return c; }

  const prevRects=useRef({});

    setLifted(id); document.body.classList.add("dragging");
    window.addEventListener("pointermove",onPointerMove,{passive:false});
    window.addEventListener("pointerup",onPointerUp,{once:true});
    window.addEventListener("pointercancel",onPointerUp,{once:true});
  };
  const onResizeStart=(e,id)=>{
    e.preventDefault(); e.stopPropagation();

    document.body.classList.add("dragging");

    window.addEventListener("pointerup",onPointerUp,{once:true});
    window.addEventListener("pointercancel",onPointerUp,{once:true});
  };
  const onPointerMove=(e)=>{
    if(!drag.current) return; e.preventDefault();
    const d=drag.current;
    if(d.type==="move"){
      if(rafPending.current) return; rafPending.current=true;
      const cx=e.clientX, cy=e.clientY;
      requestAnimationFrame(()=>{
        rafPending.current=false;
        const el=document.elementFromPoint(cx,cy);
        const t=el&&el.closest&&el.closest("[data-tileid]");
        if(!t) return;
        const over=t.getAttribute("data-tileid");
        if(!over || over===d.id) return;
        const r=t.getBoundingClientRect();
        const inBand = cx>r.left+r.width*0.08 && cx<r.right-r.width*0.08 && cy>r.top+r.height*0.08 && cy<r.bottom-r.height*0.08;
        if(!inBand) return;
        if(over===d.lastOver && Date.now()-(d.lastSwap||0)<120) return;
        const cur=[...orderRef.current]; const from=cur.indexOf(d.id); const to=cur.indexOf(over);
        if(from>-1&&to>-1){ cur.splice(from,1); cur.splice(to,0,d.id); orderRef.current=cur; setOrder(cur); d.lastOver=over; d.lastSwap=Date.now(); }
      });
    } else {
      if(rafPending.current) return; rafPending.current=true;
      const cx=e.clientX, cy=e.clientY;
      requestAnimationFrame(()=>{
        rafPending.current=false;
        const cw=cellW();
        const dc=Math.round((cx-d.x)/(cw+GAP));
        const dr=Math.round((cy-d.y)/(ROW+GAP));
        const nc=Math.max(1,Math.min(cols, d.c0+dc));
        const nr=Math.max(1,Math.min(6, d.r0+dr));
        const cur=sizesRef.current[d.id]||{c:2,r:1};
        if(cur.c!==nc||cur.r!==nr){ const next={...sizesRef.current,[d.id]:{c:nc,r:nr}}; sizesRef.current=next; setSizes(next); }
      });
    }
  };

function SpanishCard({sp,busy,done,onLearned,onUnlearned,onGenerate}){
  const [answered,setAnswered]=useState({});
  useEffect(()=>{ setAnswered({}); },[sp && sp.tema]);
  if(!sp) return <GenerateEmpty busy={busy} onGenerate={onGenerate} />;
  const qs=sp.quiz||[];
  const mark=i=>correct=>setAnswered(prev=>{
    if(prev[i]) return prev;
    const next={...prev,[i]:correct};
    if(Object.keys(next).length>=qs.length) onLearned(sp);
    return next;
  });
  const undo=i=>setAnswered(prev=>{
    if(!prev[i]) return prev;
    const next={...prev};
    delete next[i];
    onUnlearned&&onUnlearned(sp);
    return next;
  });
  return (
    <div>
      <div style={{fontSize:16,fontWeight:700,lineHeight:1.2}}>{sp.tema}</div>
      {sp.punto && <div className="insight" style={{marginTop:8}}>{sp.punto}</div>}

          <span style={{fontWeight:700,fontSize:14}}>{v.es}</span>
          <span className="muted" style={{fontSize:13,marginLeft:"auto"}}>{v.en}</span>
        </div>))}
      </div>}
      {qs.map((q,i)=><Quiz key={i} prompt={q.prompt} options={q.options} answer={q.answer} explain={q.explain} onDone={mark(i)} onUndo={()=>undo(i)} />)}
    </div>
  );
}
const recallAnswerFor=item=>{
  const q=item&&item.quiz?item.quiz:{};
  const option=Array.isArray(q.options)?q.options[Number(q.answer)||0]:"";
  const explain=q.explain||"";
  if(option&&explain) return {short:option, detail:explain};
  if(option) return {short:option, detail:""};
  if(explain) return {short:"Answer", detail:explain};
  return {short:item.term||item.title||"Answer", detail:item.meta||""};
};
function RecallCard({due,onGrade,onRestore,onComplete,onIncomplete}){
  const [snap]=useState(()=>due);
  const [answered,setAnswered]=useState({});
  const [revealed,setRevealed]=useState({});
  useEffect(()=>{ if(snap.length===0) onComplete(); /* eslint-disable-next-line */ },[]);
  const rate=(item,rating)=>{
    const scheduled=onGrade(item,rating);
    setAnswered(a=>{ const n={...a,[item.id]:scheduled}; if(Object.keys(n).length>=snap.length) onComplete(); return n; });
  };
  const undo=item=>{
    if(answered[item.id]){ onRestore(item); onIncomplete(); }
    setAnswered(a=>{ const n={...a}; delete n[item.id]; return n; });
    setRevealed(results=>{ const n={...results}; delete n[item.id]; return n; });
  };
  if(snap.length===0) return <PlainEmpty>Nothing due. Finished words and lessons return when FSRS predicts they need refreshing.</PlainEmpty>;
  return <div>{snap.map(item=>{
    const quiz=item.quiz||{};
    const prompts=(quiz.prompts&&quiz.prompts.length)?quiz.prompts:[quiz.prompt||item.title||"What do you remember?"];
    const seen=item.seen||1;
    const prompt=prompts[(seen)%prompts.length]||prompts[0];
    const isRevealed=!!revealed[item.id];
    const scheduled=answered[item.id];
    const answer=recallAnswerFor(item);
    return (<div key={item.id} className="reviewItem" onClick={e=>e.stopPropagation()}>
      <p className="rtitle">{item.title}</p>
      {item.meta && <p className="muted" style={{fontSize:11.5,margin:"-4px 0 8px"}}>{item.meta}</p>}
      <div className="recallFlash">
        <p className="recallQuestion">{prompt}</p>
        {!isRevealed&&!scheduled&&<button type="button" className="pill primary" onClick={()=>setRevealed(r=>({...r,[item.id]:true}))}>Reveal answer</button>}
        {(isRevealed||scheduled)&&<div className="recallAnswer"><b>{answer.short}</b>{answer.detail}</div>}
      </div>
      {isRevealed&&!scheduled&&<>
        <p className="recallHint">How did it feel?</p>
        <div className="recallRatings" role="group" aria-label="Rate this memory">
          {FSRS_RATINGS.map(choice=>{
            const preview=scheduleRecall(item,choice.value);
            return <button type="button" key={choice.value} className="recallRating" title={`${choice.name} · ${humanInterval(preview.fsrs.scheduledDays)}`} aria-label={`${choice.name}, next review ${humanInterval(preview.fsrs.scheduledDays)}`} onClick={()=>rate(item,choice.value)}>
              <span className="face" aria-hidden="true">{choice.face}</span>
            </button>;
          })}
        </div>
      </>}
      {scheduled&&<button type="button" className="recallScheduled" aria-label={`Undo review for ${item.title}`} onClick={()=>undo(item)}><span className="face" aria-hidden="true">{FSRS_RATINGS[scheduled.reviewLog[scheduled.reviewLog.length-1].rating-1].face}</span><span>Back {humanInterval(scheduled.fsrs.scheduledDays)}</span></button>}
    </div>);
  })}</div>;
}
function PushBars({values}){

  return (

      {values.map((v,i)=>(

          <div className="barTrack">
            <div className="bar" style={{height:`${Math.max(v/max*100,v>0?6:2)}%`}}/>
          </div>
        </div>
      ))}
    </div>
  );
}
function nextBirthday(list){
  if(!list.length) return null;
  const now=new Date(); const base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let best=null,bd=99999;
  list.forEach(b=>{ let d=new Date(now.getFullYear(),b.month-1,b.day); if(d<base) d=new Date(now.getFullYear()+1,b.month-1,b.day);
    const days=Math.round((d-base)/86400000); if(days<bd){ bd=days; best={...b,days}; } });
  return best;
}

function BreathingCard({done,onComplete,onIncomplete}){
  const TOTAL_MS=60000, CYCLE_MS=10000, INHALE_MS=4000;
  const [startedAt,setStartedAt]=useState(null);
  const [clock,setClock]=useState(Date.now());
  const [finished,setFinished]=useState(done);
  const completeRef=useRef(onComplete);
  const completedRef=useRef(false);
  completeRef.current=onComplete;
  useEffect(()=>{ if(done)setFinished(true); },[done]);
  useEffect(()=>{
    if(!startedAt)return;
    const advance=()=>{
      const current=Date.now();
      if(current-startedAt>=TOTAL_MS){
        if(completedRef.current)return;
        completedRef.current=true;
        setClock(startedAt+TOTAL_MS);
        setStartedAt(null);
        setFinished(true);
        completeRef.current();
        try{ navigator.vibrate&&navigator.vibrate([55,45,55]); }catch(e){}
        return;
      }
      setClock(current);
    };
    advance();
    const timer=setInterval(advance,100);
    return ()=>clearInterval(timer);
  },[startedAt]);
  const running=startedAt!==null;
  const elapsed=running?Math.min(TOTAL_MS,Math.max(0,clock-startedAt)):0;
  const cycleIndex=running?Math.min(5,Math.floor(elapsed/CYCLE_MS)):finished?6:0;
  const withinCycle=elapsed%CYCLE_MS;
  const inhaling=running&&withinCycle<INHALE_MS;
  const phaseProgress=running?(inhaling?withinCycle/INHALE_MS:(withinCycle-INHALE_MS)/(CYCLE_MS-INHALE_MS)):0;
  const breathAmount=running?(inhaling?phaseProgress:1-phaseProgress):(finished||done?1:0);
  const breathScale=running?(0.72+breathAmount*0.34):(finished||done?1.02:0.8);
  const phaseRemaining=running?Math.max(1,Math.ceil(((inhaling?INHALE_MS:CYCLE_MS)-withinCycle)/1000)):null;
  const begin=()=>{ const time=Date.now(); if(done)onIncomplete&&onIncomplete(); completedRef.current=false; setFinished(false); setClock(time); setStartedAt(time); };
  const stop=()=>{ setStartedAt(null); setClock(Date.now()); completedRef.current=false; };
  const phase=running?(inhaling?"Inhale":"Exhale"):finished||done?"Complete":"Ready";
  const cue=running?(inhaling?"through your nose":"gently and slowly"):finished||done?"Six calm rounds finished":"4 seconds in · 6 seconds out";
  return (
    <div className="breathCard">
      <div className="breathStage">
        <div className="breathProgress" role="progressbar" aria-label="Breathing exercise progress" aria-valuemin="0" aria-valuemax="60" aria-valuenow={Math.round(elapsed/1000)} style={{"--breath-progress":`${running?elapsed/TOTAL_MS*360:finished||done?360:0}deg`}}>
          <div className={"breathOrb "+(running?(inhaling?"inhale":"exhale"):"idle")} style={{"--breath-scale":breathScale,"--breath-amount":breathAmount}}>
            <span className="breathCount" aria-hidden="true">{running?phaseRemaining:finished||done?"✓":"6"}</span>
          </div>
        </div>
      </div>
      <div className="breathCopy">
        <div className="breathPhase" aria-live="polite">{phase}</div>
        <div className="breathCue">{cue}</div>
        {!running&&<div className="breathRecipe" aria-label="Inhale for 4 seconds, exhale for 6 seconds, repeat 6 times"><span>Nose · 4s</span><span>Gentle · 6s</span><span>× 6</span></div>}
        <div className="breathRounds" aria-label={`${running?cycleIndex:finished||done?6:0} of 6 rounds complete`}>
          {Array.from({length:6},(_,i)=><span key={i} className={"breathRound"+(i<cycleIndex?" done":running&&i===cycleIndex?" current":"")} />)}
        </div>
        <div className="breathActions">
          {!running&&<button type="button" className="pill primary" onClick={begin}>{finished||done?"Again":"Start"}</button>}
          {running&&<button type="button" className="link" onClick={stop}>Stop</button>}
          {!running&&(finished||done)&&<span className="breathDone">1 minute</span>}
        </div>
      </div>
    </div>
  );
}

function TimerCard({duration,end,remaining,fired,now,onSetDuration,onStart,onPause,onReset}){
  const diffMs=Math.max(0,(end||0)-now.getTime());
  const running=end>now.getTime()&&!fired;
  const paused=remaining>0&&!running&&!fired;
  const shownMs=running?diffMs:paused?remaining:duration*60000;
  const h=Math.floor(shownMs/3600000), m=Math.floor((shownMs%3600000)/60000);
  const adjust=d=>onSetDuration(Math.max(5,Math.min(24*60,duration+d)));
  return (
    <div className={"timerWrap "+(running?"isRunning":paused?"isPaused":fired?"isFired":"isIdle")}>
      <div className={"timerRow"+(fired?" timerHit":"")}>
        <span className="timerBig">{fired?"Done":`${h}h ${pad(m)}m`}</span>
      </div>
      <div className="timerControls">
        {!running && !paused && !fired && (
          <div className="timerSteppers">
            <button className="puBtn" onClick={()=>adjust(-60)}>−1h</button>
            <button className="puBtn" onClick={()=>adjust(-15)}>−15m</button>
            <button className="puBtn" onClick={()=>adjust(15)}>+15m</button>
            <button className="puBtn" onClick={()=>adjust(60)}>+1h</button>
          </div>
        )}
        <div className="timerActions">
          <button className="pill primary" onClick={running?onPause:onStart}>{running?"Stop":paused?"Resume":"Start"}</button>
          {(running||paused||fired) && <button className="link" onClick={onReset}>Reset</button>}
        </div>
      </div>
    </div>
  );
}

function MiniAgendaCalendar({recurring,events}){
  const [y,m]=todayKey.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const monthLabel=new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric"}).format(first);
  const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const monthOf=key=>Number(String(key||"").split("-")[1]);
  const itemsByDay={};
  const addItem=(key,item)=>{ if(!key||monthOf(key)!==m) return; (itemsByDay[key]=itemsByDay[key]||[]).push(item); };
  (events||[]).forEach(e=>{
    if(e.doneDate&&e.doneDate<todayKey) return;
    const d=daysBetween(todayKey,e.date);
    addItem(e.date,{label:e.label,time:e.time||"",due:d<=0&&!e.doneDate,done:e.doneDate===todayKey});
  });
  (recurring||[]).forEach(r=>{
    let due=addDays(r.lastDone,r.everyDays);
    if(due<todayKey) due=todayKey;
    const d=daysBetween(todayKey,due);
    addItem(due,{label:r.label,time:"",due:d<=0&&r.lastDone!==todayKey,done:r.lastDone===todayKey});
  });
  const days=Array.from({length:42},(_,i)=>{ const dt=new Date(start); dt.setDate(start.getDate()+i); return dateKey(dt); });
  return (
    <div className="miniCalendar" aria-label="Reminder calendar">
      <div className="miniCalHead"><span>{monthLabel}</span><span className="miniCalView">View</span></div>
      <div className="miniCalWeek">{["M","T","W","T","F","S","S"].map((d,i)=><span key={i}>{d}</span>)}</div>
      <div className="miniCalGrid">
        {days.map(key=>{ const day=Number(key.split("-")[2]), out=monthOf(key)!==m, items=(itemsByDay[key]||[]).sort((a,b)=>String(a.time||"").localeCompare(String(b.time||""))); return (
          <div key={key} className={"miniCalDay"+(out?" out":"")+(key===todayKey?" today":"")}>
            <div className="miniCalNum">{day}</div>
            <div className="miniCalEvents">
              {items.slice(0,2).map((item,i)=><span key={i} className={"miniCalChip"+(item.due?" due":"")} title={(item.time?item.time+" · ":"")+item.label}>{item.time?item.time+" ":""}{item.label}</span>)}
              {items.length>2&&<span className="miniCalMore">+{items.length-2}</span>}
            </div>
          </div>
        ); })}
      </div>
    </div>
  );
}
function AgendaCard({recurring,events,noDueToday,emptyDone,onToggleEmpty,onMarkDone,onAddRecurring,onRemoveRecurring,onAddEvent,onRemoveEvent,onToggleEventDone}){

  const rows=[];
  recurring.forEach(r=>{
    const done=r.lastDone===todayKey, due=addDays(r.lastDone,r.everyDays), d=daysBetween(todayKey,due);
    rows.push({ id:r.id, kind:"Recurring", label:r.label, days:d, done, sub:done?"Completed today":`Every ${r.everyDays} days`, canToggle:done||d<=0, onCheck:()=>onMarkDone(r.id), onRemove:()=>onRemoveRecurring(r.id) });
  });
  events.forEach(e=>{
    if(e.doneDate&&e.doneDate<todayKey) return;
    const d=daysBetween(todayKey,e.date), done=e.doneDate===todayKey;
    const time=String(e.time||"").trim();
    rows.push({ id:e.id, kind:"One-off", label:e.label, days:d, time, timeSort:time?Number(time.replace(":","")):9999, done, sub:done?"Completed today":formatDateKey(e.date)+(time?` · ${time}`:""), canToggle:d<=0||done, onCheck:()=>onToggleEventDone(e.id), onRemove:()=>onRemoveEvent(e.id) });
  });
  const rowRank=r=>r.done?1:r.days<=0?0:2;
  rows.sort((a,b)=>rowRank(a)-rowRank(b)||a.days-b.days||(a.timeSort||9999)-(b.timeSort||9999));

        </div>
      );})}
