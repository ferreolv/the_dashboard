function GmatWorkspace({state,onChange,initialMode,onComplete,onClose}){
  const safe=gmatStateOf(state);
  const makeSession=(mode="daily",section=null)=>{
    const questions=buildGmatSession(safe,mode,section);
    return {id:uid(),mode,section,questionIds:questions.map(q=>q.id),index:0,startedAt:Date.now(),results:[],complete:false};
  };
  const [screen,setScreen]=useState(initialMode?"practice":"home");
  const [session,setSession]=useState(()=>initialMode?makeSession(initialMode):null);
  const [selected,setSelected]=useState(null);
  const [answerSeconds,setAnswerSeconds]=useState(0);
  const [errorType,setErrorType]=useState("");
  const [questionStarted,setQuestionStarted]=useState(Date.now());
  const [tick,setTick]=useState(Date.now());
  const [mockForm,setMockForm]=useState({total:"",quant:"",verbal:"",data:""});
  useEffect(()=>{
    if(screen!=="practice"||!session||session.complete||selected!==null)return;
    const timer=setInterval(()=>setTick(Date.now()),1000);
    return ()=>clearInterval(timer);
  },[screen,session&&session.id,session&&session.index,session&&session.complete,selected]);
  const begin=(mode="daily",section=null)=>{ setSession(makeSession(mode,section)); setSelected(null); setErrorType(""); setQuestionStarted(Date.now()); setTick(Date.now()); setScreen("practice"); };
  const current=session&&!session.complete?GMAT_QUESTIONS.find(q=>q.id===session.questionIds[session.index]):null;
  const choose=index=>{ if(selected!==null||!current)return; setSelected(index); setAnswerSeconds(Math.max(1,Math.round((Date.now()-questionStarted)/1000))); };
  const rate=rating=>{
    if(!current||selected===null)return;
    const correct=selected===current.answer;
    if(!correct&&!errorType)return;
    const result={questionId:current.id,section:current.section,skill:current.skill,date:todayKey,correct,selected,seconds:answerSeconds,rating,errorType:correct?null:errorType};
    const results=[...session.results,result], last=session.index>=session.questionIds.length-1;
    onChange(previous=>{
      const next=gmatStateOf(previous);
      const memoryBase=next.memory[current.skill]||newRecallItem({id:"gmat-"+current.skill,type:"gmat-skill",addedOn:todayKey,title:current.skill,reviewLog:[]});
      const memory=scheduleRecall(memoryBase,correct?rating:Math.min(rating,2));
      const updated={...next,history:[...next.history,result],memory:{...next.memory,[current.skill]:memory}};
      if(last){
        const duration=Math.max(1,Math.round((Date.now()-session.startedAt)/60000));
        updated.sessions=[...updated.sessions,{id:session.id,date:todayKey,mode:session.mode,section:session.section||null,questions:session.questionIds.length,correct:results.filter(r=>r.correct).length,minutes:duration,completedAt:new Date().toISOString()}];
      }
      return updated;
    });
    if(last){
      setSession({...session,results,complete:true});
      onComplete();
    }else{
      setSession({...session,results,index:session.index+1});
      setSelected(null); setErrorType(""); setQuestionStarted(Date.now()); setTick(Date.now());
    }
  };
  const reportBad=()=>{
    if(!current)return;
    flagGmatQuestion(current.id);
    const last=session.index>=session.questionIds.length-1;
    if(last){ setSession({...session,complete:true}); onComplete(); }
    else{ setSession({...session,index:session.index+1}); setSelected(null); setErrorType(""); setQuestionStarted(Date.now()); setTick(Date.now()); }
  };
  const addMock=()=>{
    const total=Number(mockForm.total), quant=Number(mockForm.quant), verbal=Number(mockForm.verbal), data=Number(mockForm.data);
    if(total<205||total>805||[quant,verbal,data].some(n=>n<60||n>90)){ alert("Use a total score from 205–805 and section scores from 60–90."); return; }
    onChange(previous=>{ const next=gmatStateOf(previous); return {...next,mocks:[...next.mocks,{id:uid(),date:todayKey,total,quant,verbal,data}]}; });
    setMockForm({total:"",quant:"",verbal:"",data:""});
  };
  const removeMock=id=>onChange(previous=>{ const next=gmatStateOf(previous); return {...next,mocks:next.mocks.filter(m=>m.id!==id)}; });
  const focus=gmatFocusQuestion(safe);
  const examDays=safe.examDate?daysBetween(todayKey,safe.examDate):null;
  const recentMistakes=[...safe.history].reverse().filter(h=>!h.correct).slice(0,30);
  const dueSkills=Object.entries(safe.memory).filter(([,m])=>!m.nextReview||m.nextReview<=todayKey).slice(0,5);
  const weeklyMinutes=safe.sessions.filter(s=>s.date>=addDays(todayKey,-6)).reduce((sum,s)=>sum+(s.minutes||0),0);
  const sessionSeconds=current&&selected===null?Math.max(0,Math.round((tick-questionStarted)/1000)):answerSeconds;
  const answerLetters=["A","B","C","D","E"];
  return <DashboardModal label="GMAT workspace" onClose={onClose} overlayClassName="gmatOverlay" className="ovlcard gmatWorkspace">
      <div className="gmatTop">
        <div className="gmatBrand"><div className="gmatBrandMark">GMAT</div><div><h2>GMAT workspace</h2><p>Fresh daily lesson · adaptive practice · FSRS review</p></div></div>
        <button className="gmatClose" aria-label="Close GMAT workspace" onClick={onClose}>×</button>
      </div>
      <div className="gmatBody">
        {screen!=="practice"&&<div className="gmatNav">
          <button className={"gmatNavBtn"+(screen==="home"?" on":"")} onClick={()=>setScreen("home")}>Overview</button>
          <button className={"gmatNavBtn"+(screen==="mistakes"?" on":"")} onClick={()=>setScreen("mistakes")}>Mistakes · {recentMistakes.length}</button>
          <button className={"gmatNavBtn"+(screen==="mocks"?" on":"")} onClick={()=>setScreen("mocks")}>Official mocks · {safe.mocks.length}</button>
        </div>}
        {screen==="home"&&<div className="gmatDashboard">
          <div>
            <section className="gmatPanel gmatHeroPanel">
              <div><h3>Today’s best next move</h3><p className="gmatPanelSub">Chosen from weakness, timing, coverage and memory decay.</p><div className="gmatHeroFocus">{focus?focus.skill:"Build your baseline"}</div></div>
              <div className="gmatHeroActions"><button className="gmatBtn light" onClick={()=>begin("daily")}>Start 5-question sprint</button>{recentMistakes.length>0&&<button className="gmatBtn ghost" onClick={()=>begin("repair")}>Repair mistakes</button>}</div>
            </section>
            <div className="gmatAnalytics">
              {Object.entries(GMAT_SECTIONS).map(([key,section])=>{ const stats=gmatStats(safe,key); return <div className="gmatStatCard" key={key}><div className="gmatStatHead"><span>{section.mark}</span><span>{stats.average?stats.average+"s avg":"No baseline"}</span></div><div className="gmatStatValue">{stats.attempts?stats.accuracy+"%":"—"}</div><div className="gmatStatSub">{stats.attempts} answered · target ~{section.target}s</div></div>; })}
            </div>
            <section className="gmatPanel" style={{marginTop:14}}>
              <h3>Focused section sets</h3><p className="gmatPanelSub">Six timed questions from one section, ordered by your weakest skills.</p>
              <div className="gmatHeroActions">{Object.entries(GMAT_SECTIONS).map(([key,section])=><button className="gmatBtn soft" key={key} onClick={()=>begin("section",key)}>{section.name}</button>)}</div>
            </section>
          </div>
          <div className="gmatSideStack">
            <section className="gmatPanel">
              <h3>Exam target</h3><p className="gmatPanelSub">{examDays===null?"Add a date to turn preparation into a countdown.":examDays>=0?`${examDays} days remaining`:"Exam date has passed"}</p>
              <div className="gmatSettingRow"><input className="gmatField" type="date" value={safe.examDate} onChange={e=>onChange(previous=>({...gmatStateOf(previous),examDate:e.target.value}))}/><button className="gmatBtn soft" onClick={()=>onChange(previous=>({...gmatStateOf(previous),examDate:""}))}>Clear</button></div>
            </section>
            <section className="gmatPanel">
              <h3>Seven-day rhythm</h3><p className="gmatPanelSub">{weeklyMinutes} of {safe.weeklyGoal} focused minutes completed.</p>
              <div className="gmatMeter" style={{height:7,marginTop:10}}><span style={{width:`${Math.min(100,weeklyMinutes/Math.max(1,safe.weeklyGoal)*100)}%`}}/></div>
              <div className="gmatSettingRow"><input className="gmatField" type="number" min="30" max="1200" step="15" aria-label="Weekly GMAT minutes goal" value={safe.weeklyGoal} onChange={e=>onChange(previous=>({...gmatStateOf(previous),weeklyGoal:Math.max(30,Math.min(1200,Number(e.target.value)||30))}))}/><span className="gmatBtn soft" style={{cursor:"default"}}>min/week</span></div>
            </section>
            <section className="gmatPanel">
              <h3>Due for memory repair</h3><p className="gmatPanelSub">Concepts FSRS predicts are ready to be refreshed.</p>
              <div className="gmatDueList">{dueSkills.length?dueSkills.map(([skill,m])=><div className="gmatDueRow" key={skill}><b>{skill}</b><span>{m.nextReview&&m.nextReview<todayKey?"overdue":"today"}</span></div>):<div className="gmatEmpty">No learned skills are due yet. Your first sprint creates the schedule.</div>}</div>
            </section>
            <section className="gmatPanel">
              <h3>Practice source</h3><p className="gmatPanelSub">A new AI-written lesson is generated every day, with a curated bank as backup. These are original training questions, not official GMAT items — use official mocks for score estimates. Hit “Report a wrong question” on anything that looks off.</p>
              <div className="gmatHeroActions"><a className="gmatBtn soft" href="https://www.mba.com/exam-prep/gmat-official-starter-kit" target="_blank" rel="noreferrer">Official practice ↗</a></div>
            </section>
          </div>
        </div>}
        {screen==="practice"&&session&&session.complete&&<div className="gmatSessionDone">
          <div className="gmatDoneMark">✓</div><h3>Sprint complete</h3><p>Your answers now update both the weakness model and the FSRS review calendar.</p>
          <div className="gmatDoneStats"><div><b>{session.results.filter(r=>r.correct).length}/{session.results.length}</b><span>correct</span></div><div><b>{Math.round(session.results.reduce((n,r)=>n+r.seconds,0)/Math.max(1,session.results.length))}s</b><span>average</span></div><div><b>{session.results.filter(r=>!r.correct).length}</b><span>repairs</span></div></div>
          <div className="gmatHeroActions" style={{justifyContent:"center"}}><button className="gmatBtn" onClick={()=>begin("daily")}>Another sprint</button><button className="gmatBtn soft" onClick={()=>setScreen("home")}>Back to overview</button></div>
        </div>}
        {screen==="practice"&&session&&!session.complete&&current&&<div className="gmatQuestionShell">
          <div className="gmatPracticeHead"><button className="gmatNavBtn" onClick={()=>setScreen("home")}>← Exit sprint</button><span className="gmatKicker">Original practice · not official</span></div>
          <div className="gmatQuestionMeta"><span><b>{GMAT_SECTIONS[current.section].full}</b> · {current.type}</span><span>{sessionSeconds}s · target {current.target}s</span></div>
          <div className="gmatSessionProgress"><span style={{width:`${(session.index+(selected!==null ? 0.45 : 0))/session.questionIds.length*100}%`}}/></div>
          <p className="gmatQuestion">{current.prompt}</p>
          <div className="gmatOptions">{current.options.map((option,i)=>{ let cls="gmatOption"; if(selected!==null){ if(i===current.answer)cls+=" correct"; else if(i===selected)cls+=" wrong"; else cls+=" dim"; } return <button className={cls} disabled={selected!==null} key={i} onClick={()=>choose(i)}><span className="gmatLetter">{answerLetters[i]}</span><span>{option}</span></button>; })}</div>
          {selected!==null&&<><div className="gmatFeedback"><b>{selected===current.answer?"Correct.":"Not quite."}</b> {current.explain}{current.ai&&<button className="gmatReport" type="button" onClick={reportBad} title="Hide this question and skip it — it won't come back">⚑ Report a wrong question</button>}</div>
            {selected!==current.answer&&<div className="gmatErrorWrap"><div className="gmatPromptLabel">What broke?</div><div className="gmatChips">{["Concept","Setup","Calculation","Timing","Trap"].map(reason=><button className={"gmatChip"+(errorType===reason?" on":"")} key={reason} onClick={()=>setErrorType(reason)}>{reason}</button>)}</div></div>}
            <div className="gmatPromptLabel" style={{marginTop:14,marginBottom:0}}>How did the reasoning feel?</div>
            <div className="gmatFeelings">{[
              {rating:1,face:"😵",label:"Guessed"},{rating:2,face:"😕",label:"Struggled"},{rating:3,face:"🙂",label:"Understood"},{rating:4,face:"😄",label:"Automatic"}
            ].map(feel=><button className="gmatFeeling" disabled={selected!==current.answer&&!errorType} key={feel.rating} onClick={()=>rate(feel.rating)}><span className="face">{feel.face}</span><b>{feel.label}</b></button>)}</div>
          </>}
        </div>}
        {screen==="mistakes"&&<div>
          <div className="gmatPracticeHead"><div><h3 style={{margin:0}}>Mistake notebook</h3><p className="gmatPanelSub">Recent errors, including why they happened.</p></div>{recentMistakes.length>0&&<button className="gmatBtn" onClick={()=>begin("repair")}>Repair set</button>}</div>
          <div className="gmatMistakes">{recentMistakes.length?recentMistakes.map((mistake,i)=>{ const q=GMAT_QUESTIONS.find(item=>item.id===mistake.questionId); if(!q)return null; return <div className="gmatMistake" key={i}><div className="gmatMistakeTop"><span>{GMAT_SECTIONS[q.section].name} · {q.skill}</span><span>{mistake.seconds}s</span></div><div className="gmatMistakeText">{q.prompt}</div><span className="gmatMistakeReason">{mistake.errorType||"Unclassified"}</span></div>; }):<div className="gmatEmpty">No mistakes yet. Your errors will become a focused repair queue instead of disappearing.</div>}</div>
        </div>}
        {screen==="mocks"&&<div>
          <div><h3 style={{margin:0}}>Official mock history</h3><p className="gmatPanelSub">Log official practice results here. The dashboard will not invent a predicted score.</p></div>
          <div className="gmatMockForm"><input className="gmatField" inputMode="numeric" placeholder="Total 205–805" value={mockForm.total} onChange={e=>setMockForm({...mockForm,total:e.target.value})}/><input className="gmatField" inputMode="numeric" placeholder="Quant 60–90" value={mockForm.quant} onChange={e=>setMockForm({...mockForm,quant:e.target.value})}/><input className="gmatField" inputMode="numeric" placeholder="Verbal 60–90" value={mockForm.verbal} onChange={e=>setMockForm({...mockForm,verbal:e.target.value})}/><input className="gmatField" inputMode="numeric" placeholder="Data 60–90" value={mockForm.data} onChange={e=>setMockForm({...mockForm,data:e.target.value})}/><button className="gmatBtn" onClick={addMock}>Log mock</button></div>
          <div className="gmatMocks">{safe.mocks.length?[...safe.mocks].reverse().map(mock=><div className="gmatMockRow" key={mock.id}><b>{formatDateKey(mock.date)}</b><span>Total <b>{mock.total}</b></span><span>Q <b>{mock.quant}</b></span><span>V <b>{mock.verbal}</b></span><span>DI <b>{mock.data}</b></span><button className="gmatChip del" aria-label="Delete mock score" onClick={()=>removeMock(mock.id)}>×</button></div>):<div className="gmatEmpty">No official mock logged yet. Add one after using the GMAT Official Starter Kit.</div>}</div>
        </div>}
      </div>
  </DashboardModal>;
}

function BrainFlexCard({brain,busy,revealed,onReveal,onHide,onGenerate}){
  const {expanded}=useTilePresentation();
  if(!brain) return <GenerateEmpty busy={busy} onGenerate={onGenerate} />;
  return (
    <div className={"brainFlexCard"+(expanded?" isExpanded":"")}>
      <span className="brainFormat">{brain.format}</span>
      <p className="brainPrompt">{brain.prompt}</p>
      {!revealed ? <button type="button" className="widgetIconButton" style={{marginTop:9}} aria-label="Reveal answer" title="Reveal answer" onClick={onReveal}><WidgetGlyph name="eye"/></button> : (
        <button className="insight brainSolution" aria-label="Hide answer and mark Brainflex incomplete" onClick={onHide}>💡 {brain.solution}</button>
      )}
    </div>
  );
}

function PhilosophyCard({philo,busy,chat,sending,error,haveKey,onSetup,onRetry,onModeChange,onSubmitInitial,onSend,onReset,onGenerate}){
  const {expanded,open}=useTilePresentation();
  const [draft,setDraft]=useState("");
  const [msg,setMsg]=useState("");
  const logRef=useRef(null);
  useEffect(()=>{ if(expanded&&logRef.current) logRef.current.scrollTop=logRef.current.scrollHeight; });
  if(!philo) return <GenerateEmpty busy={busy} onGenerate={onGenerate} />;
  const started=!!chat.initial;
  const mode=chat.mode||"standard";
  const modeDef=PHILO_MODES.find(m=>m.id===mode)||PHILO_MODES[0];
  const messages=chat.messages||[];
  const latest=messages.length?messages[messages.length-1]:{role:"user",text:chat.initial};
  const send=()=>{ const t=msg.trim(); if(!t||sending) return; open(); onSend(t); setMsg(""); };
  const reflect=()=>{ const t=draft.trim(); if(!t) return; open(); onSubmitInitial(t); };
  return (
    <div className="philoCard">
      <p className="philoQ" style={started&&expanded?{fontSize:14,lineHeight:1.4,marginBottom:9,opacity:.8}:null}>{philo.question}</p>
      {!haveKey&&<p className="dailyDependency">Replies need your Claude API key. Your own reflection still saves. <button className="link" onClick={onSetup}>Add key</button></p>}
      {error&&<div className="dailyDependency" role="alert">{error}{haveKey&&<button className="link" onClick={onRetry} disabled={sending}>Retry reply</button>}</div>}
      <button type="button" className="widgetIconButton primary philoPreviewAction" hidden={expanded} aria-label={started?"Continue philosophy conversation":"Reflect on this question"} title={started?"Continue conversation":"Reflect"} onClick={open}><WidgetGlyph name="chat"/></button>
      <div className="philoWorkspace" hidden={!expanded}>
      <div className="philoModeBar">
        <span className="philoModeIcon" title={modeDef.label} aria-hidden="true">{modeDef.icon}</span>
        <label className="philoModeRow">
          <span>Mode</span>
          <select className="philoModeSelect" value={mode} disabled={sending} onChange={e=>onModeChange(e.target.value)}>
            {PHILO_MODES.map(m=><option key={m.id} value={m.id}>{m.label}</option>)}
          </select>
        </label>
        {started&&<button className="tileUndo" aria-label="Mark Philosophy incomplete" title="Mark incomplete" onClick={onReset}>↶</button>}
      </div>
      {!started ? (<>
        <textarea className="philoThinkArea" aria-label="Your reflection" placeholder="What do you think?" value={draft} onFocus={()=>{if(!expanded)open();}} onChange={e=>setDraft(e.target.value)} />
        <button className="pill primary" style={{marginTop:9,alignSelf:"flex-start"}} disabled={!draft.trim()} onClick={reflect}>Continue reflection →</button>
      </>) : (<>
        {!expanded&&<div className="philoConversationPreview">
          <div className={"chatMsg "+(latest.role==="user"?"me":"them")}>{latest.text}</div>
          {sending&&<div className="chatThinking">…thinking</div>}
          <button className="pill" onClick={open}>Continue conversation →</button>
        </div>}
        <div hidden={!expanded} className="cardExpandedDetails philoConversation">
          <div className="chatLog" ref={logRef}>
            <div className="chatMsg me">{chat.initial}</div>
            {messages.map((m,i)=>(<div key={i} className={"chatMsg "+(m.role==="user"?"me":"them")}>{m.text}</div>))}
            {sending && <div className="chatThinking">…thinking</div>}
          </div>
          <div className="chatInputRow">
            <input className="chatInput" aria-label="Reply to the conversation" placeholder="Push back, or ask why…" value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") send(); }} />
            <button className="chatSend" aria-label="Send reply" disabled={!msg.trim()||sending} onClick={send}>↑</button>
          </div>
        </div>
      </>)}
    </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DashboardEntry/>);
</script>
</body>
</html>
