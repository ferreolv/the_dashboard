}

/* iCloud / vCard (.vcf) birthday import — fully local, no network */
function parseVcf(text){
  const out=[];
  const unfold=String(text).replace(/\r\n/g,"\n").replace(/\n[ \t]/g,"");
  const blocks=unfold.split(/BEGIN:VCARD/i);
  for(const blk of blocks){
    if(!/BDAY/i.test(blk)) continue;
    let name="";
    const fn=blk.match(/(?:^|\n)FN[^:\n]*:([^\n]+)/i);
    if(fn) name=fn[1].trim();
    if(!name){ const nrow=blk.match(/(?:^|\n)N[^:\n]*:([^\n]+)/i); if(nrow){ const p=nrow[1].split(";"); name=((p[1]||"")+" "+(p[0]||"")).trim(); } }
    const bM=blk.match(/(?:^|\n)BDAY[^:\n]*:([^\n]+)/i);
    if(!name||!bM) continue;
    const val=bM[1].split("T")[0].trim();
    const noYear = /^--/.test(val) || val.slice(0,4)==="1604";
    const digits=val.replace(/[^0-9]/g,"");
    let mo,da;
    if(noYear && digits.length>=4){ mo=+digits.slice(-4,-2); da=+digits.slice(-2); }
    else if(digits.length===8){ mo=+digits.slice(4,6); da=+digits.slice(6,8); }
    else if(digits.length===6){ mo=+digits.slice(2,4); da=+digits.slice(4,6); }
    else if(digits.length===4){ mo=+digits.slice(0,2); da=+digits.slice(2,4); }
    else continue;
    if(name && mo>=1 && mo<=12 && da>=1 && da<=31) out.push({name, month:mo, day:da});
  }
  return out;
}

async function extractCourseFile(file){
  if(!file) return "";
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib) throw new Error("PDF reader unavailable. Check internet, then try again.");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const pages=[];
    for(let i=1;i<=pdf.numPages;i++){ const page=await pdf.getPage(i); const content=await page.getTextContent(); pages.push(content.items.map(x=>x.str).join(" ")); }
    return pages.join("\n\n");
  }
  if(file.type.startsWith("text/")||/\.(txt|md|csv)$/i.test(file.name)) return file.text();
  throw new Error("Use PDF, TXT, Markdown or CSV. DOCX support can be added next.");
}

/* FSRS-6 spaced repetition — default parameters, 90% desired retention. */
const LEGACY_RECALL_INTERVALS=[1,3,7,16,35,90];
const FSRS_W=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const FSRS_RETENTION=.9;
const FSRS_RATINGS=[
  {value:1,name:"Again",face:"😵"},
  {value:2,name:"Hard",face:"😕"},
  {value:3,name:"Good",face:"🙂"},
  {value:4,name:"Easy",face:"😄"}
];
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
const initialStability=rating=>Math.max(.01,FSRS_W[rating-1]);
const initialDifficulty=rating=>clamp(FSRS_W[4]-Math.exp(FSRS_W[5]*(rating-1))+1,1,10);
const nextDifficulty=(difficulty,rating)=>{
  const damped=difficulty-FSRS_W[6]*(rating-3)*(10-difficulty)/9;
  return clamp(FSRS_W[7]*initialDifficulty(4)+(1-FSRS_W[7])*damped,1,10);
};
const fsrsRetrievability=(elapsed,stability)=>{
  const factor=Math.pow(.9,-1/FSRS_W[20])-1;
  return Math.pow(1+factor*Math.max(0,elapsed)/Math.max(.01,stability),-FSRS_W[20]);
};
const fsrsInterval=stability=>{
  const factor=Math.pow(.9,-1/FSRS_W[20])-1;
  return clamp(Math.round(stability/factor*(Math.pow(FSRS_RETENTION,-1/FSRS_W[20])-1)),1,36500);
};
const recallStateFor=item=>{
  if(item.fsrs&&item.fsrs.version===6) return item.fsrs;
  const legacyLevel=clamp(Number(item.level)||0,0,LEGACY_RECALL_INTERVALS.length-1);
  const legacyInterval=LEGACY_RECALL_INTERVALS[legacyLevel];
  return {
    version:6,
    state:"review",
    stability:legacyInterval,
    difficulty:initialDifficulty(3),
    reps:Math.max(1,Number(item.seen)||1),
    lapses:0,
    lastReview:addDays(item.nextReview||todayKey,-legacyInterval),
    scheduledDays:legacyInterval,
    desiredRetention:FSRS_RETENTION,
    migratedFrom:"fixed-ladder"
  };
};
const newRecallItem=data=>({
  ...data,
  level:0,
  seen:1,
  nextReview:addDays(todayKey,1),
  fsrs:{version:6,state:"new",stability:0,difficulty:0,reps:0,lapses:0,lastReview:null,scheduledDays:1,desiredRetention:FSRS_RETENTION}
});
const scheduleRecall=(item,rating,reviewDate=todayKey)=>{
  const old=recallStateFor(item);
  const isNew=old.state==="new"||!old.stability;
  const elapsed=isNew?0:Math.max(0,daysBetween(old.lastReview||reviewDate,reviewDate));
  const retrievability=isNew?1:fsrsRetrievability(elapsed,old.stability);
  let stability,difficulty;
  if(isNew){
    stability=initialStability(rating);
    difficulty=initialDifficulty(rating);
  }else{
    difficulty=nextDifficulty(old.difficulty,rating);
    if(elapsed===0){
      let increase=Math.exp(FSRS_W[17]*(rating-3+FSRS_W[18]))*Math.pow(old.stability,-FSRS_W[19]);
      if(rating>=3) increase=Math.max(1,increase);
      stability=old.stability*increase;
    }else if(rating===1){
      stability=Math.min(
        FSRS_W[11]*Math.pow(difficulty,-FSRS_W[12])*(Math.pow(old.stability+1,FSRS_W[13])-1)*Math.exp(FSRS_W[14]*(1-retrievability)),
        old.stability
      );
    }else{
      const hardPenalty=rating===2?FSRS_W[15]:1;
      const easyBonus=rating===4?FSRS_W[16]:1;
      stability=old.stability*(1+Math.exp(FSRS_W[8])*(11-difficulty)*Math.pow(old.stability,-FSRS_W[9])*(Math.exp(FSRS_W[10]*(1-retrievability))-1)*hardPenalty*easyBonus);
    }
  }
  stability=clamp(stability,.01,36500);
  const scheduledDays=fsrsInterval(stability);
  const fsrs={
    version:6,
    state:"review",
    stability,
    difficulty,
    reps:(old.reps||0)+1,
    lapses:(old.lapses||0)+(rating===1?1:0),
    lastReview:reviewDate,
    scheduledDays,
    desiredRetention:FSRS_RETENTION
  };
  const review={date:reviewDate,rating,elapsedDays:elapsed,scheduledDays,stability,difficulty,retrievability};
  return {...item,fsrs,seen:(item.seen||1)+1,nextReview:addDays(reviewDate,scheduledDays),reviewLog:[...(item.reviewLog||[]),review]};
};
const humanInterval=days=>days===1?"tomorrow":days<7?`in ${days} days`:days<14?"in 1 week":days<60?`in ${Math.round(days/7)} weeks`:days<730?`in ${Math.round(days/30)} months`:`in ${Math.round(days/365)} years`;

let GMAT_QUESTIONS=GMAT_QUESTIONS_BASE.slice();
const GMAT_SECTION_TARGET={quant:120,verbal:120,data:130};
function rebuildGmatPool(){
  const flagged=new Set(GMAT_FLAGGED);
  GMAT_QUESTIONS=[...GMAT_AI_QUESTIONS,...GMAT_QUESTIONS_BASE].filter(q=>!flagged.has(q.id));
  if(!GMAT_QUESTIONS.length) GMAT_QUESTIONS=GMAT_QUESTIONS_BASE.slice();
}
function normalizeGmatAI(list,dateKey){
  if(!Array.isArray(list)) return [];
  const out=[];
  list.forEach((raw,i)=>{
    if(!raw||typeof raw!=="object") return;
    const section=["quant","verbal","data"].includes(raw.section)?raw.section:"quant";
    const options=Array.isArray(raw.options)?raw.options.map(o=>String(o)).filter(Boolean):[];
    let answer=Number(raw.answer);
    if(options.length<2||!(answer>=0&&answer<options.length)) return; // skip malformed
    const prompt=String(raw.prompt||"").trim(); if(!prompt) return;
    out.push({
      id:"ai-"+dateKey+"-"+i,
      section,
      skill:String(raw.skill||GMAT_SECTIONS[section].name).slice(0,60),
      type:String(raw.type||"Problem solving").slice(0,40),
      target:Number(raw.target)>0?Number(raw.target):GMAT_SECTION_TARGET[section],
      prompt,
      options,
      answer,
      explain:String(raw.explain||"").trim()||"See the worked reasoning above.",
      ai:true,
      genDate:dateKey,
    });
  });
  return out;
}
function flagGmatQuestion(id){
  if(!id||GMAT_FLAGGED.includes(id)) return;
  GMAT_FLAGGED=[...GMAT_FLAGGED,id].slice(-300);
  try{ save("gmatFlagged",GMAT_FLAGGED); }catch(e){}
  rebuildGmatPool();
}
const defaultGmatState=()=>({version:1,examDate:"",weeklyGoal:180,history:[],sessions:[],memory:{},mocks:[]});
const gmatStateOf=state=>({...defaultGmatState(),...(state||{}),history:Array.isArray(state&&state.history)?state.history:[],sessions:Array.isArray(state&&state.sessions)?state.sessions:[],memory:(state&&state.memory)||{},mocks:Array.isArray(state&&state.mocks)?state.mocks:[]});
const gmatHistoryFor=(state,id)=>gmatStateOf(state).history.filter(h=>h.questionId===id);
const gmatQuestionPriority=(state,q)=>{
  const s=gmatStateOf(state), history=gmatHistoryFor(s,q.id), attempts=history.length;
  const correct=history.filter(h=>h.correct).length, accuracy=attempts?correct/attempts:0;
  const average=attempts?history.reduce((sum,h)=>sum+(h.seconds||q.target),0)/attempts:q.target;
  const last=attempts?history[history.length-1]:null;
  const memory=s.memory[q.skill], due=!memory||!memory.nextReview||memory.nextReview<=todayKey;
  const seenToday=history.some(h=>h.date===todayKey);
  const stableNoise=(q.id.split("").reduce((n,ch)=>n+ch.charCodeAt(0),0)+Number(todayKey.slice(-2)))%17/100;
  return (attempts?0:3)+(1-accuracy)*3+Math.max(0,average/q.target-1)*1.4+(due?2.2:0)+(last&&!last.correct?1.2:0)-(seenToday?3:0)+stableNoise;
};
const gmatStats=(state,section)=>{
  const rows=gmatStateOf(state).history.filter(h=>!section||h.section===section);
  const correct=rows.filter(h=>h.correct).length;
  const seconds=rows.reduce((sum,h)=>sum+(h.seconds||0),0);
  return {attempts:rows.length,correct,accuracy:rows.length?Math.round(correct/rows.length*100):0,average:rows.length?Math.round(seconds/rows.length):0};
};
const buildGmatSession=(state,mode="daily",section=null)=>{
  const s=gmatStateOf(state);
  let pool=GMAT_QUESTIONS.filter(q=>!section||q.section===section);
  if(mode==="repair"){
    const wrongIds=[...s.history].reverse().filter(h=>!h.correct).map(h=>h.questionId);
    const unique=[...new Set(wrongIds)];
    const repair=unique.map(id=>GMAT_QUESTIONS.find(q=>q.id===id)).filter(Boolean);
    if(repair.length) return repair.slice(0,5);
  }
  const ranked=[...pool].sort((a,b)=>gmatQuestionPriority(s,b)-gmatQuestionPriority(s,a));
  if(section) return ranked.slice(0,Math.min(6,ranked.length));
  const picks=Object.keys(GMAT_SECTIONS).map(key=>ranked.find(q=>q.section===key)).filter(Boolean);
  ranked.forEach(q=>{ if(picks.length<5&&!picks.some(p=>p.id===q.id))picks.push(q); });
  return picks;
};
const gmatFocusQuestion=state=>[...GMAT_QUESTIONS].sort((a,b)=>gmatQuestionPriority(state,b)-gmatQuestionPriority(state,a))[0];

function savedDailyQuizAnswers(questions){
  const saved=load("quizAnswers:"+todayKey,{}),answers={};
  questions.forEach((question,index)=>{const selected=saved[JSON.stringify([question.prompt,question.options,question.answer])];if(Number.isInteger(selected)&&selected>=0&&selected<question.options.length)answers[index]=selected===question.answer;});
  return answers;
}
function Quiz({prompt,options,answer,explain,onDone,onUndo}){
  const answerKey=JSON.stringify([prompt,options,answer]);
  const [sel,setSel]=useState(()=>{const saved=load("quizAnswers:"+todayKey,{})[answerKey];return Number.isInteger(saved)&&saved>=0&&saved<options.length?saved:null;});
  const choose=async value=>{
    if(logicalDateKeyInZone(new Date(),getLocationProfile().timezone)!==todayKey){location.reload();return false;}
    try{
      const apply=()=>{const answers={...load("quizAnswers:"+todayKey,{})};if(value===null)delete answers[answerKey];else answers[answerKey]=value;localStorage.setItem("fefe_quizAnswers:"+todayKey,JSON.stringify(answers));schedulePush();};
      if(navigator.locks)await navigator.locks.request("fefe:progress:quizAnswers:"+todayKey,apply);else apply();
      setSel(value);return true;
    }catch(error){window.dispatchEvent(new CustomEvent("dashboard-storage-error",{detail:{key:"answers",state:"storage_error"}}));return false;}
  };
  useEffect(()=>{const sync=event=>{if(event.key==="fefe_quizAnswers:"+todayKey){const saved=load("quizAnswers:"+todayKey,{})[answerKey];setSel(Number.isInteger(saved)&&saved>=0&&saved<options.length?saved:null);}};window.addEventListener("storage",sync);return()=>window.removeEventListener("storage",sync);},[answerKey]);

  const done=sel!==null;
  return (
    <div>
      {prompt && <p className="qprompt">{prompt}</p>}
      <div className="qopts">
        {options.map((o,i)=>{ let cls="qopt"; if(done){ if(i===answer)cls+=" correct"; else if(i===sel)cls+=" wrong"; else cls+=" dim"; }
          return <button key={i} className={cls} onClick={async()=>{if(sel===i){if(await choose(null))onUndo&&onUndo();}else if(!done){if(await choose(i))onDone&&onDone(i===answer);}}}>{o}</button>; })}
      </div>
      {done && explain && <p className="qexplain">{explain}</p>}
    </div>
  );
}

/* The Word tile reads like a page out of a dictionary: serif headword, IPA,
   italic part of speech, a numbered sense, then the French gloss as a sub-entry.
   The synonym quiz lives in the expanded view, like the other reading tiles. */
function WordCard({word,busy,onLearned,onUnlearned,onGenerate}){
  const {expanded}=useTilePresentation();
  if(!word) return <GenerateEmpty busy={busy} onGenerate={onGenerate} />;
  const ipa=String(word.ipa||"").replace(/^\/+|\/+$/g,"");
  return (
    <div className="dictEntry">
      <div className="dictHeadline">
        <span className="dictWord">{word.term_en}</span>
        {ipa && <span className="dictIpa">/{ipa}/</span>}
      </div>
      {word.pos && <div className="dictPos">{word.pos}</div>}
      <p className="dictSense"><span className="dictNum">1</span><span>{word.def_en}</span></p>
      <p className="dictXlat"><span className="dictLangTag">FR</span><b>{word.term_fr}</b>{expanded&&word.def_fr&&<span className="dictXlatDef"> — {word.def_fr}</span>}</p>
      <div hidden={!expanded} className="cardExpandedDetails">{word.quiz && <Quiz prompt="closest word?" options={word.quiz.options} answer={word.quiz.answer} explain={`“${word.term_en}” — ${word.def_en}.`} onDone={()=>onLearned(word)} onUndo={()=>onUnlearned&&onUnlearned(word)} />}</div>
    </div>
  );
}
function LessonCard({lesson,busy,onLearned,onUnlearned,onGenerate}){

  const qs=lesson.quiz||[];

  const [timerDuration,setTimerDuration]=useState(()=>load("timerDuration",450));
  const [timerEnd,setTimerEnd]=useState(()=>load("timerEnd",0));
  const [timerRemaining,setTimerRemaining]=useState(()=>load("timerRemaining",0));
  const persistTimerDuration=v=>{ setTimerDuration(v); save("timerDuration",v); setTimerRemaining(0); save("timerRemaining",0); };
  const startTimer=()=>{ const end=Date.now()+(timerRemaining>0?timerRemaining:timerDuration*60000); setTimerEnd(end); save("timerEnd",end); setTimerRemaining(0); save("timerRemaining",0); setTimerFired(false); };
  const pauseTimer=()=>{ if(timerEnd<=Date.now())return; const remaining=timerEnd-Date.now(); setTimerRemaining(remaining); save("timerRemaining",remaining); setTimerEnd(0); save("timerEnd",0); };
  const resetTimer=()=>{ setTimerEnd(0); save("timerEnd",0); setTimerRemaining(0); save("timerRemaining",0); setTimerFired(false); };
  const [timerFired,setTimerFired]=useState(false);

  /* which of today's generated tiles are missing/failed, so they can be retried individually */
  // Daily error states are date-scoped; saved successes are independent of them.

  const [now,setNow]=useState(new Date());
  useEffect(()=>{ const t=setInterval(()=>{ const current=new Date(); setNow(current); if(logicalDateKeyInZone(current,locationProfile.timezone)!==todayKey) location.reload(); },15000); return ()=>clearInterval(t); },[locationProfile.timezone]);
  useEffect(()=>{ const onR=()=>setCols(columnsForWidth(window.innerWidth)); window.addEventListener("resize",onR); return ()=>window.removeEventListener("resize",onR); },[]);

  /* fire the clock-timer chime once when the target minute arrives */
  useEffect(()=>{
    if(timerEnd>0 && now.getTime()>=timerEnd && !timerFired){
      setTimerFired(true);
      setTimerRemaining(0); save("timerRemaining",0);
      try{
        const Ctx=window.AudioContext||window.webkitAudioContext;
        const ctx=new Ctx(); const o=ctx.createOscillator(); const g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.frequency.value=880; o.type="sine";
        g.gain.setValueAtTime(0.0001,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.22,ctx.currentTime+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.7);
        o.start(); o.stop(ctx.currentTime+0.7);
      }catch(e){}
      if("Notification" in window){
        if(Notification.permission==="granted") new Notification("Timer complete",{body:"7h30 timer finished."});

  /* log this visit — used for the app-days streak */

  /* roll unfinished goals from ALL past days into today (handles multi-day skips) */
  useEffect(()=>{
    const gl=load("goalsLog",{}); let changed=false; const carried=[];
    Object.keys(gl).forEach(k=>{ if(k<todayKey){ const keep=[]; (gl[k]||[]).forEach(g=>{ if(g.done) keep.push(g); else carried.push({...g,carried:true}); });
      if(keep.length!==(gl[k]||[]).length){ gl[k]=keep; changed=true; } } });
    if(carried.length){ const seen=new Set((gl[todayKey]||[]).map(x=>x.text)); const add=carried.filter(x=>!seen.has(x.text)); if(add.length){ gl[todayKey]=[...(gl[todayKey]||[]),...add]; changed=true; } }
    if(changed){ save("goalsLog",gl); setGoalsLog(gl); }
  },[]);

  const goals=goalsLog[todayKey]||[]; const rToday=ritualLog[todayKey]||{}; const hToday=habitLog[todayKey]||{}; const pToday=pushLog[todayKey]||0;

  const goalsFor=k=>goalsLog[k]||[];
  const setGoalsDay=(k,arr)=>{ const m={...goalsLog,[k]:arr}; setGoalsLog(m); save("goalsLog",m); };
  const moveGoal=(from,to,id)=>{ if(!from||!to||from===to) return; const item=(goalsLog[from]||[]).find(g=>g.id===id); if(!item)return;
    const m={...goalsLog,[from]:(goalsLog[from]||[]).filter(g=>g.id!==id),[to]:[...(goalsLog[to]||[]),{...item,carried:false}]}; setGoalsLog(m); save("goalsLog",m); };
  const setTodayNote=t=>{ const m={...notes,[todayKey]:t}; setNotes(m); save("notes",m); };
  const persistHabits=v=>{ setHabits(v); save("habits",v); };

  const updateStoredProgress=async(key,setter,update,fallback)=>{
    if(logicalDateKeyInZone(new Date(),getLocationProfile().timezone)!==todayKey){location.reload();return;}
    const apply=()=>{const next=update(load(key,fallback));save(key,next);setter(next);};

  };
  const persistRecall=update=>updateStoredProgress("recall",setRecallList,previous=>typeof update==="function"?update(previous):update,[]);
  const appendDailyRecall=(type,additions)=>persistRecall(previous=>previous.some(item=>item.type===type&&item.addedOn===todayKey)?previous:[...previous,...additions.map((item,index)=>({...item,id:"daily-"+todayKey+"-"+type+"-"+index}))]);
  const persistGmat=v=>{
    if(typeof v==="function"){

    const next=gmatStateOf(v); setGmat(next); save("gmat",next);

  const toggleHabit=id=>{ const day={...hToday,[id]:!hToday[id]}; const m={...habitLog,[todayKey]:day}; setHabitLog(m); save("habitLog",m); };

  const setPushExact=n=>{ const v=Math.max(0,n|0); const m={...pushLog,[todayKey]:v}; setPushLog(m); save("pushLog",m); };

  const activeForDay=k=>{

  const openPage=next=>{

  useEffect(()=>{
    const syncRoute=()=>{if(/^#\/?reset-password(?:\?|$)/.test(location.hash))return;const next=dashboardPageFromHash();setPage(next);setEdit(false);if(location.hash!=="#/"+next)history.replaceState(null,"","#/"+next);window.scrollTo({top:0,behavior:"auto"});};
    if(location.hash!=="#/"+dashboardPageFromHash())history.replaceState(null,"","#/"+dashboardPageFromHash());
    window.addEventListener("hashchange",syncRoute);window.addEventListener("popstate",syncRoute);

  },[]);

  const goSettings=()=>openPage("settings");
  const [genBusy,setGenBusy]=useState(false);

  // Every entry point uses this engine; a ready tile is never a generation request.
  const runGen=async(requested,{silent=false}={})=>{
    if(genBusyRef.current){notify("Tiles are still loading. Saved content is kept; wait for this request to finish.");return;}
    if(!dailyHydrated){
      genBusyRef.current=true;setGenBusy(true);
      try{const changed=await pullSync();if(changed){location.reload();return;}setDailyHydrated(_syncReadOK);setSyncChecked(true);if(!_syncReadOK)showLoadProblems([dailyIssueInfo("account",_syncIssue?.state||"sync_pending")]);}
      finally{genBusyRef.current=false;setGenBusy(false);}return;
    }
    if(logicalDateKeyInZone(new Date(),getLocationProfile().timezone)!==todayKey){location.reload();return;}
    const initial=mergeDailyContent(daily,load("daily:"+todayKey,{}));
    const keys=dailyRequestKeys(requested,initial);
    if(!keys.length){if(!silent)notify("Everything is saved for today. Your content and progress are unchanged.");return;}
    genBusyRef.current=true;setGenBusy(true);setLoadingKeys(keys);
    const issues={};
    const failed=(key,code,message)=>{updateLoadStatus({[key]:{state:code,message}});if(code==="ready")delete issues[key];else issues[key]=dailyIssueInfo(key,code,message);};
    const localPrefs=load("genPrefs",null);
    const skipped=new Set(keys.filter(key=>SHARED_KEYS.has(key)&&SHARED_URL&&Array.isArray(localPrefs)&&!localPrefs.includes(key)));
    skipped.forEach(key=>failed(key,"disabled",""));
    const remember=(key,value)=>{
      const before=load("daily:"+todayKey,{}), next=acceptDaily({[key]:value});
      if(!validDailyTile(key,before[key])&&validDailyTile(key,next[key])){
        const history={word:["wordHistory",value.term_en],worth:["lessonHistory",value.title],spanish:["spanishHistory",value.tema],german:["germanHistory",value.thema],music:["musicHistory",value.title+" — "+value.artist],brainflex:["brainHistory",value.format],philo:["philoHistory",value.theme]};
        if(history[key]){const [name,item]=history[key];save(name,[...new Set([...load(name,[]),item])].slice(-80));}
        if(key==="world")save("worldHistory",[...new Set([...load("worldHistory",[]),...value.map(item=>item.headline)])].slice(-40));
      }
      failed(key,"ready","");
    };
    try{
      const shared=keys.filter(key=>!skipped.has(key)&&SHARED_URL&&SHARED_KEYS.has(key));
      const jobs=keys.filter(key=>!skipped.has(key)&&!shared.includes(key)).map(key=>withDailyLock(todayKey,key,async()=>{
        const saved=load("daily:"+todayKey,{});
        if(validDailyTile(key,saved[key])){acceptDaily(saved);return;}
        if(key==="academic"&&!SHARED_URL&&!load("courses",[]).length){failed(key,"missing_course","Add course notes to load your study tile.");return;}
        if(key!=="weather"&&!(key==="academic"&&SHARED_URL)&&!getKey()){failed(key,"personal_key","Add your Claude API key in Settings.");return;}
        try{
          let value;
          if(key==="academic"&&SHARED_URL){
            const cs=load("courses",[]),ptr=load("academicPtr",0),course=cs[ptr%cs.length];
            const response=await fetch(SHARED_URL+"/daily/personal",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+getAccountToken()},body:JSON.stringify({date:todayKey,key,apiKey:getKey(),course,avoid:(load("courseCoverage",{})[course?.id]||[]).slice(-12)}),signal:AbortSignal.timeout(65000)});
            const doc=await readDailyResponse(response);
            if(doc.date!==todayKey)throw Error("wrong_day");
            value=doc.content&&doc.content[key];
            if(!validDailyTile(key,value)){const status=doc.status&&doc.status[key];failed(key,status?.state||"invalid_content",status?.message);return;}
            remember(key,value);
            if(course){save("academicPtr",ptr+1);const coverage=load("courseCoverage",{});save("courseCoverage",{...coverage,[course.id]:[...new Set([...(coverage[course.id]||[]),value.concept])].slice(-30)});}return;
          }
          value=await GEN_TASKS[key]?.();
          if(!validDailyTile(key,value))throw Error("invalid_content");
          if(key==="music"){const match=await resolveMusicTrack(value).catch(()=>null);if(match)value={...value,...match};}
          remember(key,value);
        }catch(error){const issue=dailyRequestFailure(error);failed(key,issue.state,issue.message);}
      }).catch(error=>{const issue=dailyRequestFailure(error);failed(key,issue.state,issue.message);}));
      if(shared.length)jobs.push(withDailyLock(todayKey,"shared",async()=>{
        const needed=dailyRequestKeys(shared,load("daily:"+todayKey,{}));
        if(!needed.length){acceptDaily(load("daily:"+todayKey,{}));return;}
        try{
          let response=await fetch(SHARED_URL+"/shared/retry?date="+encodeURIComponent(todayKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({keys:needed}),signal:AbortSignal.timeout(65000)});
          if(response.status===404||response.status===405)response=await fetch(SHARED_URL+"/shared?date="+encodeURIComponent(todayKey),{cache:"no-store",signal:AbortSignal.timeout(65000)});
          const doc=await readDailyResponse(response);
          if(doc.date!==todayKey)throw Error("wrong_day");
          for(const key of needed){
            if(validDailyTile(key,doc.content&&doc.content[key]))remember(key,doc.content[key]);
            else{const status=doc.status&&doc.status[key];failed(key,status?.state||"invalid_content",status?.message);}
          }
        }catch(error){const issue=dailyRequestFailure(error);shared.forEach(key=>failed(key,issue.state,issue.message));}
      }).catch(error=>{const issue=dailyRequestFailure(error);shared.forEach(key=>failed(key,issue.state,issue.message));}));
      await Promise.all(jobs);
      const saved=load("daily:"+todayKey,{}),remaining=keys.filter(key=>!validDailyTile(key,saved[key]));
      const problems=remaining.map(key=>issues[key]||dailyIssueInfo(key,"error"));
      if(problems.length)showLoadProblems(problems);
      else if(!silent)notify("Today's content is saved. Nothing was replaced; your progress is kept.");
    }finally{genBusyRef.current=false;setGenBusy(false);setLoadingKeys([]);}
  };
  const generateToday=()=>{
    const selected=ALL_GEN_KEYS.filter(key=>activeTiles.includes(key));
    const plan=dailyRefreshPlan(selected,mergeDailyContent(daily,load("daily:"+todayKey,{})),effectiveDailyStatus,dailyHydrated,genBusy);
    if(dailyHydrated&&plan.blocked.length&&plan.loadable.length===0){showLoadProblems(plan.blocked.map(key=>dailyIssueInfo(key,effectiveDailyStatus[key].state,effectiveDailyStatus[key].message)),"Finish setting up your tiles");return;}
    return runGen(selected);
  };
  const regenerateOne=key=>runGen([key]);

  /* recall scheduling — store alt prompts so review looks different each time */
  const learnWord=w=>{ setRitual("word"); if(w&&w.quiz && !recallList.some(x=>x.type==="word"&&x.addedOn===todayKey)) appendDailyRecall("word",[newRecallItem({ id:uid(), type:"word", addedOn:todayKey, title:"Word · "+w.term_en, term:w.term_en, meta:`En français : ${w.term_fr}`, quiz:{ prompts:[`Closest word to “${w.term_en}”?`, ...(w.quiz.alt_prompts||[])].filter(Boolean), options:w.quiz.options, answer:w.quiz.answer, explain:`“${w.term_en}” — ${w.def_en}.` } })]); };
  const unlearnWord=w=>{ unsetRitual("word"); persistRecall(previous=>previous.filter(x=>!(x.type==="word"&&x.addedOn===todayKey&&x.term===(w&&w.term_en)))); };
  const learnLesson=l=>{ setRitual("worth"); if(l&&l.quiz&&l.quiz[0] && !recallList.some(x=>x.type==="lesson"&&x.addedOn===todayKey)){ const q=l.quiz[0]; appendDailyRecall("lesson",[newRecallItem({ id:uid(), type:"lesson", addedOn:todayKey, title:l.title, quiz:{ prompts:[q.prompt, ...(q.alt_prompts||[])].filter(Boolean), options:q.options, answer:q.answer, explain:q.explain } })]); } };
  const unlearnLesson=l=>{ unsetRitual("worth"); persistRecall(previous=>previous.filter(x=>!(x.type==="lesson"&&x.addedOn===todayKey&&x.title===(l&&l.title)))); };
  /* Spanish feeds recall harder than the others on purpose — both quiz questions AND each
     vocab word (using the day's other vocab as natural decoys) — so a day of Spanish doesn't
     just evaporate after the tile is marked done. */
  const learnSpanish=sp=>{
    setRitual("spanish");
    if(!sp || recallList.some(x=>x.type==="spanish"&&x.addedOn===todayKey)) return;
    const additions=[];
    (sp.quiz||[]).forEach(q=>{ if(!q) return; additions.push(newRecallItem({ id:uid(), type:"spanish", addedOn:todayKey, title:"Español · "+sp.tema, quiz:{ prompts:[q.prompt], options:q.options, answer:q.answer, explain:q.explain } })); });
    const vocab=sp.vocab||[];
    vocab.forEach((v,i)=>{
      const decoys=vocab.filter((_,j)=>j!==i).map(x=>x.en);
      const base=[v.en,...decoys].slice(0,3); while(base.length<3) base.push("—");
      const order=[0,1,2].sort(()=>Math.random()-0.5);
      const options=order.map(idx=>base[idx]); const answer=order.indexOf(0);
      additions.push(newRecallItem({ id:uid(), type:"spanish", addedOn:todayKey, title:"Vocab · "+sp.tema, quiz:{ prompts:[`¿Qué significa “${v.es}”?`], options, answer, explain:`“${v.es}” = ${v.en}.` } }));
    });
    if(additions.length) appendDailyRecall("spanish",additions);
  };
  /* German feeds recall the same way as Spanish — quiz questions plus every vocab word,
     each keeping its pronunciation in the answer so the respelling is rehearsed too. */
  const learnGerman=de=>{
    setRitual("german");
    if(!de || recallList.some(x=>x.type==="german"&&x.addedOn===todayKey)) return;
    const additions=[];
    (de.quiz||[]).forEach(q=>{ if(!q) return; additions.push(newRecallItem({ id:uid(), type:"german", addedOn:todayKey, title:"Deutsch · "+de.thema, quiz:{ prompts:[q.prompt], options:q.options, answer:q.answer, explain:q.explain } })); });
    const vocab=de.vocab||[];
    vocab.forEach((v,i)=>{
      const decoys=vocab.filter((_,j)=>j!==i).map(x=>x.fr);
      const base=[v.fr,...decoys].slice(0,3); while(base.length<3) base.push("—");
      const order=[0,1,2].sort(()=>Math.random()-0.5);
      const options=order.map(idx=>base[idx]); const answer=order.indexOf(0);
      additions.push(newRecallItem({ id:uid(), type:"german", addedOn:todayKey, title:"Vokabel · "+de.thema, quiz:{ prompts:[`Que veut dire « ${v.de} » ?`], options, answer, explain:`« ${v.de} » = ${v.fr}${v.pron?` (prononcé ${v.pron})`:""}.` } }));
    });

  };
  const learnAcademic=a=>{ setRitual("academic"); if(a&&a.quiz&&a.quiz.length && !recallList.some(x=>x.type==="academic"&&x.addedOn===todayKey)){
    const additions=a.quiz.filter(Boolean).map(q=>newRecallItem({ id:uid(), type:"academic", addedOn:todayKey, title:(a.courseName?a.courseName+" · ":"")+a.concept, quiz:{ prompts:[q.prompt], options:q.options, answer:q.answer, explain:q.explain } }));
    if(additions.length) appendDailyRecall("academic",additions);
  } };
  const unlearnAcademic=a=>{ unsetRitual("academic"); persistRecall(previous=>previous.filter(x=>!(x.type==="academic"&&x.addedOn===todayKey&&x.title===((a&&a.courseName?a.courseName+" · ":"")+(a&&a.concept||""))))); };
  const learnBank=(topic,quiz)=>{ if(!quiz) return; persistRecall(previous=>[...previous,newRecallItem({ id:uid(), type:"brain-bank", addedOn:todayKey, title:"🧠 "+topic, quiz:{ prompts:[quiz.prompt], options:quiz.options, answer:quiz.answer, explain:quiz.explain } })]); };
  const gradeRecall=(item,rating)=>{ const scheduled=scheduleRecall(item,rating); persistRecall(list=>list.map(x=>x.id===item.id?scheduled:x)); return scheduled; };
  const restoreRecall=item=>{ persistRecall(list=>list.map(x=>x.id===item.id?item:x)); };

  /* ---- movies: a plain personal watch-list, no AI. Tapping the tile watches the
     next movie (tap again to undo); the list itself is managed in the expanded view. ---- */
  const persistMovies=v=>{ setMovies(v); save("movies",v); };

  /* ---- reminders: recurring chores + one-off dated tasks ---- */
  const markRecurringDone=id=>{ persistRecurring(agendaRecurring.map(r=>{

  const removeEvent=id=>{ persistEvents(agendaEvents.filter(e=>e.id!==id)); };
  const toggleEventDone=id=>{ persistEvents(agendaEvents.map(e=>e.id===id?{...e,doneDate:e.doneDate===todayKey?null:todayKey}:e)); };

  const addPositiveEvent=(label,date,type)=>{ persistPositiveEvents([...positiveEvents,{id:uid(),label,date,type:type||"other"}]); };

  /* ---- second brain: file one learned thing, never inventing new content ---- */
  const addBankEntry=async(raw)=>{
    if(!getKey()){showLoadProblems([dailyIssueInfo("brain","personal_key")]);return false;}
    setBankBusy(true);
    try{
      const r=await genFileEntry(brainBank,raw);
      if(r && Array.isArray(r.path) && r.path.length && r.entry){
        const old=[]; Object.entries(brainBank.topics||{}).forEach(([path,list])=>(list||[]).forEach(e=>old.push({...e,_path:path.split(" › ")})));
        const placements=new Map((r.structure||[]).filter(x=>x&&x.id&&Array.isArray(x.path)&&x.path.length).map(x=>[x.id,x.path.slice(0,4)]));
        const topics={}; old.forEach(e=>{ const path=placements.get(e.id)||e._path, key=path.join(" › "); const clean={...e}; delete clean._path; topics[key]=[...(topics[key]||[]),clean]; });
        const topic=r.path.slice(0,4).join(" › "); const bankEntry={id:uid(),text:r.entry,date:todayKey}; topics[topic]=[...(topics[topic]||[]),bankEntry];
        persistBank({topics});
        learnBank(topic,r.quiz);setBankBusy(false);return true;
      }else throw Object.assign(new Error("Incomplete filing response"),{dailyState:"invalid_content"});
    }catch(e){const failure=dailyRequestFailure(e);showLoadProblems([dailyIssueInfo("brain",failure.state,failure.message,true)]);}

            </div>; })}
            {[{id:"gmat",label:"GMAT",emoji:"🎓",color:COL.gmat.v},{id:"breathing",label:"Breathing",emoji:"🌬️",color:COL.breathing.v}].map(r=>{ const st=streakOf(ritualLog,r.id), history=Array.from({length:28},(_,i)=>addDays(todayKey,i-27)); return <div key={r.id} className="habitHistoryCard" style={{"--habit-color":r.color}}>
              <div className="habitHistoryHead"><span className="habitHistoryName" title={r.label}>{r.emoji} {r.label}</span><span className="habitHistoryStreak">{st} day{st===1?"":"s"}</span></div>

            </div>; })}

    birthdays: T("birthdays","Birthdays",false,null,
      <BirthdaysCard birthdays={birthdays} today={todayBdays}

    health: T("health","Health",false,null,

    shopping: T("shopping","Shopping",shoppingLit,null,

      <RetryNote tileKey="philo"/></>),
    people: T("people","People",people.some(p=>p.date===todayKey),null,
      <PeopleMetCard people={people} onAdd={p=>persistPeople([...people,{id:uid(),date:todayKey,...p}])} onRemove={id=>persistPeople(people.filter(p=>p.id!==id))} />),
  };

  const settingsDirty=(nameField.trim()||"Fefe")!==profileName||usernameField.trim()!==load("profileUsername","")||keyField.trim()!==getKey()||garminKeyField.trim()!==load("garminKey","")||backgroundTheme!==load("backgroundTheme","weave")||JSON.stringify(locationProfile)!==JSON.stringify(getLocationProfile());
  const libraryIds=order.filter(id=>widgets[id]&&matchesLibraryWidget(id,widgets[id].props.label,libraryQuery,libraryCategory));
  const libraryResting=libraryIds.filter(id=>!activeNow.has(id));
  const libraryActive=libraryIds.filter(id=>activeNow.has(id));
  const libraryFiltered=libraryQuery.trim()!==""||libraryCategory!=="all";
  const resetLibraryFilters=()=>{setLibraryQuery("");setLibraryCategory("all");librarySearchRef.current?.focus();};

  return (
    <div className="wrap">
      <a className="skipLink" href="#main-content" onClick={e=>{e.preventDefault();document.getElementById("main-content")?.focus();}}>Skip to content</a>
      {!accountSignedIn&&<DashboardModal key={authMode} label={authMode==="forgot"?"Recover password":authMode==="login"?"Sign in":"Create account"} onClose={()=>{}} overlayClassName="authGate" className="authCard" as="form" onSubmit={event=>{event.preventDefault();authMode==="forgot"?requestPasswordRecovery():submitAccount();}}>
        <h2>{authMode==="forgot"?(authRecoveryRequested?"Recovery requested":"Forgot your password?"):authMode==="login"?"Welcome back":"Create your account"}</h2>
        <p className="hint">{authMode==="forgot"?"Enter the email you use for your dashboard.":authMode==="login"?"Sign in to your dashboard.":"Keep your dashboard with you across devices."}</p>
        <label className="authLabel" htmlFor="auth-email">Email</label><input id="auth-email" className="sinput" type="email" autoComplete="email" required disabled={authBusy} value={authEmailField} onChange={event=>{setAuthEmailField(event.target.value);setAuthRecoveryRequested("");}}/>
        {authMode!=="forgot"&&<>
          <label className="authLabel" htmlFor="auth-password">Password</label><input id="auth-password" className="sinput" type="password" required disabled={authBusy} minLength={authMode==="signup"?8:undefined} autoComplete={authMode==="login"?"current-password":"new-password"} aria-describedby={authMode==="signup"?"auth-password-help":undefined} value={authPassword} onChange={event=>setAuthPassword(event.target.value)}/>
          {authMode==="signup"&&<p id="auth-password-help" className="hint">At least 8 characters.</p>}
        </>}
        {authMode==="forgot"&&authRecoveryRequested&&<div className="authStatus" role="status"><p>If an account uses <strong>{authRecoveryRequested}</strong>, look for a password reset link in that inbox.</p><p>Check spam too. Links expire; use the most recent email.</p>{authRecoveryOwnerOnly&&<p>Email delivery currently supports the app owner’s Resend address only. Other addresses need a verified sender domain.</p>}</div>}
        {authError&&<p className="authError" role="alert">{authError}</p>}
        <button type="submit" className="savebtn" disabled={authBusy||(authMode==="forgot"&&authRecoveryCooldown>0)}>{authBusy?(authMode==="forgot"?"Requesting email…":authMode==="login"?"Signing in…":"Creating account…"):authMode==="forgot"?(authRecoveryCooldown>0?"Request again in "+authRecoveryCooldown+"s":authRecoveryRequested?"Request another link":"Send reset link"):authMode==="login"?"Sign in":"Create account"}</button>
        {authMode==="login"&&<button type="button" className="link" disabled={authBusy} onClick={()=>changeAuthMode("forgot")}>Forgot password?</button>}
        <button type="button" className="link" disabled={authBusy} onClick={()=>changeAuthMode(authMode==="login"?"signup":"login")}>{authMode==="forgot"?"Back to sign in":authMode==="login"?"Create an account":"Already have an account? Sign in"}</button>
      </DashboardModal>}
      <nav className="topbar" aria-label="Primary navigation">
        <div className="topnav">
          <button className={"navbtn"+(page==="dashboard"?" active":"")} aria-current={page==="dashboard"?"page":undefined} onClick={()=>openPage("dashboard")}>Today</button>
          <button className={"navbtn"+(page==="library"?" active":"")} aria-current={page==="library"?"page":undefined} onClick={()=>openPage("library")}>Library</button>
          <button className={"navbtn"+(page==="settings"?" active":"")} aria-current={page==="settings"?"page":undefined} onClick={()=>openPage("settings")}>Settings</button>
        </div>

          {page!=="settings"&&<button className="actionBtn primary" aria-label={refreshPlan.label} title={refreshPlan.detail} onClick={generateToday} disabled={genBusy||expectedGenKeys.length===0}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3a7 7 0 0 0 11.6-1"/></svg><span>{refreshPlan.label}</span></button>}
          {page==="dashboard"&&<button className={"actionBtn"+(edit?" active":"")} title={edit?"Finish arranging":"Arrange dashboard"} aria-label={edit?"Finish arranging":"Arrange dashboard"} aria-pressed={edit} onClick={()=>setEdit(a=>!a)}><AppIcon name={edit?"check":"layout"}/><span>{edit?"Done":"Arrange"}</span></button>}
        </div>
      </nav>

          {page==="dashboard"&&<div className="heroEyebrow">{displayDateLabel}</div>}

          <div className="metric"><span className="metricValue">{page==="library"?activeTiles.length:page==="settings"?birthdays.length:appDaysStreak}</span><span className="metricLabel">{page==="library"?"Active tiles":page==="settings"?"Birthdays":"Day streak"}</span></div>
          <div className="metric"><span className="metricValue">{page==="library"?ALL.length-activeTiles.length:page==="settings"?locationProfile.name:ice.perfect}</span><span className="metricLabel">{page==="library"?"Resting":page==="settings"?"Location":"Perfect days"}</span></div>
          <div className="metric"><span className="heroClock">{displayClock}</span><span className="metricLabel">{locationProfile.name}</span></div>
        </div>
      </header>
      {page==="dashboard"&&<div className="dailySafety"><span className="dailySafetyIcon" aria-hidden="true">✓</span><div><strong>{expectedGenKeys.length?readyGenCount+" of "+expectedGenKeys.length+" daily tiles saved":"Your day is saved as you go"}</strong><span>Saved tiles, answers and streaks stay put. The button only loads gaps or explains the setup needed. New content arrives after 1am.</span></div></div>}

      {page==="settings"&&(
        <div className="settings">
          <div className="settingsGrid">
            <section className="settingsCard">
              <h2>Profile</h2>
              <div className="accountFields">
                <div className="accountField"><label htmlFor="profile-name">Display name</label><input id="profile-name" className="sinput" autoComplete="name" value={nameField} onChange={e=>setNameField(e.target.value)}/></div>

                <label className="lab" htmlFor="account-new-password">New password</label>

            <section className="settingsCard">

              <p style={{marginTop:10}}>Preview a background here, then save your choice.</p>
            </section>
            <section className="settingsCard" id="daily-content" tabIndex="-1">

              <div className="genTileList">{SHARED_AI_TILES.map(([id,label])=><label key={id} className={"genTileRow"+(genEnabled(id)?" on":"")}><input id={"daily-enabled-"+id} type="checkbox" checked={genEnabled(id)} onChange={()=>toggleGenTile(id)}/><span>{label}</span></label>)}</div>
              <div className="settingsActions"><button type="button" className="ghostbtn" onClick={applyGenNow} disabled={genCfgBusy}>{genCfgBusy?"Applying…":"Apply preferences"}</button><button type="button" className="linklike" onClick={verifyGenConfig}>Check connection</button></div>
              <p role="status" aria-live="polite" style={{marginTop:10}}>{genCfgStatus||"These preferences save separately from your profile."}</p>
              <details className="settingsHelp" open={showServiceSetup} onToggle={event=>setShowServiceSetup(event.currentTarget.open)}><summary>Service connection setup</summary><p>Shared daily tiles need the service’s Claude key and its daily-save coordinator. A personal key powers Study, Memory filing and Philosophy replies.</p><p>The app owner can <a href="https://github.com/ferreolv/the_dashboard/blob/main/worker/README-deploy.md" target="_blank" rel="noreferrer">follow the worker deployment guide</a> to connect the coordinator and service key. Today’s saved tiles are kept.</p></details>
            </section>
            <section className="settingsCard">
              <h2>API keys</h2>
              <p>Your Claude key is needed for Study, Memory filing and Philosophy replies. Shared daily tiles use the service key; Weather needs no key.</p>
              <label className="lab" htmlFor="claude-key">Claude API key</label><input id="claude-key" className="sinput" type="password" autoComplete="off" spellCheck="false" placeholder="Paste your API key" value={keyField} onChange={e=>setKeyField(e.target.value)}/>
              <label className="lab" htmlFor="garmin-key">Garmin Connect key</label><input id="garmin-key" className="sinput" type="password" autoComplete="off" spellCheck="false" placeholder="Optional" value={garminKeyField} onChange={e=>setGarminKeyField(e.target.value)}/>
            </section>
            <section className="settingsCard">

              <form onSubmit={e=>{e.preventDefault();findLocations();}}><label className="lab" htmlFor="location-search">Find a city</label><div className="srow"><input id="location-search" className="sinput" placeholder="City name" aria-describedby="location-feedback" value={locationQuery} onChange={e=>setLocationQuery(e.target.value)}/><button type="submit" className="ghostbtn" disabled={locationBusy}>{locationBusy?"Searching…":"Search"}</button></div></form>
              <p id="location-feedback" role="status" aria-live="polite" style={{marginTop:8}}>{locationFeedback}</p>
              {!!locationMatches.length&&<div className="placeResults">{locationMatches.map((place,i)=><button key={`${place.name}-${i}`} className="placeOption" onClick={()=>pickLocation(place)}><b>{place.name}{place.region?`, ${place.region}`:""}</b><span>{place.country} · {place.timezone}</span></button>)}</div>}
            </section>
            <section className="settingsCard">
              <h2>Health</h2>
              <p>Connect Garmin to bring in your daily health summary.</p>
              {healthToken?<><label className="lab" htmlFor="health-token">Connected token</label><input id="health-token" className="sinput" type="password" autoComplete="off" readOnly value={healthToken} onFocus={e=>e.target.select()}/><div className="settingsActions"><button className="ghostbtn" onClick={syncHealthNow} disabled={healthBusy}>{healthBusy?"Syncing…":"Sync now"}</button><button className="linklike" onClick={disableHealthToken}>Disconnect</button></div></>:<><label className="lab" htmlFor="health-token">Garmin sync token</label><input id="health-token" className="sinput" type="password" autoComplete="off" placeholder="Token from your Garmin setup" value={healthTokenField} onChange={e=>setHealthTokenField(e.target.value)}/><div className="settingsActions"><button className="ghostbtn" onClick={connectHealthToken} disabled={healthBusy}>{healthBusy?"Connecting…":"Connect Garmin"}</button></div></>}
              <div className="settingsActions"><button className="ghostbtn" onClick={importHealthJson}>Import Health JSON</button></div>
              <button className="linklike" style={{marginTop:14}} aria-expanded={showHealthHelp} aria-controls="health-setup-help" onClick={()=>setShowHealthHelp(v=>!v)}>{showHealthHelp?"Hide setup guide":"Show setup guide"}</button>
              {showHealthHelp&&<div className="settingsHelp" id="health-setup-help"><ol className="settingsList"><li>Choose a token of at least 8 characters and enter it above.</li><li>Save the same token and your Garmin credentials as secrets for scripts/garmin_to_dashboard.py.</li><li>Run the included GitHub Action on a schedule. Your dashboard checks for new data when it opens.</li></ol><p>An iOS Shortcut can also export Apple Health summaries as JSON.</p></div>}
            </section>
            <section className="settingsCard">

  const [name,setName]=useState(""),[day,setDay]=useState(""),[month,setMonth]=useState("");

const recallAnswerFor=item=>{
  const q=item&&item.quiz?item.quiz:{};
  const option=Array.isArray(q.options)?q.options[Number(q.answer)||0]:"";
  const explain=q.explain||"";
  if(option&&explain) return {short:option, detail:explain};
  if(option) return {short:option, detail:""};
  if(explain) return {short:"Answer", detail:explain};
  return {short:item.term||item.title||"Answer", detail:item.meta||""};
};
const RECALL_TYPE_TAG={word:"Word",lesson:"Lesson",spanish:"Español",german:"Deutsch",academic:"Study","brain-bank":"Memory"};
/* One real flashcard at a time: the front shows only the prompt (never the title or
   meta, which can give the answer away), tapping flips it, an emoji grade slides the
   next card in. The tile's own expand opens the same session big, with the grade
   intervals spelled out — the deck keeps its state because the content is reparented. */
function RecallCard({due,onGrade,onRestore,onComplete,onIncomplete}){
  const {expanded}=useTilePresentation();
  const [snap]=useState(()=>due);
  const [log,setLog]=useState([]);
  const [flipped,setFlipped]=useState(false);
  useEffect(()=>{ if(snap.length===0) onComplete(); /* eslint-disable-next-line */ },[]);
  const total=snap.length, done=log.length, finished=total>0&&done>=total;
  const current=finished?null:snap[done];
  const rate=rating=>{
    if(!current) return;
    const scheduled=onGrade(current,rating);
    setLog(l=>[...l,{item:current,scheduled,rating}]);
    setFlipped(false);
    if(done+1>=total) onComplete();
  };
  const back=()=>{
    if(!log.length){ setFlipped(false); return; }
    const last=log[log.length-1];
    onRestore(last.item); onIncomplete();
    setLog(l=>l.slice(0,-1)); setFlipped(true);
  };
  if(total===0) return <div className="recallDone"><span className="recallDoneGlyph" aria-hidden="true">✦</span><span className="recallDoneText">Nothing due</span></div>;
  if(finished) return (
    <div className="recallDone">
      <span className="recallDoneGlyph" aria-hidden="true">✦</span>
      <span className="recallDoneText">{total} reviewed</span>
      <button type="button" className="recallBack" onClick={back} aria-label="Undo last review" title="Undo">↶</button>
    </div>
  );
  const answer=recallAnswerFor(current);
  const prompts=(current.quiz&&current.quiz.prompts&&current.quiz.prompts.length)?current.quiz.prompts:[(current.quiz&&current.quiz.prompt)||current.title||"What do you remember?"];
  const prompt=prompts[(current.seen||1)%prompts.length]||prompts[0];
  const tag=RECALL_TYPE_TAG[current.type]||"Recall";
  return (
    <div className={"recallDeck"+(expanded?" big":"")}>
      <button type="button" className={"recallCard3d"+(flipped?" flipped":"")} onClick={()=>setFlipped(f=>!f)} aria-label={flipped?"Hide answer":"Reveal answer"}>
        <span className="recallFace recallFront">
          <span className="recallTag">{tag}</span>
          <span className="recallPrompt">{prompt}</span>
        </span>
        <span className="recallFace recallBackface">
          <span className="recallTag">{tag}</span>
          <span className="recallAnswerBig">{answer.short}</span>
          {answer.detail?<span className="recallDetail">{answer.detail}</span>:null}
        </span>
      </button>
      {flipped ? (
        <div className="recallRatings" role="group" aria-label="Rate this memory">
          {FSRS_RATINGS.map(c=>{ const preview=scheduleRecall(current,c.value); return (
            <button type="button" key={c.value} className="recallRating" title={`${c.name} · ${humanInterval(preview.fsrs.scheduledDays)}`} aria-label={`${c.name}, next review ${humanInterval(preview.fsrs.scheduledDays)}`} onClick={()=>rate(c.value)}>
              <span className="face" aria-hidden="true">{c.face}</span>
              {expanded&&<span className="recallWhen">{humanInterval(preview.fsrs.scheduledDays)}</span>}
            </button>); })}
        </div>
      ) : (
        <div className="recallMetaRow">
          {log.length>0 ? <button type="button" className="recallBack" onClick={back} aria-label="Undo last review" title="Undo">↶</button> : <span className="recallBackSpacer" aria-hidden="true"/>}
          <span className="recallCount">{done+1} / {total}</span>
          <span className="recallBackSpacer" aria-hidden="true"/>
        </div>
      )}
      {expanded&&flipped&&(current.title||current.meta)&&<p className="recallSource">{current.title}{current.meta?` · ${current.meta}`:""}</p>}
      <div className="recallSegs" aria-hidden="true">{snap.map((it,i)=><span key={it.id} className={"recallSeg"+(i<done?" on":i===done?" cur":"")} />)}</div>
    </div>
  );
}
function PushBars({values}){
  const n=values.length, max=Math.max(...values,1), last=n-1;
  // map each day to a point: x across the width, y as a % height off the floor
  const xOf=i=>n<=1?50:(i/(last))*100;
  const yOf=v=>7+(v/max)*76; // 7%..83% — leaves headroom for the value label
  const pts=values.map((v,i)=>`${xOf(i).toFixed(2)},${(100-yOf(v)).toFixed(2)}`).join(" ");
  return (
    <div className="pushLine">
      <svg className="pushLineSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <polyline className="pushLinePath" points={pts}/>
      </svg>
      {values.map((v,i)=>(
        <span key={i}
          className={"pushDot"+(i===last?" today":"")+(v>0?"":" zero")}
          style={{left:`${xOf(i)}%`,bottom:`${yOf(v)}%`}}
          title={`${v} push-ups`}>
          {(i===last||v===max)&&v>0&&<b className="pushDotVal">{v}</b>}
        </span>
      ))}
    </div>
  );
}
function birthdayDaysUntil(b,baseDate=new Date()){
  const base=new Date(baseDate.getFullYear(),baseDate.getMonth(),baseDate.getDate());
  let d=new Date(base.getFullYear(),Number(b.month)-1,Number(b.day));
  if(d<base) d=new Date(base.getFullYear()+1,Number(b.month)-1,Number(b.day));
  return Math.round((d-base)/86400000);
}
function nextBirthday(list){
  if(!list.length) return null;
  let best=null,bd=99999;
  list.forEach(b=>{ const days=birthdayDaysUntil(b); if(days<bd){ bd=days; best={...b,days}; } });
  return best;
}

function BreathingCard({done,onComplete,onIncomplete}){
  const TOTAL_MS=180000, INHALE_MS=4000, HOLD_MS=1000, EXHALE_MS=4000, REST_MS=1000, CYCLE_MS=INHALE_MS+HOLD_MS+EXHALE_MS+REST_MS, SEGMENTS=6, SEG_MS=TOTAL_MS/SEGMENTS;
  const [startedAt,setStartedAt]=useState(null);
  const [clock,setClock]=useState(Date.now());
  const [finished,setFinished]=useState(done);
  const completeRef=useRef(onComplete);
  const completedRef=useRef(false);
  completeRef.current=onComplete;
  useEffect(()=>{ if(done)setFinished(true); },[done]);
  useEffect(()=>{
    if(!startedAt)return;
    const advance=()=>{
      const current=Date.now();
      if(current-startedAt>=TOTAL_MS){
        if(completedRef.current)return;
        completedRef.current=true;
        setClock(startedAt+TOTAL_MS);
        setStartedAt(null);
        setFinished(true);
        completeRef.current();
        try{ navigator.vibrate&&navigator.vibrate([55,45,55]); }catch(e){}
        return;
      }
      setClock(current);
    };
    advance();
    const timer=setInterval(advance,100);
    return ()=>clearInterval(timer);
  },[startedAt]);
  const running=startedAt!==null;
  const elapsed=running?Math.min(TOTAL_MS,Math.max(0,clock-startedAt)):0;
  const segIndex=running?Math.min(SEGMENTS-1,Math.floor(elapsed/SEG_MS)):finished?SEGMENTS:0;
  /* Four phases with a 1s hold at the top (squeeze) and a 1s release at the bottom,
     so it never snaps straight from breathing in to breathing out. */
  const withinCycle=elapsed%CYCLE_MS;
  let phaseKey="inhale", phaseElapsed=withinCycle, phaseLen=INHALE_MS, amount=0;
  if(withinCycle<INHALE_MS){ phaseKey="inhale"; phaseElapsed=withinCycle; phaseLen=INHALE_MS; amount=withinCycle/INHALE_MS; }
  else if(withinCycle<INHALE_MS+HOLD_MS){ phaseKey="hold"; phaseElapsed=withinCycle-INHALE_MS; phaseLen=HOLD_MS; amount=1; }
  else if(withinCycle<INHALE_MS+HOLD_MS+EXHALE_MS){ phaseKey="exhale"; phaseElapsed=withinCycle-INHALE_MS-HOLD_MS; phaseLen=EXHALE_MS; amount=1-(phaseElapsed/EXHALE_MS); }
  else { phaseKey="rest"; phaseElapsed=withinCycle-(INHALE_MS+HOLD_MS+EXHALE_MS); phaseLen=REST_MS; amount=0; }
  const expanded=phaseKey==="inhale"||phaseKey==="hold";
  const breathAmount=running?amount:(finished||done?1:0);
  const breathScale=running?(0.72+breathAmount*0.34):(finished||done?1.02:0.8);
  const phaseRemaining=running?Math.max(1,Math.ceil((phaseLen-phaseElapsed)/1000)):null;
  const begin=()=>{ const time=Date.now(); if(done)onIncomplete&&onIncomplete(); completedRef.current=false; setFinished(false); setClock(time); setStartedAt(time); };
  const stop=()=>{ setStartedAt(null); setClock(Date.now()); completedRef.current=false; };
  const PHASE_LABEL={inhale:"Inhale",hold:"Lift",exhale:"Exhale",rest:"Release"};
  const PHASE_CUE={inhale:"Belly rises to the ceiling",hold:"Gently lift and hold",exhale:"Breathe out — stay lifted",rest:"Drop, release, open"};
  const phase=running?PHASE_LABEL[phaseKey]:finished||done?"Complete":"Breathe";
  const cue=running?PHASE_CUE[phaseKey]:finished||done?"":"4s in · 4s out · 3 min";
  /* The circle is the control: tap it to begin, tap again to stop. No separate buttons. */
  return (
    <div className="breathCard">
      <div className="breathStage">
        <div className="breathProgress" role="progressbar" aria-label="Breathing exercise progress" aria-valuemin="0" aria-valuemax="180" aria-valuenow={Math.round(elapsed/1000)} style={{"--breath-progress":`${running?elapsed/TOTAL_MS*360:finished||done?360:0}deg`}}>
          <button type="button" className={"breathOrb "+(running?(expanded?"inhale":"exhale"):"idle")} style={{"--breath-scale":breathScale,"--breath-amount":breathAmount}} onClick={e=>{e.stopPropagation(); if(running){stop();}else{begin();}}} aria-label={running?"Stop the breathing exercise":finished||done?"Breathe again":"Start the breathing exercise"}>
            <span className="breathCount" aria-hidden="true">{running?phaseRemaining:finished||done?"✓":"3′"}</span>
          </button>
        </div>
      </div>
      <div className="breathCopy">
        <div className="breathPhase" aria-live="polite">{phase}</div>
        {cue&&<div className="breathCue">{cue}</div>}
        <div className="breathRounds" aria-label={`${running?segIndex:finished||done?SEGMENTS:0} of ${SEGMENTS} segments complete`}>
          {Array.from({length:SEGMENTS},(_,i)=><span key={i} className={"breathRound"+(i<segIndex?" done":running&&i===segIndex?" current":"")} />)}
        </div>
      </div>
    </div>
  );
}

function TimerCard({duration,end,remaining,fired,now,onSetDuration,onStart,onPause,onReset}){
  const {expanded,open}=useTilePresentation();
  const diffMs=Math.max(0,(end||0)-now.getTime());
  const running=end>now.getTime()&&!fired;
  const paused=remaining>0&&!running&&!fired;
  const shownMs=running?diffMs:paused?remaining:duration*60000;
  const totalSec=Math.ceil(shownMs/1000);
  const hh=Math.floor(totalSec/3600), mm=Math.floor((totalSec%3600)/60), ss=totalSec%60;
  const big=fired?"Done":hh>0?`${hh}:${pad(mm)}`:`${pad(mm)}:${pad(ss)}`;
  const unit=fired?"time's up":hh>0?"h · m":"m · s";
  const frac=fired?0:(running||paused)?Math.max(0,Math.min(1,shownMs/(duration*60000||1))):1;
  const C=2*Math.PI*44; // ring circumference (r=44)
  const adjust=d=>onSetDuration(Math.max(5,Math.min(24*60,duration+d)));
  return (
    <div className={"timerWrap "+(running?"isRunning":paused?"isPaused":fired?"isFired":"isIdle")}>
      <div className={"timerRow"+(fired?" timerHit":"")}>
        <div className="timerDial" role={expanded?undefined:"button"} tabIndex={expanded?undefined:0} aria-label={expanded?undefined:"Change timer duration"} onClick={expanded?undefined:open} onKeyDown={event=>{if(!expanded&&(event.key==="Enter"||event.key===" ")){event.preventDefault();open();}}}>
          <svg className="timerRingSvg" viewBox="0 0 100 100" aria-hidden="true">
            <circle className="timerRingBg" cx="50" cy="50" r="44"/>
            <circle className="timerRingFg" cx="50" cy="50" r="44"
              style={{strokeDasharray:C,strokeDashoffset:C*(1-frac)}}/>
          </svg>
          <div className="timerDialCenter">
            <span className="timerDialTime">{big}</span>
            <span className="timerSub">{running?"remaining":paused?"paused":fired?unit:unit}</span>
          </div>
        </div>
      </div>
      <div className="timerControls">
        {!running && !paused && !fired && (
          <div className="timerSteppers">
            <button className="puBtn" onClick={()=>adjust(-60)}>−1h</button>
            <button className="puBtn" onClick={()=>adjust(-15)}>−15m</button>
            <button className="puBtn" onClick={()=>adjust(15)}>+15m</button>
            <button className="puBtn" onClick={()=>adjust(60)}>+1h</button>
          </div>
        )}
        <div className="timerActions">
          <button type="button" className="widgetIconButton primary" aria-label={running?"Pause timer":paused?"Resume timer":"Start timer"} title={running?"Pause":paused?"Resume":"Start"} onClick={running?onPause:onStart}><WidgetGlyph name={running?"pause":"play"}/></button>
          {(running||paused||fired) && <button type="button" className="widgetIconButton" aria-label="Reset timer" title="Reset" onClick={onReset}><WidgetGlyph name="reset"/></button>}
        </div>
      </div>
    </div>
  );
}

function MiniAgendaCalendar({recurring,events,selectedDate,onSelectDate}){
  const [baseY,baseM]=todayKey.split("-").map(Number);
  const [viewMonth,setViewMonth]=useState(()=>new Date(baseY,baseM-1,1));
  const y=viewMonth.getFullYear(),m=viewMonth.getMonth()+1;
  const first=new Date(y,m-1,1);
  const monthLabel=new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric"}).format(first);
  const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const monthKey=`${y}-${pad(m)}`;
  const monthOf=key=>String(key||"").slice(0,7);
  const itemsByDay={};
  const addItem=(key,item)=>{ if(!key||monthOf(key)!==monthKey) return; (itemsByDay[key]=itemsByDay[key]||[]).push(item); };
  (events||[]).forEach(e=>{
    if(e.doneDate&&e.doneDate<todayKey) return;
    const d=daysBetween(todayKey,e.date);
    addItem(e.date,{label:e.label,time:e.time||"",due:d<=0&&!e.doneDate,done:e.doneDate===todayKey});
  });
  (recurring||[]).forEach(r=>{
    let due=addDays(r.lastDone,r.everyDays);
    if(due<todayKey) due=todayKey;
    const d=daysBetween(todayKey,due);
    addItem(due,{label:r.label,time:"",due:d<=0&&r.lastDone!==todayKey,done:r.lastDone===todayKey});
  });
  const days=Array.from({length:42},(_,i)=>{ const dt=new Date(start); dt.setDate(start.getDate()+i); return dateKey(dt); });
  const moveMonth=delta=>setViewMonth(current=>new Date(current.getFullYear(),current.getMonth()+delta,1));
  const returnToday=()=>setViewMonth(new Date(baseY,baseM-1,1));
  const chooseDay=key=>{
    onSelectDate(key===selectedDate?"":key);
    if(monthOf(key)!==monthKey){ const [ny,nm]=key.split("-").map(Number); setViewMonth(new Date(ny,nm-1,1)); }
  };
  return (
    <div className="miniCalendar" aria-label="Reminder calendar">
      <div className="miniCalHead">
        <div className="miniCalNavGroup">
          <button type="button" className="miniCalNav" aria-label="Previous month" title="Previous month" onClick={()=>moveMonth(-1)}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="m12 5-5 5 5 5" /></svg></button>
          <span className="miniCalTitle" aria-live="polite">{monthLabel}</span>
          <button type="button" className="miniCalNav" aria-label="Next month" title="Next month" onClick={()=>moveMonth(1)}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="m8 5 5 5-5 5" /></svg></button>
        </div>
        <button type="button" className="miniCalToday widgetIconButton" aria-label="Return to the current month" title="Current month" onClick={returnToday}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="12" rx="2.5" /><path d="M6.5 3v3M13.5 3v3M3.5 8.5h13" /><circle cx="10" cy="12.5" r="1.3" fill="currentColor" stroke="none" /></svg></button>
      </div>
      <div className="miniCalWeek">{["M","T","W","T","F","S","S"].map((d,i)=><span key={i}>{d}</span>)}</div>
      <div className="miniCalGrid">
        {days.map(key=>{ const day=Number(key.split("-")[2]), out=monthOf(key)!==monthKey, items=(itemsByDay[key]||[]).sort((a,b)=>String(a.time||"").localeCompare(String(b.time||""))); return (
          <button key={key} className={"miniCalDay"+(out?" out":"")+(key===todayKey?" today":"")+(key===selectedDate?" selected":"")} aria-label={`${formatDateKey(key)}${items.length?` · ${items.map(item=>(item.time?item.time+" ":"")+item.label).join(", ")}`:""}`} title={`${formatDateKey(key)}${items.length?` · ${items.map(item=>(item.time?item.time+" ":"")+item.label).join(", ")}`:""}`} aria-current={key===todayKey?"date":undefined} aria-pressed={key===selectedDate} onClick={()=>chooseDay(key)}>
            <div className="miniCalNum">{day}</div>
            <div className="miniCalEvents" aria-hidden="true">
              {items.slice(0,3).map((item,i)=><span key={i} className={"miniCalDot"+(item.due?" due":"")+(item.done?" done":"")} />)}
            </div>
          </button>
        ); })}
      </div>
    </div>
  );
}
function AgendaCard({recurring,events,noDueToday,emptyDone,onToggleEmpty,onMarkDone,onAddRecurring,onRemoveRecurring,onAddEvent,onRemoveEvent,onToggleEventDone}){
  const [showAdd,setShowAdd]=useState(false);
  const [selectedDate,setSelectedDate]=useState("");
  const rows=[];
  recurring.forEach(r=>{
    const done=r.lastDone===todayKey, due=addDays(r.lastDone,r.everyDays), d=daysBetween(todayKey,due);
    rows.push({ id:r.id, kind:"Recurring", label:r.label, days:d, calendarDate:done?todayKey:(due<todayKey?todayKey:due), done, sub:done?"Completed today":`Every ${r.everyDays} days`, canToggle:done||d<=0, onCheck:()=>onMarkDone(r.id), onRemove:()=>onRemoveRecurring(r.id) });
  });
  events.forEach(e=>{
    if(e.doneDate&&e.doneDate<todayKey) return;
    const d=daysBetween(todayKey,e.date), done=e.doneDate===todayKey;
    const time=String(e.time||"").trim();
    rows.push({ id:e.id, kind:"One-off", label:e.label, days:d, calendarDate:e.date, time, timeSort:time?Number(time.replace(":","")):9999, done, sub:done?"Completed today":formatDateKey(e.date)+(time?` · ${time}`:""), canToggle:d<=0||done, onCheck:()=>onToggleEventDone(e.id), onRemove:()=>onRemoveEvent(e.id) });
  });
  const rowRank=r=>r.done?1:r.days<=0?0:2;
  rows.sort((a,b)=>rowRank(a)-rowRank(b)||a.days-b.days||(a.timeSort||9999)-(b.timeSort||9999));
  const shown=rows;
  return (
    <div className="taskAgenda">
      <MiniAgendaCalendar recurring={recurring} events={events} selectedDate={selectedDate} onSelectDate={setSelectedDate} />
      <div className="agendaItems">
      {shown.length===0 && !noDueToday && <PlainEmpty>No tasks on the radar.</PlainEmpty>}
      {shown.map(r=>{ const state=r.done?" done":r.days<=0?" dueNow":" later"; return (
        <div key={r.id} className={"agRow taskRow"+state+(selectedDate&&r.calendarDate===selectedDate?" calendarSelected":"")}>
          <button className="taskMain" disabled={!r.canToggle} aria-label={(r.done?(r.canToggle?"Undo ":"Completed "):"Complete ")+r.label} aria-pressed={!!r.done} onClick={r.onCheck}>
            <span className="agName">{r.label}</span><span className="agSub">{r.sub}</span>
          </button>
          <span className="agWhen">{r.done?"done":r.days<0?`${-r.days}d late`:r.days===0?(r.time||"due today"):`in ${r.days}d`}</span>
          {r.onRemove && <button className="del" aria-label={"Delete "+r.label} onClick={r.onRemove}>×</button>}
        </div>
      );})}
      {noDueToday && shown.length===0 && <button className="agendaClearSpace" aria-label={emptyDone?"Mark Reminders incomplete":"Mark Reminders complete for today"} aria-pressed={emptyDone} onClick={onToggleEmpty} />}
      {!showAdd ? (
        <button type="button" className="widgetIconButton taskAddLink" aria-label="Add task" title="Add task" onClick={()=>setShowAdd(true)}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg></button>
      ) : (
        <AgendaAddForm onAddRecurring={onAddRecurring} onAddEvent={onAddEvent} onClose={()=>setShowAdd(false)} />
      )}
      </div>
    </div>
  );
}
function AgendaAddForm({onAddRecurring,onAddEvent,onClose}){
  const [mode,setMode]=useState("oneoff");
  const [label,setLabel]=useState(""); const [date,setDate]=useState(""); const [time,setTime]=useState(""); const [days,setDays]=useState("");
  const submit=()=>{ const t=label.trim(); if(!t) return;
    if(mode==="oneoff"){ if(!date) return; onAddEvent(t,date,time); } else { const n=Number(days); if(!n||n<1) return; onAddRecurring(t,n); }
    onClose(); };
  return (
    <div className="taskAddForm">
      <div className="tabbar">
        <button className={"tab"+(mode==="oneoff"?" on":"")} onClick={()=>setMode("oneoff")}>One-off task</button>
        <button className={"tab"+(mode==="recurring"?" on":"")} onClick={()=>setMode("recurring")}>Recurring task</button>
      </div>
      <div className="addrow"><input className="addinput" placeholder={mode==="oneoff"?"e.g. Renew passport":"e.g. Water the plants"} value={label} onChange={e=>setLabel(e.target.value)} /></div>
      <div className="addrow" style={{marginTop:7}}>
        {mode==="oneoff"
          ? <>
              <input className="addinput" type="date" min={todayKey} value={date} onChange={e=>setDate(e.target.value)} />
              <input className="addinput" type="time" value={time} onChange={e=>setTime(e.target.value)} />
            </>
          : <input className="addinput" type="number" min="1" placeholder="Every N days" value={days} onChange={e=>setDays(e.target.value)} />}
        <button className="addbtn" onClick={submit}>+</button>
      </div>
      <button className="link" style={{marginTop:7}} onClick={onClose}>Cancel</button>
    </div>
  );
