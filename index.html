<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#E4E4E9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Daily" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234F46E5'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E" />
<title>Fefe · Daily Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family:'Nunito',system-ui,sans-serif; color:#17182c;
    background:linear-gradient(145deg,#f2efff,#e8f7ff 48%,#fff1f7); min-height:100vh; -webkit-font-smoothing:antialiased; }
  body.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  .wrap { padding: 20px clamp(12px,3vw,32px) 48px; }

  .hero { display:flex; justify-content:space-between; align-items:center; gap:14px; max-width:1320px; margin:0 auto 18px; flex-wrap:wrap; }
  .heroL { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .clock { font:800 38px/1 'Nunito',sans-serif; letter-spacing:-0.02em; color:#1d2030; }
  .heroMeta { display:flex; flex-direction:column; gap:2px; }
  .greet { font-size:18px; font-weight:700; color:#1d2030; }
  .subro { font:700 9.5px/1.3 'Nunito',monospace; letter-spacing:.15em; text-transform:uppercase; color:rgba(29,32,48,0.5); }
  .heroR { display:flex; align-items:center; gap:9px; }
  .hbtn { font:700 11px/1 'Nunito',monospace; letter-spacing:.06em; text-transform:uppercase; color:#1d2030; background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:99px; padding:10px 15px; cursor:pointer; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,0.05); transition:all .15s; }
  .hbtn:hover { box-shadow:0 4px 14px rgba(0,0,0,0.1); transform:translateY(-1px); }
  .hbtn.active { background:#1d2030; color:#fff; }
  .hbtn.hbtnGen { background:#1d2030; color:#fff; border-color:#1d2030; }
  .hbtn.hbtnGen:hover { background:#33384d; }
  .hbtn.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(29,32,48,.55);} 50%{ box-shadow:0 0 0 10px rgba(29,32,48,0);} }

  .streakbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:5px; }
  .chipx { font:700 10.5px/1 'Nunito',monospace; padding:6px 9px; border-radius:99px; background:#fff; border:1px solid rgba(0,0,0,.08); color:rgba(29,32,48,.75); }

  .weatherSplit { display:grid; grid-template-columns:1.2fr 1fr; align-items:center; height:100%; gap:14px; }
  .wtomorrow { display:flex; flex-direction:column; justify-content:center; gap:3px; padding-left:14px; border-left:1px solid var(--hair); min-height:58px; }

  .wordcard { display:flex; flex-direction:column; gap:0; container-type:inline-size; }
  .wcTerm { font-size:clamp(20px, 6cqi, 30px); font-weight:800; line-height:1.05; letter-spacing:-0.01em; }
  .wcIpa { font-size:clamp(11px, 2.6cqi, 13px); }
  .wcDef { font-size:clamp(13px, 3.2cqi, 15px); line-height:1.4; margin:6px 0 0; }
  .wcFr { margin-top:9px; padding-top:9px; border-top:1px solid var(--hair); }
  .wcTermFr { font-size:clamp(14px, 3.8cqi, 17px); font-weight:700; }
  .wcDefFr { font-size:clamp(12px, 3cqi, 14px); }
  @supports not (container-type:inline-size){
    .wcTerm { font-size:22px; } .wcIpa { font-size:12px; } .wcDef { font-size:13.5px; }
    .wcTermFr { font-size:15px; } .wcDefFr { font-size:13px; }
  }

  .wrev { display:flex; flex-direction:column; gap:14px; height:100%; }
  .wrevSection { padding:11px 12px; background:var(--field); border:1px solid var(--fieldbd); border-radius:12px; }
  .wrevTitle { font:700 12px/1.2 'Nunito',sans-serif; letter-spacing:.02em; }
  .wrevMeta { font:600 12px/1.3 'Nunito',monospace; opacity:.8; margin-top:2px; }
  .wrevAxis { display:flex; justify-content:space-between; margin-top:2px; font:700 9px/1 'Nunito',monospace; opacity:.55; letter-spacing:.05em; }
  .wrevRow { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .wrevHabits { margin-top:8px; display:flex; flex-direction:column; gap:5px; }
  .wrevHrow { display:flex; align-items:center; gap:9px; font-size:13px; }
  .wrevHname { flex:1; }
  .wrevHflame { font:700 11.5px/1 'Nunito',monospace; opacity:.85; min-width:38px; text-align:right; }
  .pillBtn { font:700 10.5px/1 'Nunito',monospace; padding:6px 10px; border-radius:99px; border:1px solid var(--btnbd); background:var(--btnbg); color:var(--ink); cursor:pointer; }
  .pillBtn:hover { filter:brightness(1.1); }
  .wrevAch { display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:8px; }
  .achCard { background:var(--field); border:1px solid var(--fieldbd); border-radius:12px; padding:11px 10px; text-align:center; }
  .achCard.achGold { background:linear-gradient(135deg, #FDE68A, #F59E0B); color:#452901; border-color:#f0b13a; }
  .achN { font:800 22px/1 'Nunito',sans-serif; }
  .achL { font:700 10px/1.2 'Nunito',monospace; letter-spacing:.06em; margin-top:4px; opacity:.85; text-transform:uppercase; }

  .pill.primary { background:var(--tickfill); color:var(--tickmark); border-color:var(--tickfill); }
  .pill:disabled { opacity:.55; cursor:default; }

  .settings { max-width:1320px; margin:0 auto 16px; background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:18px; padding:16px 18px; box-shadow:0 6px 20px rgba(0,0,0,0.06); }
  .settings h3 { margin:0 0 4px; font-size:15px; }
  .settings p { margin:0 0 8px; color:rgba(29,32,48,0.6); font-size:12.5px; line-height:1.5; }
  .settings .lab { font-size:11px; font-weight:700; color:rgba(29,32,48,0.7); margin:12px 0 5px; text-transform:uppercase; letter-spacing:.05em; }
  .srow { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .sinput { flex:1; min-width:220px; background:#f3f3f6; border:1px solid rgba(0,0,0,0.1); border-radius:10px; padding:10px 12px; color:#1d2030; font-size:13.5px; outline:none; font-family:inherit; }
  .sinput:focus { border-color:#4F46E5; }
  .savebtn { background:#1d2030; color:#fff; border:none; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; font-family:inherit; }
  .savebtn:hover { background:#33384d; }
  .ghostbtn { background:#fff; color:rgba(29,32,48,0.8); border:1px solid rgba(0,0,0,0.12); border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .hint { color:rgba(29,32,48,0.5); font-size:12px; }
  .libraryIntro { max-width:1320px; margin:0 auto 14px; padding:15px 17px; border-radius:16px; background:rgba(255,255,255,.72); border:1px solid rgba(0,0,0,.07); display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .libraryIntro h2 { margin:0 0 3px; font-size:18px; }
  .libraryIntro p { margin:0; color:rgba(29,32,48,.62); font-size:12.5px; line-height:1.45; max-width:760px; }
  .tileManage { font:700 9.5px/1 'Nunito',monospace; text-transform:uppercase; letter-spacing:.05em; border:1px solid var(--btnbd); border-radius:99px; padding:7px 9px; background:var(--btnbg); color:var(--ink); cursor:pointer; }
  .tileManage.on { background:var(--tickfill); color:var(--tickmark); border-color:var(--tickfill); }

  .edithint { max-width:1320px; margin:0 auto 12px; color:rgba(29,32,48,0.6); font-size:12.5px; display:flex; align-items:center; gap:8px; }

  .grid { max-width:1320px; margin:0 auto; display:grid; gap:13px; grid-auto-rows:112px; grid-auto-flow:row dense; }
  @media (max-width:639px){ .grid{ grid-auto-rows:auto !important; } .tile{ min-height:118px; } }

  .tile { position:relative; border-radius:20px; padding:14px 15px; overflow:hidden; height:100%; display:flex; flex-direction:column;
    background:var(--bg); color:var(--ink);
    box-shadow: var(--glow), 0 4px 16px rgba(0,0,0,0.07);
    transition: background .45s ease, box-shadow .45s ease, transform .18s ease; }
  .tile:not(.editing):hover { transform:translateY(-2px); box-shadow: var(--glow), 0 10px 26px rgba(0,0,0,0.12); }
  .tile.lift { transform:scale(1.045); z-index:60; box-shadow:0 18px 44px rgba(0,0,0,0.28); opacity:0.97; pointer-events:none; }
  .tile.editing:not(.lift) { animation:jiggle .42s ease-in-out infinite; touch-action:none; }
  .tile.editing.lift { touch-action:none; }
  @keyframes jiggle { 0%,100%{transform:rotate(-0.4deg);} 50%{transform:rotate(0.4deg);} }

  .tilehead { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; flex:none; }
  .ldot { width:6px; height:6px; border-radius:99px; background:var(--lbl); }
  .lbl { font:700 10px/1.3 'Nunito',monospace; letter-spacing:.15em; text-transform:uppercase; color:var(--lbl); }
  .tbody { flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--fieldbd) transparent; }
  .tbody::-webkit-scrollbar { width:4px; }
  .tbody::-webkit-scrollbar-track { background:transparent; }
  .tbody::-webkit-scrollbar-thumb { background:var(--fieldbd); border-radius:9px; }
  .tbody::-webkit-scrollbar-thumb:hover { background:var(--tickbd); }
  .content { height:100%; }
  .content.locked { pointer-events:none; opacity:0.82; }
  .topright { position:absolute; top:11px; right:11px; z-index:4; display:flex; gap:6px; }
  .iconbtn { background:var(--btnbg); border:1px solid var(--btnbd); color:var(--ink); border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; justify-content:center; transition:all .15s; }
  .iconbtn:hover { filter:brightness(1.1); }
  .iconbtn.warn { background:#DC2626; border-color:#DC2626; color:#fff; }

  .draghandle { position:absolute; top:8px; left:8px; right:auto; z-index:5; width:36px; height:30px; border-radius:10px; cursor:grab; touch-action:none;
    background:rgba(255,255,255,.92); border:1px solid var(--line); box-shadow:0 5px 15px rgba(23,24,44,.10);
    display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(3,1fr); place-items:center; gap:3px; padding:7px 11px; }
  .draghandle:active { cursor:grabbing; }
  .draghandle .gd { width:3.5px; height:3.5px; border-radius:99px; background:#85889a; opacity:.9; }
  .resizeH { position:absolute; right:7px; bottom:7px; z-index:7; width:30px; height:30px; cursor:nwse-resize; touch-action:none;
    display:flex; align-items:flex-end; justify-content:flex-end; border-radius:10px; padding:0 6px 6px 0;
    background:rgba(255,255,255,.92); border:1px solid var(--line); box-shadow:0 5px 15px rgba(23,24,44,.10); }
  .resizeH::after { content:""; width:15px; height:15px; border-right:3px solid #85889a; border-bottom:3px solid #85889a; border-bottom-right-radius:4px; opacity:0.85; }
  .sizebadge { position:absolute; left:11px; bottom:9px; z-index:6; font:700 10px/1 'Nunito',monospace; color:var(--ink); opacity:0.55; }

  .tick { width:19px; height:19px; flex:none; border:1.6px solid var(--tickbd); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:var(--tickmark); cursor:pointer; font-weight:800; background:transparent; transition:all .18s; }
  .tick.on { background:var(--tickfill); border-color:var(--tickfill); }
  .tick.sm { width:16px; height:16px; font-size:10px; }
  .trow { display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px solid var(--hair); }
  .trow:last-child { border-bottom:none; }
  .del { background:none; border:none; color:var(--dim); font-size:17px; cursor:pointer; line-height:1; padding:0 2px; opacity:0.7; }
  .del:hover { opacity:1; }
  .muted { color:var(--dim); }
  .addrow { display:flex; gap:7px; margin-top:2px; }
  .addinput { flex:1; min-width:0; background:var(--field); border:1px solid var(--fieldbd); border-radius:9px; padding:9px 12px; color:var(--ink); font-size:14px; outline:none; font-family:inherit; }
  .addinput::placeholder { color:var(--dim); }
  .addinput[type=date],.addinput[type=time]{ }
  .addbtn { background:var(--tickfill); color:var(--tickmark); border:none; border-radius:9px; width:38px; font-size:20px; font-weight:700; cursor:pointer; flex:none; }

  .hgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:8px; container-type:inline-size; }
  .hsq { position:relative; aspect-ratio:1/1; border-radius:14px; border:1.6px solid var(--tickbd); background:var(--field);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
    font-family:inherit; color:var(--ink); padding:6px; transition:all .2s; overflow:hidden; }
  .hsq .hicon { font-size:24px; line-height:1; }
  .hsq .hname { font-weight:700; font-size:12px; line-height:1.15; text-align:center; overflow-wrap:anywhere; }
  .hsq .hstreak { font:700 10px/1 'Nunito',monospace; opacity:.75; min-height:10px; }
  .hsq.on { background:var(--tickfill); color:var(--tickmark); border-color:var(--tickfill); }
  .hsq.on::after { content:""; position:absolute; inset:10px; pointer-events:none; opacity:.9;
    background:
      linear-gradient(to top right, transparent 46.5%, currentColor 46.5%, currentColor 53.5%, transparent 53.5%),
      linear-gradient(to top left,  transparent 46.5%, currentColor 46.5%, currentColor 53.5%, transparent 53.5%); }
  .hsq .hdel { position:absolute; top:2px; right:7px; font-size:13px; opacity:.45; line-height:1; }
  .hsq .hdel:hover { opacity:1; }
  .hsq.plus { border-style:dashed; font-size:22px; color:var(--dim); background:transparent; }
  .hsq.editing2 { padding:6px; }
  .hinput { width:100%; background:transparent; border:none; outline:none; color:var(--ink); font-family:inherit; font-size:12.5px; font-weight:700; text-align:center; }
  .hinput::placeholder { color:var(--dim); }
  .pill { display:inline-flex; align-items:center; gap:6px; font:700 11.5px/1 'Nunito',monospace; color:var(--ink); background:var(--btnbg); border:1px solid var(--btnbd); border-radius:99px; padding:8px 13px; text-decoration:none; cursor:pointer; transition:filter .15s; }
  .pill:hover { filter:brightness(1.08); }
  .mark { display:inline-flex; align-items:center; gap:7px; font:700 11.5px/1 'Nunito',sans-serif; border:1px solid var(--btnbd); background:var(--btnbg); color:var(--ink); border-radius:99px; padding:7px 12px; cursor:pointer; transition:all .2s; }
  .mark.on { background:var(--tickfill); color:var(--tickmark); border-color:var(--tickfill); }

  .qprompt { font-size:13.5px; font-weight:700; margin:9px 0 7px; color:var(--ink); }
  .qopts { display:flex; flex-wrap:wrap; gap:7px; }
  .qopt { font:600 13px/1.25 'Nunito',sans-serif; color:var(--ink); background:var(--btnbg); border:1px solid var(--btnbd); border-radius:10px; padding:8px 12px; cursor:pointer; transition:all .18s; }
  .qopt:hover:not(:disabled) { filter:brightness(1.08); }
  .qopt:disabled { cursor:default; }
  .qopt.correct { background:#16a34a; color:#fff; border-color:#16a34a; }
  .qopt.wrong { background:#dc2626; color:#fff; border-color:#dc2626; text-decoration:line-through; }
  .qopt.dim { opacity:0.4; }
  .qexplain { font-size:12.5px; line-height:1.45; color:var(--dim); margin:8px 0 0; }

  .story p { font-size:13.2px; line-height:1.6; margin:0 0 8px; color:var(--ink); }
  .insight { background:var(--field); border-left:3px solid var(--lbl); border-radius:8px; padding:9px 12px; font-size:13px; line-height:1.45; margin:4px 0 10px; color:var(--ink); }

  .reviewItem { padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--hair); }
  .reviewItem:last-child { border-bottom:none; margin-bottom:0; }
  .rtitle { font-size:11px; color:var(--dim); margin:0 0 6px; font-weight:700; }

  .puBtn { background:var(--btnbg); border:1px solid var(--btnbd); color:var(--ink); border-radius:9px; padding:7px 0; flex:1; cursor:pointer; font-weight:700; font-size:13px; font-family:inherit; transition:filter .15s; }
  .puBtn:hover { filter:brightness(1.08); }

  .bars { display:flex; align-items:flex-end; gap:5px; flex:1 1 auto; min-height:38px; margin-top:6px; }
  .barcol { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; height:100%; justify-content:flex-end; }
  .barTrack { width:100%; flex:1 1 auto; display:flex; align-items:flex-end; min-height:0; }
  .bar { width:100%; border-radius:5px 5px 2px 2px; background:var(--lbl); min-height:3px; transition:height .4s ease; opacity:.85; }
  .barcol:hover .bar,.barcol.today .bar { opacity:1; }
  .barval { font:700 10px/1 'Nunito',monospace; color:var(--dim); }
  .barday { font:700 9px/1 'Nunito',monospace; color:var(--dim); }
  .statn { font-size:22px; font-weight:700; color:var(--ink); }
  .wrevSection.chartSec { flex:1 1 auto; min-height:100px; display:flex; flex-direction:column; }

  .tabbar { display:flex; gap:6px; margin-bottom:9px; flex-wrap:wrap; }
  .tab { font:700 10.5px/1 'Nunito',monospace; padding:7px 11px; border-radius:99px; border:1px solid var(--btnbd); background:var(--btnbg); color:var(--ink); cursor:pointer; transition:all .15s; }
  .tab.on { background:var(--tickfill); color:var(--tickmark); border-color:var(--tickfill); }
  .carry { font-size:11px; opacity:.65; }
  .notearea { width:100%; min-height:0; resize:none; background:var(--field); border:1px solid var(--fieldbd); border-radius:12px; padding:11px 13px; color:var(--ink); font-family:'Nunito',sans-serif; font-size:14px; line-height:1.55; outline:none; flex:1; }
  .notearea::placeholder { color:var(--dim); }
  .targets { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 9px; }
  .tgt { font:600 11.5px/1.2 'Nunito',sans-serif; background:var(--field); border:1px solid var(--fieldbd); border-radius:8px; padding:5px 8px; color:var(--ink); }
  .model { font-style:italic; background:var(--field); border-left:3px solid var(--lbl); border-radius:8px; padding:8px 11px; font-size:12.6px; line-height:1.5; margin-top:2px; color:var(--ink); }
  .ovl { position:fixed; inset:0; z-index:200; background:rgba(20,22,30,.5); backdrop-filter:blur(4px); display:flex; align-items:flex-start; justify-content:center; padding:30px 14px; overflow:auto; }
  .ovlcard { background:#fff; color:#1d2030; max-width:720px; width:100%; border-radius:20px; padding:20px 22px; box-shadow:0 30px 80px rgba(0,0,0,.35); }
  .ovlhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .jitem { padding:12px 0; border-bottom:1px solid rgba(0,0,0,.08); }
  .jitem:last-child { border-bottom:none; }
  .jdate { font:700 10px/1.3 'Nunito',monospace; letter-spacing:.12em; color:rgba(29,32,48,.5); text-transform:uppercase; }
  .jtext { font-size:14px; line-height:1.55; margin-top:4px; white-space:pre-wrap; }

  .wbig { font:800 38px/1 'Nunito',sans-serif; }
  .gbadge { font:700 8px/1 'Nunito',monospace; background:var(--btnbg); border:1px solid var(--btnbd); border-radius:5px; padding:2px 4px; color:var(--dim); }

  .foot { max-width:1320px; margin:22px auto 0; text-align:center; }
  .ro { font:700 9.5px/1.4 'Nunito',monospace; letter-spacing:.15em; text-transform:uppercase; color:var(--dim); }
  .link { color:var(--ink); background:none; border:none; cursor:pointer; text-decoration:none; padding:0; font-size:12.5px; font-weight:700; font-family:inherit; }
  .samplehint { font-size:10.5px; color:var(--dim); margin-top:8px; font-style:italic; }
  .enter { animation: rise .45s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  @keyframes spin { to { transform: rotate(360deg);} }

  /* ---- quiz retry ---- */
  .qretry { display:inline-block; background:none; border:none; color:var(--dim); font:700 10.5px/1 'Nunito',monospace; text-decoration:underline; cursor:pointer; padding:0; margin-top:9px; }
  .qretry:hover { color:var(--ink); }

  /* ---- freshly-added-today task styling ---- */
  .trow.fresh .tick { border-color:var(--tickbd); }
  .trow.fresh > span:nth-child(2) { color:var(--dim); font-weight:500; }

  /* ---- per-tile retry-failed banner ---- */
  .tileRetry { display:flex; align-items:center; gap:8px; background:var(--field); border:1px solid var(--fieldbd); border-radius:10px; padding:8px 10px; font-size:11.5px; line-height:1.4; margin-top:9px; color:var(--dim); }

  }

  .academicSetup p{max-width:44ch;margin:0;color:var(--dim);font-size:12.8px;line-height:1.5}

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useLayoutEffect } = React;

/* colour sets: p=pastel(undone), v=vivid(done), d=dark accent (labels on pastel) */
const COL = {
  goals:    {p:"#E7E8FF", v:"#5A4BEA", d:"#372BBE"},
  word:     {p:"#EDEAFF", v:"#7C4DFF", d:"#4A2CBE"},
  worth:    {p:"#DDF7F0", v:"#00C2A3", d:"#067563"},
  spanish:  {p:"#FFE4EB", v:"#FF3D77", d:"#B01E4E"},
  music:    {p:"#E2EDFF", v:"#2F7BFF", d:"#2450BE"},
  habits:   {p:"#D6F7EA", v:"#0FC087", d:"#0A7B58"},
  pushups:  {p:"#FFE2ED", v:"#FF3F79", d:"#A81C4C"},
  weather:  {p:"#DDF4FF", v:"#00B4DC", d:"#0E6E8C"},
  world:    {p:"#F0E6FF", v:"#9B4DFF", d:"#6329AE"},
  recall:   {p:"#FFE5FA", v:"#F846D0", d:"#A02391"},
  weekly:   {p:"#DCF6E5", v:"#10C46E", d:"#0C7544"},
  note:     {p:"#E8F6D8", v:"#7ED43F", d:"#4C8319"},
  birthdays:{p:"#FFE3F0", v:"#FF4FA3", d:"#AC2A6C"},
  timer:    {p:"#E3EBFF", v:"#4A6BFF", d:"#2A45BE"},
  agenda:   {p:"#FFEADD", v:"#FF6A3D", d:"#B44223"},
  events:   {p:"#EAE5FF", v:"#7357F6", d:"#4931AE"},
  brain:    {p:"#DDF7FA", v:"#00BFD4", d:"#0E7684"},
  academic: {p:"#E0F4E5", v:"#2CC05E", d:"#1C7440"},
  brainflex:{p:"#FFF0D8", v:"#FF9A2E", d:"#B0560F"},
  philo:    {p:"#EEE8FF", v:"#8A5CFF", d:"#543AAE"},
  people:   {p:"#DDF8F3", v:"#10C2A0", d:"#0C7A66"},
};
const TASK = new Set(["goals","word","worth","spanish","music","pushups","habits","world","birthdays","weather","weekly","recall","note","timer","brain","academic","brainflex","philo","people"]);
const uid=()=> (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2);

function themeVars(id, done){
  const c=COL[id]||{p:"#e6e6ea",v:"#666",d:"#444"};
  const complete=TASK.has(id)&&done;
  if(complete) return { "--bg":c.p, "--accent":c.v, "--accentDark":c.d, "--tileBg":`linear-gradient(145deg,color-mix(in srgb,${c.v} 88%,white),${c.v} 48%,${c.d})`, "--ink":"#fff", "--dim":"rgba(255,255,255,.78)", "--lbl":"rgba(255,255,255,.96)", "--hair":"rgba(255,255,255,.17)", "--field":"rgba(255,255,255,.15)", "--fieldbd":"rgba(255,255,255,.25)", "--tickbd":"rgba(255,255,255,.76)", "--tickfill":"#fff", "--tickmark":c.d, "--btnbg":"rgba(255,255,255,.16)", "--btnbd":"rgba(255,255,255,.27)", "--glow":`0 20px 45px -22px color-mix(in srgb,${c.v} 70%,transparent)`, "--candyShadow":c.v };
  return { "--bg":c.p, "--accent":c.v, "--accentDark":c.d, "--tileBg":`linear-gradient(140deg,color-mix(in srgb,${c.p} 84%,white),${c.p} 58%,color-mix(in srgb,${c.p} 88%,${c.v}))`, "--ink":c.d, "--dim":`color-mix(in srgb,${c.d} 68%,transparent)`, "--lbl":c.d, "--hair":`color-mix(in srgb,${c.v} 24%,transparent)`, "--field":"rgba(255,255,255,.52)", "--fieldbd":`color-mix(in srgb,${c.v} 26%,transparent)`, "--tickbd":c.v, "--tickfill":c.v, "--tickmark":"#fff", "--btnbg":"rgba(255,255,255,.62)", "--btnbd":"rgba(23,24,44,.10)", "--glow":`0 16px 38px -28px ${c.v}`, "--candyShadow":c.v };
}

/* localStorage */
const load=(k,fb)=>{ try{ const v=localStorage.getItem("fefe_"+k); return v==null?fb:JSON.parse(v); }catch{ return fb; } };
const save=(k,val)=>{ try{ localStorage.setItem("fefe_"+k, JSON.stringify(val)); schedulePush(); }catch(e){} };
const getKey=()=> (localStorage.getItem("fefe_apiKey")||"").trim();

/* ---- cross-device sync (JSONBlob) ----
   Whole-state snapshot under a secret blob id. The Anthropic API key is NEVER synced. */
const SYNC_URL="https://fefe-sync.fefedashboard.workers.dev";
const SYNC_EXCLUDE=new Set(["fefe_apiKey","fefe_syncId","fefe_syncStamp"]);
const getSyncId=()=> localStorage.getItem("fefe_syncId")||"";
function collectState(){ const o={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf("fefe_")===0&&!SYNC_EXCLUDE.has(k)) o[k]=localStorage.getItem(k); } return o; }
let _pushT=null;
function schedulePush(){ const id=getSyncId(); if(!id) return; clearTimeout(_pushT);
  _pushT=setTimeout(async()=>{ try{ const stamp=Date.now();
    const r=await fetch(SYNC_URL+"/data",{method:"POST",headers:{"Content-Type":"application/json","X-Sync-Code":id},body:JSON.stringify({updatedAt:stamp,data:collectState()})});
    if(r.ok) localStorage.setItem("fefe_syncStamp",String(stamp));
  }catch(e){} },3500); }
async function pullSync(){ const id=getSyncId(); if(!id) return false;
  try{ const r=await fetch(SYNC_URL+"/data",{headers:{"X-Sync-Code":id}}); if(!r.ok) return false; const doc=await r.json();
    const local=Number(localStorage.getItem("fefe_syncStamp")||0);
    if(doc&&doc.updatedAt&&doc.data&&doc.updatedAt>local){
      Object.entries(doc.data).forEach(([k,v])=>{ if(k.indexOf("fefe_")===0&&!SYNC_EXCLUDE.has(k)) localStorage.setItem(k,String(v)); });
      localStorage.setItem("fefe_syncStamp",String(doc.updatedAt)); return true; }
  }catch(e){}
  return false; }

/* dates — the "logical day" rolls over at 01:00, not midnight, so a late night
   doesn't quietly become tomorrow while you're still awake. */
const pad=n=>String(n).padStart(2,"0");
const dateKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function addDays(key,n){ const [y,m,d]=key.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dateKey(dt); }
function daysBetween(fromKey,toKey){ const [ay,am,ad]=fromKey.split("-").map(Number); const [by,bm,bd]=toKey.split("-").map(Number); return Math.round((new Date(by,bm-1,bd)-new Date(ay,am-1,ad))/86400000); }
const logicalDateKey=(d=new Date())=>{ const dt=new Date(d); if(dt.getHours()<1) dt.setDate(dt.getDate()-1); return dateKey(dt); };
const todayKey=logicalDateKey();
const isWeeHours=(d=new Date())=>d.getHours()===0;

/* Claude API (browser key) */
function extractJSON(text){ if(!text) return null; let t=text.replace(/```json|```/g,"").trim(); const s=[t.indexOf("{"),t.indexOf("[")].filter(i=>i>=0); const a=s.length?Math.min(...s):-1; const b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]")); if(a===-1||b===-1) return null; try{ return JSON.parse(t.slice(a,b+1)); }catch{ return null; } }
function clean(s){ if(s==null) return ""; return String(s)
  .replace(/【[^】]*】/g,"").replace(/\[[0-9]+\]/g,"").replace(/\((?:https?:[^)]+)\)/g,"")
  .replace(/https?:\/\/\S+/g,"").replace(/[*_`#>\\]+/g,"").replace(/\s+([.,;:!?])/g,"$1")
  .replace(/\s{2,}/g," ").trim(); }
async function callClaude(system,user,opts={}){
  const key=getKey(); if(!key) throw new Error("no-key");
  const body={ model:opts.model||"claude-haiku-4-5-20251001", max_tokens:opts.max||600, system, messages:[{role:"user",content:user}] };
  const res=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST",
    headers:{ "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true" },
    body:JSON.stringify(body) });
  if(!res.ok) throw new Error("API "+res.status);
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

  const key=getKey(); if(!key) throw new Error("no-key");
  const system=`You are a Socratic philosophical interlocutor of exceptional range — able to argue from inside almost any tradition (analytic, continental, ancient, Buddhist, pragmatist, existentialist, etc.) without personally championing one school. Your job is not to lecture or hand over a tidy theory. It is to sharpen the other person's OWN thinking: press on unexamined assumptions, raise a real objection or counterexample to what they just said, occasionally steelman a view they haven't considered, and — when it genuinely fits — name a specific real philosopher (and their actual position) who agrees or disagrees with what they've said, briefly and correctly. Never let them settle too comfortably into an answer that merely feels obvious to them; that comfort is usually an unexamined bias, and surfacing it gently is part of the point. Keep replies tight: 3-6 sentences, conversational, no bullet lists, no headers, no "in conclusion." Ask at most one sharp follow-up per reply. Today's question under discussion: "${question}"`;
  const body={ model:"claude-sonnet-4-20250514", max_tokens:420, system, messages:history.map(h=>({role:h.role,content:h.text})) };
  const res=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST",

  const data=await res.json();

}

/* Resolve a direct Apple Music track link via the free iTunes Search API (with proxy fallback).
   Tries a few query phrasings and prefers a result whose artist actually matches, since obscure
   tracks often miss on the first exact-string search. If everything misses, callers fall back
   to a plain Apple Music search link rather than a dead one. */
async function resolveMusicUrl(m){
  const clean=s=>String(s||"").replace(/["“”]/g,"").replace(/\s*[\(\[]feat\.[^)\]]*[\)\]]/gi,"").trim();
  const title=clean(m.title), artist=clean(m.artist);
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  const variants=[`${title} ${artist}`, title, `${artist} ${title.split(" ").slice(0,3).join(" ")}`].filter(Boolean);
  for(const q of variants){
    const term=encodeURIComponent(q);
    const api=`https://itunes.apple.com/search?term=${term}&entity=song&limit=5`;
    for(const u of [api, "https://api.allorigins.win/raw?url="+encodeURIComponent(api)]){
      try{
        const r=await fetch(u); if(!r.ok) continue; const d=await r.json();
        const results=d.results||[];
        const hit=results.find(t=>t.trackViewUrl && norm(t.artistName).includes(norm(artist).slice(0,6))) || results[0];
        if(hit&&hit.trackViewUrl) return hit.trackViewUrl;
      }catch(e){}
    }
  }
  return null;
}

/* World briefing — pulls real, free RSS headlines via our own Worker (same origin, no CORS),
   then Claude only summarizes/cleans that provided text (no web_search tool = far cheaper). */
const RSS_FEEDS=[
  "https://feeds.bbci.co.uk/news/world/rss.xml",
  "https://feeds.skynews.com/feeds/rss/world.xml",
  "https://www.france24.com/en/rss",
];
async function fetchRssHeadlines(){
  const results=await Promise.allSettled(RSS_FEEDS.map(async url=>{
    let r=null; const candidates=[SYNC_URL+"/rss?url="+encodeURIComponent(url),url,"https://api.allorigins.win/raw?url="+encodeURIComponent(url)];
    for(const candidate of candidates){ try{ const attempt=await fetch(candidate); if(attempt.ok){ r=attempt; break; } }catch(e){} }
    if(!r) throw new Error("bad feed");
    const text=await r.text();
    const doc=new DOMParser().parseFromString(text,"text/xml");
    return [...doc.querySelectorAll("item")].slice(0,10).map(it=>({
      title:(it.querySelector("title")?.textContent||"").trim(),
      desc:(it.querySelector("description")?.textContent||"").replace(/<[^>]+>/g," ").trim(),
    })).filter(x=>x.title);
  }));
  const all=[]; const seen=new Set();
  results.forEach(r=>{ if(r.status==="fulfilled") r.value.forEach(it=>{
    const key=it.title.toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(" ").slice(0,6).join(" ");
    if(key && !seen.has(key)){ seen.add(key); all.push(it); }
  }); });
  return all.length ? all : null;
}
async function genWorld(avoid){
  const items=await fetchRssHeadlines();
  if(!items || items.length===0) return null;
  const raw=items.slice(0,16).map((it,i)=>`${i+1}. ${it.title} — ${it.desc}`).join("\n");
  const out=await callClaude("You output ONLY a valid JSON array, no markdown.",
    `Here are today's raw news headlines from several wire services (may include near-duplicates covering the same event):\n${raw}\n\nPick the 5 most important DISTINCT stories — if two items describe the same event, count that as one. Avoid re-covering stories already picked recently: ${(avoid||[]).join(" | ")||"none"}. For each pick write a "headline" (max 9 words, your own words) and a "summary" (2-3 sentences) covering what happened AND why it matters, using only the information given above. Do not end the summary with a generic closing line that just restates the obvious (e.g. "this shows/highlights/underscores…") — add a closing thought only if it's genuinely non-obvious insight; otherwise stop after the facts. Plain prose only — NO markdown, NO citation numbers, NO URLs, NO special symbols. JSON array of {"headline":"","summary":""}.`, {max:950});
  const arr=extractJSON(out); return Array.isArray(arr)?arr:null;
}

async function fetchWeather(){
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=-33.8688&longitude=151.2093&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=2");
  const d=await r.json();
  const temp=Math.round(d.current.temperature_2m);
  const hi=Math.max(temp,Math.round(d.daily.temperature_2m_max[0]));
  const lo=Math.min(temp,Math.round(d.daily.temperature_2m_min[0]));
  const tHi=Math.round(d.daily.temperature_2m_max[1]);
  const tLo=Math.round(d.daily.temperature_2m_min[1]);
  const tCode=d.daily.weather_code[1];
  return { temp, code:d.current.weather_code, hi, lo, tomorrow:{hi:tHi, lo:tLo, code:tCode}, at:Date.now() };
}

/* iCloud / vCard (.vcf) birthday import — fully local, no network */
function parseVcf(text){
  const out=[];
  const unfold=String(text).replace(/\r\n/g,"\n").replace(/\n[ \t]/g,"");
  const blocks=unfold.split(/BEGIN:VCARD/i);
  for(const blk of blocks){
    if(!/BDAY/i.test(blk)) continue;
    let name="";
    const fn=blk.match(/(?:^|\n)FN[^:\n]*:([^\n]+)/i);
    if(fn) name=fn[1].trim();
    if(!name){ const nrow=blk.match(/(?:^|\n)N[^:\n]*:([^\n]+)/i); if(nrow){ const p=nrow[1].split(";"); name=((p[1]||"")+" "+(p[0]||"")).trim(); } }
    const bM=blk.match(/(?:^|\n)BDAY[^:\n]*:([^\n]+)/i);
    if(!name||!bM) continue;
    const val=bM[1].split("T")[0].trim();
    const noYear = /^--/.test(val) || val.slice(0,4)==="1604";
    const digits=val.replace(/[^0-9]/g,"");
    let mo,da;
    if(noYear && digits.length>=4){ mo=+digits.slice(-4,-2); da=+digits.slice(-2); }
    else if(digits.length===8){ mo=+digits.slice(4,6); da=+digits.slice(6,8); }
    else if(digits.length===6){ mo=+digits.slice(2,4); da=+digits.slice(4,6); }
    else if(digits.length===4){ mo=+digits.slice(0,2); da=+digits.slice(2,4); }
    else continue;
    if(name && mo>=1 && mo<=12 && da>=1 && da<=31) out.push({name, month:mo, day:da});
  }
  return out;
}

async function extractCourseFile(file){
  if(!file) return "";
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib) throw new Error("PDF reader unavailable. Check internet, then try again.");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const pages=[];
    for(let i=1;i<=pdf.numPages;i++){ const page=await pdf.getPage(i); const content=await page.getTextContent(); pages.push(content.items.map(x=>x.str).join(" ")); }
    return pages.join("\n\n");
  }
  if(file.type.startsWith("text/")||/\.(txt|md|csv)$/i.test(file.name)) return file.text();
  throw new Error("Use PDF, TXT, Markdown or CSV. DOCX support can be added next.");
}

  return bits.map((fact,i)=>{ const words=fact.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'-]{4,}/g)||[]; const target=words.sort((a,b)=>b.length-a.length)[0]; if(!target)return null; const prompt=fact.replace(new RegExp("\\b"+target.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i"),"____"); const pool=bits.flatMap(x=>x.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'-]{4,}/g)||[]).filter(w=>w.toLowerCase()!==target.toLowerCase()); const decoys=[...new Set(pool)].sort(()=>Math.random()-.5).slice(0,3); while(decoys.length<3)decoys.push(["context","system","principle"][decoys.length]); const choices=[target,...decoys].sort(()=>Math.random()-.5); return basicCard(concept,"Complete the idea: "+prompt,choices,choices.indexOf(target),fact); }).filter(Boolean);

const fsrsReview=(card,rating,date=todayKey)=>{ const f={difficulty:5,stability:1,reps:0,lapses:0,...(card.fsrs||{})}; const elapsed=f.lastReview?Math.max(0,daysBetween(f.lastReview,date)):0; const retrievability=Math.pow(1+elapsed/(9*Math.max(.1,f.stability)),-1); const success=rating>1; const difficulty=Math.max(1,Math.min(10,f.difficulty+(success ? .15*(3-rating) : 1.2))); let stability; if(!success)stability=Math.max(.2,f.stability*(.45+.25*retrievability)); else stability=Math.max(f.stability+.2,f.stability*(1+(11-f.difficulty)*.08*(1-retrievability)*(.85+.15*rating))); const interval=Math.max(1,Math.min(3650,Math.round(9*stability*(1/LEARN_TARGET-1)))); return {...card,fsrs:{difficulty,stability,reps:f.reps+1,lapses:f.lapses+(success?0:1),lastReview:date,due:addDays(date,interval),lastRating:rating}}; };

function buildMindTree(topics){ const root={children:{},entries:[]}; Object.entries(topics||{}).forEach(([path,list])=>{ let node=root; path.split(" › ").filter(Boolean).forEach(part=>{ node.children[part]=node.children[part]||{children:{},entries:[]}; node=node.children[part]; }); (list||[]).forEach(e=>node.entries.push({...e,_topic:path})); }); return root; }

function Quiz({prompt,options,answer,explain,onDone,onUndo}){
  const [sel,setSel]=useState(null); const done=sel!==null;
  return (
    <div>
      {prompt && <p className="qprompt">{prompt}</p>}
      <div className="qopts">
        {options.map((o,i)=>{ let cls="qopt"; if(done){ if(i===answer)cls+=" correct"; else if(i===sel)cls+=" wrong"; else cls+=" dim"; }
          return <button key={i} className={cls} onClick={()=>{ if(sel===i){ setSel(null); onUndo&&onUndo(); } else if(!done){ setSel(i); onDone&&onDone(i===answer); } }}>{o}</button>; })}
      </div>
      {done && explain && <p className="qexplain">{explain}</p>}
    </div>
  );
}

function WordCard({word,busy,onLearned}){
  if(!word) return <Note>{busy?"Fetching today's word…":"Not generated yet — tap ✦ Generate today."}</Note>;
  return (
    <div className="wordcard">
      <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
        <span className="wcTerm">{word.term_en}</span>
        {word.pos && <span className="lbl">{word.pos}</span>}
      </div>
      {word.ipa && <span className="muted wcIpa">{word.ipa}</span>}
      <p className="wcDef">{word.def_en}</p>
      <div className="wcFr">
        <span className="wcTermFr">{word.term_fr}</span>
        <span className="muted wcDefFr"> — {word.def_fr}</span>

      {word.quiz && <Quiz prompt="Quiz · closest word?" options={word.quiz.options} answer={word.quiz.answer} explain={`Closest synonym for “${word.term_en}”.`} onDone={()=>onLearned(word)} />}

function LessonCard({lesson,busy,onLearned,onUnlearned}){
  const [n,setN]=useState(0);
  useEffect(()=>{ setN(0); },[lesson && lesson.title]);
  if(!lesson) return <Note>{busy?"Writing today's lesson…":"Not generated yet — tap ✦ Generate today."}</Note>;
  const qs=lesson.quiz||[];
  const mark=()=>{ setN(v=>{ const nv=v+1; if(nv>=qs.length) onLearned(lesson); return nv; }); };
  const undo=()=>{ setN(v=>Math.max(0,v-1)); onUnlearned&&onUnlearned(lesson); };
  return (
    <div>
      <div style={{fontSize:16,fontWeight:700,lineHeight:1.2,marginBottom:2}}>{lesson.title}</div>
      {lesson.category && <span className="lbl">{lesson.category}</span>}
      <div className="story" style={{marginTop:8}}>{(lesson.story||"").split("\n\n").map((p,i)=><p key={i}>{p}</p>)}</div>
      {lesson.insight && <div className="insight">💡 {lesson.insight}</div>}
      {qs.map((q,i)=><Quiz key={i} prompt={q.prompt} options={q.options} answer={q.answer} explain={q.explain} onDone={mark} onUndo={undo} />)}
    </div>
  );
}

  useEffect(()=>{ const el=tbodyRef.current; if(!el) return; const update=()=>{ el.classList.toggle("moreBelow",el.scrollHeight-el.clientHeight-el.scrollTop>2); el.classList.toggle("moreAbove",el.scrollTop>2); }; update(); el.addEventListener("scroll",update,{passive:true}); const ro=(typeof ResizeObserver!=="undefined")?new ResizeObserver(update):null; if(ro)ro.observe(el); window.addEventListener("resize",update); return ()=>{ el.removeEventListener("scroll",update); if(ro)ro.disconnect(); window.removeEventListener("resize",update); }; });
  return (
    <section data-tileid={id} data-cols={tileCols} data-rows={size.r} className={"tile enter"+(done?" completed":"")+(edit?" editing":"")+(lifted?" lift":"")} style={{...t,...span}} onPointerDown={edit?(e)=>onMoveStart(e,id):undefined}>
      {topright && !edit && <div className="topright">{topright}</div>}
      <div className={"tbody"} ref={tbodyRef} onClick={!edit&&onTap?onTap:undefined} style={!edit&&onTap?{cursor:"pointer"}:null}><div className="tilehead"><span style={{display:"flex",alignItems:"center",gap:7}}><span className="ldot"/><span className="lbl">{label}</span></span></div><div className={"content"+(edit?" locked":"")}>{children}</div></div>
      {edit && <>
        <div className="sizebadge">{Math.min(size.c,cols)}×{size.r}</div>
        <div className="resizeH" title="Drag to resize" onPointerDown={(e)=>onResizeStart(e,id)} />
      </>}
    </section>
  );
}

  const [philoChat,setPhiloChat]=useState(()=>load("philoChat:"+todayKey,{initial:"",messages:[]}));
  const persistPhiloChat=v=>{ setPhiloChat(v); save("philoChat:"+todayKey,v); };
  const [philoBusy,setPhiloBusy]=useState(false);

  /* duration timer: default 7h30 from whenever Start is pressed */
  const [timerDuration,setTimerDuration]=useState(()=>load("timerDuration",450));

  const startTimer=()=>{ const end=Date.now()+timerDuration*60000; setTimerEnd(end); save("timerEnd",end); setTimerFired(false); };
  const resetTimer=()=>{ setTimerEnd(0); save("timerEnd",0); setTimerFired(false); };
  const [timerFired,setTimerFired]=useState(false);

  /* fire the clock-timer chime once when the target minute arrives */
  useEffect(()=>{
    if(timerEnd>0 && now.getTime()>=timerEnd && !timerFired){

      try{
        const Ctx=window.AudioContext||window.webkitAudioContext;
        const ctx=new Ctx(); const o=ctx.createOscillator(); const g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.frequency.value=880; o.type="sine";
        g.gain.setValueAtTime(0.0001,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.22,ctx.currentTime+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.7);

    if(carried.length){ const seen=new Set((gl[todayKey]||[]).map(x=>x.text)); const add=carried.filter(x=>!seen.has(x.text)); if(add.length){ gl[todayKey]=[...(gl[todayKey]||[]),...add]; changed=true; } }

  const runGen=async(keys,{silent}={})=>{

      const results=await Promise.all(keys.map(k=>(GEN_TASKS[k]?GEN_TASKS[k]():Promise.resolve(null)).catch(()=>null)));

      setDaily(next); save("daily:"+todayKey,next);
      const weatherIdx=keys.indexOf("weather");
      if(weatherIdx>-1 && results[weatherIdx]){ setWeather(results[weatherIdx]); save("weather",results[weatherIdx]); }
      keys.forEach((k,i)=>{ const v=results[i]; if(!v) return;
        if(k==="word") save("wordHistory",[...load("wordHistory",[]),v.term_en].slice(-40));

        if(k==="philo") save("philoHistory",[...load("philoHistory",[]),v.theme].slice(-30));
      });
      const applicable=keys.filter(k=>k!=="academic"||load("courses",[]).length>0);
      const failedNow=applicable.filter(k=>!results[keys.indexOf(k)]);
      const carried=load("genErrors:"+todayKey,[]).filter(k=>!keys.includes(k));
      const merged=[...new Set([...carried,...failedNow])];
      setGenErrors(merged); save("genErrors:"+todayKey,merged);
      if(!silent){
        if(applicable.length>0 && failedNow.length===applicable.length) alert("Nothing came back this time. Check your internet or API key and try again.");
        else if(failedNow.length) alert("Updated the tiles that worked. Couldn't refresh: "+failedNow.join(", ")+".\nEach affected tile now has its own retry note — no need to regenerate everything.");
      }
    }catch(e){ if(!silent) alert("Generation failed: "+e.message); }
    setGenBusy(false);
  };

  const generateToday=async()=>{
    if(!getKey()){ goSettings(); return; }
    if(genBusy) return;
    if(daily && !confirm(page==="library"?"Today's content is already generated. Regenerate every testable tile?":"Today's content is already generated. Regenerate all active dashboard tiles?")) return;
    const keys=ALL_GEN_KEYS.filter(k=>(page==="library"||activeTiles.includes(k))&&(k!=="academic"||courses.length>0));
    if(!keys.length){ alert("None of your active dashboard tiles need generated content. Open the Tile library to generate and test hidden tiles."); return; }
    await runGen(keys);

  /* Retry just one broken tile — never touches the others, never re-prompts, never advances the day. */
  const regenerateOne=async(key)=>{ if(genBusy) return; await runGen([key],{silent:true}); };
  /* expose the generate-all handler so empty-state ✦ buttons inside tiles can trigger it */
  if(typeof window!=="undefined") window.__fefeGenerate=generateToday;

  /* recall scheduling — store alt prompts so review looks different each time */
  const learnWord=w=>{ setRitual("word"); if(w&&w.quiz && !recallList.some(x=>x.type==="word"&&x.addedOn===todayKey)) persistRecall([...recallList,{ id:uid(), type:"word", addedOn:todayKey, level:0, seen:1, nextReview:addDays(todayKey,INTERVALS[0]), title:"Word · "+w.term_en, term:w.term_en, meta:`En français : ${w.term_fr}`, quiz:{ prompts:[`Closest word to “${w.term_en}”?`, ...(w.quiz.alt_prompts||[])].filter(Boolean), options:w.quiz.options, answer:w.quiz.answer, explain:`“${w.term_en}” — ${w.def_en}.` } }]); };
  const learnLesson=l=>{ setRitual("worth"); if(l&&l.quiz&&l.quiz[0] && !recallList.some(x=>x.type==="lesson"&&x.addedOn===todayKey)){ const q=l.quiz[0]; persistRecall([...recallList,{ id:uid(), type:"lesson", addedOn:todayKey, level:0, seen:1, nextReview:addDays(todayKey,INTERVALS[0]), title:l.title, quiz:{ prompts:[q.prompt, ...(q.alt_prompts||[])].filter(Boolean), options:q.options, answer:q.answer, explain:q.explain } }]); } };
  const unlearnLesson=l=>{ unsetRitual("worth"); persistRecall(recallList.filter(x=>!(x.type==="lesson"&&x.addedOn===todayKey&&x.title===(l&&l.title)))); };
  /* Spanish feeds recall harder than the others on purpose — both quiz questions AND each
     vocab word (using the day's other vocab as natural decoys) — so a day of Spanish doesn't
     just evaporate after the tile is marked done. */
  const learnSpanish=sp=>{
    setRitual("spanish");
    if(!sp || recallList.some(x=>x.type==="spanish"&&x.addedOn===todayKey)) return;
    const additions=[];
    (sp.quiz||[]).forEach(q=>{ if(!q) return; additions.push({ id:uid(), type:"spanish", addedOn:todayKey, level:0, seen:1, nextReview:addDays(todayKey,INTERVALS[0]), title:"Español · "+sp.tema, quiz:{ prompts:[q.prompt], options:q.options, answer:q.answer, explain:q.explain } }); });
    const vocab=sp.vocab||[];
    vocab.forEach((v,i)=>{
      const decoys=vocab.filter((_,j)=>j!==i).map(x=>x.en);
      const base=[v.en,...decoys].slice(0,3); while(base.length<3) base.push("—");
      const order=[0,1,2].sort(()=>Math.random()-0.5);

        rafPending.current=false;
        const el=document.elementFromPoint(cx,cy);

ck.length?"Open the treasure chest":"Next weird thing →"}</button></div></>}</article>

    <div className="learnGrid"><section className="learnPanel"><h2>🌍 Atlas territories</h2><p>{due.length?`${due.length} ideas are at the edge of forgetting.`:"Everything is watered. The next run will introduce or strengthen the next useful ideas."}</p>{roots.length>0&&<div className="knowledgeGalaxy">{roots.map(([name,count],i)=><div className="galaxyNode" key={name} style={{"--i":i}}><span>{["🔬","📜","🌦️","💸","🎨","💻","🌿"][i%7]}</span><b>{name}</b><small>{count}</small></div>)}</div>}<div className="sourceRow"><span className="sourceDot"/><div><b>Curated core atlas</b><span>{gameCards.length} source-linked foundations</span></div></div><div className="sourceRow"><span className="sourceDot" style={{background:"#ef5f9d",boxShadow:"0 0 0 5px #ffe9f2"}}/><div><b>Territories explored</b><span>{domains.length} broad domains in rotation</span></div></div></section><aside className="learnPanel"><h2>🏆 Loot shelf</h2><p>{data.profile.runs||0} runs · {data.profile.bossesBeaten||0} bosses squished · best combo {data.profile.bestCombo||0}×</p><div style={{fontSize:32,letterSpacing:5,margin:"18px 0"}}>{(data.profile.runs||0)>0?"🍬":"◻️"} {(data.profile.bossesBeaten||0)?"👑":"◻️"} {mastered>4?"💎":"◻️"}</div><button className="quietBtn" onClick={onExit}>← Sneak back to today</button></aside></div>
  </main>;
}

function RecallCard({due,onGrade,onRestore,onComplete,onIncomplete}){
  const [snap]=useState(()=>due);
  const [answered,setAnswered]=useState({});
  useEffect(()=>{ if(snap.length===0) onComplete(); /* eslint-disable-next-line */ },[]);
  const handle=(item,ok)=>{ onGrade(item,ok); setAnswered(a=>{ const n={...a,[item.id]:true}; if(Object.keys(n).length>=snap.length) onComplete(); return n; }); };
  const undo=item=>{ onRestore(item); onIncomplete(); setAnswered(a=>{ const n={...a}; delete n[item.id]; return n; }); };
  if(snap.length===0) return <Note>Nothing due. Words and lessons you finish return here as quick quizzes on a 1/3/7/16-day schedule, so they stick.</Note>;
  return <div>{snap.map(item=>{
    const prompts=(item.quiz.prompts&&item.quiz.prompts.length)?item.quiz.prompts:[item.quiz.prompt||""];
    const seen=item.seen||1;
    const prompt=prompts[(seen)%prompts.length]||prompts[0];
    return (<div key={item.id} className="reviewItem">
      <p className="rtitle">{item.title}</p>
      {item.meta && <p className="muted" style={{fontSize:11.5,margin:"-4px 0 8px"}}>{item.meta}</p>}
      <Quiz prompt={prompt} options={item.quiz.options} answer={item.quiz.answer} explain={item.quiz.explain} onDone={ok=>handle(item,ok)} onUndo={()=>undo(item)} />
    </div>);
  })}</div>;
}
function PushBars({values}){

function nextBirthday(list){
  if(!list.length) return null;
  const now=new Date(); const base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let best=null,bd=99999;
  list.forEach(b=>{ let d=new Date(now.getFullYear(),b.month-1,b.day); if(d<base) d=new Date(now.getFullYear()+1,b.month-1,b.day);
    const days=Math.round((d-base)/86400000); if(days<bd){ bd=days; best={...b,days}; } });
  return best;
}

function TimerCard({duration,end,fired,now,onSetDuration,onStart,onReset}){
  const diffMs=Math.max(0,(end||0)-now.getTime());
  const h=Math.floor(diffMs/3600000), m=Math.floor((diffMs%3600000)/60000);
  const running=end>now.getTime()&&!fired;
  const adjust=d=>onSetDuration(Math.max(5,Math.min(24*60,duration+d)));
  return (
    <div>
      <div className={"timerRow"+(fired?" timerHit":"")}>
        <span className="timerBig">{fired?"Done":running?`${h}h ${pad(m)}m`:`${Math.floor(duration/60)}h ${pad(duration%60)}m`}</span>
        <span className="muted" style={{fontSize:12}}>{running?"remaining":"duration"}</span>
      </div>
      {!running && !fired && (
        <div className="timerSteppers">
          <button className="puBtn" onClick={()=>adjust(-60)}>−1h</button>
          <button className="puBtn" onClick={()=>adjust(-15)}>−15m</button>
          <button className="puBtn" onClick={()=>adjust(15)}>+15m</button>
          <button className="puBtn" onClick={()=>adjust(60)}>+1h</button>
        </div>
      )}
      <div className="timerActions" style={{marginTop:11}}>
        <button className="pill primary" onClick={running?onReset:onStart}>{running?"Stop":"Start"}</button>
        {(running||fired) && <button className="link" onClick={onReset}>Reset</button>}
      </div>
    </div>
  );
}

function AgendaCard({recurring,events,birthdays,checks,onMarkDone,onAddRecurring,onRemoveRecurring,onAddEvent,onRemoveEvent,onToggleEventDone,onToggleCheck}){
  const [showAdd,setShowAdd]=useState(false);
  const rows=[];
  recurring.forEach(r=>{
    const due=addDays(r.lastDone,r.everyDays); const d=daysBetween(todayKey,due);
    rows.push({ id:r.id, kind:"Recurring", label:r.label, days:d, sub:d<0?`Overdue by ${-d}d`:`Every ${r.everyDays} days`, canCheck:d<=0, onCheck:()=>onMarkDone(r.id), onRemove:()=>onRemoveRecurring(r.id) });
  });
  events.forEach(e=>{
    if(e.doneDate&&e.doneDate<todayKey) return;
    const d=daysBetween(todayKey,e.date), done=e.doneDate===todayKey;
    rows.push({ id:e.id, kind:"One-off", label:e.label, days:d, done, sub:done?"Completed today":e.date, canCheck:d<=0||done, onCheck:()=>onToggleEventDone(e.id), onRemove:()=>onRemoveEvent(e.id) });
  });
  birthdays.forEach(b=>{
    const nb=nextBirthday([b]), id="gift-"+b.id;
    if(nb && nb.days<=14) rows.push({ id, kind:"One-off", label:"🎁 Gift for "+b.name, days:nb.days, done:!!checks[id], sub:checks[id]?"Completed today":nb.days===0?"Birthday today":`Birthday in ${nb.days}d`, canCheck:nb.days===0, onCheck:()=>onToggleCheck(id) });
  });
  rows.sort((a,b)=>Number(!!a.done)-Number(!!b.done)||a.days-b.days);
  const shown=rows.slice(0,7);
  return (
    <div className="taskAgenda">
      <p className="taskIntro">Recurring chores and one-off things to do.</p>
      {shown.length===0 && <Note>No tasks on the radar.</Note>}
      {shown.map(r=>(
        <div key={r.id} className={"agRow taskRow"+(r.done?" done":"")}>
          {r.canCheck
            ? <button className={"taskCheck"+(r.done?" on":"")} aria-label={(r.done?"Undo ":"Complete ")+r.label} aria-pressed={!!r.done} onClick={r.onCheck}>{r.done?"✓":""}</button>
            : <span className="agDot"/>}
          <div className="agBody"><div className="agName">{r.label}</div><div className="agSub"><span className="agKind">{r.kind}</span>{r.sub}</div></div>
          <span className={"agWhen"+(r.days<0&&!r.done?" due":"")}>{r.done?"done":r.days<0?`${-r.days}d over`:r.days===0?"today":`${r.days}d`}</span>
          {r.onRemove && <button className="del" aria-label={"Delete "+r.label} onClick={r.onRemove}>×</button>}
        </div>
      ))}
      {!showAdd ? (
        <button className="link taskAddLink" onClick={()=>setShowAdd(true)}>+ Add task →</button>
      ) : (
        <AgendaAddForm onAddRecurring={onAddRecurring} onAddEvent={onAddEvent} onClose={()=>setShowAdd(false)} />
      )}
    </div>
  );
}
function AgendaAddForm({onAddRecurring,onAddEvent,onClose}){
  const [mode,setMode]=useState("oneoff");
  const [label,setLabel]=useState(""); const [date,setDate]=useState(""); const [days,setDays]=useState("");
  const submit=()=>{ const t=label.trim(); if(!t) return;
    if(mode==="oneoff"){ if(!date) return; onAddEvent(t,date); } else { const n=Number(days); if(!n||n<1) return; onAddRecurring(t,n); }
    onClose(); };
  return (
    <div className="taskAddForm">
      <div className="tabbar">
        <button className={"tab"+(mode==="oneoff"?" on":"")} onClick={()=>setMode("oneoff")}>One-off task</button>
        <button className={"tab"+(mode==="recurring"?" on":"")} onClick={()=>setMode("recurring")}>Recurring task</button>
      </div>
      <div className="addrow"><input className="addinput" placeholder={mode==="oneoff"?"e.g. Renew passport":"e.g. Water the plants"} value={label} onChange={e=>setLabel(e.target.value)} /></div>
      <div className="addrow" style={{marginTop:7}}>
        {mode==="oneoff"
          ? <input className="addinput" type="date" min={todayKey} value={date} onChange={e=>setDate(e.target.value)} />
          : <input className="addinput" type="number" min="1" placeholder="Every N days" value={days} onChange={e=>setDays(e.target.value)} />}
        <button className="addbtn" onClick={submit}>+</button>
      </div>
      <button className="link" style={{marginTop:7}} onClick={onClose}>Cancel</button>
    </div>
  );
}

      {later.length>0 && <div className="eventList">{later.map(event=><div className="eventMini" key={event.id}>
        <span className="eventMiniIcon">{typeFor(event).icon}</span>
        <span className="eventMiniBody"><b>{event.label}</b><small>{positiveEventDate(event.date)}</small></span>
        <span className="eventMiniCount">{event.days===0?"Today":event.days+"d"}</span>
        <button className="del" aria-label={"Delete "+event.label} onClick={()=>onRemove(event.id)}>×</button>
      </div>)}</div>}
      {!showAdd
        ? <button className="eventAddToggle" onClick={()=>setShowAdd(true)}>+ Something exciting</button>
        : <PositiveEventForm onAdd={(label,date,type)=>{onAdd(label,date,type);setShowAdd(false);}} onClose={()=>setShowAdd(false)} />}
    </div>
  );
}
function PositiveEventForm({onAdd,onClose}){
  const [label,setLabel]=useState(""), [date,setDate]=useState(""), [type,setType]=useState("plan");
  const submit=()=>{ const clean=label.trim(); if(!clean||!date)return; onAdd(clean,date,type); };
  return <div className="eventAddForm">
    <input className="addinput" autoFocus placeholder="What are you looking forward to?" value={label} onChange={e=>setLabel(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} />
    <div className="eventFormRow">
      <select className="addinput eventTypeSelect" aria-label="Event type" value={type} onChange={e=>setType(e.target.value)}>
        {Object.entries(POSITIVE_EVENT_TYPES).map(([key,item])=><option key={key} value={key}>{item.icon} {item.label}</option>)}
      </select>
      <input className="addinput" type="date" min={todayKey} value={date} onChange={e=>setDate(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} />
      <button className="addbtn" aria-label="Add event" onClick={submit}>+</button>
    </div>
    <button className="link" onClick={onClose}>Cancel</button>
  </div>;
}
function CourseAddForm({onAdd}){
  const [name,setName]=useState(""); const [content,setContent]=useState("");
  const [reading,setReading]=useState(false);
  const submit=()=>{ const n=name.trim(), c=content.trim(); if(!n||!c) return; onAdd(n,c); setName(""); setContent(""); };
  return (
    <div style={{marginTop:14}}>
      <div className="lab" style={{margin:"0 0 6px"}}>Add a course</div>
      <input className="addinput" style={{marginBottom:8}} placeholder="Course name, e.g. Corporate Finance II" value={name} onChange={e=>setName(e.target.value)} />
      <label className="ghostbtn" style={{display:"inline-block",marginBottom:8,cursor:"pointer"}}>{reading?"Reading file…":"Upload PDF or notes"}<input type="file" accept=".pdf,.txt,.md,.csv,application/pdf,text/*" style={{display:"none"}} onChange={async e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; setReading(true); try{ const text=await extractCourseFile(f); setContent(c=>(c?c+"\n\n":"")+text); if(!name)setName(f.name.replace(/\.[^.]+$/,"")); }catch(err){alert(err.message);} setReading(false); e.target.value=""; }}/></label>
      <textarea className="bigtextarea" placeholder="Paste your notes, slide text, or syllabus here…" value={content} onChange={e=>setContent(e.target.value)} />
      <button className="savebtn" style={{marginTop:9}} onClick={submit}>Add course</button>
    </div>
  );
}

function PeopleMetCard({people,onAdd,onRemove}){
  const [place,setPlace]=useState(""); const [name,setName]=useState(""); const [desc,setDesc]=useState("");
  const submit=()=>{ if(!place.trim()||!name.trim())return; onAdd({place:place.trim(),name:name.trim(),desc:desc.trim()}); setName(""); setDesc(""); };
  const places=[...new Set(people.map(p=>p.place))];
  return <div><div className="addrow peopleAddRow"><input className="addinput" placeholder="Place" value={place} onChange={e=>setPlace(e.target.value)}/><input className="addinput" placeholder="Name" value={name} onChange={e=>setName(e.target.value)}/><button className="addbtn" onClick={submit}>+</button></div><input className="addinput" style={{marginTop:7}} placeholder="Tiny note, optional" value={desc} onChange={e=>setDesc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/><div className="peopleTree" style={{marginTop:10}}>{places.map(pl=><div className="placeBranch" key={pl}><div className="mindLabel">📍 {pl}</div>{people.filter(p=>p.place===pl).map(p=><div className="bankEntry" key={p.id}><span><b>{p.name}</b>{p.desc?` · ${p.desc}`:""}</span><button className="del" onClick={()=>onRemove(p.id)}>×</button></div>)}</div>)}</div></div>;
}

function BrainBankCard({bank,busy,onAdd,onOpenBrowser}){
  const [v,setV]=useState("");
  const topics=Object.keys(bank.topics||{});
  const total=topics.reduce((n,t)=>n+(bank.topics[t]||[]).length,0);
  const submit=()=>{ const t=v.trim(); if(!t||busy) return; onAdd(t); setV(""); };
  return (
    <div>
      <textarea className="notearea" style={{minHeight:64}} placeholder="Something you just learned…" value={v} onChange={e=>setV(e.target.value)} />
      <div style={{display:"flex",gap:8,marginTop:8,alignItems:"center"}}>
        <button className="pill primary" disabled={!v.trim()||busy} onClick={submit}>{busy?"Filing…":"Add to bank"}</button>
        <button className="link" onClick={onOpenBrowser}>Browse bank →</button>
      </div>
      <p className="muted" style={{fontSize:11.5,marginTop:9}}>{total} thing{total===1?"":"s"} filed across {topics.length} topic{topics.length===1?"":"s"} — each one comes back later in Recall too.</p>
    </div>
  );
}

function AcademicCard({academic,busy,hasCourses,onLearned,onOpenEditor}){
  const [n,setN]=useState(0);
  useEffect(()=>{ setN(0); },[academic && academic.concept]);
  if(!hasCourses) return (
    <div className="academicSetup">
      <span className="academicSetupGlyph" aria-hidden="true">📚</span>
      <p>Paste your class or course notes and this tile studies from them daily — built for broad chapter understanding, not isolated facts.</p>
      <button className="pill primary" onClick={onOpenEditor}>📄 Add study files</button>
    </div>
  );
  if(!academic) return <Note>{busy?"Preparing today's study capsule…":"Not generated yet — tap ✦ Generate today."}</Note>;
  const qs=academic.quiz||[];
  const mark=()=>{ setN(v=>{ const nv=v+1; if(nv>=qs.length) onLearned(academic); return nv; }); };
  return (
    <div>
      {academic.courseName && <span className="lbl">{academic.courseName}</span>}
      <div style={{fontSize:16,fontWeight:700,lineHeight:1.2,marginTop:4}}>{academic.concept}</div>
      <p style={{fontSize:13.2,lineHeight:1.55,margin:"8px 0 0"}}>{academic.explain}</p>
      {academic.bigPicture && <div className="examLink">🎯 {academic.bigPicture}</div>}
      {qs.map((q,i)=><Quiz key={i} prompt={q.prompt} options={q.options} answer={q.answer} explain={q.explain} onDone={mark} />)}
      <button className="pill" style={{marginTop:10}} onClick={onOpenEditor}>📄 Manage files</button>
    </div>
  );
}

function BrainFlexCard({brain,busy,revealed,onReveal}){
  if(!brain) return <Note>{busy?"Cooking up today's challenge…":"Not generated yet — tap ✦ Generate today."}</Note>;
  return (
    <div>
      <span className="brainFormat">{brain.format}</span>
      <p className="brainPrompt">{brain.prompt}</p>
      {!revealed ? <button className="pill primary" style={{marginTop:9}} onClick={onReveal}>Reveal answer</button> : (
        <div className="insight">💡 {brain.solution}</div>
      )}
    </div>
  );
}

function PhilosophyCard({philo,busy,chat,sending,onSubmitInitial,onSend}){
  const [draft,setDraft]=useState("");
  const [msg,setMsg]=useState("");
  const logRef=useRef(null);
  useEffect(()=>{ if(logRef.current) logRef.current.scrollTop=logRef.current.scrollHeight; });
  if(!philo) return <Note>{busy?"Choosing today's question…":"Not generated yet — tap ✦ Generate today."}</Note>;
  const started=!!chat.initial;
  const send=()=>{ const t=msg.trim(); if(!t||sending) return; onSend(t); setMsg(""); };
  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <p className="philoQ" style={started?{fontSize:12.5,lineHeight:1.35,marginBottom:7,opacity:.72}:null}>{philo.question}</p>
      {!started ? (<>
        <textarea className="philoThinkArea" placeholder="Think it through first — write your own take here…" value={draft} onChange={e=>setDraft(e.target.value)} />
        <button className="pill primary" style={{marginTop:9,alignSelf:"flex-start"}} disabled={!draft.trim()} onClick={()=>onSubmitInitial(draft.trim())}>I've thought about this →</button>
      </>) : (<>
        <div className="chatLog" ref={logRef} style={{flex:1,overflowY:"auto",minHeight:0}}>
          <div className="chatMsg me">{chat.initial}</div>
          {chat.messages.map((m,i)=>(<div key={i} className={"chatMsg "+(m.role==="user"?"me":"them")}>{m.text}</div>))}
          {sending && <div className="chatThinking">…thinking</div>}
        </div>
        <div className="chatInputRow">
          <input className="chatInput" placeholder="Push back, or ask why…" value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") send(); }} />
          <button className="chatSend" disabled={!msg.trim()||sending} onClick={send}>↑</button>
        </div>
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
