function BreathingCard({done,onComplete,onIncomplete}){
  const TOTAL_MS=180000, INHALE_MS=4000, HOLD_MS=1000, EXHALE_MS=4000, REST_MS=1000, CYCLE_MS=INHALE_MS+HOLD_MS+EXHALE_MS+REST_MS;
  const [startedAt,setStartedAt]=useState(null);
  const [clock,setClock]=useState(Date.now());
  const [finished,setFinished]=useState(done);
  const completeRef=useRef(onComplete);
  const completedRef=useRef(false);
  completeRef.current=onComplete;
  useEffect(()=>{ if(done)setFinished(true); },[done]);
  useEffect(()=>{
    if(!startedAt)return;
    const advance=()=>{
      const current=Date.now();
      if(current-startedAt>=TOTAL_MS){
        if(completedRef.current)return;
        completedRef.current=true;
        setClock(startedAt+TOTAL_MS);
        setStartedAt(null);
        setFinished(true);
        completeRef.current();
        try{ navigator.vibrate&&navigator.vibrate([55,45,55]); }catch(e){}
        return;
      }
      setClock(current);
    };
    advance();
    const timer=setInterval(advance,100);
    return ()=>clearInterval(timer);
  },[startedAt]);
  const running=startedAt!==null;
  const elapsed=running?Math.min(TOTAL_MS,Math.max(0,clock-startedAt)):0;
  /* Four phases with a 1s hold at the top (squeeze) and a 1s release at the bottom,
     so it never snaps straight from breathing in to breathing out. */
  const withinCycle=elapsed%CYCLE_MS;
  let phaseKey="inhale", phaseElapsed=withinCycle, phaseLen=INHALE_MS, amount=0;
  if(withinCycle<INHALE_MS){ phaseKey="inhale"; phaseElapsed=withinCycle; phaseLen=INHALE_MS; amount=withinCycle/INHALE_MS; }
  else if(withinCycle<INHALE_MS+HOLD_MS){ phaseKey="hold"; phaseElapsed=withinCycle-INHALE_MS; phaseLen=HOLD_MS; amount=1; }
  else if(withinCycle<INHALE_MS+HOLD_MS+EXHALE_MS){ phaseKey="exhale"; phaseElapsed=withinCycle-INHALE_MS-HOLD_MS; phaseLen=EXHALE_MS; amount=1-(phaseElapsed/EXHALE_MS); }
  else { phaseKey="rest"; phaseElapsed=withinCycle-(INHALE_MS+HOLD_MS+EXHALE_MS); phaseLen=REST_MS; amount=0; }
  const expanded=phaseKey==="inhale"||phaseKey==="hold";
  const breathAmount=running?amount:(finished||done?1:0);
  const breathScale=running?(0.72+breathAmount*0.34):(finished||done?1.02:0.8);
  const phaseRemaining=running?Math.max(1,Math.ceil((phaseLen-phaseElapsed)/1000)):null;
  const begin=()=>{ const time=Date.now(); if(done)onIncomplete&&onIncomplete(); completedRef.current=false; setFinished(false); setClock(time); setStartedAt(time); };
  const stop=()=>{ setStartedAt(null); setClock(Date.now()); completedRef.current=false; };
  const PHASE_LABEL={inhale:"Inhale",hold:"Lift",exhale:"Exhale",rest:"Release"};
  const phase=running?PHASE_LABEL[phaseKey]:finished||done?"Complete":"Breathe";
  /* The breathing circle IS the tile: it fills the square edge to edge, tap it to begin or
     stop. No words — the ring fills with the session and the orb swells and empties with
     each breath. The phase is still announced to screen readers. */
  return (
    <div className="breathFull">
      <div className={"breathDial"+(running?" isRunning":finished||done?" isDone":" isIdle")} role="progressbar" aria-label="Breathing exercise progress" aria-valuemin="0" aria-valuemax="180" aria-valuenow={Math.round(elapsed/1000)} style={{"--breath-progress":`${running?elapsed/TOTAL_MS*360:finished||done?360:0}deg`}}>
        {running&&phaseKey==="exhale"&&<span key={Math.floor(elapsed/CYCLE_MS)} className="breathRipples" aria-hidden="true"><i/><i/><i/></span>}
        <button type="button" className="breathCore" style={{"--breath-scale":breathScale}} onClick={e=>{e.stopPropagation(); if(running){stop();}else{begin();}}} aria-label={running?`${phase}. Tap to stop the breathing exercise`:finished||done?"Breathing done. Tap to breathe again":"Start the three-minute breathing exercise"}>
          {!running&&<svg className="breathPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 8.1v7.8c0 1.15 1.26 1.85 2.24 1.24l6.24-3.9c.92-.57.92-1.91 0-2.48l-6.24-3.9C11.06 6.25 9.8 6.95 9.8 8.1Z" fill="currentColor"/></svg>}
        </button>
      </div>
      <span className="srOnly" aria-live="polite">{running?phase:""}</span>
    </div>
  );
}

/* A small square that is the timer: tap the dial to start, pause or resume; a quiet
   −/＋ underneath while idle (steps grow with the duration); reset only once it runs. */
function TimerCard({duration,end,remaining,fired,now,onSetDuration,onStart,onPause,onReset}){
  const diffMs=Math.max(0,(end||0)-now.getTime());
  const running=end>now.getTime()&&!fired;
  const paused=remaining>0&&!running&&!fired;
  const shownMs=running?diffMs:paused?remaining:duration*60000;
  const totalSec=Math.ceil(shownMs/1000);
  const hh=Math.floor(totalSec/3600), mm=Math.floor((totalSec%3600)/60), ss=totalSec%60;
  const big=fired?"Done":hh>0?`${hh}:${pad(mm)}`:`${pad(mm)}:${pad(ss)}`;
  const frac=fired?0:(running||paused)?Math.max(0,Math.min(1,shownMs/(duration*60000||1))):1;
  const C=2*Math.PI*44; // ring circumference (r=44)
  const step=up=>{ const d=up?duration:duration-1; return d<30?5:d<120?15:60; };
  const adjust=up=>onSetDuration(Math.max(5,Math.min(24*60,duration+(up?step(true):-step(false)))));
  const idle=!running&&!paused&&!fired;
  const tap=()=>{ if(fired){ onReset(); return; } if(running) onPause(); else onStart(); };
  return (
    <div className={"timerSquare "+(running?"isRunning":paused?"isPaused":fired?"isFired":"isIdle")}>
      <button type="button" className="timerFace" onClick={e=>{e.stopPropagation();tap();}} aria-label={fired?"Time’s up. Tap to reset":running?`${big} left. Tap to pause`:paused?`Paused at ${big}. Tap to resume`:`Start a ${big} timer`}>
        <svg className="timerRingSvg" viewBox="0 0 100 100" aria-hidden="true">
          <circle className="timerRingBg" cx="50" cy="50" r="44"/>
          <circle className="timerRingFg" cx="50" cy="50" r="44" style={{strokeDasharray:C,strokeDashoffset:C*(1-frac)}}/>
        </svg>
        <span className="timerFaceTime">{big}</span>
        {paused&&<span className="timerFaceState" aria-hidden="true">❚❚</span>}
      </button>
      {idle?<div className="timerNudge">
        <button type="button" aria-label={`Shorter by ${step(false)} minutes`} onClick={e=>{e.stopPropagation();adjust(false);}}>−</button>
        <button type="button" aria-label={`Longer by ${step(true)} minutes`} onClick={e=>{e.stopPropagation();adjust(true);}}>＋</button>
      </div>:<button type="button" className="timerResetGlyph" aria-label="Reset timer" title="Reset" onClick={e=>{e.stopPropagation();onReset();}}>↺</button>}
    </div>
  );
}

function MiniAgendaCalendar({recurring,events,selectedDate,onSelectDate,streak}){
  const [baseY,baseM]=todayKey.split("-").map(Number);
  const [viewMonth,setViewMonth]=useState(()=>new Date(baseY,baseM-1,1));
  const y=viewMonth.getFullYear(),m=viewMonth.getMonth()+1;
  const first=new Date(y,m-1,1);

  const monthName=new Intl.DateTimeFormat("en-US",{month:"long"}).format(first).toUpperCase();
  const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));

  const addItem=(key,item)=>{ if(!key||monthOf(key)!==monthKey) return; (itemsByDay[key]=itemsByDay[key]||[]).push(item); };

  });

    return ()=>{ document.removeEventListener("pointerdown",away); document.removeEventListener("keydown",esc); }; },[placing]);
  useEffect(()=>{ if(!popped) return; const t=setTimeout(()=>setPopped(""),700); return ()=>clearTimeout(t); },[popped]);
  const R=15.7, C=2*Math.PI*R;
  const chooseDay=key=>{
    if(placing){ setPlacing(false);
      if(monthOf(key)===monthKey&&(canIce(key)||iced(key))){ if(!iced(key)) setPopped(key); streak.onToggleIce(key); }
      return; }
    onSelectDate(key===selectedDate?"":key);

  };

    <div ref={calRef} className={"miniCalendar"+(placing?" placing":"")} aria-label="Reminder calendar">

          <span className="miniCalTitle" aria-live="polite" aria-label={monthLabel}><b>{monthName}</b><small>{y}</small></span>

        <button type="button" className="miniCalToday widgetIconButton" aria-label="Return to the current month" title="Current month" onClick={returnToday}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="12" rx="2.5" /><path d="M6.5 3v3M13.5 3v3M3.5 8.5h13" /><circle cx="10" cy="12.5" r="1.3" fill="currentColor" stroke="none" /></svg></button>
      </div>

          const f=!out&&lit(key), ic=!out&&iced(key), p=!out&&!f&&!ic&&tracked(key)?streak.dayCompletion(key):null;
          const target=placing&&!out&&(canIce(key)||ic), ring=!out&&!f&&!ic&&(p!=null||target);
          const state=f?"100%, a flame":ic?"kept by an ice":p!=null?Math.round(p*100)+"% done":"";
          const label=`${formatDateKey(key)}${state?" · "+state:""}${items.length?` · ${items.map(item=>(item.time?item.time+" ":"")+item.label).join(", ")}`:""}${target?(ic?" · take the ice back":" · place the ice here"):""}`;
          return (
          <button key={key} className={"miniCalDay"+(out?" out":"")+(key===todayKey?" today":"")+(key===selectedDate?" selected":"")+(items.length?" has":"")+(ring?" ringed":"")+(f?" flame":"")+(ic?" iced":"")+(target?" target":"")+(ic&&key===popped?" pop":"")} aria-label={label} title={label} aria-current={key===todayKey?"date":undefined} aria-pressed={key===selectedDate} onClick={()=>chooseDay(key)}>
            <div className="miniCalNum">{ring&&<svg className="miniCalRing" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r={R} className="miniCalTrack"/>{p>0&&<circle cx="18" cy="18" r={R} className="miniCalArc" style={{strokeDasharray:`${(C*p).toFixed(2)} ${C.toFixed(2)}`}}/>}</svg>}{f?<DayFlame/>:ic?<DayIce/>:day}</div>
            <div className="miniCalEvents" aria-hidden="true">

              {items.length>4&&<span className="miniCalMore">+</span>}
            </div>
          </button>
        ); })}
      </div>
    </div>
  );

/* ================= Insights page =================
   Records, a month of completion rings, a habit + tile history table and per-section
   streak cards. Every section keeps its tile colour. */
const INS_ICONS={
  flame:<path d="M12 2.8c3.1 3.7 5.2 6.3 5.2 9.7a5.2 5.2 0 0 1-10.4 0c0-1.8.8-3.1 1.9-4.2.2 1.4 1.2 2.1 1.2 2.1 0-2.6 1-4.8 2.1-7.6Z"/>,
  medal:<><circle cx="12" cy="14.5" r="5.5"/><path d="M8.5 9.6 6 3h4l2 4 2-4h4l-2.5 6.6"/></>,

  flag:<><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></>
};
const InsIcon=({name,color})=><svg className="insIcon" viewBox="0 0 24 24" style={{color}} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{INS_ICONS[name]}</svg>;
const WEEKDAY_LETTERS=["M","T","W","T","F","S","S"];
const weekdayIndex=key=>{ const [y,m,d]=key.split("-").map(Number); return (new Date(y,m-1,d).getDay()+6)%7; };
const mondayOf=key=>{ const [y,m,d]=key.split("-").map(Number); const dt=new Date(y,m-1,d); const off=(dt.getDay()+6)%7; return addDays(key,-off); };
const shortDate=key=>{ const [y,m,d]=key.split("-").map(Number); return new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric"}).format(new Date(y,m-1,d)); };

/* STREAK_CORE_START */
/* Ice: every 100% day earns one; covering a habit gap or placing one on a missed day
   spends it. An ice on a day that later reached 100% costs nothing (the flame wins). */
const iceUsed=(habitSpent,dayIces,isPerfect)=>(Number(habitSpent)||0)+(Array.isArray(dayIces)?dayIces:[]).filter(k=>!isPerfect(k)).length;
const canPlaceIce=(k,{today,firstDay,lit,iced})=>!lit&&!iced&&k<today&&k>=firstDay;
/* Streak links in a month grid: a linked day (flame or ice) knows whether its run goes
   on to the left/right within the same week row. */
const calendarRuns=(days,linked)=>days.map((k,i)=>{ const col=i%7, on=!!linked(k); return {on,start:on&&!(col>0&&linked(days[i-1])),end:on&&!(col<6&&linked(days[i+1]))}; });
/* strict streak: today may still be pending, but any earlier day outside the run ends it */
const streakFrom=(done,today,step)=>{ let n=0; for(let d=done(today)?0:1; d<400; d++){ if(done(step(today,-d))) n++; else break; } return n; };
/* STREAK_CORE_END */
/* Flame for a 100% day, ice for a day kept by an ice: two-tone glyphs, no emoji. */
const DayFlame=()=><svg className="insDayGlyph insDayFlame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6c3.3 3.9 5.6 6.7 5.6 10.4a5.6 5.6 0 0 1-11.2 0c0-2 .9-3.4 2-4.6.2 1.5 1.3 2.3 1.3 2.3 0-2.8 1.1-5.2 2.3-8.1Z" fill="#FF6B3D"/><path d="M12 20.4a3 3 0 0 1-3-3c0-1.5.9-2.4 1.8-3.3.2.9.8 1.5 1.4 1.7-.1-1.4.4-2.6 1.2-3.6 1 1.3 1.6 2.6 1.6 4.2a3 3 0 0 1-3 4Z" fill="#FFC44D"/></svg>;
const DayIce=()=><svg className="insDayGlyph insDayIce" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.6" y="4.6" width="14.8" height="14.8" rx="4" fill="#BFE8FF" stroke="#38BDF8" strokeWidth="1.6"/><path d="M8.2 9.6 11 7.8M8.4 13.2l5.4-3.8" stroke="#fff" strokeWidth="1.7" strokeLinecap="round"/></svg>;
/* The month as a streak calendar: each day's ring fills with its completion and a 100% day
   becomes a flame. A missed past day takes an ice from the earned pool (tap again to take
   it back); the flames and ices of a run are linked by one band and count as one streak.
   Today is a filled disk in the theme colour, never an underline. */
function CompletionCalendar({dayCompletion,firstDay,isPerfectDay,dayIces,iceAvailable,onToggleIce}){
  const [offset,setOffset]=useState(0);
  const [note,setNote]=useState("");
  const [ty,tm]=todayKey.split("-").map(Number);
  const first=new Date(ty,tm-1+offset,1);
  const monthLabel=new Intl.DateTimeFormat("en-US",{month:"long",year:"numeric"}).format(first);
  const start=mondayOf(dateKey(first));
  const days=Array.from({length:42},(_,i)=>addDays(start,i));
  const inMonth=k=>Number(k.split("-")[1])===first.getMonth()+1;
  const tracked=k=>k>=firstDay&&k<=todayKey;
  const lit=k=>tracked(k)&&isPerfectDay(k);
  const iced=k=>!lit(k)&&(dayIces||[]).includes(k);
  const runs=calendarRuns(days,k=>lit(k)||iced(k));
  const eligible=k=>canPlaceIce(k,{today:todayKey,firstDay,lit:lit(k),iced:iced(k)});
  const anyEligible=days.some(k=>inMonth(k)&&eligible(k));
  const tap=k=>{
    if(iced(k)){ onToggleIce(k); setNote("Ice taken back."); return; }
    if(iceAvailable<=0) return;
    onToggleIce(k); setNote("Ice placed: the streak holds through that day.");
  };
  const R=14.5, C=2*Math.PI*R;
  return <section className="insCard insCalendar" style={{"--c":"#8B5CF6"}}>
    <header className="insCardHead"><h2>{monthLabel}</h2>
      <div className="insNav">
        <span className="insCalIceCount" title={iceAvailable+" ice to place"} aria-label={iceAvailable+" ice to place"}><DayIce/>{iceAvailable}</span>
        <button type="button" aria-label="Previous month" onClick={()=>{setOffset(o=>o-1);setNote("");}}>‹</button>
        <button type="button" aria-label="Next month" disabled={offset>=0} onClick={()=>{setOffset(o=>Math.min(0,o+1));setNote("");}}>›</button>
      </div>
    </header>
    <div className="insCalGrid">
      {WEEKDAY_LETTERS.map((d,i)=><span key={"h"+i} className="insCalWd">{d}</span>)}
      {days.map((k,i)=>{
        const p=tracked(k)?dayCompletion(k):null, f=lit(k), ic=iced(k), run=runs[i], can=eligible(k);
        const state=f?"100%, a flame":ic?"kept by an ice":p==null?"":Math.round(p*100)+"%";
        const label=shortDate(k)+(state?" · "+state:"")+(can&&iceAvailable>0?" · tap to place an ice":"")+(ic?" · tap to take the ice back":"");
        const cls="insCalDay"+(inMonth(k)?"":" out")+(k===todayKey?" today":"")+(f?" flame":"")+(ic?" iced":"")+(run.on?" link":"")+(run.start?" linkStart":"")+(run.end?" linkEnd":"")+(can&&iceAvailable>0?" canIce":"")+(p==null&&!f&&!ic?" quiet":"");
        const inner=<>
          {!f&&!ic&&p!=null&&<svg className="insCalRing" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r={R} className="insCalTrack"/>{p>0&&<circle cx="18" cy="18" r={R} className="insCalArc" style={{strokeDasharray:`${C*p} ${C}`}}/>}</svg>}
          {f?<DayFlame/>:ic?<DayIce/>:<span className="insCalNum">{Number(k.split("-")[2])}</span>}
        </>;
        return ((can&&iceAvailable>0)||ic)
          ? <button type="button" key={k} className={cls} title={label} aria-label={label} onClick={()=>tap(k)}>{inner}</button>
          : <div key={k} className={cls} title={label} role="img" aria-label={label}>{inner}</div>;
      })}
    </div>
    <p className="insCalNote" role="status">{note||(anyEligible&&iceAvailable>0?"Tap a missed day to place an ice.":"")}</p>
  </section>;
}

    const d=daysBetween(todayKey,e.date), done=e.doneDate===todayKey;
    const time=String(e.time||"").trim();
    rows.push({ id:e.id, kind:"One-off", label:e.label, days:d, calendarDate:e.date, time, timeSort:time?Number(time.replace(":","")):9999, done, sub:done?"Completed today":selectedDate?(time||"All day"):shortDate(e.date)+(time?` · ${time}`:""), canToggle:d<=0||done, onCheck:()=>onToggleEventDone(e.id), onRemove:()=>onRemoveEvent(e.id) });
  });

  rows.sort((a,b)=>rowRank(a)-rowRank(b)||a.days-b.days||(a.timeSort||9999)-(b.timeSort||9999));
  /* by default the soonest items; a tapped day shows just that day */
  const shown=selectedDate?rows.filter(r=>r.calendarDate===selectedDate):rows;

          {r.onRemove && <button className="del" aria-label={"Delete "+r.label} onClick={r.onRemove}>×</button>}
        </div>
      );})}
      {!selectedDate && noDueToday && shown.length===0 && <button className="agendaClearSpace" aria-label={emptyDone?"Mark Reminders incomplete":"Mark Reminders complete for today"} aria-pressed={emptyDone} onClick={onToggleEmpty} />}
      {/* booking happens on a chosen day: the + only appears once today or a later day is selected */}
      {selectedDate&&selectedDate>=todayKey&&(!showAdd ? (
        <button type="button" className="widgetIconButton taskAddLink" aria-label={"Add a reminder on "+positiveEventDate(selectedDate)} title="Add a reminder on this day" onClick={startAdd}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg></button>
      ) : (

      ))}
      </div>
    </div>
  );
}
/* The day is already chosen in the calendar, so the form asks only for the words, an optional
   time, and how it repeats: a row of chips, with an "every N" stepper once it repeats. A
   repeating reminder starts on the chosen day. */
const AGENDA_REPEATS=[["once","Once"],["day","Daily"],["week","Weekly"],["month","Monthly"],["year","Yearly"]];
function AgendaAddForm({date,onAddRecurring,onAddEvent,onClose}){
  const [label,setLabel]=useState(""); const [time,setTime]=useState(""); const [unit,setUnit]=useState("once"); const [n,setN]=useState(1);
  /* a form left empty goes away: a press anywhere outside it, or Escape, closes it */
  const formRef=useRef(null), emptyRef=useRef(true); emptyRef.current=!label.trim();
  useEffect(()=>{
    const away=e=>{ if(formRef.current&&!formRef.current.contains(e.target)&&emptyRef.current) onClose(); };
    const esc=e=>{ if(e.key==="Escape"&&emptyRef.current){ e.stopPropagation(); onClose(); } };
    const t=setTimeout(()=>{ document.addEventListener("pointerdown",away,true); document.addEventListener("keydown",esc,true); },0);
    return()=>{ clearTimeout(t); document.removeEventListener("pointerdown",away,true); document.removeEventListener("keydown",esc,true); };
  },[]);
  const submit=()=>{ const t=label.trim(); if(!t||!date) return;
    if(unit==="once") onAddEvent(t,date,time); else onAddRecurring(t,Math.max(1,Math.round(n)),unit,date);
    onClose(); };
  return (
    <div className="taskAddForm agendaForm" ref={formRef}>
      <div className="agendaFormRow">
        <input className="addinput agendaField" placeholder={unit==="once"?"Renew passport":"Water the plants"} value={label} onChange={e=>setLabel(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoFocus />
        {unit==="once"&&<input className="addinput agendaField agendaTime" type="time" aria-label="Time (optional)" value={time} onChange={e=>setTime(e.target.value)} />}
      </div>
      <div className="agendaRepeat" role="radiogroup" aria-label="Repeats">
        {AGENDA_REPEATS.map(([u,l])=><button type="button" key={u} role="radio" aria-checked={unit===u} className={"agendaChip"+(unit===u?" on":"")} onClick={()=>setUnit(u)}>{l}</button>)}
      </div>
      {unit!=="once"&&<div className="agendaEveryRow">
        <span className="agendaEvery">every</span>
        <button type="button" className="agendaStep" aria-label="Less often" disabled={n<=1} onClick={()=>setN(v=>Math.max(1,v-1))}>−</button>
        <b className="agendaN" aria-live="polite">{n}</b>
        <button type="button" className="agendaStep" aria-label="More often" onClick={()=>setN(v=>Math.min(99,v+1))}>+</button>
        <span className="agendaEvery">{n===1?unit:unit+"s"} · from {shortDate(date)}</span>
      </div>}
      <div className="agendaFormRow">
        <button type="button" className="agendaBtn ghost" onClick={onClose}>Cancel</button>
        <button type="button" className="agendaBtn" onClick={submit}>Add</button>
      </div>
    </div>
  );
}

  const places=[...new Set(people.map(p=>p.place))];
  /* The preview is the badge wall; adding people lives in the expanded view
     (the form only shows inline while the wall is still empty). */
  const showForm=expanded||people.length===0;
  return <div><div className="addrow peopleAddRow" hidden={!showForm}><input className="addinput" placeholder="Place" value={place} onChange={e=>setPlace(e.target.value)}/><input className="addinput" placeholder="Name" value={name} onChange={e=>setName(e.target.value)}/><button className="addbtn" onClick={submit}>+</button></div><input className="addinput" style={{marginTop:7}} hidden={!showForm} placeholder="Tiny note, optional" value={desc} onChange={e=>setDesc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/><div className="peopleTree" style={{marginTop:10}}>{places.map(pl=><div className="placeBranch" key={pl}><div className="mindLabel">📍 {pl}</div><div className="pplBadges">{people.filter(p=>p.place===pl).map((p,i)=><div className="pplBadge" key={p.id} hidden={!expanded&&i>=2}><span className="pplBadgeBand" aria-hidden="true">HELLO</span><b className="pplBadgeName">{p.name}</b>{p.desc&&<span className="pplBadgeNote">{p.desc}</span>}<button className="del pplBadgeDel" aria-label={"Remove "+p.name} onClick={()=>onRemove(p.id)}>×</button></div>)}</div></div>)}</div></div>;
}

function BrainBankCard({bank,busy,onAdd,onOpenBrowser,haveKey,onSetup}){
  const [v,setV]=useState(()=>load("brainDraft",""));
  const topics=Object.keys(bank.topics||{});
  const total=topics.reduce((n,t)=>n+(bank.topics[t]||[]).length,0);
  const submit=async()=>{const t=v.trim();if(!t||busy)return;if(await onAdd(t)){setV("");save("brainDraft","");}};
  return (
    <div>
      {!haveKey&&<p className="dailyDependency" data-fit-drop="2">Memory filing needs your Claude API key. Your draft stays here if filing fails. <button className="link" onClick={onSetup}>Add key</button></p>}
      <textarea className="notearea" style={{minHeight:48}} placeholder="Something you just learned…" value={v} onChange={e=>{setV(e.target.value);save("brainDraft",e.target.value);}} />
      <div style={{display:"flex",gap:8,marginTop:8,alignItems:"center"}}>
        <button type="button" className="widgetIconButton primary" disabled={!v.trim()||busy} aria-label={busy?"Filing memory":"Save to memory"} title={busy?"Filing…":"Save to memory"} onClick={submit}>{busy?<span className="genSpin" aria-hidden="true"/>:<WidgetGlyph name="send"/>}</button>
        <button type="button" className="widgetIconButton" aria-label="Browse saved memories" title="Browse memories" onClick={onOpenBrowser}><WidgetGlyph name="folder"/></button>
      </div>
      <p className="muted" style={{fontSize:11.5,marginTop:9}}>{total} memor{total===1?"y":"ies"} · {topics.length} topic{topics.length===1?"":"s"}</p>
    </div>
  );
}

function AcademicCard({academic,busy,hasCourses,onLearned,onUnlearned,onOpenEditor,onGenerate}){
  const {expanded}=useTilePresentation();
  if(!hasCourses&&!academic) return (
    <div className="academicSetup">
      <span className="academicSetupGlyph" aria-hidden="true">📚</span>
      <p>Add course notes for a short daily study session.</p>
      <button className="pill primary" onClick={onOpenEditor}>📄 Add study files</button>
    </div>
  );
  if(!academic) return <GenerateEmpty busy={busy} onGenerate={onGenerate} />;
  const qs=academic.quiz||[];
  const explanation=String(academic.explain||"").split(/\n\s*\n/);
  const mark=()=>{if(Object.keys(savedDailyQuizAnswers(qs)).length>=qs.length)onLearned(academic);};
  const undo=()=>onUnlearned&&onUnlearned(academic);
  return (
    <div className="academicCard readingCard">
      {academic.courseName && <span className="lbl">{academic.courseName}</span>}
      <div className="cardContentTitle" style={{fontSize:16,fontWeight:700,lineHeight:1.2,marginTop:4}}>{academic.concept}</div>
      <div className="cardReadingCopy">{explanation.map((paragraph,i)=><p key={i} hidden={!expanded&&i>0} style={{fontSize:14,lineHeight:1.55,margin:"8px 0 0"}}>{paragraph}</p>)}</div>
      {academic.bigPicture && <div className="examLink">🎯 {academic.bigPicture}</div>}
      <div hidden={!expanded} className="cardExpandedDetails">
        {qs.map((q,i)=><Quiz key={i} prompt={q.prompt} options={q.options} answer={q.answer} explain={q.explain} onDone={mark} onUndo={undo} />)}
        <button className="pill" style={{marginTop:10}} onClick={onOpenEditor}>📄 Manage files</button>
      </div>
    </div>
  );
}

/* The gear is pure decoration now: a big line-art cog half-buried in the lower corner,
   slowly turning. The day's challenge type is simply announced, never chosen. */
function BrainGearArt(){
  const teeth=Array.from({length:8},(_,i)=>i*45);
  return <svg className="brainGearArt" viewBox="0 0 100 100" aria-hidden="true">
    {teeth.map(a=><rect key={a} x="44.5" y="5" width="11" height="16" rx="3" fill="currentColor" transform={`rotate(${a} 50 50)`}/>)}
    <circle cx="50" cy="50" r="26" fill="none" stroke="currentColor" strokeWidth="15"/>
  </svg>;
}
/* The tile previews today's board; tapping it opens the pop-up where the game is played.
   Progress is saved per day and synced; finishing the game completes the tile. */
function useBrainState(name,initial){
  const storeKey="brainGame:"+todayKey+":"+name;
  const [state,setState]=useState(()=>{ const saved=load(storeKey,null); return saved&&typeof saved==="object"?saved:initial(); });
  const update=next=>setState(previous=>{ const value=typeof next==="function"?next(previous):next; save(storeKey,value); return value; });
  return [state,update];
}
function DigitsGame({onFinish,expanded,open}){
  const puzzle=React.useMemo(()=>makeDigits(todayKey),[]);
  const [state,setState]=useBrainState("digits",()=>({pool:puzzle.nums.map((v,i)=>({id:"n"+i,v})),history:[],finished:false,revealed:false}));
  const [pick,setPick]=useState({a:null,op:null}),[shake,setShake]=useState(null);
  const solved=state.pool.some(n=>n.v===puzzle.target);
  const tapNumber=id=>{
    if(state.finished)return;
    if(!pick.a||!pick.op||pick.a===id){ setPick({a:pick.a===id?null:id,op:null}); return; }
    const a=state.pool.find(n=>n.id===pick.a), b=state.pool.find(n=>n.id===id), r=applyBrainOp(a.v,pick.op,b.v);
    if(r===null){ setShake(id); setTimeout(()=>setShake(null),380); return; }
    const pool=state.pool.filter(n=>n.id!==a.id).map(n=>n.id===b.id?{id:"r"+Date.now(),v:r}:n);
    const hit=r===puzzle.target;
    setState({...state,pool,history:[...state.history,state.pool],finished:hit});
    setPick({a:null,op:null});
    if(hit)onFinish();
  };
  const undo=()=>{ if(!state.history.length||state.finished)return; setState({...state,pool:state.history[state.history.length-1],history:state.history.slice(0,-1)}); setPick({a:null,op:null}); };
  const reset=()=>{ if(state.finished)return; setState({...state,pool:puzzle.nums.map((v,i)=>({id:"n"+i,v})),history:[]}); setPick({a:null,op:null}); };
  const giveUp=()=>{ setState({...state,finished:true,revealed:true}); onFinish(); };
  if(!expanded)return <button type="button" className="brainBoard digitsPreview" onClick={open} aria-label={`Digits: reach ${puzzle.target}. Open to play`}>
    <span className="digitsTarget">{puzzle.target}</span>
    <span className="digitsChips">{state.pool.map(n=><span key={n.id} className={"digitsChip"+(n.v===puzzle.target?" hit":"")}>{n.v}</span>)}</span>
  </button>;
  return <div className="brainPlay digitsPlay">
    <div className="digitsTarget big" aria-live="polite">{puzzle.target}</div>
    <div className="digitsChips">{state.pool.map(n=><button type="button" key={n.id} className={"digitsChip"+(pick.a===n.id?" on":"")+(n.v===puzzle.target?" hit":"")+(shake===n.id?" shake":"")} onClick={()=>tapNumber(n.id)} aria-pressed={pick.a===n.id}>{n.v}</button>)}</div>
    <div className="digitsOps">{["+","−","×","÷"].map(op=><button type="button" key={op} className={"digitsOp"+(pick.op===op?" on":"")} disabled={!pick.a||state.finished} onClick={()=>setPick({...pick,op})} aria-label={{"+":"plus","−":"minus","×":"times","÷":"divided by"}[op]}>{op}</button>)}</div>
    <div className="brainActions">
      <button type="button" className="brainLink" onClick={undo} disabled={!state.history.length||state.finished}>Undo</button>
      <button type="button" className="brainLink" onClick={reset} disabled={!state.history.length||state.finished}>Reset</button>
      {!state.finished&&<button type="button" className="brainLink" onClick={giveUp}>Show a solution</button>}
    </div>
    {state.finished&&<p className="brainOutcome">{solved&&!state.revealed?"Solved.":"One way:"} {puzzle.solution.join(" · ")}</p>}
  </div>;
}
const BRAIN_KEYS=["qwertyuiop","asdfghjkl","↵zxcvbnm⌫"];
function FiveGame({onFinish,expanded,open}){
  const answer=React.useMemo(()=>brainWordFor(todayKey),[]);
  const [state,setState]=useBrainState("five",()=>({guesses:[],finished:false}));
  const [draft,setDraft]=useState(""),[note,setNote]=useState("");
  const won=state.guesses.includes(answer);
  const submit=()=>{
    if(state.finished)return;
    if(draft.length!==5){ setNote("Five letters"); return; }
    const guesses=[...state.guesses,draft], finished=draft===answer||guesses.length>=6;
    setState({guesses,finished}); setDraft(""); setNote("");
    if(finished)onFinish();
  };
  const press=key=>{
    if(state.finished)return;
    if(key==="↵")return submit();
    if(key==="⌫")return setDraft(d=>d.slice(0,-1));
    if(/^[a-z]$/.test(key))setDraft(d=>d.length<5?d+key:d);
  };
  useEffect(()=>{ if(!expanded)return; const onKey=e=>{ if(e.metaKey||e.ctrlKey||e.altKey)return; const k=e.key==="Enter"?"↵":e.key==="Backspace"?"⌫":e.key.toLowerCase(); if(k==="↵"||k==="⌫"||/^[a-z]$/.test(k)){ e.preventDefault(); press(k); } }; window.addEventListener("keydown",onKey); return()=>window.removeEventListener("keydown",onKey); });
  const letterState={};
  state.guesses.forEach(g=>scoreBrainGuess(g,answer).forEach((s,i)=>{ const prev=letterState[g[i]]; if(prev!=="correct"&&(s==="correct"||prev!=="present"))letterState[g[i]]=s; }));
  const rows=Array.from({length:6},(_,i)=>i<state.guesses.length?{word:state.guesses[i],marks:scoreBrainGuess(state.guesses[i],answer)}:i===state.guesses.length&&!state.finished?{word:draft,marks:null}:{word:"",marks:null});
  const grid=<div className={"fiveGrid"+(expanded?" big":"")}>{rows.map((row,r)=><div key={r} className="fiveRow">{[0,1,2,3,4].map(i=><span key={i} className={"fiveCell"+(row.marks?" "+row.marks[i]:row.word[i]?" typed":"")}>{expanded?(row.word[i]||""):""}</span>)}</div>)}</div>;
  if(!expanded)return <button type="button" className="brainBoard fivePreview" onClick={open} aria-label="Five letters: guess today's word in six tries. Open to play">{grid}</button>;
  return <div className="brainPlay fivePlay">
    {grid}
    {state.finished?<p className="brainOutcome">{won?`Got it in ${state.guesses.length}.`:"Today’s word:"} <b>{answer.toUpperCase()}</b></p>:<p className="brainNote" aria-live="polite">{note}</p>}
    <div className="fiveKeys">{BRAIN_KEYS.map((row,i)=><div key={i} className="fiveKeyRow">{[...row].map(k=><button type="button" key={k} className={"fiveKey"+(k==="↵"||k==="⌫"?" wide":"")+(letterState[k]?" "+letterState[k]:"")} onClick={()=>press(k)} aria-label={k==="↵"?"Enter":k==="⌫"?"Delete":k}>{k}</button>)}</div>)}</div>
  </div>;
}
function SudokuGame({onFinish,expanded,open}){
  const puzzle=React.useMemo(()=>makeSudoku(todayKey),[]);
  const [state,setState]=useBrainState("sudoku",()=>({grid:puzzle.puzzle.map(r=>r.slice()),finished:false}));
  const [cell,setCell]=useState(null);
  const bad=sudokuConflicts(state.grid);
  const put=v=>{
    if(cell===null||state.finished)return;
    const r=Math.floor(cell/6), c=cell%6; if(puzzle.puzzle[r][c])return;
    const grid=state.grid.map(row=>row.slice()); grid[r][c]=v;
    const finished=sudokuSolved(grid); setState({grid,finished});
    if(finished){ setCell(null); onFinish(); }
  };
  useEffect(()=>{ if(!expanded)return; const onKey=e=>{ if(/^[1-6]$/.test(e.key)){ e.preventDefault(); put(Number(e.key)); } else if(e.key==="Backspace"||e.key==="Delete"){ e.preventDefault(); put(0); } }; window.addEventListener("keydown",onKey); return()=>window.removeEventListener("keydown",onKey); });
  const board=<div className={"sudokuGrid"+(expanded?" big":"")}>{state.grid.flatMap((row,r)=>row.map((v,c)=>{ const i=r*6+c, given=!!puzzle.puzzle[r][c];
    const cls="sudokuCell"+(given?" given":"")+(bad.has(i)?" bad":"")+(cell===i?" on":"")+(c===2?" edgeR":"")+(r%2===1&&r<5?" edgeB":"");
    return expanded&&!given&&!state.finished?<button type="button" key={i} className={cls} onClick={()=>setCell(i)} aria-label={`Row ${r+1}, column ${c+1}${v?", "+v:", empty"}`}>{v||""}</button>:<span key={i} className={cls}>{v||""}</span>; }))}</div>;
  if(!expanded)return <button type="button" className="brainBoard sudokuPreview" onClick={open} aria-label="Mini sudoku: fill the grid so each row, column and box holds 1 to 6. Open to play">{board}</button>;
  return <div className="brainPlay sudokuPlay">
    {board}
    {state.finished?<p className="brainOutcome">Solved.</p>:<div className="sudokuPad">{[1,2,3,4,5,6].map(v=><button type="button" key={v} className="digitsOp" onClick={()=>put(v)}>{v}</button>)}<button type="button" className="digitsOp" onClick={()=>put(0)} aria-label="Erase">⌫</button></div>}
  </div>;
}
function BrainGameCard({done,onFinish}){
  const {expanded,open}=useTilePresentation();
  const game=brainGameFor(todayKey);
  const Game={digits:DigitsGame,five:FiveGame,sudoku:SudokuGame}[game];
  return <div className={"brainFlexCard brainGames"+(expanded?" isExpanded":"")}>
    <BrainGearArt/>
    <span className="brainFormat">{BRAIN_GAMES[game]}</span>
    <Game onFinish={()=>{ if(!done)onFinish(); }} expanded={expanded} open={open}/>
  </div>;
}

/* Replies are asked to carry no markdown; any **bold** or *italic* that still comes back
   renders as emphasis instead of showing its asterisks. */
const philoInline=text=>String(text||"").split(/(\*\*[^*\n]+\*\*|\*[^*\s][^*\n]*\*)/g).map((part,i)=>
  /^\*\*[^*\n]+\*\*$/.test(part)?<strong key={i}>{part.slice(2,-2)}</strong>
  :/^\*[^*\s][^*\n]*\*$/.test(part)?<em key={i}>{part.slice(1,-1)}</em>:part);
/* Philosophy: the day's question as a quotation, answered straight from the tile. The
   pop-up holds the conversation, with "No philosopher" always in view and the thinkers you
   can argue with as a row of names beside it. In the tile, a long answer grows only into the
   room under the question (the peek steps aside) and scrolls inside after that. */
function PhilosophyCard({philo,busy,chat,sending,error,haveKey,onSetup,onRetry,onModeChange,onSubmitInitial,onSend,onReset,onGenerate}){
  const {expanded,open}=useTilePresentation();
  const [msg,setMsg]=useState(""),[tall,setTall]=useState(false);
  const inputRef=useRef(null),endRef=useRef(null),thinkersRef=useRef(null);
  const messages=chat.messages||[];
  useEffect(()=>{ if(expanded&&endRef.current)endRef.current.scrollIntoView({block:"nearest"}); },[expanded,messages.length,sending]);
  useEffect(()=>{
    const row=thinkersRef.current; if(!expanded||!row)return;
    row.querySelector(".philoThinker.on")?.scrollIntoView({block:"nearest",inline:"center"});
    const onWheel=e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&row.scrollWidth>row.clientWidth){ e.preventDefault(); row.scrollLeft+=e.deltaY; } };
    row.addEventListener("wheel",onWheel,{passive:false});
    return()=>row.removeEventListener("wheel",onWheel);
  },[expanded]);
  const grow=el=>{
    // before the tile is on the page there is nothing to measure: leave the bar its natural height
    if(!el||!el.isConnected||!el.getClientRects().length)return; el.style.height="auto";
    const cs=getComputedStyle(el), lh=parseFloat(cs.lineHeight)||20;
    const multi=el.scrollHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0)>lh*1.5;
    let cap=Math.round(window.innerHeight*.4);
    const tile=el.closest(".grid>.tile"), q=tile&&tile.querySelector(".philoQ"), comp=el.closest(".philoComposer");
    if(tile&&q&&comp){
      // in the tile: never past the padding edge, never over the question; whole lines only
      const limit=tile.getBoundingClientRect().bottom-(parseFloat(getComputedStyle(tile).paddingBottom)||0);
      const chrome=multi?14:comp.getBoundingClientRect().height-el.getBoundingClientRect().height, pad=multi?0:14;
      const room=limit-q.getBoundingClientRect().bottom-8-chrome;
      cap=pad+Math.max(1,Math.floor((room-pad)/lh))*lh;
    }
    el.style.height=Math.min(el.scrollHeight,cap)+"px";
    setTall(multi);
  };
  // the room changes with the tile's padding, the pop-up and the text: size it again then
  useLayoutEffect(()=>{ if(philo) grow(inputRef.current); },[tall,expanded,!!philo]);
  if(!philo) return <GenerateEmpty busy={busy} onGenerate={onGenerate} />;
  const started=!!chat.initial;
  /* a conversation keeps the question it began on; a new one gets today's short question */
  const question=chat.question||(started?philo.question:philoQuestionOf(philo,todayKey));
  const mode=chat.mode||"standard";
  const thread=started?[{role:"user",text:chat.initial},...messages]:[];
  const lastReply=[...thread].reverse().find(m=>m.role==="assistant");
  const submit=()=>{
    const text=msg.trim(); if(!text||sending)return;
    if(!expanded)open();
    if(started)onSend(text); else onSubmitInitial(text);
    setMsg(""); requestAnimationFrame(()=>grow(inputRef.current));
  };
  return (
    <div className={"philoCard"+(lastReply?" hasReply":"")+(tall&&!expanded?" tall":"")}>
      {/* the day's question comes first, big; the last open question asked back sits under it
          while there is room */}
      <p className="philoQ">{question}</p>
      {expanded&&<div className="philoWho" role="group" aria-label="Who answers">
        {PHILO_MODES.slice(0,1).map(m=><button type="button" key={m.id} className={"philoThinker philoNone"+(m.id===mode?" on":"")} aria-pressed={m.id===mode} disabled={sending} onClick={()=>onModeChange(m.id)}>{m.label}</button>)}
        <div className="philoThinkers" ref={thinkersRef}>
          {PHILO_MODES.slice(1).map(m=><button type="button" key={m.id} className={"philoThinker"+(m.id===mode?" on":"")} aria-pressed={m.id===mode} disabled={sending} onClick={()=>onModeChange(m.id)}>{m.label}</button>)}
        </div>
      </div>}
      {expanded&&started&&<div className="philoThread">
        {thread.map((m,i)=><div key={i} className={"philoMsg "+(m.role==="user"?"me":"them")}>{m.role==="user"?m.text:philoInline(m.text)}</div>)}
        {sending&&<div className="philoTyping" aria-label="Thinking"><i/><i/><i/></div>}
        <div ref={endRef}/>
      </div>}
      {!expanded&&lastReply&&!tall&&<p className="philoLast" data-fit-drop="5" role="button" tabIndex={0} aria-label="Open the conversation" onClick={e=>{ e.stopPropagation(); open(); }} onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); open(); } }}>{philoInline(lastReply.text)}</p>}
      {!expanded&&sending&&!lastReply&&<div className="philoTyping" aria-label="Thinking"><i/><i/><i/></div>}
      {expanded&&error&&<p className="philoHint" role="alert">{error} <button type="button" className="link" onClick={onRetry} disabled={sending}>Retry</button></p>}
      <div className="philoComposer">
        <textarea ref={inputRef} rows={1} className="philoInput" aria-label={started?"Reply":"Your answer"} placeholder={started?"Push back, or ask why…":"What do you think?"} value={msg}
          onChange={e=>{ setMsg(e.target.value); grow(e.target); }}
          onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); submit(); } }}/>
        <button type="button" className="philoSend" aria-label="Send" disabled={!msg.trim()||sending} onClick={submit}><WidgetGlyph name="send"/></button>
      </div>
      {expanded&&started&&<button type="button" className="philoRestart" disabled={sending} onClick={onReset}>Start over</button>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DashboardEntry/>);
