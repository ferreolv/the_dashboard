<script>
/* Read the recovery secret before external resources load. Keep it in memory,
   and remove it from the address and its current history entry immediately. */
function captureDashboardRecoveryLink(){
  if(!/^#\/?reset-password(?:\?|$)/.test(location.hash))return null;
  const query=location.hash.split("?")[1]||"";
  const candidate=new URLSearchParams(query).get("token")||"";
  history.replaceState(history.state,"",location.pathname+location.search+"#/reset-password");
  return {token:/^[A-Za-z0-9_-]{32,512}$/.test(candidate)?candidate:""};
}
let dashboardRecoveryLink=captureDashboardRecoveryLink();
</script>

  /* ---- guided breathing ---- */
  .breathCard { min-height:100%; display:grid; grid-template-columns:minmax(104px,.9fr) minmax(0,1.1fr); align-items:center; gap:clamp(9px,4cqi,16px); }
  .breathStage { position:relative; min-height:132px; display:grid; place-items:center; }
  .breathProgress { position:relative; width:clamp(98px,38cqi,140px); aspect-ratio:1; display:grid; place-items:center; border-radius:50%; background:conic-gradient(var(--accent) var(--breath-progress,0deg),color-mix(in srgb,var(--accent) 13%,transparent) 0); transition:background .2s linear; }
  .breathProgress::before { content:""; position:absolute; width:calc(clamp(98px,38cqi,140px) - 7px); aspect-ratio:1; border-radius:50%; background:color-mix(in srgb,var(--bg) 74%,white); opacity:.96; }
  .breathOrb { position:relative; z-index:1; width:clamp(68px,27cqi,100px); aspect-ratio:1; display:grid; place-items:center; border-radius:50%; color:#fff; background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 46%,white),var(--accent) 58%,var(--accentDark)); box-shadow:0 14px 32px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.66); transform:scale(var(--breath-scale,.78)); transition:transform .1s linear, box-shadow .1s linear; }
  .breathOrb::before,.breathOrb::after { content:""; position:absolute; inset:-9px; border:1.5px solid color-mix(in srgb,var(--accent) 38%,transparent); border-radius:50%; opacity:.72; }
  .breathOrb::after { inset:-18px; opacity:.34; }
  .breathOrb.inhale,.breathOrb.exhale { box-shadow:0 18px 38px color-mix(in srgb,var(--accent) calc(18% + var(--breath-amount,0) * 22%),transparent),inset 0 1px 0 rgba(255,255,255,.72); }
  .breathOrb.idle { box-shadow:0 12px 24px color-mix(in srgb,var(--accent) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.66); }
  .breathCount { font-size:clamp(20px,8cqi,30px); line-height:1; font-weight:900; letter-spacing:-.04em; }
  .breathCopy { min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:5px; }

  /* ===== Daylight v2 design system ===== */

  html { background:var(--canvas); overflow-x:hidden; }
  body { max-width:100%; overflow-x:hidden; color:var(--text); background:#e6eae7 !important; }
  body.theme-neutral { background:#e6eae7 !important; }
  body.theme-atmospheric { background:radial-gradient(circle at 8% 0%,rgba(255,187,135,.27),transparent 28%),radial-gradient(circle at 94% 16%,rgba(150,137,255,.24),transparent 30%),linear-gradient(145deg,#fff1e6,#f4f0ff 54%,#e9f7ff) !important; }
  body.theme-aurora { background:radial-gradient(circle at 12% 8%,rgba(255,140,200,.50),transparent 34%),radial-gradient(circle at 88% 16%,rgba(120,150,255,.48),transparent 36%),radial-gradient(circle at 62% 94%,rgba(110,232,220,.44),transparent 42%),linear-gradient(140deg,#fdeefb,#eef0ff 50%,#e6fbff) !important; background-attachment:fixed !important; }
  body.theme-sunset { background:radial-gradient(circle at 14% 6%,rgba(255,178,116,.52),transparent 36%),radial-gradient(circle at 86% 20%,rgba(255,126,150,.44),transparent 40%),radial-gradient(circle at 70% 96%,rgba(255,205,140,.40),transparent 42%),linear-gradient(150deg,#fff3e8,#ffe9ef 55%,#fff7ec) !important; background-attachment:fixed !important; }
  body.theme-ocean { background:radial-gradient(circle at 12% 10%,rgba(118,200,255,.46),transparent 36%),radial-gradient(circle at 90% 18%,rgba(120,160,255,.42),transparent 40%),radial-gradient(circle at 70% 94%,rgba(126,240,214,.42),transparent 42%),linear-gradient(150deg,#edf7ff,#eafaff 55%,#f0fff8) !important; background-attachment:fixed !important; }
  body.theme-paper { background:#f2ece2 !important; }
  body.theme-graphite { background:linear-gradient(160deg,#c6ccd6,#d9dee5 60%,#cdd3dd) !important; background-attachment:fixed !important; }

  button,input,textarea { -webkit-tap-highlight-color:transparent; }
  button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid rgba(99,102,241,.22); outline-offset:2px; }
  .wrap { width:100%; max-width:1800px; margin:0 auto; padding:18px clamp(16px,3vw,42px) 72px; box-sizing:border-box; }

  .topbar { position:sticky; top:12px; z-index:110; max-width:1396px; margin:0 auto 34px; min-height:58px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:8px 9px 8px 12px; background:rgba(255,255,255,.90); border:1px solid rgba(255,255,255,.96); border-radius:18px; box-shadow:0 12px 38px rgba(34,39,72,.12),inset 0 0 0 1px rgba(23,24,44,.05); backdrop-filter:blur(24px) saturate(1.3); }
  .brand { display:flex; align-items:center; gap:10px; min-width:150px; }
  .brandMark { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; color:#fff; background:linear-gradient(145deg,#6d5dfc,#4a3ad8); box-shadow:0 7px 18px rgba(79,70,229,.25); font-size:15px; font-weight:800; letter-spacing:-.04em; }
  .brandName { font-size:14px; font-weight:800; letter-spacing:-.025em; }
  .topnav { display:flex; align-items:center; padding:3px; border-radius:12px; background:rgba(23,24,44,.045); }
  .navbtn { border:0; background:transparent; color:var(--muted); border-radius:9px; padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; transition:color .2s,background .2s,box-shadow .2s; }
  .navbtn.active { color:var(--text); background:#fff; box-shadow:0 1px 3px rgba(23,24,44,.10); }
  .topActions { display:flex; align-items:center; gap:7px; }
  .actionBtn { height:38px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 13px; border:1px solid var(--line); border-radius:11px; color:#4c4f64; background:rgba(255,255,255,.76); font-size:11.5px; font-weight:700; cursor:pointer; transition:transform .2s var(--ease),box-shadow .2s,background .2s; }
  .actionBtn:hover { transform:translateY(-1px); background:#fff; box-shadow:0 7px 18px rgba(23,24,44,.09); }
  .actionBtn.primary { color:#fff; border-color:#17182c; background:#17182c; box-shadow:0 7px 18px rgba(23,24,44,.18); }
  .actionBtn.active { color:#fff; background:#6257e7; border-color:#6257e7; }
  .actionBtn svg { width:15px; height:15px; stroke-width:1.9; }

  .dashboardHero { max-width:1800px; margin:0 auto 24px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
  .heroCopy { min-width:0; }
  .heroEyebrow { color:#7a7d91; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:7px; }
  .dashboardHero h1 { margin:0; color:#16172a; font-size:clamp(30px,4vw,48px); line-height:1.03; letter-spacing:-.052em; font-weight:750; }
  .heroStatus { margin:10px 0 0; color:#777a8e; font-size:13px; line-height:1.45; }
  .heroSummary { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
  .progressOrb { --p:0; width:76px; height:76px; border-radius:50%; display:grid; place-items:center; position:relative; background:conic-gradient(#6257e7 calc(var(--p)*1%),rgba(98,87,231,.10) 0); box-shadow:inset 0 0 0 1px rgba(98,87,231,.08); }
  .progressOrb::before { content:""; position:absolute; inset:6px; border-radius:50%; background:#fff; box-shadow:0 4px 14px rgba(23,24,44,.06); }
  .progressValue { position:relative; z-index:1; font-size:15px; font-weight:800; letter-spacing:-.03em; }
  .metric { min-width:82px; padding:11px 13px; background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.9); border-radius:14px; box-shadow:0 7px 24px rgba(23,24,44,.05); }
  .metricValue { display:block; font-size:16px; font-weight:800; letter-spacing:-.035em; }
  .metricLabel { display:block; margin-top:2px; color:#85889a; font-size:9.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .heroClock { color:#5a5d70; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }

  .grid { gap:16px; grid-auto-rows:104px; max-width:1800px; }
  .tile { isolation:isolate; border-radius:var(--radius); padding:17px 18px 18px; color:var(--ink); background:var(--tileBg); border:1px solid rgba(255,255,255,.78); box-shadow:var(--glow),var(--shadow); transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s,background .5s var(--ease),color .35s; }
  .tile::before { content:""; position:absolute; z-index:-1; left:18px; right:18px; top:0; height:2px; border-radius:0 0 4px 4px; background:var(--accent); opacity:.0; transform:scaleX(.55); transition:opacity .25s,transform .35s var(--ease); }
  .tile.completed::before { opacity:.85; transform:scaleX(1); background:rgba(255,255,255,.92); }
  .tile.completed { border-color:rgba(255,255,255,.24); box-shadow:var(--glow),0 18px 48px rgba(28,32,65,.13); }
  .tile.completed .ldot { background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.14); }
  .tile.completed .lbl,.tile.completed .muted,.tile.completed .link { color:var(--lbl); }
  .tile.completed .qopt { color:#fff; background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.20); }
  .tile.completed .qopt.correct { color:#14532d; background:#dcfce7; border-color:#86efac; }
  .tile.completed .qopt.wrong { color:#7f1d1d; background:#fee2e2; border-color:#fca5a5; }
  .tile.completed input,.tile.completed textarea { color:#fff; }
  .tile.completed input::placeholder,.tile.completed textarea::placeholder { color:rgba(255,255,255,.62); }
  .tbody { scrollbar-width:none!important; -ms-overflow-style:none; }
  .tbody::-webkit-scrollbar,.chatLog::-webkit-scrollbar,.ovl::-webkit-scrollbar { display:none!important; width:0!important; height:0!important; }
  .chatLog,.ovl { scrollbar-width:none; }
  a,.link,.qretry { text-decoration:none!important; }
  .link { display:inline-flex; align-items:center; gap:5px; color:var(--accentDark); }
  .link:hover { opacity:.68; }
  .tile input,.tile textarea,.tile select { color:var(--ink)!important; -webkit-text-fill-color:var(--ink); caret-color:var(--accent); }
  .tile input::placeholder,.tile textarea::placeholder { color:var(--dim)!important; -webkit-text-fill-color:var(--dim); opacity:1; }
  .mindTree { display:flex; flex-direction:column; gap:8px; padding:4px 0; }
  .mindNode { position:relative; margin-left:calc(var(--depth,0) * 15px); }
  .mindNode::before { content:""; position:absolute; left:-10px; top:0; bottom:0; width:1px; background:linear-gradient(var(--mindAccent,#6257e7),transparent); opacity:.28; }
  .mindNodeHead { display:flex; align-items:center; gap:8px; min-height:30px; font-size:13px; font-weight:800; letter-spacing:-.01em; }
  .mindNodeDot { width:7px; height:7px; flex:none; border-radius:50%; background:var(--mindAccent,#6257e7); box-shadow:0 0 0 4px color-mix(in srgb,var(--mindAccent,#6257e7) 12%,transparent); }
  .mindEntries { display:flex; flex-direction:column; gap:5px; margin:2px 0 7px 15px; }
  .mindEntry { display:flex; align-items:flex-start; gap:10px; padding:8px 10px; border-radius:10px; background:rgba(98,87,231,.045); color:#34364a; font-size:12.5px; line-height:1.42; }
  .mindEntry span { flex:1; }

  /* Candy mode: playful reward, disciplined system */

  /* Universal widget contract

     summaries instead of controls being sliced by a resized tile. */
  .tile{

  .tile .tbody,.tile .content{min-width:0;min-height:0;max-width:100%}

        color-mix(in srgb,var(--accent) 58%,var(--accentDark)),

  /* Universal compact-tile contract: no horizontal clipping or side-scrolling. */

  /* ===== Liquid-glass polish (ui-ux-pro-max pass) ==============================
     Keeps each tile's own hue: light frosted glass at rest → vivid glass when
     ticked. A faint hue tint + two-layer specular highlight + inner depth make
     the surface read as real refracting glass rather than flat translucency. */
  /* Near-clear glass: the background shows through; colour lives in a faint tint
     + the luminous rim. Thin border; the bright edge comes from the ::before ring. */
  .tile{
    background:color-mix(in srgb,var(--accent) 8%,rgba(255,255,255,.12))!important;
    border:1px solid color-mix(in srgb,var(--accent) 20%,rgba(255,255,255,.45))!important;
    -webkit-backdrop-filter:blur(14px) saturate(180%) brightness(1.06)!important;
    backdrop-filter:blur(14px) saturate(180%) brightness(1.06)!important;
    box-shadow:
      inset 0 -10px 24px color-mix(in srgb,var(--accent) 10%,transparent),
      inset 0 0 20px rgba(255,255,255,.10),
      0 14px 34px rgba(26,26,54,.14),
      0 2px 6px rgba(26,26,54,.07)!important;
  }
  /* No hard rim line — the edge is the clean 1px border. */
  .tile::before{ display:none!important; }
  /* A single soft sheen from the top — a broad glow, never a sharp line. */
  .tile::after{
    opacity:.8!important;
    background:radial-gradient(140% 95% at 74% -30%,rgba(255,255,255,.5),transparent 58%)!important;
  }
  .tile:not(.editing):hover{border-color:color-mix(in srgb,var(--accent) 12%,rgba(255,255,255,.7))!important}
  /* Completed: vivid but still glassy — a translucent hue fill with a bright white rim. */
  .tile.completed{
    background:linear-gradient(150deg,
      color-mix(in srgb,var(--accent) 78%,rgba(255,255,255,.20)),
      color-mix(in srgb,var(--accent) 64%,var(--accentDark)))!important;
    border-color:rgba(255,255,255,.5)!important;
    box-shadow:
      inset 0 -16px 32px color-mix(in srgb,var(--accent) 34%,transparent),
      0 16px 38px color-mix(in srgb,var(--accent) 30%,transparent),
      0 2px 6px rgba(26,26,54,.10)!important;
  }
  .tile.completed::after{
    opacity:.9!important;
    background:radial-gradient(140% 95% at 74% -28%,rgba(255,255,255,.55),transparent 56%)!important;
  }
  /* Accessibility: a clear keyboard-focus ring in the tile's hue (skill priority #1). */
  .tile a:focus-visible,.tile button:focus-visible,.tile input:focus-visible,
  .tile textarea:focus-visible,.tile select:focus-visible,.tile [tabindex]:focus-visible,
  .navbtn:focus-visible,.actionBtn:focus-visible,.pill:focus-visible{
    outline:2.5px solid color-mix(in srgb,var(--accent) 72%,#fff)!important;
    outline-offset:2px!important;
  }
  .tile.completed a:focus-visible,.tile.completed button:focus-visible,
  .tile.completed input:focus-visible,.tile.completed [tabindex]:focus-visible{
    outline-color:rgba(255,255,255,.92)!important;
  }
  /* Honour reduced-motion for the hover lift and any looping animation. */
  @media (prefers-reduced-motion:reduce){
    .tile:not(.editing):hover{transform:none!important}
    .tile,.tile *{animation-duration:.001ms!important;animation-iteration-count:1!important}
  }
  /* Weather: stretch the single grid row to the full tile height so the two
     cards fill it instead of hugging the top. */
  .tile[data-tileid="weather"] .weatherSplit{flex:1 1 auto!important;height:auto!important;grid-template-rows:minmax(0,1fr)!important;align-content:stretch!important;align-items:stretch!important}
  .tile[data-tileid="weather"] .weatherNow,.tile[data-tileid="weather"] .wtomorrow{height:100%!important}
  .tile[data-tileid="weather"] .weatherNow{display:flex!important;align-items:center!important;gap:14px!important}
  .tile[data-tileid="weather"] .wtomorrow{justify-content:center!important}
  /* Habits: ONE authoritative layout that overrides every earlier fixed-width /
     flex rule. A uniform auto-fill grid — every circle is identical, they stack
     neatly and wrap to as many per row as the tile width allows, at any column
     span. auto-fill (not auto-fit) keeps circles from stretching when few. */
  .tile[data-tileid="habits"] .hgrid{
    display:grid!important;
    grid-template-columns:repeat(auto-fill,minmax(clamp(62px,19cqi,92px),1fr))!important;
    gap:clamp(7px,2.6cqi,13px)!important;
    align-content:start!important;justify-content:start!important;
    width:100%!important;height:auto!important;overflow:visible!important;
  }
  .tile[data-tileid="habits"] .hsq{
    width:auto!important;min-width:0!important;max-width:none!important;
    height:auto!important;min-height:0!important;max-height:none!important;
    flex:initial!important;flex-basis:auto!important;
    aspect-ratio:1/1!important;border-radius:50%!important;
  }
  .tile[data-tileid="habits"] .hsq .hicon{font-size:clamp(20px,7.5cqi,31px)!important}
  .tile[data-tileid="habits"] .hsq .hname{font-size:clamp(10px,2.7cqi,13px)!important;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* the plus/add cell follows the same footprint so the grid stays even */
  .tile[data-tileid="habits"] .hsq.plus{aspect-ratio:1/1!important}
  /* Stats tile: a compact push-up trend as a line-with-dots (scatter) chart.
     Takes less vertical room than the old bars and reads the trend at a glance. */
  .tile[data-tileid="weekly"] .chartSec{min-height:0}
  .tile[data-tileid="weekly"] .pushLine{min-height:46px;max-height:88px}
  .tile.completed[data-tileid="weekly"] .pushLinePath{stroke:#fff!important;opacity:.9}
  .tile.completed[data-tileid="weekly"] .pushDot{background:#fff!important;box-shadow:none!important}
  .tile.completed[data-tileid="weekly"] .pushDot.today{background:var(--accent)!important;border-color:#fff!important}
  .tile.completed[data-tileid="weekly"] .pushDotVal{color:#fff!important}

  /* ============================================================
     Design boost — pushups (1×1), goals, weather, stats.
     Every rule is checked in BOTH the pastel (undone) and vivid
     (.completed) states so contrast holds either way.
     ============================================================ */

  /* --- Push-ups: a clean vertical layout for the 1-wide tile — a count hero
         above a compact button pad. Short (1×1) → one button row; taller → 2×2. --- */
  .tile[data-tileid="pushups"][data-cols="1"] .pushWrap{flex-direction:column!important;align-items:stretch!important;justify-content:center!important;gap:8px!important;padding:2px 0!important}

  .tile[data-tileid="pushups"][data-cols="1"] .pushBtns{display:grid!important;gap:5px!important;width:100%!important;flex:none!important;align-self:stretch!important;height:auto!important}
  .tile[data-tileid="pushups"][data-cols="1"] .pushBtns .puBtn{width:100%!important;min-width:0!important;height:auto!important;font-weight:850!important;border-radius:11px!important}
  .tile[data-tileid="pushups"][data-cols="1"] .pushBtns .puReset{width:100%!important;flex:none!important}
  /* short 1×1: number moderate, all four controls in a single row */

  .tile[data-tileid="pushups"][data-cols="1"][data-rows="1"] .pushBtns{grid-template-columns:repeat(4,1fr)!important}
  .tile[data-tileid="pushups"][data-cols="1"][data-rows="1"] .pushBtns .puBtn{min-height:27px!important;padding:4px 2px!important;font-size:11px!important}
  /* taller 1-wide (1×2+): big hero number, a 2×2 pad, and a "reps" cue */
  .tile[data-tileid="pushups"][data-cols="1"]:not([data-rows="1"]) .pushCount{font-size:clamp(34px,32cqi,54px)!important}
  .tile[data-tileid="pushups"][data-cols="1"]:not([data-rows="1"]) .pushCount::after{content:"reps today";display:block;margin-top:6px;font:900 8.5px/1 'Nunito',sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.62}
  .tile[data-tileid="pushups"][data-cols="1"]:not([data-rows="1"]) .pushBtns{grid-template-columns:1fr 1fr!important}
  .tile[data-tileid="pushups"][data-cols="1"]:not([data-rows="1"]) .pushBtns .puBtn{min-height:33px!important;padding:6px 4px!important;font-size:12.5px!important}

  /* --- Goals: built-in, airy day groups. No boxy cards — days are separated by
         hairlines and generous spacing; "Today" is set apart by an accent header;
         future days get a quiet collapsible add instead of a full input. --- */
  .tile[data-tileid="goals"] .goalDay{padding:0 0 14px!important;margin:0 0 14px!important;background:none!important;border:0!important;border-bottom:1px solid color-mix(in srgb,var(--accent) 14%,var(--hair))!important;box-shadow:none!important;border-radius:0!important}
  .tile[data-tileid="goals"] .goalDay:last-child{margin-bottom:0!important;padding-bottom:0!important;border-bottom:0!important}
  .grid>.tile[data-tileid="goals"] .goalDay:not(:first-child):not(:has(.goalRow)){display:flex;align-items:center;justify-content:space-between;padding:0 0 9px!important;margin:0 0 9px!important}
  .grid>.tile[data-tileid="goals"] .goalDay:not(:first-child):not(:has(.goalRow)) .goalDayHead{margin:0}
  .grid>.tile[data-tileid="goals"] .goalDay:not(:first-child):not(:has(.goalRow)) .goalAddGhost{margin:0}

  /* Coloured liquid glass. Refraction stays behind the content, never on text. */
  body{isolation:isolate}
  /* A quiet mineral canvas lets the coloured glass carry the visual identity. */
  body::before{content:'';position:fixed;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 4% 5%,rgba(255,255,255,.68),transparent 75%),radial-gradient(ellipse 65% 80% at 100% 85%,rgba(133,157,151,.12),transparent 80%)}
  body::after{content:none}

    --glass-radius:34px;
    border:1px solid rgba(255,255,255,.46)!important;border-radius:var(--glass-radius)!important;
    --glass-surface:linear-gradient(140deg,rgba(var(--glass-rgb),.30),rgba(var(--glass-rgb),.19));
    background:transparent!important;
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    box-shadow:inset 1px 1px 1px rgba(255,255,255,.5),inset -1px -1px 1px rgba(var(--glass-depth),.1),0 10px 26px -14px rgba(var(--glass-depth),.16),0 2px 6px rgba(30,40,50,.025)!important;
    color:var(--ink)!important;transition:background .25s,border-color .25s,box-shadow .25s;
  }
  .tile[data-tileid]::before{
    content:''!important;display:block!important;position:absolute;z-index:-1;inset:0!important;width:auto!important;height:auto!important;margin:0!important;border-radius:inherit;pointer-events:none;opacity:1!important;transform:none!important;
    background:var(--glass-surface)!important;box-shadow:inset 0 0 12px 2px rgba(255,255,255,.035);
    /* Frosted, vivid glass: a strong blur with extra saturation, so whatever is behind
       turns into soft colour instead of washing out, tinted with the tile's own hue. */
    -webkit-backdrop-filter:blur(18px) saturate(185%);backdrop-filter:blur(18px) saturate(185%);
  }
  .tile[data-tileid]::after{
    content:'';display:block!important;position:absolute;z-index:-1;inset:0;border-radius:inherit;pointer-events:none;opacity:1!important;
    /* just a soft top sheen and a hairline inner edge — no rim band */
    background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0) 38%)!important;

/* --- Recall: a real flashcard deck --- */

.tile input.movieTitleInput{width:100%;min-height:0!important;padding:3px 8px!important;border:0!important;border-radius:8px!important;background:rgba(255,255,255,.16)!important;box-shadow:none!important;font:900 clamp(15px,7cqi,19px)/1.15 'Nunito',sans-serif!important;color:#fff!important;-webkit-text-fill-color:#fff;text-align:center;outline:none!important}
.movieUpNext,.tile .movieUpNext{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.58)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .movieStrip .movieAddInput{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.25)!important;color:#fff!important;-webkit-text-fill-color:#fff!important;text-align:center}

.tile[data-tileid="movie"] .content{display:flex;flex-direction:column}
.tile[data-tileid="recall"] .content{display:flex;flex-direction:column}

/* --- Events as admission tickets: stub with the big day count, perforation,
       then the plan itself. Alternating tilt keeps the pile playful. --- */
.eventHero.eventTicket{display:flex;align-items:stretch;gap:0;padding:0;border-radius:13px;overflow:visible;
  -webkit-mask:radial-gradient(circle 7px at 74px 0,transparent 96%,#000 100%),radial-gradient(circle 7px at 74px 100%,transparent 96%,#000 100%);
  -webkit-mask-composite:source-in;mask:radial-gradient(circle 7px at 74px 0,transparent 96%,#000 100%),radial-gradient(circle 7px at 74px 100%,transparent 96%,#000 100%);mask-composite:intersect}
.eventTicket.tiltA{transform:rotate(-.7deg)}
.eventTicket.tiltB{transform:rotate(.7deg)}
/* Tickets read horizontally, so they stack — overriding the 2-up event grid. */
.eventList.eventComposition:has(.eventTicket){display:flex!important;flex-direction:column;grid-template-columns:none!important;gap:10px!important}
.tileFocusSurface .eventComposition:has(.eventTicket){grid-template-columns:none!important}
.eventComposition .eventHero.eventTicket{padding:0!important}
.eventTicket::after{display:none}
.ticketStub{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:10px 6px;background:color-mix(in srgb,var(--accent) 16%,rgba(255,255,255,.3));border-right:2px dashed color-mix(in srgb,var(--accent) 45%,#fff)}
.ticketStub strong{font-size:clamp(22px,9cqi,32px);line-height:.95;letter-spacing:-.04em;color:var(--accentDark);font-weight:900}
.ticketStub span{font-size:8.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.ticketBody{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 30px 9px 11px}
.eventTicket .eventTitle{font-size:14px;font-weight:800;line-height:1.2}
.eventTicket .eventDate{margin-top:0}
.eventTicket .eventType{padding:3px 7px;font-size:8px}
.ticketDel{position:absolute;top:6px;right:6px}
.tile.completed .ticketStub{background:rgba(255,255,255,.16);border-right-color:rgba(255,255,255,.6)}
.tile.completed .ticketStub strong{color:#fff}
.tile.completed .ticketStub span{color:rgba(255,255,255,.75)}
/* In the tall Events tile (one square wide, two high) a ticket stands upright: the day count on
   a stub across the top, the perforation under it, the plan below. */
.grid>.tile[data-tileid="events"] .eventHero.eventTicket{flex-direction:column;
  -webkit-mask:radial-gradient(circle 7px at 0 54px,transparent 96%,#000 100%),radial-gradient(circle 7px at 100% 54px,transparent 96%,#000 100%);
  -webkit-mask-composite:source-in;mask:radial-gradient(circle 7px at 0 54px,transparent 96%,#000 100%),radial-gradient(circle 7px at 100% 54px,transparent 96%,#000 100%);mask-composite:intersect}
.grid>.tile[data-tileid="events"] .ticketStub{width:auto;height:54px;box-sizing:border-box;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:6px;padding:10px 30px 8px 12px;border-right:0;border-bottom:2px dashed color-mix(in srgb,var(--accent) 45%,#fff)}
.grid>.tile[data-tileid="events"] .ticketStub strong{font-size:30px}
.grid>.tile[data-tileid="events"] .ticketBody{padding:9px 12px 11px}
.grid>.tile.completed[data-tileid="events"] .ticketStub{border-bottom-color:rgba(255,255,255,.6)}

/* --- Note as ruled paper: faint lines, a red margin, writing straight on it. --- */
.tile[data-tileid="note"] .notearea{
  background:
    linear-gradient(90deg,transparent 21px,color-mix(in srgb,var(--accentDark) 50%,transparent) 21px,color-mix(in srgb,var(--accentDark) 50%,transparent) 22.5px,transparent 22.5px),
    repeating-linear-gradient(to bottom,transparent 0 22.5px,color-mix(in srgb,var(--accent) 42%,transparent) 22.5px 23.5px,transparent 23.5px 24px)!important;
  background-position:0 0,0 6px!important;
  line-height:24px!important;padding:6px 14px 6px 31px!important;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;
  border:none!important;border-radius:0!important;box-shadow:none!important;font-size:14.5px;flex:1 1 auto;min-height:0}
/* the paper runs the whole tile: stretch mount and content, park the archive button on the sheet */
.grid>.tile[data-tileid="note"]>.tbody{display:flex!important;flex-direction:column}
.grid>.tile[data-tileid="note"] .tileMount{flex:1 1 auto!important;display:flex}
.grid>.tile[data-tileid="note"] .tileMount>.content{flex:1 1 auto!important;display:flex!important;min-height:0}
.tile[data-tileid="note"] .noteCard{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.tile.completed[data-tileid="note"] .notearea{background:
    linear-gradient(90deg,transparent 21px,rgba(255,255,255,.65) 21px,rgba(255,255,255,.65) 22.5px,transparent 22.5px),
    repeating-linear-gradient(to bottom,transparent 0 22.5px,rgba(255,255,255,.4) 22.5px 23.5px,transparent 23.5px 24px)!important;
  background-position:0 0,0 6px!important}

/* --- Philosophy: the day's question set like a quotation. --- */
.philoQ{position:relative;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-style:italic;font-size:16.5px;line-height:1.45;font-weight:600;color:var(--accentDark);padding:12px 2px 0 27px;margin-bottom:12px}
.philoQ::before{content:"\201C";position:absolute;left:-3px;top:-8px;font-family:Georgia,serif;font-style:normal;font-weight:700;font-size:56px;line-height:1;color:color-mix(in srgb,var(--accent) 50%,transparent);pointer-events:none}
.tile.completed .philoQ{color:#fff}
.tile.completed .philoQ::before{color:rgba(255,255,255,.45)}

/* --- Push-ups: the add buttons are weight plates, sized by what they add. --- */
.pushBtns{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.tile[data-tileid="pushups"] .pushBtns:has(.puPlate){display:flex!important;grid-template-columns:none!important;flex-wrap:wrap;align-items:center;justify-content:center;align-self:center!important;width:auto!important;gap:9px}
.tile[data-tileid="pushups"] .pushBtns button.puBtn.puPlate,.tile.completed[data-tileid="pushups"] .pushBtns button.puBtn.puPlate{flex:none!important;display:grid;place-items:center;padding:0!important;border-radius:50%!important;border:2.5px solid color-mix(in srgb,var(--accent) 55%,#fff)!important;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 7%,#fff) 0 33%,color-mix(in srgb,var(--accent) 22%,rgba(255,255,255,.6)) 34% 100%)!important;box-shadow:inset 0 0 0 5px rgba(255,255,255,.55),0 4px 10px color-mix(in srgb,var(--accent) 20%,transparent)!important;color:var(--accentDark)!important;font-weight:900}
.tile[data-tileid="pushups"] .pushBtns button.puPlate.p10{width:58px!important;min-width:58px!important;max-width:58px!important;height:58px!important;min-height:58px!important;font-size:14.5px!important}
.tile[data-tileid="pushups"] .pushBtns button.puPlate.p5{width:47px!important;min-width:47px!important;max-width:47px!important;height:47px!important;min-height:47px!important;font-size:12.5px!important}
.tile[data-tileid="pushups"] .pushBtns button.puPlate.p1{width:38px!important;min-width:38px!important;max-width:38px!important;height:38px!important;min-height:38px!important;font-size:11px!important}
.tile[data-tileid="pushups"] .pushBtns button.puPlate:hover{background:radial-gradient(circle,color-mix(in srgb,var(--accent) 12%,#fff) 0 33%,color-mix(in srgb,var(--accent) 30%,rgba(255,255,255,.6)) 34% 100%)!important;border-color:var(--accent)!important;transform:translateY(-2px) rotate(-8deg)}
.tile.completed[data-tileid="pushups"] .pushBtns button.puPlate{border-color:rgba(255,255,255,.8)!important;background:radial-gradient(circle,rgba(255,255,255,.3) 0 33%,rgba(255,255,255,.14) 34% 100%)!important;box-shadow:inset 0 0 0 5px rgba(255,255,255,.28),0 4px 10px rgba(0,0,0,.14)!important;color:#fff!important}
.tile[data-tileid="pushups"] .pushBtns button.puReset,.tile.completed[data-tileid="pushups"] .pushBtns button.puReset{flex:none!important;width:30px!important;min-width:30px!important;height:30px!important;min-height:30px!important;padding:0!important;border:none!important;border-radius:9px!important;background:transparent!important;box-shadow:none!important;color:var(--dim)!important;font-size:15px!important}
.tile[data-tileid="pushups"] .pushBtns button.puReset:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)!important;border:none!important;transform:none}
.tile.completed[data-tileid="pushups"] .pushBtns button.puReset{color:rgba(255,255,255,.72)!important}

/* --- People as "HELLO" name badges, grouped by place. --- */
.pplBadges{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}
.pplBadge{position:relative;min-width:96px;max-width:100%;display:flex;flex-direction:column;border-radius:11px;overflow:hidden;background:rgba(255,255,255,.85);border:1px solid color-mix(in srgb,var(--accent) 26%,#fff);box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 12%,transparent)}
.pplBadgeBand{display:block;padding:3px 9px 2px;background:var(--accent);color:#fff;font-size:8px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.pplBadgeName{padding:5px 22px 1px 9px;font-size:13.5px;font-weight:850;color:#2a2e40;line-height:1.15}
.pplBadgeNote{padding:0 22px 6px 9px;font-size:11px;color:#777e90;line-height:1.3}
.pplBadge .pplBadgeName:last-child{padding-bottom:6px}
.pplBadgeDel{position:absolute;top:1px;right:2px;color:rgba(255,255,255,.85)}
.tile.completed .pplBadge{background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.7)}
.tile.completed .pplBadgeBand{background:var(--accent)}

/* --- Birthdays: the next one as a tear-off calendar leaf. --- */
.birthdayNextWrap{display:flex;align-items:center;justify-content:center;gap:11px;text-align:left}
.grid>.tile[data-tileid="birthdays"]>.tbody{display:flex!important;flex-direction:column}
.grid>.tile[data-tileid="birthdays"] .tileMount{flex:1 1 auto!important;display:flex;align-items:center;justify-content:center}
.grid>.tile[data-tileid="birthdays"] .tileMount>.content{width:100%}
.grid>.tile[data-tileid="birthdays"] .birthdaysSummary{width:100%;display:flex;justify-content:center}
.grid>.tile[data-tileid="birthdays"] .birthdayTodaySummary{justify-content:center}
.bdayLeaf{flex:none;width:46px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:#fff;border:1px solid color-mix(in srgb,var(--accent) 30%,#fff);box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 16%,transparent)}
.bdayLeafMonth{display:block;padding:2.5px 0 2px;background:var(--accent);color:#fff;font-size:8px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.bdayLeafDay{display:block;padding:3px 0 4px;font-size:19px;font-weight:900;color:#2a2e40;text-align:center;line-height:1}
.tile.completed .bdayLeafMonth{background:var(--accent)}
.birthdayTodayEmoji{display:inline-block;transform-origin:50% 85%;animation:cakeFlicker 2.6s ease-in-out infinite}
@keyframes cakeFlicker{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) translateY(-1px)}}
@media(prefers-reduced-motion:reduce){.birthdayTodayEmoji{animation:none}}
/* --- Breathe: the dial fills the whole square, no words --- */
.srOnly{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
.tile[data-tileid="breathing"] .content{display:flex;align-items:center;justify-content:center;padding:0!important;min-height:0!important}
.breathFull{width:100%;display:grid;place-items:center}
.breathDial{position:relative;width:100%;max-width:calc(var(--tile-base-rows,2) * var(--dashboard-unit,140px) + (var(--tile-base-rows,2) - 1) * var(--dashboard-gap,14px) - 2 * var(--dashboard-pad,18px) - 12px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
/* session ring: a 5px band that fills clockwise over the three minutes */
.breathDial::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--accent) var(--breath-progress,0deg),color-mix(in srgb,var(--accent) 30%,rgba(255,255,255,.5)) 0);
  -webkit-mask:radial-gradient(circle closest-side,transparent calc(100% - 7px),#000 calc(100% - 6.5px));mask:radial-gradient(circle closest-side,transparent calc(100% - 7px),#000 calc(100% - 6.5px))}
.breathDial::before{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 10%,rgba(255,255,255,.22)),transparent 70%)}
.tile button.breathCore,.tile.completed button.breathCore{position:relative;z-index:1;width:82%;height:auto;aspect-ratio:1;min-height:0!important;padding:0!important;border:none!important;border-radius:50%!important;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 40%,white),var(--accent) 58%,var(--accentDark))!important;
  box-shadow:0 18px 40px -12px color-mix(in srgb,var(--accent) 60%,transparent),inset 0 2px 0 rgba(255,255,255,.55)!important;
  transform:scale(var(--breath-scale,.8));transition:transform .1s linear}
.tile button.breathCore:hover{transform:scale(calc(var(--breath-scale,.8) * 1.03))!important;border:none!important;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 40%,white),var(--accent) 58%,var(--accentDark))!important}
.breathDial.isIdle .breathCore{animation:breathIdle 4.5s ease-in-out infinite}
.breathPlay{width:30%;height:30%;margin-left:5%;color:rgba(255,255,255,.85);filter:drop-shadow(0 2px 5px rgba(0,0,0,.14))}
.breathDial.isDone .breathPlay{opacity:.55}
.tile button.breathCore{display:grid;place-items:center}
@keyframes breathIdle{0%,100%{transform:scale(.74)}50%{transform:scale(.84)}}
.tile.completed button.breathCore{background:radial-gradient(circle at 34% 28%,#fff,rgba(255,255,255,.82) 60%,rgba(255,255,255,.6))!important}
.tile.completed .breathDial::after{background:conic-gradient(#fff var(--breath-progress,0deg),rgba(255,255,255,.28) 0)}
button.breathCore:focus-visible{outline:2px solid var(--accentDark);outline-offset:6px}
@media(prefers-reduced-motion:reduce){.breathDial.isIdle .breathCore{animation:none}.breathRipples i{animation:none;display:none}}
/* each exhale releases soft rings that drift outward and dissolve */
.breathRipples{position:absolute;inset:0;z-index:2;border-radius:50%;pointer-events:none}
.breathRipples i{position:absolute;inset:11%;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 55%,#fff);opacity:0;animation:breathRipple 3.4s ease-out forwards}
.breathRipples i:nth-child(2){animation-delay:.85s}
.breathRipples i:nth-child(3){animation-delay:1.7s}
@keyframes breathRipple{0%{transform:scale(.6);opacity:.5}70%{opacity:.16}100%{transform:scale(1.05);opacity:0}}
.tile.completed .breathRipples i{border-color:rgba(255,255,255,.75)}
/* --- Habits: big emoji circles; editing lives in the expanded view --- */
.grid>.tile[data-tileid="habits"]>.tbody,.grid>.tile[data-tileid="breathing"]>.tbody{display:flex!important;flex-direction:column}
/* centre via the mount; .content keeps its natural height because the tile measures it */
.grid>.tile[data-tileid="habits"] .tileMount{flex:1 1 auto!important;display:flex!important;align-items:center!important;justify-content:center!important;padding-top:0!important}
.grid>.tile[data-tileid="habits"] .tileMount>.content{flex:0 0 auto!important;width:100%;height:auto!important;display:flex!important;justify-content:center!important;padding:0!important}
.tile[data-tileid] .habitBoard.hgrid{display:flex!important;flex-wrap:wrap;align-items:flex-start!important;justify-content:center!important;align-content:center!important;gap:clamp(10px,1.2vw,16px)!important;width:100%;grid-template-columns:none!important}
.tile[data-tileid] .habitBoard .habitControl{position:relative;flex:none!important;display:flex;flex-direction:column;align-items:center;gap:6px;width:auto!important}
.tile[data-tileid="habits"] .habitBoard .hsq,.tileFocusSurface .habitBoard .hsq{width:clamp(54px,calc(var(--dashboard-unit,90px) * .82),96px)!important;height:auto!important;aspect-ratio:1!important;min-height:0!important;border-radius:50%!important;padding:0!important}
.tile[data-tileid="habits"] .habitBoard .hsq.emojiOnly .hicon,.tileFocusSurface .habitBoard .hsq.emojiOnly .hicon{font-size:clamp(25px,calc(var(--dashboard-unit,90px) * .35),44px)!important;line-height:1}
.habitBoard .hdel{position:static!important;opacity:1!important}
.habitEditRow{display:flex;align-items:center;gap:4px;max-width:120px}
.habitEditRow[hidden]{display:none!important}
.habitEditName{font-size:12px;font-weight:750;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habitAddSlot[hidden]{display:none!important}
.habitAddSlot .hsq.plus{width:clamp(54px,calc(var(--dashboard-unit,90px) * .82),96px)!important;height:auto!important;aspect-ratio:1;border-radius:50%!important;border-style:dashed!important}
/* --- Push-ups: a leaning pile of weight plates sized by value --- */
.grid>.tile[data-tileid="pushups"]>.tbody{display:flex!important;flex-direction:column}
.grid>.tile[data-tileid="pushups"] .tileMount{flex:1 1 auto!important;display:flex!important;align-items:center!important;justify-content:center!important;padding-top:0!important}
.grid>.tile[data-tileid="pushups"] .tileMount>.content{flex:0 0 auto!important;width:100%;height:auto!important;display:block!important;padding:0!important;container-type:inline-size}
/* square rack capped to the tile's own base height so the tile never grows */
.tile .pushRack{position:relative;width:100%;aspect-ratio:1;max-width:calc(var(--tile-base-rows,2) * var(--dashboard-unit,140px) + (var(--tile-base-rows,2) - 1) * var(--dashboard-gap,14px) - 2 * var(--dashboard-pad,18px) - 12px)!important;margin:0 auto}
.pushTally{position:absolute;left:2%;top:0;font-weight:900;font-size:clamp(28px,30cqi,54px);line-height:.9;letter-spacing:-.05em;color:var(--accentDark);font-variant-numeric:tabular-nums}
.tile.completed .pushTally{color:#fff}
.tile button.plate,.tile.completed button.plate{position:absolute;display:grid;place-items:center;padding:0!important;min-height:0!important;border-radius:50%!important;
  border:none!important;font-weight:900;letter-spacing:-.03em;color:#fff!important;text-shadow:none!important;cursor:pointer;-webkit-tap-highlight-color:transparent;
  /* face, a darker groove, then the outer rim — read as a cast plate */
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 88%,#fff) 0 56%,color-mix(in srgb,var(--accentDark) 85%,#000) 57% 61%,var(--accent) 62% 100%)!important;
  box-shadow:0 8px 16px -7px color-mix(in srgb,var(--accentDark) 75%,transparent),inset 0 2px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.14)!important;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.tile button.plate.p10{width:56cqi;height:56cqi;right:0;bottom:0;transform:rotate(-9deg);font-size:clamp(15px,13cqi,26px);z-index:1}
.tile button.plate.p5{width:40cqi;height:40cqi;left:5%;bottom:3%;transform:rotate(7deg);font-size:clamp(13px,10cqi,20px);z-index:2}
.tile button.plate.p1{width:27cqi;height:27cqi;left:34%;bottom:44%;transform:rotate(-4deg);font-size:clamp(11px,8cqi,16px);z-index:3}
.tile button.plate:hover{filter:brightness(1.06);border:none!important}
.tile button.plate.p10:hover{transform:rotate(-14deg) translateY(-2px)}
.tile button.plate.p5:hover{transform:rotate(12deg) translateY(-2px)}
.tile button.plate.p1:hover{transform:rotate(-9deg) translateY(-2px)}
.tile button.plate:active{filter:brightness(.94)}
.tile.completed button.plate{background:radial-gradient(circle,#fff 0 56%,color-mix(in srgb,var(--accent) 45%,#fff) 57% 61%,rgba(255,255,255,.9) 62% 100%)!important;color:var(--accentDark)!important;box-shadow:0 8px 16px -7px rgba(0,0,0,.3),inset 0 -2px 0 rgba(0,0,0,.06)!important}
.tile button.pushReset,.tile.completed button.pushReset{position:absolute;right:0;top:0;width:26px;height:26px;min-height:0!important;padding:0!important;border:none!important;border-radius:8px!important;background:transparent!important;box-shadow:none!important;color:var(--dim)!important;font-size:14px;opacity:.7;z-index:4}
.tile button.pushReset:hover{opacity:1;background:color-mix(in srgb,var(--accent) 12%,transparent)!important;border:none!important;transform:none}
.tile.completed button.pushReset{color:rgba(255,255,255,.8)!important}
button.plate:focus-visible{outline:2px solid var(--accentDark);outline-offset:3px}
/* --- World: a small newspaper page --- */
.newsPage{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;color:var(--ink)}
.newsMast{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 6px;margin-bottom:9px;border-top:3px double currentColor;border-bottom:1px solid currentColor;border-bottom-color:color-mix(in srgb,currentColor 55%,transparent);border-top-color:color-mix(in srgb,currentColor 75%,transparent)}
.newsMastTitle{font-family:'Old English Text MT','UnifrakturMaguntia',Georgia,serif;font-size:clamp(20px,6cqi,30px);font-weight:700;letter-spacing:.02em;line-height:1}
.newsDateline{font-family:'Nunito',sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.newsHeadline{margin:0 0 4px;font-weight:700;font-size:clamp(16px,4.4cqi,21px);line-height:1.15;letter-spacing:-.01em}
.newsHeadline.small{font-size:14px;line-height:1.2}
.newsBody{margin:0;font-size:12.8px;line-height:1.5;font-weight:400;color:var(--ink);opacity:.85;text-align:left;hyphens:auto}
.newsLead .newsBody{text-align:justify}
.newsHeadline{font-weight:700!important}
.newsLead{padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid color-mix(in srgb,currentColor 30%,transparent)}
.newsColumns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.newsItem{padding:0 11px 6px;border-left:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.newsColumns .newsItem:nth-child(odd){padding-left:0;border-left:none}
.newsColumns .newsItem:nth-child(n+3){padding-top:9px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.tileFocusSurface .newsColumns{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));row-gap:9px}
.tile[data-tileid="world"] .content{container-type:inline-size}
/* --- Goals: minimal add field, round checks, no counters --- */
.goalInputMinimal{position:relative;display:flex;align-items:center;margin-top:4px}
.tile input.goalInputField,.tile.completed input.goalInputField{flex:1;min-width:0;height:30px;padding:2px 26px 2px 2px!important;border:none!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;font-size:13.5px!important;transform:none!important}
.tile input.goalInputField::placeholder{color:color-mix(in srgb,var(--ink) 42%,transparent)}
.tile button.goalInputAdd{position:absolute;right:0;width:24px;height:24px;min-height:0!important;padding:0!important;border:none!important;border-radius:50%!important;background:var(--accent)!important;color:#fff!important;font-size:13px;box-shadow:none!important}
.tile .goalTick,.tile button.goalTick{border-radius:50%!important}
/* --- Timer: a small square that is the dial --- */
.grid>.tile[data-tileid="timer"]>.tbody{display:flex!important;flex-direction:column}
.grid>.tile[data-tileid="timer"] .tileMount{flex:1 1 auto!important;display:flex!important;align-items:center!important;justify-content:center!important;padding-top:0!important}
.grid>.tile[data-tileid="timer"] .tileMount>.content{flex:0 0 auto!important;width:100%;height:auto!important;display:block!important;padding:0!important;container-type:inline-size}
.tile .timerSquare{position:relative;width:100%;aspect-ratio:1;max-width:calc(var(--tile-base-rows,2) * var(--dashboard-unit,140px) + (var(--tile-base-rows,2) - 1) * var(--dashboard-gap,14px) - 2 * var(--dashboard-pad,18px) - 12px)!important;margin:0 auto;display:grid;place-items:center}
.tile button.timerFace,.tile.completed button.timerFace{position:relative;width:84%;height:auto;aspect-ratio:1;min-height:0!important;padding:0!important;border:none!important;border-radius:50%!important;background:transparent!important;box-shadow:none!important;display:grid;place-items:center;cursor:pointer;color:var(--accentDark)!important}
.tile button.timerFace:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)!important;border:none!important;transform:none}
.timerFace .timerRingSvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timerFace .timerRingBg{fill:none;stroke:color-mix(in srgb,var(--accent) 18%,transparent);stroke-width:6}
.timerFace .timerRingFg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.timerFaceTime{position:relative;font-weight:900;font-size:clamp(16px,17cqi,30px);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timerFaceState{position:absolute;bottom:24%;font-size:9px;letter-spacing:-1px;opacity:.6}
.timerSquare.isIdle .timerFace .timerRingFg{opacity:.35}
.timerSquare.isFired .timerFaceTime{animation:timerPulse 1s ease-in-out infinite}
@keyframes timerPulse{50%{opacity:.45}}
.timerNudge{position:absolute;left:0;right:0;bottom:-2px;display:flex;justify-content:space-between;pointer-events:none}
.tile .timerNudge button,.tile.completed .timerNudge button{pointer-events:auto;width:26px;height:26px;min-height:0!important;padding:0!important;border:none!important;border-radius:50%!important;background:color-mix(in srgb,var(--accent) 12%,rgba(255,255,255,.5))!important;box-shadow:none!important;color:var(--accentDark)!important;font-size:15px;font-weight:800;line-height:1}
.tile .timerNudge button:hover{background:color-mix(in srgb,var(--accent) 22%,rgba(255,255,255,.5))!important;border:none!important;transform:none}
.tile button.timerResetGlyph,.tile.completed button.timerResetGlyph{position:absolute;right:0;top:0;width:26px;height:26px;min-height:0!important;padding:0!important;border:none!important;border-radius:8px!important;background:transparent!important;box-shadow:none!important;color:var(--dim)!important;font-size:14px}
.tile.completed button.timerFace{color:#fff!important}
.tile.completed .timerFace .timerRingFg{stroke:#fff}
.tile.completed .timerFace .timerRingBg{stroke:rgba(255,255,255,.3)}
.tile.completed .timerNudge button{background:rgba(255,255,255,.2)!important;color:#fff!important}
.tile.completed button.timerResetGlyph{color:rgba(255,255,255,.85)!important}
/* --- Reminders: compact rows, visible due state, uniform form controls --- */
.grid>.tile[data-tileid="agenda"] .tileMount>.content{padding-bottom:0!important}
.grid>.tile[data-tileid="agenda"] .agendaItems{position:relative;gap:0!important;padding-top:30px}
/* preview shows whole rows only; the rest lives in the pop-up (like the newspaper) */
.grid>.tile[data-tileid="agenda"] .agendaItems .taskRow:nth-of-type(n+4){display:none}
.grid>.tile[data-tileid="goals"] .goalDay .goalRow:nth-of-type(n+5){display:none}
.grid>.tile[data-tileid="agenda"] .agRow{padding:3px 2px!important;min-height:0!important;gap:8px!important}
.grid>.tile[data-tileid="agenda"] button.taskMain{min-height:30px!important}
/* the add control sits level with the calendar header instead of taking its own line */
.grid>.tile[data-tileid="agenda"] .agendaItems>button.taskAddLink{position:absolute;top:0;right:0;width:30px!important;height:30px!important;min-height:0!important;margin:0!important}
.grid>.tile[data-tileid="agenda"] .agendaItems:has(.agendaForm){padding-top:0}
.tile[data-tileid="agenda"] .agName{display:block;white-space:normal;overflow-wrap:break-word;font-size:13.5px!important;line-height:1.25!important}
.tile[data-tileid="agenda"] .agSub{font-size:11px!important;line-height:1.2!important;margin-top:1px}
.tile[data-tileid="agenda"] .taskMain{min-width:0;flex:1}
.tile[data-tileid="agenda"] .agWhen{flex:none;font-size:10.5px!important;font-weight:800;white-space:nowrap}
.tile[data-tileid="agenda"] .taskRow.dueNow .agWhen{padding:0;border-radius:0;background:transparent!important;color:var(--accentDark)!important;font-weight:900}
.tile[data-tileid="agenda"] .taskRow.dueNow .agWhen::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--accent);vertical-align:1px}
.tile.completed[data-tileid="agenda"] .taskRow.dueNow .agWhen{background:transparent!important;color:#fff!important}
.tile.completed[data-tileid="agenda"] .taskRow.dueNow .agWhen::before{background:#fff}
.tile[data-tileid="agenda"] .miniCalendar button.miniCalDay{min-height:26px!important;height:26px!important;padding:0!important;font-size:11.5px!important}
.tile[data-tileid="agenda"] .miniCalendar .miniCalWeekday,.tile[data-tileid="agenda"] .miniCalendar [class*="Weekday"]{font-size:9.5px!important}
.agendaForm{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.agendaFormRow{display:flex;align-items:center;gap:8px}
.tile .agendaForm .agendaField,.tile .agendaForm input.agendaField{height:38px!important;min-height:38px!important;max-height:38px!important;box-sizing:border-box;flex:1;min-width:0;padding:0 11px!important;border-radius:11px!important;font-size:13px!important}
.agendaEvery{font-size:12.5px;font-weight:750;color:var(--dim);flex:none}
.tile button.agendaBtn,.tile.completed button.agendaBtn{flex:1;height:38px;min-height:38px!important;padding:0!important;border-radius:11px!important;border:none!important;background:var(--accent)!important;color:#fff!important;font-weight:800;font-size:13px;box-shadow:none!important}
.tile button.agendaBtn.ghost{background:transparent!important;color:var(--accentDark)!important;border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent)!important}
/* --- Brainflex: a decorative cog half-buried in the lower corner, slowly turning --- */
/* anchored to the tile itself, so the cog is cropped by the tile's lower-right edge */
.brainFlexCard>*{position:relative;z-index:1}
/* previews clamp long copy to whole lines; the pop-up (or the chat for Philosophy) has the rest */
.grid>.tile[data-tileid="brainflex"] .brainPrompt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:7;overflow:hidden;max-height:16em}
.grid>.tile[data-tileid="brainflex"] .brainSolution{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:9;overflow:hidden;margin-top:8px;text-align:left;font-weight:650!important}
.grid>.tile[data-tileid="worth"] .lessonTitle{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:2.5em;font-size:17px}
.grid>.tile[data-tileid="philo"] .philoQ{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-height:5.2em}
.brainFlexCard .brainGearArt{position:absolute;z-index:0;bottom:-38px;right:-34px;width:116px;height:116px;color:var(--accentDark);opacity:.32;pointer-events:none;animation:gearTurn 80s linear infinite}
@keyframes gearTurn{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.brainFlexCard .brainGearArt{animation:none}}
.tile.completed .brainFlexCard .brainGearArt{color:#fff;opacity:.4}
/* --- Daily content meter: one dot per daily tile, filled once its content is in --- */
.dailyMeter{display:inline-flex;align-items:center;gap:10px;margin:-10px 0 20px;padding:6px 12px 6px 10px;border-radius:99px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 14px -8px rgba(30,40,60,.25);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);cursor:default}
.dailyMeterDots{display:inline-flex;gap:5px}
.dailyMeterDot{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid rgba(40,52,64,.35);transition:background .3s,border-color .3s}
.dailyMeterDot.on{background:#2c3a45;border-color:#2c3a45}
.dailyMeterText{font-size:12px;font-weight:800;letter-spacing:.01em;color:#33424d}
.dailyMeter.isComplete .dailyMeterDot.on{background:#1f9d6a;border-color:#1f9d6a}
.dailyMeter.isComplete .dailyMeterText{color:#1f7a55}
/* --- Weather: illustrated, filling the tile --- */
.grid>.tile[data-tileid="weather"]>.tbody{display:flex!important;flex-direction:column}
.grid>.tile[data-tileid="weather"] .tileMount{flex:1 1 auto!important;display:flex!important;padding-top:0!important}
.grid>.tile[data-tileid="weather"] .tileMount>.content{flex:0 0 auto!important;width:100%;height:auto!important;display:block!important;padding:0!important;container-type:inline-size}
.wxCard{position:relative;width:100%;height:calc(var(--tile-base-rows,2) * var(--dashboard-unit,140px) + (var(--tile-base-rows,2) - 1) * var(--dashboard-gap,14px) - 2 * var(--dashboard-pad,18px) - 12px);min-height:120px;overflow:visible;color:var(--ink)}
.wxHero{position:absolute;right:-5%;top:50%;transform:translateY(-52%);height:128%;width:auto;max-width:58%;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(30,50,80,.12))}
.tile .wxNow{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left!important;height:100%;max-width:62%;padding-bottom:30px;box-sizing:border-box}
.wxTemp{font-weight:900;font-size:clamp(40px,14cqi,72px);line-height:.9;letter-spacing:-.05em;color:var(--accentDark)}
.wxLabel{margin-top:6px;font-size:clamp(14px,3.6cqi,17px);font-weight:800}
.wxMeta{margin-top:2px;font-size:12.5px;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxTomorrow{position:absolute;left:0;bottom:0;z-index:1;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 9px;border-radius:99px;background:rgba(255,255,255,.38);font-size:12px;font-weight:800}
.wxTomorrowLbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.wxMini{width:24px;height:24px}
.wxTomorrowTemps i{font-style:normal;opacity:.6;font-weight:700}
.tile.completed .wxTemp{color:#fff}
.tile.completed .wxTomorrow{background:rgba(255,255,255,.22)}
@container (max-width:300px){.tile .wxNow{justify-content:flex-start;padding-top:2px}.wxTemp{font-size:42px}.wxMeta{display:none}.wxHero{max-width:62%;height:96%}}
.wxRays{animation:wxSpin 40s linear infinite}
@keyframes wxSpin{to{transform:rotate(360deg)}}
.wxRain path{animation:wxDrop 1.4s ease-in infinite}
@keyframes wxDrop{0%{opacity:0;transform:translateY(-4px)}30%{opacity:1}100%{opacity:0;transform:translateY(8px)}}
.wxSnow circle{animation:wxFlake 2.6s ease-in-out infinite}
@keyframes wxFlake{0%{opacity:0;transform:translateY(-4px)}40%{opacity:1}100%{opacity:0;transform:translate(3px,8px)}}
@media(prefers-reduced-motion:reduce){.wxRays,.wxRain path,.wxSnow circle{animation:none}}
/* the forecast pop-up */
.tileFocusSurface[data-tileid="weather"] .content{height:auto!important;overflow:visible!important;text-align:left}
.wxFull{display:flex;flex-direction:column;gap:12px;color:var(--ink);text-align:left;container-type:inline-size}
.wxFullHead{display:flex;align-items:center;gap:14px;padding-right:44px}
.wxFull .wxFullArt{flex:none;width:96px;height:96px;filter:drop-shadow(0 8px 14px rgba(30,50,80,.12))}
.wxFullNow{min-width:0}
.wxFullPlace{font-size:15px;font-weight:800}
.wxFullTemp{font-weight:900;font-size:60px;line-height:.95;letter-spacing:-.05em;color:var(--accentDark)}
.wxFullLabel{margin-top:4px;font-size:15px;font-weight:800}
.wxFullLabel span{margin-left:10px;font-weight:700;color:var(--dim)}
.wxPanel{border-radius:18px;background:rgba(255,255,255,.55);padding:12px 12px}
.wxHours{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.wxHours::-webkit-scrollbar{display:none}
.wxHour{flex:1 0 54px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px}
.wxHourT{font-size:12px;font-weight:800;color:var(--dim);white-space:nowrap}
.wxHour:first-child .wxHourT{color:var(--ink)}
.wxFull .wxHourArt{width:42px;height:42px;margin:-3px 0 0}
.wxFull .wxSunEvent{width:30px;height:30px;margin:3px 0}
.wxSunEvent{color:var(--accentDark)}
.wxPop{height:12px;font-size:10.5px;line-height:12px;font-weight:800;color:#2F80D1}
.wxHourV{font-size:15px;font-weight:800}
.wxHour.sun .wxHourV{font-size:11px;line-height:20px;color:var(--dim)}
.wxStats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@container (max-width:560px){.wxStats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wxStat{display:flex;flex-direction:column;gap:2px;min-width:0;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.55)}
.wxStatK{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.wxStatV{font-size:20px;font-weight:900;letter-spacing:-.02em;color:var(--accentDark)}
.wxStatS{font-size:11.5px;font-weight:700;color:var(--dim)}
.wxWeek{display:flex;flex-direction:column;gap:2px;padding:6px 14px}
.wxDay{display:grid;grid-template-columns:52px 44px 34px minmax(0,1fr) 34px;align-items:center;gap:8px;min-height:40px}
.wxDay+.wxDay{border-top:1px solid color-mix(in srgb,var(--accent) 16%,transparent)}
.wxDayName{font-size:14px;font-weight:800}
.wxDayIcon{display:flex;flex-direction:column;align-items:center;line-height:1}
.wxFull .wxDayArt{width:36px;height:36px;margin:-4px 0 0}
.wxDayIcon i{font-style:normal;font-size:10px;font-weight:800;color:#2F80D1}
.wxDayLo{font-size:14px;font-weight:800;color:var(--dim);text-align:right}
.wxDayHi{font-size:14px;font-weight:800;text-align:right}
.wxBar{position:relative;height:6px;border-radius:99px;background:color-mix(in srgb,var(--accent) 16%,rgba(20,40,70,.08))}
.wxBarFill{position:absolute;top:0;bottom:0;border-radius:99px}
.wxBarNow{position:absolute;top:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(20,40,70,.32);transform:translateY(-50%)}
.wxFullNote{margin:0;font-size:12.5px;font-weight:700;color:var(--dim)}
.tile.completed .wxFull,.tile.completed .wxFullTemp,.tile.completed .wxStatV,.tile.completed .wxSunEvent{color:#fff}
.tile.completed .wxPanel,.tile.completed .wxStat{background:rgba(255,255,255,.18)}
.tile.completed .wxFullLabel span,.tile.completed .wxHourT,.tile.completed .wxStatK,.tile.completed .wxStatS,.tile.completed .wxDayLo,.tile.completed .wxHour.sun .wxHourV,.tile.completed .wxFullNote{color:rgba(255,255,255,.78)}
.tile.completed .wxPop,.tile.completed .wxDayIcon i{color:#fff}
.tile.completed .wxDay+.wxDay{border-top-color:rgba(255,255,255,.22)}
.tile.completed .wxBar{background:rgba(255,255,255,.25)}
/* --- Language tiles: the day's lesson sits in one speech bubble; the flag is the round
   avatar at the bubble's tail (Spain on the left, Germany on the right) --- */
.langHead{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px;padding-right:34px}
.langTitle{font-size:17px!important;font-weight:800!important;line-height:1.2!important;flex:1;min-width:0}
.langLede{position:relative;margin:0 0 13px;font-size:13.5px;line-height:1.5;font-weight:650;color:#2a2e40}
.tile.completed .langLede{color:#fff}
/* --- Knowledge: a watering can spilling the day's field --- */
.lessonHead{margin-bottom:6px}
.lessonHead .lessonField{padding-right:40px}
.lessonTitle{font-size:18px;font-weight:850;line-height:1.2;letter-spacing:-.01em}
.lessonField{display:block;margin:0 0 3px;color:var(--dim);font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
.tile.completed .lessonField{color:rgba(255,255,255,.8)}
/* ================= Insights ================= */
.insights{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:stretch;padding-bottom:40px;width:100%;max-width:var(--dashboard-max,100rem);margin-inline:auto}
.insights>*{min-width:0}
.insRecords,.insMain,.insSide,.insStreaks{display:contents}
.insRecord{grid-column:span 3}
.insCalendar{grid-column:span 4}
.insIce{grid-column:span 4}
.insMini{grid-column:span 4}
.insSustain{grid-column:span 4}
.insHistory{grid-column:span 8}
.insPush{grid-column:span 4;align-self:start}
.insStreak{grid-column:span 2}
@media(max-width:1100px){.insRecord{grid-column:span 3}.insCalendar{grid-column:span 6}.insIce{grid-column:span 3}.insMini{grid-column:span 3}.insSustain{grid-column:span 3}.insHistory{grid-column:span 12}.insPush{grid-column:span 6}.insStreak{grid-column:span 3}}
.insCard{position:relative;border-radius:18px;padding:12px 14px;color:#1f2a33;background:linear-gradient(140deg,rgba(255,255,255,.58),rgba(255,255,255,.38));border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 14px 34px -22px rgba(30,40,60,.35);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%)}
.insCardHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.insCardHead h2{margin:0;font-size:13px;font-weight:850;letter-spacing:-.01em}
.insNav{display:flex;align-items:center;gap:6px}
.insNav>button{width:24px;height:24px;border:none;border-radius:50%;background:rgba(255,255,255,.6);color:var(--c,#1f2a33);font-size:15px;font-weight:800;cursor:pointer;line-height:1}
.insNav>button:disabled{opacity:.3;cursor:default}
.insSeg{display:flex;gap:2px;padding:3px;border-radius:99px;background:rgba(255,255,255,.5)}
.insSeg button{height:21px;padding:0 9px;border:none;border-radius:99px;background:transparent;font:800 10px/1 'Nunito',sans-serif;color:#556270;cursor:pointer}
.insSeg button.on{background:#fff;color:#1f2a33;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.insMuted{font-size:11px;font-weight:700;color:#6a7682;margin:0}
.insSmall{font-size:10.5px;line-height:1.4;color:#6a7682;margin:6px 0 0}
.insIcon{width:16px;height:16px}
/* records */
.insRecord{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;padding:10px 12px}
.insRecord b{grid-row:1;font-size:clamp(18px,2vw,24px);font-weight:900;letter-spacing:-.04em;line-height:1}
.insRecord .insIcon{grid-column:2;grid-row:1;width:18px;height:18px}
.insRecord span{grid-column:1/-1;margin-top:3px;font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#6a7682}
/* calendar + side */
.insCalendar{background:linear-gradient(150deg,rgba(255,255,255,.9),color-mix(in srgb,var(--c) 8%,rgba(255,255,255,.8)))}
.insCalendar .insCardHead h2{color:color-mix(in srgb,var(--c) 72%,#1f1235)}
.insCalIceCount{display:inline-flex;align-items:center;gap:4px;margin-right:4px;padding:3px 9px 3px 5px;border-radius:999px;background:#E6F6FF;color:#0E6E9A;font:850 12px/1 'Nunito',sans-serif}
.insCalIceCount .insDayGlyph{width:16px;height:16px}
.insCalGrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.insCalWd{text-align:center;font-size:9.5px;font-weight:850;letter-spacing:.08em;color:color-mix(in srgb,var(--c) 60%,#3a3550);padding-bottom:4px}
.insCalDay{position:relative;display:grid;place-items:center;height:38px;margin:0;padding:0;border:0;background:none;font:inherit;color:inherit}
button.insCalDay{cursor:pointer;-webkit-tap-highlight-color:transparent}
.insCalDay>*{position:relative;z-index:1}
.insCalRing{position:absolute;width:34px;height:34px;transform:rotate(-90deg)}
.insCalTrack{fill:none;stroke:color-mix(in srgb,var(--c) 22%,#fff);stroke-width:3.4}
.insCalArc{fill:none;stroke:var(--c);stroke-width:3.4;stroke-linecap:round}
.insCalNum{font-size:12px;font-weight:850;color:#2a2440;line-height:1}
.insCalDay.quiet .insCalNum{color:color-mix(in srgb,var(--c) 30%,#8a84a0);font-weight:750}
.insCalDay.out{opacity:.38}
.insDayGlyph{width:24px;height:24px;display:block}
.insCalDay.iced .insDayGlyph{width:22px;height:22px}
/* one band links the flames and ices of a run, within each week row */
.insCalDay.link::before{content:"";position:absolute;z-index:0;top:50%;left:0;right:0;height:32px;transform:translateY(-50%);background:color-mix(in srgb,var(--c) 16%,#fff)}
.insCalDay.linkStart::before{left:3px;border-top-left-radius:99px;border-bottom-left-radius:99px}
.insCalDay.linkEnd::before{right:3px;border-top-right-radius:99px;border-bottom-right-radius:99px}
/* today: a filled disk in the theme colour (its ring still shows the day's progress) */
.insCalDay.today .insCalNum{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--c);color:#fff}
.insCalDay.today.flame::after,.insCalDay.today.iced::after{content:"";position:absolute;z-index:1;bottom:1px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--c)}
/* a missed day can take an ice: its ring turns to a dashed ice-blue edge on hover/focus */
button.insCalDay.canIce:hover .insCalTrack,button.insCalDay.canIce:focus-visible .insCalTrack{stroke:#7DD3FC;stroke-dasharray:3 3}
button.insCalDay:focus-visible{outline:2px solid var(--c);outline-offset:-2px;border-radius:12px}
.insCalNote{min-height:16px;margin:8px 2px 0;font-size:11.5px;font-weight:700;color:color-mix(in srgb,var(--c) 55%,#4a4560)}
/* ice */
.insIce{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 22%,rgba(255,255,255,.55)),rgba(255,255,255,.4))}
.insIceBig{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.insIceBig b{font-size:28px;font-weight:900;letter-spacing:-.04em;color:color-mix(in srgb,var(--c) 70%,#0b2a3a)}
.insIceCube{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,#e9f8ff,#9fdcff 55%,#62c2f5);box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset -4px -6px 10px rgba(30,120,180,.25),0 8px 18px -8px rgba(30,140,200,.6);transform:rotate(-8deg)}
/* history table */
.insTable{display:grid;grid-template-columns:minmax(88px,128px) repeat(var(--cols),minmax(0,1fr));align-items:center;row-gap:4px}
.insTable.dense{row-gap:6px}
.insColHead{text-align:center;font-size:9.5px;font-weight:850;color:#6a7682}
.insColHead.today{color:#1f2a33;text-decoration:underline;text-underline-offset:3px}
.insGroup{grid-column:1/-1;margin-top:4px;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#8a95a0}
.insRowLabel{display:flex;align-items:center;gap:5px;min-width:0;font-size:11px;font-weight:750}
.insRowIcon{font-size:12px}
.insRowName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insCell{position:relative;display:grid;place-items:center;height:19px}
.insCell::before{content:"";width:15px;height:15px;border-radius:50%;background:rgba(40,52,64,.10);position:relative;z-index:1;grid-area:1/1}
.insCell svg,.insCell i{grid-area:1/1;position:relative;z-index:2;width:10px;height:10px;font-style:normal;font-size:8.5px;color:#fff}
.insCell.done::before{background:var(--c)}
.insCell.frozen::before{background:linear-gradient(145deg,#d6f2ff,#7cc9f2)}
.insCell.pending::before{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.insCell.future::before{background:rgba(40,52,64,.05)}
.insCell.joinL::after,.insCell.joinR::after{content:"";position:absolute;top:50%;height:5px;margin-top:-2.5px;background:var(--c);z-index:0}
.insCell.joinL::after{left:0;right:50%}
.insCell.joinR.joinL::after{left:0;right:0}
.insCell.joinR:not(.joinL)::after{left:50%;right:0}
.insCell.frozen.joinL::after,.insCell.frozen.joinR::after{background:#9fd9f7}
.insTable.dense .insCell{height:14px}
.insTable.dense .insCell::before{width:9px;height:9px}
.insTable.dense .insCell.joinL::after,.insTable.dense .insCell.joinR::after{height:4px;margin-top:-2px}
/* per-section streaks, each in its tile colour */
.insStreak{padding:10px 12px;background:linear-gradient(140deg,rgba(var(--glass-rgb),.30),rgba(var(--glass-rgb),.18));color:var(--ink)}
.insStreakTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.insStreakName{font-size:11.5px;font-weight:850}
.insStreakNow{display:inline-flex;align-items:center;gap:3px;font-size:17px;font-weight:900;letter-spacing:-.03em;color:var(--accentDark)}
.insStreakNow .insIcon{width:13px;height:13px;color:var(--accent)}
.insStreakNow.zero{opacity:.45}
.insWeek{display:flex;gap:4px;margin:8px 0 6px}
.insWeek span{flex:1;height:6px;border-radius:99px;background:rgba(var(--glass-rgb),.22)}
.insWeek span.on{background:var(--accent)}
.insStreakMeta{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;color:var(--dim)}
.insStreakMeta b{color:var(--ink);font-weight:900}
/* push-ups + small numbers */
.insPush{background:linear-gradient(140deg,rgba(var(--glass-rgb),.26),rgba(var(--glass-rgb),.14));color:var(--ink)}
.insPush .pushLine{height:72px}
.insMini{display:flex;flex-direction:column;justify-content:center;gap:7px}
.insMini div{display:flex;align-items:baseline;gap:10px}
.insMini b{font-size:19px;font-weight:900;letter-spacing:-.03em;min-width:32px}
.insMini span{font-size:10.5px;font-weight:750;color:#6a7682}
@media(max-width:760px){.insRecord{grid-column:span 6}.insCalendar{grid-column:span 12}.insIce{grid-column:span 6}.insMini{grid-column:span 6}.insSustain{grid-column:span 6}.insHistory{grid-column:span 12}.insPush{grid-column:span 12}.insStreak{grid-column:span 6}.insStreakMeta span:last-child{display:none}.insTable{grid-template-columns:minmax(84px,110px) repeat(var(--cols),minmax(0,1fr))}.insRowName{font-size:10.5px}.insCard{padding:12px}}

.tile.tileFocusSurface :is(input,textarea,select):focus,.tile.tileFocusSurface :is(input,textarea,select):focus-visible{outline:none!important;box-shadow:none!important}

.brainPlay{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:8px}

.tile button.recallBar,.tile.completed button.recallBar,button.recallBar{position:relative;flex:1 1 0;min-width:3px;width:auto!important;height:12px!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;transform:none!important;filter:none!important;cursor:pointer;-webkit-tap-highlight-color:transparent}
.recallBar::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);border-radius:99px;background:var(--barPale);transition:height .15s ease,background .15s ease,box-shadow .15s ease}
.recallBar.done::before{background:var(--bar)}
.recallBar.again::before{background:repeating-linear-gradient(-45deg,var(--bar) 0 2.5px,#fff 2.5px 5px);box-shadow:inset 0 0 0 1.5px var(--bar)}
.recallBar.next::before{background:var(--barPale);box-shadow:inset 0 0 0 1.5px var(--bar)}
.recallBar.here::before{background:var(--bar);animation:recallHere 1.6s ease-in-out infinite}
@keyframes recallHere{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.recallBar.here::before{animation:none}}
.recallDeck .recallRatings{animation:recallRise .2s ease-out}
@keyframes recallRise{from{opacity:0;transform:translateY(6px)}}
.recallBar.again.here::before{background:var(--bar);box-shadow:none}
.recallBar:focus-visible{outline:2px solid var(--bar);outline-offset:1px;border-radius:4px}

/* --- Birthdays: the next one as a wrapped present; a bigger cake on the day --- */
.bdayGift{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;width:100%}
.bdayGiftArt{width:min(112px,62%);height:auto;display:block;filter:drop-shadow(0 8px 12px color-mix(in srgb,var(--accent) 30%,transparent));animation:bdayGiftBob 4.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bdayGiftBob{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg) translateY(-1px)}}
@media(prefers-reduced-motion:reduce){.bdayGiftArt{animation:none}}
.bdayGiftName{max-width:100%;margin-top:7px;font-size:17px;font-weight:900;line-height:1.1;color:var(--ink)}
/* a name is never cut: it wraps between words, and the fitter steps its type down when one word is too wide */
.birthdayTodayText{max-width:100%;min-width:0}
.birthdayTodayName,.bdayGiftName{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;overflow-wrap:normal}

/* tapped done: the lid flips open, confetti pops out */

.bdayLid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.bdayInside{opacity:0;transition:opacity .2s}
.bdayConfetti>*{opacity:0;transform-box:fill-box;transform-origin:center;translate:0 14px;scale:.3;transition:opacity .2s,translate .55s cubic-bezier(.34,1.56,.64,1),scale .55s cubic-bezier(.34,1.56,.64,1)}
.tile.completed .bdayLid{transform:translate(-6px,-12px) rotate(-18deg)}
.tile.completed .bdayInside{opacity:.28}
.tile.completed .bdayConfetti>*{opacity:1;translate:0 0;scale:1}
.tile.completed .bdayConfetti>:nth-child(2n){transition-delay:.06s}.tile.completed .bdayConfetti>:nth-child(3n){transition-delay:.12s}
@media(prefers-reduced-motion:reduce){.bdayLid,.bdayConfetti>*{transition:none}}

/* Reminders calendar keeps each day's completion: a ring on every tracked past day (today's

/* ---- Priorities: a board of pinned post-its on an Eisenhower matrix, in the tile's one colour, a
   dark yellow: the tile's own liquid glass is the board, the post-its are its pale paper, the
   axes, pins and marker writing are its ink. Tap an empty spot to add a note there; drag a note
   anywhere (by its pin too); let it go off the board to take it off. ---- */
.tile[data-tileid="matrix"],.tile.completed[data-tileid="matrix"]{--glass-surface:linear-gradient(140deg,rgba(var(--glass-rgb),.5),rgba(var(--glass-rgb),.38))}
.tileFocusSurface[data-tileid="matrix"]{background:linear-gradient(160deg,rgba(var(--glass-rgb),.38),rgba(var(--glass-rgb),.26))!important}

.grid>.tile[data-tileid="matrix"] .tileMount{flex:1 1 auto!important;display:flex}
