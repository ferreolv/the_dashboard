.tile[data-tileid="matrix"] .content{padding:0!important}
.pinBoard{--nw:clamp(66px,20cqmin,128px);--line:color-mix(in srgb,var(--ink) 40%,transparent);position:relative;flex:1 1 auto;width:100%;min-height:0;container-type:size;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tileFocusSurface[data-tileid="matrix"] .pinBoard{height:min(72vh,680px)}
.pbSize{position:absolute;width:var(--nw);height:0;visibility:hidden;pointer-events:none}
.pbAxis{position:absolute;background:var(--line);border-radius:2px;pointer-events:none}
.pbAxis.v{left:calc(50% - 1px);top:4%;bottom:4%;width:2px}
.pbAxis.h{top:calc(50% - 1px);left:4%;right:4%;height:2px}
.pbAxis::before,.pbAxis::after{content:"";position:absolute;width:9px;height:9px;border:solid var(--line);border-width:2px 0 0 2px;border-radius:1px}
.pbAxis.v::before{top:0;left:50%;transform:translate(-50%,1px) rotate(45deg)}
.pbAxis.v::after{bottom:0;left:50%;transform:translate(-50%,-1px) rotate(225deg)}
.pbAxis.h::before{left:0;top:50%;transform:translate(1px,-50%) rotate(-45deg)}
.pbAxis.h::after{right:0;top:50%;transform:translate(-1px,-50%) rotate(135deg)}
.pbLbl{position:absolute;font:400 clamp(12px,4.2cqmin,20px)/1 'Permanent Marker',cursive;color:color-mix(in srgb,var(--ink) 66%,transparent);pointer-events:none;white-space:nowrap}
.pbLbl.imp{top:4%;right:calc(50% + 12px)}
.pbLbl.urg{right:4%;top:calc(50% + 9px)}
.pbNote{position:absolute;left:calc(var(--x) * (100% - var(--nw)));top:calc(var(--y) * (100% - var(--nw)));width:var(--nw);height:var(--nw);box-sizing:border-box;padding:calc(var(--nw) * .15) calc(var(--nw) * .09) calc(var(--nw) * .08);display:flex;align-items:center;justify-content:center;
  border-radius:2px 2px 7px 3px;transform:rotate(var(--r));transform-origin:50% 10%;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.22) 55%,rgba(255,255,255,.12)),var(--bg);box-shadow:0 1px 1px rgba(0,0,0,.06),0 10px 14px -10px rgba(0,0,0,.42);
  color:var(--ink);cursor:grab;touch-action:none;outline:none;transition:transform .22s cubic-bezier(.2,1.25,.5,1),box-shadow .22s ease}
.pbNote::after{content:"";position:absolute;right:0;bottom:0;width:26%;height:26%;border-radius:0 0 7px 0;background:linear-gradient(135deg,transparent 50%,color-mix(in srgb,var(--accent) 30%,transparent) 50%,rgba(255,255,255,.6));pointer-events:none}
.tile .pbNote:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.pbNote.dragging{z-index:5;cursor:grabbing;transform:rotate(calc(var(--r) - 2deg)) scale(1.07);box-shadow:0 2px 3px rgba(0,0,0,.08),0 22px 26px -14px rgba(0,0,0,.42);transition:transform .14s ease,box-shadow .14s ease}
.pbNote.editing{z-index:6;cursor:text;transform:rotate(0deg) scale(1.1)}
.pbNote.leaving{opacity:.45;transform:rotate(calc(var(--r) + 8deg)) scale(.92)}
.pbNote.falling{z-index:6;pointer-events:none;animation:pbFall .32s cubic-bezier(.5,0,.9,.6) .1s forwards}
.pbNote.falling .pbPinHead{animation:pbPull .18s ease-out forwards}
@keyframes pbPull{to{transform:translate(-25%,-160%) rotate(-30deg) scale(1.15);opacity:0}}
@keyframes pbFall{to{transform:rotate(calc(var(--r) + 20deg)) translateY(70%);opacity:0}}
.pbText{max-height:100%;overflow:hidden;font:400 calc(var(--nw) * .165)/1.12 'Permanent Marker',cursive;text-align:center;overflow-wrap:anywhere;color:var(--ink)}
.tile textarea.pbInput{width:100%;height:100%;min-height:0!important;margin:0;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;outline:none!important;resize:none;font:400 max(11px,calc(var(--nw) * .145))/1.12 'Permanent Marker',cursive!important;text-align:center;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)}
/* the pin: a small flat thumbtack in the tile's ink, a lighter cap inside its rim, a crisp shadow */
.tile .pbPin{position:absolute;top:calc(var(--nw) * -.18);left:50%;width:calc(var(--nw) * .5);height:calc(var(--nw) * .5);min-height:0!important;padding:0!important;border:0!important;border-radius:50%!important;background:none!important;box-shadow:none!important;transform:translateX(-50%)!important;cursor:pointer;touch-action:manipulation;z-index:2}
.pbPinHead{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ink) 74%,#fff) 0 46%,var(--ink) 52%);box-shadow:0 1.5px 2px rgba(0,0,0,.32),0 4px 6px -2px rgba(0,0,0,.24);transition:transform .15s ease}
.tile .pbPin:hover .pbPinHead{transform:translateY(-1px) scale(1.1)}
.tile .pbPin:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tile button.pbPad{position:absolute;left:2%;bottom:2%;z-index:4;width:calc(var(--nw) * .54);height:calc(var(--nw) * .54);min-height:0!important;padding:0!important;border:0!important;border-radius:3px!important;background:none!important;box-shadow:none!important;cursor:grab;touch-action:none;transform:none!important}
.pbPad>span{position:absolute;inset:0;border-radius:3px;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.16)}
.pbPad>span:nth-child(1){transform:translate(4px,4px) rotate(4deg)}
.pbPad>span:nth-child(2){transform:translate(2px,2px) rotate(2deg)}
.pbPad>span:nth-child(3){display:grid;place-items:center;font:400 calc(var(--nw) * .3)/1 'Permanent Marker',cursive;color:var(--ink);transition:transform .15s ease}

.tile button.pbPad:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.pbNote,.pbNote.dragging,.pbPinHead{transition:none}.pbNote.falling{animation:none;opacity:0}.pbNote.falling .pbPinHead{animation:none}}
/* ---- Sustainability: a tray of emission bubbles; throw one out of the tile = avoided today.

<svg class="glassFilterDefs" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;pointer-events:none"><defs><filter id="dashboard-glass-refraction" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise"/><feGaussianBlur in="noise" stdDeviation="0.4" result="softNoise"/><feDisplacementMap in="SourceGraphic" in2="softNoise" scale="12" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useLayoutEffect } = React;

/* colour sets: p=pastel(undone), v=vivid(done), d=dark accent (labels on pastel) */
const COL = {
  goals:    {p:"#FFF2CC", v:"#F0A500", d:"#8A5200"},
  word:     {p:"#E5F7FF", v:"#00A6D6", d:"#006A8A"},
  worth:    {p:"#DDF7F0", v:"#00C2A3", d:"#067563"},
  spanish:  {p:"#FFE4EB", v:"#FF3D77", d:"#B01E4E"},
  german:   {p:"#EBE4FF", v:"#7C4DFF", d:"#4A28B4"},
  movie:    {p:"#FBE0E3", v:"#D62839", d:"#8C1623"},
  sustain:  {p:"#EDF3DE", v:"#86A83C", d:"#4C6418"},
  matrix:   {p:"#FFF6D8", v:"#D8A72E", d:"#5E4306"},
  music:    {p:"#E2EDFF", v:"#2F7BFF", d:"#2450BE"},
  habits:   {p:"#D6F7EA", v:"#0FC087", d:"#0A7B58"},
  pushups:  {p:"#DEE7FF", v:"#2749B8", d:"#16307A"},
  weather:  {p:"#DDF4FF", v:"#00B4DC", d:"#0E6E8C"},
  world:    {p:"#E8F5DF", v:"#64B82E", d:"#3D7A16"},
  recall:   {p:"#ECECEE", v:"#8E8E93", d:"#3F3F45"},
  weekly:   {p:"#ECEEF2", v:"#7B8190", d:"#4B5260"},
  note:     {p:"#FFF5C2", v:"#FFCC00", d:"#8A6A00"},
  birthdays:{p:"#FFE2ED", v:"#FF3F79", d:"#A81C4C"},
  timer:    {p:"#F1DBE0", v:"#7A1F35", d:"#5A1526"},
  breathing:{p:"#FFE5FA", v:"#F846D0", d:"#A02391"},
  agenda:   {p:"#FFEADD", v:"#FF6A3D", d:"#B44223"},
  events:   {p:"#FFF3D6", v:"#FFB000", d:"#9A5B00"},
  brain:    {p:"#DDF7FA", v:"#00BFD4", d:"#0E7684"},
  academic: {p:"#E0F4E5", v:"#2CC05E", d:"#1C7440"},
  brainflex:{p:"#FFF0D8", v:"#FF9A2E", d:"#B0560F"},
  philo:    {p:"#E8F4FF", v:"#178FE5", d:"#0B5D99"},
  people:   {p:"#DDF8F3", v:"#10C2A0", d:"#0C7A66"},
  shopping: {p:"#DDEFDC", v:"#3E9E5B", d:"#256B39"},
  health:   {p:"#E1F7EC", v:"#18B96E", d:"#0C7042"},
  clock:    {p:"#E4E9F5", v:"#2D4BA0", d:"#1A2A55"},
  stats:    {p:"#FFE6DA", v:"#FF5A1F", d:"#A3300A"},
};
/* Every dashboard tile shares the same reversible full-colour presentation.
   Whether a tile is completed by a task control or by tapping an informative
   surface is decided by the tile itself; the visual system never opts out. */
const TASK = new Set(Object.keys(COL));
const uid=()=> (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2);

function themeVars(id, done){
  const c=COL[id]||{p:'#e6e6ea',v:'#666666',d:'#444444'};
  const complete=TASK.has(id)&&done;
  const rgb=hex=>hex.match(/[a-f0-9]{2}/gi).map(value=>parseInt(value,16));
  const hue=rgb(c.v), dark=rgb(c.d);
  const inkBase=complete?[4,8,12]:[15,23,32], inkMix=complete?.1:.3;
  const ink=dark.map((value,i)=>Math.round(value*inkMix+inkBase[i]*(1-inkMix)));
  const depth=hue.map((value,i)=>Math.round(value*.18+[12,21,30][i]*.82));
  return {
    '--bg':c.p,'--accent':c.v,'--accentDark':'rgb('+ink.join(',')+')',
    '--glass-rgb':hue.join(','),'--glass-depth':depth.join(','),'--glass-ink':'rgb('+ink.join(',')+')',
    '--ink':'rgb('+ink.join(',')+')','--lbl':'rgb('+ink.join(',')+')',
    '--dim':'rgba('+ink.join(',')+',.82)',
    '--hair':'rgba('+ink.join(',')+','+(complete?'.18':'.15')+')',
    '--field':'rgba(255,255,255,.08)',
    '--fieldbd':'rgba('+ink.join(',')+',.2)',
    '--tickbd':'rgba('+ink.join(',')+',.4)',
    '--tickfill':'rgba('+depth.join(',')+',.88)',
    '--tickmark':'#fff','--btnbg':'rgba(255,255,255,.1)',
    '--btnbd':'rgba('+ink.join(',')+',.18)',
    '--glow':'0 16px 40px -25px '+c.v,'--candyShadow':c.v
  };
}

/* localStorage */
const load=(k,fb)=>{ try{ const v=localStorage.getItem("fefe_"+k); return v==null?fb:JSON.parse(v); }catch{ return fb; } };
const save=(k,val)=>{ try{ localStorage.setItem("fefe_"+k, JSON.stringify(val)); schedulePush(); }catch(e){} };
const getKey=()=> (localStorage.getItem("fefe_apiKey")||"").trim();

/* ---- cross-device sync (JSONBlob) ----
   Whole-state snapshot under a secret blob id. The Anthropic API key is NEVER synced. */
const SYNC_URL="https://fefe-sync.fefedashboard.workers.dev";
/* Shared community daily content: one server-side key generates word/knowledge/spanish/
   music/news/brainflex/philo-prompt once a day for EVERYONE (see worker/shared-content.js).
   These tiles then need no personal API key. Set to "" to disable and fall back to per-user
   generation. Weather, academic, and philosophy chat stay per-user. */

/* Digits: combine six numbers with + − × ÷ to hit the target. The target is built by
   folding a random chain of those numbers, so at least one solution always exists. */
function applyBrainOp(a,op,b){
  if(op==="+")return a+b;
  if(op==="−")return a>b?a-b:null;
  if(op==="×")return a*b;
  if(op==="÷")return b>1&&a%b===0?a/b:null;

function makeDigits(key){

function makeSudoku(key){

/* Philosophy replies work like every other AI tile: the dashboard's daily server answers first
   (signed-in accounts, with the server's key); the key saved in Settings is only the fallback
   when the server can't (signed out, not updated yet, unreachable). The conversation tries the
   stronger model first; a model the key can't use (403/404, or a retired id: 400) gives way to
   the next one, and only a key Claude rejects outright (401) asks for a new key. */
const PHILO_CHAT_MODELS=["claude-sonnet-5-5","claude-haiku-5-5","claude-haiku-4-5-20251001"];
/* Current models think before they answer unless told otherwise, and that thinking counts toward
   max_tokens: a short cap was used up before any text came out (an empty reply). Sonnet 5.5 is
   asked not to think ("between_tools", its thinking-off setting); Haiku 5.5 thinks little (low
   effort) and gets room for it on top of the answer; older models only think when asked. */
function claudeBody(model,max,system,messages,effort){
  if(model==="claude-sonnet-5-5") return {model,max_tokens:max,thinking:{type:"between_tools"},system,messages};
  if(model==="claude-haiku-5-5") return {model,max_tokens:max+4096,output_config:{effort:effort||"low"},system,messages};
  return {model,max_tokens:max,system,messages};
}
/* The answer is the text blocks only; a refusal or a reply cut off with no text is no answer. */
function claudeReplyText(data){
  if(!data||data.stop_reason==="refusal") return "";
  return (data.content||[]).filter(b=>b&&b.type==="text").map(b=>b.text).join("\n").replace(/<\/?thinking>/g,"").trim();
}
/* What the conversation sends: empty turns (an earlier failed reply) are left out and two turns
   in a row from the same side are joined, so every request alternates as the API requires. */
function philoHistory(initial,messages){
  const out=[];
  [{role:"user",text:initial},...(messages||[])].forEach(m=>{
    const text=String((m&&m.text)||"").trim(); if(!text) return;
    const role=m.role==="assistant"?"assistant":"user", last=out[out.length-1];
    if(last&&last.role===role) last.text+="\n\n"+text; else out.push({role,text});
  });
  while(out.length&&out[0].role!=="user") out.shift();
  return out;
}
function philoSystemPrompt(question,philosopher){
  return philosopher

    : `You are a Socratic partner whose only job is to help the other person think for themselves about today's question: "${question}". Reply with exactly ONE open question and nothing else. Never answer the question yourself, never give an opinion, argument, explanation, example answer or summary of what they said, and never reason out loud. No praise, agreement or reassurance ("good point", "interesting", "you're right"), no hedging, no lists, no markdown, no bold. The question must be open (not answerable by yes, no or a fact), at most 30 words, plain and direct, and aimed at what their last message examined least: an assumption it rests on, a word it leaves undefined, a case that would test it, or a consequence they have not followed. Do not steer them toward any position, including moderate, consensus, conventional, fashionable or "balanced" ones; favour no school, culture or era; never imply which answer is right or that one exists. If they ask you a question or ask what you think, do not answer: turn it into an open question for them.`;

async function philoReply(question,history,mode="standard"){

      :serverErr.dailyState==="signin_required"?"The daily server needs you to sign in again."
      :serverErr.dailyState==="rate_limit"&&serverErr.philoText?serverErr.philoText:"The daily server couldn’t answer either.";

async function philoReplyWithKey(key,question,history,philosopher){
  const system=philoSystemPrompt(question,philosopher);

    const body=claudeBody(model,400,system,history.map(h=>({role:h.role,content:h.text})),"low");

      headers:{ "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify(body) }); }
    catch(e){ throw fail(navigator.onLine===false?"offline":"error","Couldn’t reach Claude. Check the connection and retry."); }
    if(res.ok){
      const reply=claudeReplyText(await res.json().catch(()=>null));
      if(reply) return reply;
      lastErr=fail("error","Claude sent back an empty reply. Retry in a moment.");
      continue;
    }
    const detail=await res.json().then(d=>d&&d.error&&d.error.message).catch(()=>"");
    const said=detail?" (Claude said: “"+String(detail).slice(0,160)+"”)":"";
    if(res.status===401) throw fail("invalid_key","Claude rejected the API key saved in Settings"+said+". Update it there, or remove it.");
    if(res.status===402) throw fail("error","Your Anthropic account has a billing problem"+said+". Check its credit in the Claude Console.");
    if(res.status===429) throw fail("rate_limit","Claude is rate limiting your key. Try again in a minute.");
    lastErr=fail("error",res.status===403?"Your key isn’t allowed to use the Philosophy models"+said+".":"Claude couldn’t answer (HTTP "+res.status+")"+said+".");
    if(![400,403,404].includes(res.status)) throw lastErr;

}
async function philoReplyFromServer(question,history,thinker){
  const fail=(state,text)=>Object.assign(new Error("philosophy server: "+state),{dailyState:state,viaServer:true,philoText:text});

/* Apple catalog matching must be conservative: a search result is never accepted merely because
   it came first. Title and the complete recording credit (performers and/or composer) are scored
   separately, which also handles classical recordings whose Apple "artist" is not the composer. */
const musicNorm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
const MUSIC_NOISE=new Set(["a","an","the","and","feat","featuring","with","version","edit","remaster","remastered","mono","stereo"]);
const musicTokens=s=>new Set(musicNorm(s).split(/\s+/).filter(w=>w&&!MUSIC_NOISE.has(w)));
const musicOverlap=(a,b)=>{
  const aa=musicTokens(a),bb=musicTokens(b); if(!aa.size||!bb.size) return 0;
  let hit=0; aa.forEach(w=>{ if(bb.has(w)) hit++; });
  return hit/Math.max(aa.size,bb.size);
};
/* Without an exact catalog match, search for the main artist only: a long "title + every credit"
   query rarely matches anything, while the artist always lands on a real page. */
const musicPrimaryArtist=a=>String(a||"").split(/\s+(?:with|feat\.?|featuring|ft\.?)\s+|\s*\/\s*/i)[0].trim();
const appleMusicSearchUrl=m=>`https://music.apple.com/fr/search?term=${encodeURIComponent(musicPrimaryArtist(m.artist)||m.composer||m.title||"")}`;
/* On a Mac the music:// scheme opens the Music app instead of the web player (iPhone and iPad
   already hand music.apple.com links to the app). */
const IS_MAC_DESKTOP=typeof navigator!=="undefined"&&/Mac/.test(navigator.platform||navigator.userAgent||"")&&!(navigator.maxTouchPoints>1);
const musicAppHref=url=>IS_MAC_DESKTOP?String(url).replace(/^https:\/\/(?:geo\.)?music\.apple\.com\//,"music://music.apple.com/"):url;
/* geo.music.apple.com redirects to the listener's own storefront, so a matched track
   opens the exact song in-app instead of dead-ending on a foreign-country page. */
const appleGeoUrl=url=>String(url||"").replace(/^https:\/\/music\.apple\.com\//,"https://geo.music.apple.com/");
async function resolveMusicTrack(m){
  const title=String(m&&m.title||"").trim(), artist=String(m&&m.artist||"").trim(), composer=String(m&&m.composer||"").trim();
  if(!title) return null;
  const signature=musicNorm([title,artist,composer].join(" | "));
  const cached=load("musicMatches",{});
  if(cached[signature]&&cached[signature].url) return cached[signature];
  const queries=[`${title} ${artist} ${composer}`,`${title} ${artist}`,`${title} ${composer}`].map(q=>q.trim()).filter((q,i,a)=>q&&a.indexOf(q)===i);
  const candidates=new Map();
  for(const q of queries){
    try{
      const api=`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&country=fr&media=music&entity=song&limit=25`;
      const response=await fetch(api); if(!response.ok) continue;
      const data=await response.json();
      (data.results||[]).forEach(track=>{ if(track.trackViewUrl) candidates.set(String(track.trackId||track.trackViewUrl),track); });
    }catch(e){}
  }
  const expectedCredits=[artist,composer].filter(Boolean).join(" ");
  const scored=[...candidates.values()].map(track=>{
    const wanted=musicNorm(title), found=musicNorm(track.trackName);
    const titleOverlap=musicOverlap(title,track.trackName);
    const titleScore=wanted===found?100:(wanted&&found&&(wanted.includes(found)||found.includes(wanted))?88:titleOverlap*80);
    const catalogCredits=[track.artistName,track.composerName,track.collectionArtistName].filter(Boolean).join(" ");
    const wantedCredit=musicNorm(expectedCredits), foundCredit=musicNorm(catalogCredits);
    const creditOverlap=musicOverlap(expectedCredits,catalogCredits);
    const creditScore=!wantedCredit?12:(wantedCredit===foundCredit?38:(wantedCredit.includes(foundCredit)||foundCredit.includes(wantedCredit)?32:creditOverlap*30));
    return {track,titleScore,creditScore,score:titleScore+creditScore};
  }).sort((a,b)=>b.score-a.score);
  const best=scored[0];
  if(!best||best.titleScore<70||best.creditScore<10) return null;
  const match={
    url:appleGeoUrl(best.track.trackViewUrl),
    trackId:best.track.trackId||"",
    catalogTitle:best.track.trackName||title,
    catalogArtist:best.track.artistName||artist,
    catalogComposer:best.track.composerName||composer,
    catalogMatched:true
  };
  const nextCache={...cached,[signature]:match};
  const trimmed=Object.fromEntries(Object.entries(nextCache).slice(-80));
  save("musicMatches",trimmed);
  return match;
}

/* World briefing — pulls real, free RSS headlines via our own Worker (same origin, no CORS),
   then Claude only summarizes/cleans that provided text (no web_search tool = far cheaper). */
const RSS_FEEDS=[
  "https://feeds.bbci.co.uk/news/world/rss.xml",
  "https://feeds.skynews.com/feeds/rss/world.xml",
  "https://www.france24.com/en/rss",
];
async function fetchRssHeadlines(){
  const results=await Promise.allSettled(RSS_FEEDS.map(async url=>{
    let r=null; const candidates=[SYNC_URL+"/rss?url="+encodeURIComponent(url),url,"https://api.allorigins.win/raw?url="+encodeURIComponent(url)];
    for(const candidate of candidates){ try{ const attempt=await fetch(candidate); if(attempt.ok){ r=attempt; break; } }catch(e){} }
    if(!r) throw new Error("bad feed");
    const text=await r.text();
    const doc=new DOMParser().parseFromString(text,"text/xml");
    return [...doc.querySelectorAll("item")].slice(0,10).map(it=>({
      title:(it.querySelector("title")?.textContent||"").trim(),
      desc:(it.querySelector("description")?.textContent||"").replace(/<[^>]+>/g," ").trim(),
    })).filter(x=>x.title);
  }));
  const all=[]; const seen=new Set();
  results.forEach(r=>{ if(r.status==="fulfilled") r.value.forEach(it=>{
    const key=it.title.toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(" ").slice(0,6).join(" ");
    if(key && !seen.has(key)){ seen.add(key); all.push(it); }
  }); });
  return all.length ? all : null;
}
async function genWorld(avoid){
  const items=await fetchRssHeadlines();
  if(!items || items.length===0) return null;
  const raw=items.slice(0,16).map((it,i)=>`${i+1}. ${it.title} — ${it.desc}`).join("\n");
  const out=await callClaude("You output ONLY a valid JSON array, no markdown.",
    `Here are today's raw news headlines from several wire services (may include near-duplicates covering the same event):\n${raw}\n\nPick the 5 most important DISTINCT stories — if two items describe the same event, count that as one. Avoid re-covering stories already picked recently: ${(avoid||[]).join(" | ")||"none"}. For each pick write a "headline" (max 9 words, your own words) and a "summary" (2-3 sentences) covering what happened AND why it matters, using only the information given above. Do not end the summary with a generic closing line that just restates the obvious (e.g. "this shows/highlights/underscores…") — add a closing thought only if it's genuinely non-obvious insight; otherwise stop after the facts. Plain prose only — NO markdown, NO citation numbers, NO URLs, NO special symbols. JSON array of {"headline":"","summary":""}.`, {max:950});
  const arr=extractJSON(out); return Array.isArray(arr)?arr:null;
}

/* The pop-up's forecast, all from Open-Meteo's free API (no key): current details, 48 hours
   from today's midnight, and seven days. Everything is optional: a missing value just leaves
   its line out. Times stay in the place's own local time, as the API returns them. */
const WX_CURRENT="temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation,pressure_msl,visibility,uv_index";
const WX_HOURLY="temperature_2m,weather_code,precipitation_probability,is_day";
const WX_DAILY="weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,precipitation_sum,uv_index_max,wind_speed_10m_max";
const wxNum=(v,round)=>typeof v==="number"&&Number.isFinite(v)?(round?Math.round(v):v):null;
function weatherDetail(d){
  const c=(d&&d.current)||{}, h=(d&&d.hourly)||{}, y=(d&&d.daily)||{}, at=(list,i)=>Array.isArray(list)?list[i]:undefined;
  const now={time:String(c.time||""),feels:wxNum(c.apparent_temperature,true),humidity:wxNum(c.relative_humidity_2m,true),wind:wxNum(c.wind_speed_10m,true),windDir:wxNum(c.wind_direction_10m),gusts:wxNum(c.wind_gusts_10m,true),precip:wxNum(c.precipitation),pressure:wxNum(c.pressure_msl,true),visibility:wxNum(c.visibility),uv:wxNum(c.uv_index),day:c.is_day!==0};
  const hours=(Array.isArray(h.time)?h.time:[]).slice(0,48).map((t,i)=>({t:String(t),temp:wxNum(at(h.temperature_2m,i),true),code:wxNum(at(h.weather_code,i)),pop:wxNum(at(h.precipitation_probability,i),true),day:at(h.is_day,i)!==0})).filter(x=>x.temp!==null&&x.code!==null);
  const days=(Array.isArray(y.time)?y.time:[]).slice(0,7).map((date,i)=>({date:String(date),code:wxNum(at(y.weather_code,i)),hi:wxNum(at(y.temperature_2m_max,i),true),lo:wxNum(at(y.temperature_2m_min,i),true),pop:wxNum(at(y.precipitation_probability_max,i),true),rain:wxNum(at(y.precipitation_sum,i)),uv:wxNum(at(y.uv_index_max,i)),wind:wxNum(at(y.wind_speed_10m_max,i),true),sunrise:String(at(y.sunrise,i)||""),sunset:String(at(y.sunset,i)||"")})).filter(x=>x.hi!==null&&x.lo!==null&&x.code!==null);
  return {now,hours,days};
}
const wxHourLabel=t=>{ const h=Number(String(t).slice(11,13)); return (h%12||12)+(h<12?"AM":"PM"); };
const wxClock=t=>{ const h=Number(String(t).slice(11,13)); return (h%12||12)+":"+String(t).slice(14,16)+(h<12?"AM":"PM"); };
const wxCompass=deg=>["N","NE","E","SE","S","SW","W","NW"][Math.round((((Number(deg)%360)+360)%360)/45)%8];
const wxUvLabel=uv=>uv<3?"Low":uv<6?"Moderate":uv<8?"High":uv<11?"Very high":"Extreme";
/* The coming day from now (local time "YYYY-MM-DDTHH:MM") in steps of two hours: twelve stops
   cover 24 hours, so the next sunrise and the next sunset are always both there, each as its own
   stop at its exact time. The first stop is "Now", carrying the live reading when the snapshot
   is from this hour. */
function wxHourly(data,nowStamp,count=12,step=2){
  const hours=Array.isArray(data&&data.hours)?data.hours:[], hourKey=String(nowStamp).slice(0,13)+":00";
  let i=hours.findIndex(h=>h.t===hourKey); if(i<0) i=hours.findIndex(h=>h.t>hourKey); if(i<0) return [];
  const span=[]; for(let k=i;k<hours.length&&span.length<count;k+=step) span.push(hours[k]);
  const liveNow=!!(data.now&&String(data.now.time||"").slice(0,13)===hourKey.slice(0,13));
  const items=span.map((h,k)=>{ const live=k===0&&liveNow&&h.t===hourKey;
    return {kind:"hour",t:h.t,label:k===0&&h.t===hourKey?"Now":wxHourLabel(h.t),temp:live?data.temp:h.temp,code:live?data.code:h.code,pop:h.pop,day:live?data.now.day!==false:h.day}; });
  // a sun event belongs to the strip until the stop after the last one shown
  const lastAt=i+(span.length-1)*step, until=hours[lastAt+step]?hours[lastAt+step].t:span[span.length-1].t.slice(0,13)+":59";
  (Array.isArray(data.days)?data.days:[]).forEach(d=>[["sunrise",d.sunrise],["sunset",d.sunset]].forEach(([kind,t])=>{
    if(!t||t<=String(nowStamp)||t>=until) return;
    const hour=hours.find(h=>h.t.slice(0,13)===t.slice(0,13));
    items.push({kind,t,label:wxClock(t),temp:hour?hour.temp:null});
  }));
  return items.sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:(a.kind==="hour"?-1:1));
}
/* the bar colours of a temperature (°C): cold blue through green and yellow to hot red */
const WX_TEMP_STOPS=[[-5,[110,139,255]],[5,[90,200,250]],[12,[99,214,155]],[18,[255,206,10]],[24,[255,159,10]],[30,[255,69,58]]];
const wxTempColor=t=>{ const s=WX_TEMP_STOPS; if(!(t>s[0][0])) return `rgb(${s[0][1]})`; for(let i=1;i<s.length;i++){ if(t<=s[i][0]){ const [a,ca]=s[i-1],[b,cb]=s[i],k=(t-a)/(b-a); return `rgb(${ca.map((v,j)=>Math.round(v+(cb[j]-v)*k)).join(",")})`; } } return `rgb(${s[s.length-1][1]})`; };

async function fetchWeather(profile=getLocationProfile()){
  const lat=Number(profile.latitude), lon=Number(profile.longitude);
  const tz=encodeURIComponent(profile.timezone||"auto");
  const base=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=${tz}`;
  let r=await fetch(`${base}&current=${WX_CURRENT}&hourly=${WX_HOURLY}&daily=${WX_DAILY}&forecast_days=7`,{signal:AbortSignal.timeout(25000)});
  // the detailed forecast is extra: if the service refuses it, the tile still gets its basics
  if(!r.ok) r=await fetch(`${base}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=2`,{signal:AbortSignal.timeout(25000)});
  if(!r.ok)throw Error("weather_unavailable");
  const d=await r.json();
  const temp=Math.round(d.current.temperature_2m);
  const hi=Math.max(temp,Math.round(d.daily.temperature_2m_max[0]));
  const lo=Math.min(temp,Math.round(d.daily.temperature_2m_min[0]));

  const tLo=Math.round(d.daily.temperature_2m_min[1]);

  return { temp, code:d.current.weather_code, hi, lo, tomorrow:{hi:tHi, lo:tLo, code:tCode}, place:profile.name, timezone:profile.timezone, at:Date.now(), ...weatherDetail(d) };
}

/* iCloud / vCard (.vcf) birthday import — fully local, no network */
function parseVcf(text){
  const out=[];
  const unfold=String(text).replace(/\r\n/g,"\n").replace(/\n[ \t]/g,"");
  const blocks=unfold.split(/BEGIN:VCARD/i);
  for(const blk of blocks){
    if(!/BDAY/i.test(blk)) continue;
    let name="";
    const fn=blk.match(/(?:^|\n)FN[^:\n]*:([^\n]+)/i);
    if(fn) name=fn[1].trim();
    if(!name){ const nrow=blk.match(/(?:^|\n)N[^:\n]*:([^\n]+)/i); if(nrow){ const p=nrow[1].split(";"); name=((p[1]||"")+" "+(p[0]||"")).trim(); } }
    const bM=blk.match(/(?:^|\n)BDAY[^:\n]*:([^\n]+)/i);
    if(!name||!bM) continue;
    const val=bM[1].split("T")[0].trim();
    const noYear = /^--/.test(val) || val.slice(0,4)==="1604";
    const digits=val.replace(/[^0-9]/g,"");
    let mo,da;
    if(noYear && digits.length>=4){ mo=+digits.slice(-4,-2); da=+digits.slice(-2); }
    else if(digits.length===8){ mo=+digits.slice(4,6); da=+digits.slice(6,8); }
    else if(digits.length===6){ mo=+digits.slice(2,4); da=+digits.slice(4,6); }
    else if(digits.length===4){ mo=+digits.slice(0,2); da=+digits.slice(2,4); }
    else continue;
    if(name && mo>=1 && mo<=12 && da>=1 && da<=31) out.push({name, month:mo, day:da});
  }
  return out;
}

async function extractCourseFile(file){
  if(!file) return "";
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib) throw new Error("PDF reader unavailable. Check internet, then try again.");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const pages=[];
    for(let i=1;i<=pdf.numPages;i++){ const page=await pdf.getPage(i); const content=await page.getTextContent(); pages.push(content.items.map(x=>x.str).join(" ")); }
    return pages.join("\n\n");
  }
  if(file.type.startsWith("text/")||/\.(txt|md|csv)$/i.test(file.name)) return file.text();
  throw new Error("Use PDF, TXT, Markdown or CSV. DOCX support can be added next.");
}

/* RECALL_CORE_START */
/* FSRS-6 spaced repetition — default parameters, 90% desired retention. */
const LEGACY_RECALL_INTERVALS=[1,3,7,16,35,90];
const FSRS_W=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const FSRS_RETENTION=.9;
const FSRS_RATINGS=[
  {value:1,name:"Again"},
  {value:2,name:"Hard"},
  {value:3,name:"Good"},
  {value:4,name:"Easy"}
];
/* Grade buttons wear the interval the algorithm would schedule, e.g. "3 d" or "2 w". */
const shortInterval=days=>{const d=Math.max(0,Math.round(Number(days)||0));return d===0?"today":d===1?"1 d":d<7?d+" d":d<30?Math.max(1,Math.round(d/7))+" w":d<365?Math.max(1,Math.round(d/30))+" mo":Math.max(1,Math.round(d/365))+" y";};
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
const initialStability=rating=>Math.max(.01,FSRS_W[rating-1]);
const initialDifficulty=rating=>clamp(FSRS_W[4]-Math.exp(FSRS_W[5]*(rating-1))+1,1,10);
const nextDifficulty=(difficulty,rating)=>{
  const damped=difficulty-FSRS_W[6]*(rating-3)*(10-difficulty)/9;
  return clamp(FSRS_W[7]*initialDifficulty(4)+(1-FSRS_W[7])*damped,1,10);
};
const fsrsRetrievability=(elapsed,stability)=>{
  const factor=Math.pow(.9,-1/FSRS_W[20])-1;
  return Math.pow(1+factor*Math.max(0,elapsed)/Math.max(.01,stability),-FSRS_W[20]);
};
const fsrsInterval=stability=>{
  const factor=Math.pow(.9,-1/FSRS_W[20])-1;
  return clamp(Math.round(stability/factor*(Math.pow(FSRS_RETENTION,-1/FSRS_W[20])-1)),1,36500);
};
const recallStateFor=item=>{
  if(item.fsrs&&item.fsrs.version===6) return item.fsrs;
  const legacyLevel=clamp(Number(item.level)||0,0,LEGACY_RECALL_INTERVALS.length-1);
  const legacyInterval=LEGACY_RECALL_INTERVALS[legacyLevel];
  return {
    version:6,
    state:"review",
    stability:legacyInterval,
    difficulty:initialDifficulty(3),
    reps:Math.max(1,Number(item.seen)||1),
    lapses:0,
    lastReview:addDays(item.nextReview||todayKey,-legacyInterval),
    scheduledDays:legacyInterval,
    desiredRetention:FSRS_RETENTION,
    migratedFrom:"fixed-ladder"
  };
};
const newRecallItem=data=>({
  ...data,
  level:0,
  seen:1,
  nextReview:addDays(todayKey,1),
  fsrs:{version:6,state:"new",stability:0,difficulty:0,reps:0,lapses:0,lastReview:null,scheduledDays:1,desiredRetention:FSRS_RETENTION}
});
const scheduleRecall=(item,rating,reviewDate=todayKey)=>{
  const old=recallStateFor(item);
  const isNew=old.state==="new"||!old.stability;
  const elapsed=isNew?0:Math.max(0,daysBetween(old.lastReview||reviewDate,reviewDate));
  const retrievability=isNew?1:fsrsRetrievability(elapsed,old.stability);
  let stability,difficulty;
  if(isNew){
    stability=initialStability(rating);
    difficulty=initialDifficulty(rating);
  }else{
    difficulty=nextDifficulty(old.difficulty,rating);
    if(elapsed===0){
      let increase=Math.exp(FSRS_W[17]*(rating-3+FSRS_W[18]))*Math.pow(old.stability,-FSRS_W[19]);
      if(rating>=3) increase=Math.max(1,increase);
      stability=old.stability*increase;
    }else if(rating===1){
      stability=Math.min(
        FSRS_W[11]*Math.pow(difficulty,-FSRS_W[12])*(Math.pow(old.stability+1,FSRS_W[13])-1)*Math.exp(FSRS_W[14]*(1-retrievability)),
        old.stability
      );
    }else{
      const hardPenalty=rating===2?FSRS_W[15]:1;
      const easyBonus=rating===4?FSRS_W[16]:1;
      stability=old.stability*(1+Math.exp(FSRS_W[8])*(11-difficulty)*Math.pow(old.stability,-FSRS_W[9])*(Math.exp(FSRS_W[10]*(1-retrievability))-1)*hardPenalty*easyBonus);
    }
  }
  stability=clamp(stability,.01,36500);
  const scheduledDays=fsrsInterval(stability);

/* ---- Recall · Word cards are fill-in-the-blank production cards ----
   A cloze sentence carries the word in braces: "He was being very {abusive} with me."

   at the word); the back is the dictionary entry: the word, its short definition and
   the French equivalent. Several sentences rotate, so the word is learnt, not the line. */

   Cards are grouped into one row per tile that made them (each row wears that tile's
   colour); within a row they come in a fixed order, most overdue first. "Again" sends a
   card to the end of its row for another pass the same day. Grades are a replay from the

   everything after it is recomputed. The session is kept for the day, so a reload
   resumes it with its passes and grades. */
const RECALL_SOURCES=[
  {key:"word",tile:"word",types:["word"],label:"Word"},
  {key:"lesson",tile:"worth",types:["lesson"],label:"Knowledge"},
  {key:"spanish",tile:"spanish",types:["spanish"],label:"Español"},
  {key:"german",tile:"german",types:["german"],label:"Deutsch"},
  {key:"academic",tile:"academic",types:["academic"],label:"Study"},
  {key:"brain",tile:"brain",types:["brain-bank"],label:"Memory"}

const recallReplay=(session,id,start,beforeKey)=>{

function WeatherCard({data,busy,onGenerate,onRefresh}){

  useEffect(()=>{
    if(!expanded||!data||!onRefresh) return;
    if(Date.now()-(Number(data.at)||0)<30*60*1000&&Array.isArray(data.hours)&&data.hours.length) return;
    let live=true; setRefreshing(true);
    Promise.resolve(onRefresh()).finally(()=>{ if(live) setRefreshing(false); });
    return()=>{ live=false; };
  },[expanded]);
  if(busy && !data) return <Note>Checking local skies…</Note>;
  if(!data) return <GenerateEmpty busy={busy} onGenerate={onGenerate} />;
  if(expanded) return <WeatherFull data={data} refreshing={refreshing}/>;

      <WeatherArt code={data.code} className="wxHero"/>
      <div className="wxNow">
        <div className="wxTemp">{data.temp}°</div>
        <div className="wxLabel">{label}</div>

              <div className="habitSquares" aria-label={`${r.label}: ${st} day streak`}>{history.map(day=>{ const done=!!(ritualLog[day]&&ritualLog[day][r.id]); return <span key={day} className={`habitSquare${done?" done":""}`} title={`${day}: ${done?"completed":"not completed"}`}/>; })}</div>
            </div>; })}
          </div>
        </div>
      </div>, ()=>toggleRitual("weekly")),
    birthdays: T("birthdays","Birthdays",false,null,
      <BirthdaysCard birthdays={birthdays} today={todayBdays}
        onAdd={b=>persistBirthdays([...birthdays,{id:uid(),...b}])}
        onRemove={id=>persistBirthdays(birthdays.filter(x=>x.id!==id))} />),
    timer: T("timer","Timer",timerFired,null,
      <TimerCard duration={timerDuration} end={timerEnd} remaining={timerRemaining} fired={timerFired} now={now} onSetDuration={persistTimerDuration} onStart={startTimer} onPause={pauseTimer} onReset={resetTimer} />),
    breathing: T("breathing","Breathing",!!rToday.breathing,null,
      <BreathingCard done={!!rToday.breathing} onComplete={()=>setRitual("breathing")} onIncomplete={()=>unsetRitual("breathing")} />),
    health: T("health","Health",false,null,
      <HealthCard data={healthLog[todayKey]} latest={Object.values(healthLog||{}).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]} connected={!!healthToken} busy={healthBusy} onSetup={goSettings} onSync={syncHealthNow} />),
    shopping: T("shopping","Shopping",shoppingLit,null,
      <ShoppingCard items={shoppingList} onChange={persistShopping} />),
    agenda: T("agenda","Reminders",agendaLit,null,
      <AgendaCard recurring={agendaRecurring} events={agendaEvents}
        noDueToday={agendaTodayStates.length===0} emptyDone={!!rToday.agenda} onToggleEmpty={()=>toggleRitual("agenda")}
        onMarkDone={markRecurringDone} onAddRecurring={addRecurring} onRemoveRecurring={removeRecurring}
        onAddEvent={addEvent} onRemoveEvent={removeEvent} onToggleEventDone={toggleEventDone}
        streak={{dayCompletion,isPerfectDay,firstDay,dayIces,iceAvailable:ice.available,onToggleIce:toggleDayIce}} />),
    events: T("events","Events",false,null,
      <PositiveEventsCard events={positiveEvents} onAdd={addPositiveEvent} onRemove={removePositiveEvent} />),
    movie: T("movie","Movies",movies.some(m=>m.watchedOn===todayKey),null,
      <MovieCard movies={movies} onAdd={addMovie} onRemove={removeMovie} onBump={bumpMovie} onRename={renameMovie} />, ()=>toggleMovieWatched()),
    sustain: T("sustain","Sustainability",sustainIsDone(sustainOut),null,
      <SustainCard out={sustainOut} onToggle={setSustainThrown} />),
    clock: T("clock","Watch",false,null,<WatchCard timeZone={locationProfile.timezone}/>),
    stats: T("stats","Streak",pctLit>=100,null,<StatsCard pct={pctLit} {...statsSummary} onOpen={()=>openPage("insights")}/>,()=>openPage("insights")),
    matrix: T("matrix","Priorities",false,null,
      <MatrixCard notes={matrixNotes} onChange={saveMatrix} />,()=>{}),
    brain: T("brain","Memory",false,null,
      <BrainBankCard bank={brainBank} busy={bankBusy} haveKey={haveKey} onSetup={()=>openDailySettings("claude-key")} onAdd={addBankEntry} onOpenBrowser={()=>setShowBankBrowser(true)} />),
    academic: T("academic","Study",!!rToday.academic,null,<>
      <AcademicCard academic={view.academic} busy={genBusy} hasCourses={courses.length>0} onLearned={learnAcademic} onUnlearned={unlearnAcademic} onOpenEditor={()=>setShowCourseEditor(true)} onGenerate={()=>regenerateOne("academic")} />
      <RetryNote tileKey="academic"/></>),
    brainflex: T("brainflex","Brainflex",!!rToday.brainflex,null,<>
      <BrainGameCard done={!!rToday.brainflex} onFinish={()=>setRitual("brainflex")}/></>),
    philo: T("philo","Philosophy",!!rToday.philo,null,<>
      <PhilosophyCard philo={view.philo} busy={genBusy} chat={philoChat} sending={philoBusy} error={philoError} haveKey={haveKey} onSetup={goSettings} onRetry={()=>philoSend("",true)} onModeChange={setPhiloMode} onSubmitInitial={philoSubmitInitial} onSend={philoSend} onReset={philoRestart} onGenerate={()=>regenerateOne("philo")} />
      <RetryNote tileKey="philo"/></>),
    people: T("people","People",people.some(p=>p.date===todayKey),null,
      <PeopleMetCard people={people} onAdd={p=>persistPeople([...people,{id:uid(),date:todayKey,...p}])} onRemove={id=>persistPeople(people.filter(p=>p.id!==id))} />),
  };

  const settingsDirty=(nameField.trim()||"Fefe")!==profileName||usernameField.trim()!==load("profileUsername","")||keyField.trim()!==getKey()||garminKeyField.trim()!==load("garminKey","")||backgroundTheme!==load("backgroundTheme","weave")||JSON.stringify(locationProfile)!==JSON.stringify(getLocationProfile());
  const libraryIds=order.filter(id=>widgets[id]&&matchesLibraryWidget(id,widgets[id].props.label,libraryQuery,libraryCategory));
  const libraryResting=libraryIds.filter(id=>!activeNow.has(id));
  const libraryActive=libraryIds.filter(id=>activeNow.has(id));
  const libraryFiltered=libraryQuery.trim()!==""||libraryCategory!=="all";
  const resetLibraryFilters=()=>{setLibraryQuery("");setLibraryCategory("all");librarySearchRef.current?.focus();};

  return (
    <div className="wrap">
      <a className="skipLink" href="#main-content" onClick={e=>{e.preventDefault();document.getElementById("main-content")?.focus();}}>Skip to content</a>
      {!accountSignedIn&&<DashboardModal key={authMode} label={authMode==="forgot"?"Recover password":authMode==="login"?"Sign in":"Create account"} onClose={()=>{}} overlayClassName="authGate" className="authCard" as="form" onSubmit={event=>{event.preventDefault();authMode==="forgot"?requestPasswordRecovery():submitAccount();}}>
        <h2>{authMode==="forgot"?(authRecoveryRequested?"Recovery requested":"Forgot your password?"):authMode==="login"?"Welcome back":"Create your account"}</h2>
        <p className="hint">{authMode==="forgot"?"Enter the email you use for your dashboard.":authMode==="login"?"Sign in to your dashboard.":"Keep your dashboard with you across devices."}</p>
        <label className="authLabel" htmlFor="auth-email">Email</label><input id="auth-email" className="sinput" type="email" autoComplete="email" required disabled={authBusy} value={authEmailField} onChange={event=>{setAuthEmailField(event.target.value);setAuthRecoveryRequested("");}}/>
        {authMode!=="forgot"&&<>
          <label className="authLabel" htmlFor="auth-password">Password</label><input id="auth-password" className="sinput" type="password" required disabled={authBusy} minLength={authMode==="signup"?8:undefined} autoComplete={authMode==="login"?"current-password":"new-password"} aria-describedby={authMode==="signup"?"auth-password-help":undefined} value={authPassword} onChange={event=>setAuthPassword(event.target.value)}/>
          {authMode==="signup"&&<p id="auth-password-help" className="hint">At least 8 characters.</p>}
        </>}
        {authMode==="forgot"&&authRecoveryRequested&&<div className="authStatus" role="status"><p>If an account uses <strong>{authRecoveryRequested}</strong>, look for a password reset link in that inbox.</p><p>Check spam too. Links expire; use the most recent email.</p>{authRecoveryOwnerOnly&&<p>Email delivery currently supports the app owner’s Resend address only. Other addresses need a verified sender domain.</p>}</div>}
        {authError&&<p className="authError" role="alert">{authError}</p>}
        <button type="submit" className="savebtn" disabled={authBusy||(authMode==="forgot"&&authRecoveryCooldown>0)}>{authBusy?(authMode==="forgot"?"Requesting email…":authMode==="login"?"Signing in…":"Creating account…"):authMode==="forgot"?(authRecoveryCooldown>0?"Request again in "+authRecoveryCooldown+"s":authRecoveryRequested?"Request another link":"Send reset link"):authMode==="login"?"Sign in":"Create account"}</button>
        {authMode==="login"&&<button type="button" className="link" disabled={authBusy} onClick={()=>changeAuthMode("forgot")}>Forgot password?</button>}
        <button type="button" className="link" disabled={authBusy} onClick={()=>changeAuthMode(authMode==="login"?"signup":"login")}>{authMode==="forgot"?"Back to sign in":authMode==="login"?"Create an account":"Already have an account? Sign in"}</button>
      </DashboardModal>}
      <button type="button" ref={dockHandleRef} className={"dockHandle"+(navOpen||edit?" open":"")} aria-expanded={navOpen||edit} aria-controls="app-dock" aria-label={navOpen||edit?"Hide the menu":"Show the menu"} title={navOpen||edit?"Hide the menu":"Menu"} onClick={()=>{ if(edit){ setEdit(false); setNavOpen(false); } else setNavOpen(v=>!v); }}><svg viewBox="0 0 24 12" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={navOpen||edit?"M5 3l7 6 7-6":"M5 9l7-6 7 6"}/></svg></button>
      <nav ref={dockRef} id="app-dock" className={"topbar dock"+(navOpen||edit?" open":"")} aria-label="Primary navigation" inert={navOpen||edit?undefined:""}>
        <div className="topnav">
          <button className={"navbtn"+(page==="dashboard"?" active":"")} aria-current={page==="dashboard"?"page":undefined} onClick={()=>openPage("dashboard")}>Today</button>
          <button className={"navbtn"+(page==="insights"?" active":"")} aria-current={page==="insights"?"page":undefined} onClick={()=>openPage("insights")}>Insights</button>
          <button className={"navbtn"+(page==="library"?" active":"")} aria-current={page==="library"?"page":undefined} onClick={()=>openPage("library")}>Library</button>
          <button className={"navbtn"+(page==="settings"?" active":"")} aria-current={page==="settings"?"page":undefined} onClick={()=>openPage("settings")}>Settings</button>
        </div>
        <div className="topActions">
          {page!=="settings"&&page!=="insights"&&<button className="actionBtn primary" aria-label={refreshPlan.label} title={refreshPlan.detail} onClick={generateToday} disabled={genBusy||expectedGenKeys.length===0}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3a7 7 0 0 0 11.6-1"/></svg><span>{refreshPlan.label}</span></button>}
          {page==="dashboard"&&<button className={"actionBtn"+(edit?" active":"")} title={edit?"Finish arranging":"Arrange dashboard"} aria-label={edit?"Finish arranging":"Arrange dashboard"} aria-pressed={edit} onClick={()=>setEdit(a=>!a)}><AppIcon name={edit?"check":"layout"}/><span>{edit?"Done":"Arrange"}</span></button>}
        </div>
      </nav>

      <main id="main-content" className="pageContent" tabIndex="-1">
      {page!=="dashboard"&&<header className="dashboardHero">
        <div className="heroCopy">
          {page==="dashboard"&&<div className="heroEyebrow">{displayDateLabel}</div>}
          <h1>{page==="library"?"Library":page==="settings"?"Settings":page==="insights"?"Insights":`${greeting}, ${profileName}`}</h1>
          <p className="heroStatus">{page==="insights"?"Streaks, history and records across every tile.":page==="library"?"Choose what appears on Today.":page==="settings"?"Your profile, preferences and connections.":genBusy?"Loading missing tiles. Saved content stays put.":litTotal?`${litDone} of ${litTotal} daily actions complete.`:"Choose a few tiles to start your day."}</p>
          {lateNight&&page==="dashboard"&&<div className="bedtime">Past midnight. Today rolls over at 1am.</div>}
        </div>
        <div className="heroSummary" aria-label="Daily summary">
          {page==="dashboard"&&<div className="progressOrb" style={{"--p":pctLit}} role="progressbar" aria-label="Daily progress" aria-valuenow={pctLit} aria-valuemin="0" aria-valuemax="100" title={`${pctLit}% complete`}><span className="progressValue">{pctLit}%</span></div>}
          <div className="metric"><span className="metricValue">{page==="library"?activeTiles.length:page==="settings"?birthdays.length:appDaysStreak}</span><span className="metricLabel">{page==="library"?"Active tiles":page==="settings"?"Birthdays":"Day streak"}</span></div>
          <div className="metric"><span className="metricValue">{page==="library"?ALL.length-activeTiles.length:page==="settings"?locationProfile.name:ice.perfect}</span><span className="metricLabel">{page==="library"?"Resting":page==="settings"?"Location":"Perfect days"}</span></div>
          <div className="metric"><span className="heroClock">{displayClock}</span><span className="metricLabel">{locationProfile.name}</span></div>
        </div>
      </header>}
      {page==="dashboard"&&expectedGenKeys.length>0&&!contentReady&&<div className={"dailyMeter"+(contentReady?" isComplete":"")} title="Saved content, answers and streaks stay put. Loading only fills gaps. New content arrives after 1am." aria-label={`Today’s content: ${readyGenCount} of ${expectedGenKeys.length} tiles in`}>
        <span className="dailyMeterDots" aria-hidden="true">{expectedGenKeys.map(key=><span key={key} className={"dailyMeterDot"+(validDailyTile(key,view[key])?" on":"")} title={DAILY_TILE_LABELS[key]||key}/>)}</span>
        <span className="dailyMeterText">{contentReady?"All in":`${readyGenCount} of ${expectedGenKeys.length} in`}</span>
      </div>}

      {page==="insights"&&<InsightsPage sustain={insightSustain} overall={insightOverall} sections={insightSections} habits={habits} habitLog={habitLog} freezes={freezes} ice={ice} icesSpent={icesSpent} dayIces={dayIces} onToggleIce={toggleDayIce} isPerfectDay={isPerfectDay} dayCompletion={dayCompletion} firstDay={firstDay} push14={push14} pushTotal14={pushTotal14} pushAvg14={pushAvg14} goalsHit7={goalsHit7} learned7={learned7} recallTotal={recallList.length} />}
      {page==="settings"&&(
        <div className="settings">
          <div className="settingsGrid">
            <section className="settingsCard">
              <h2>Profile</h2>
              <div className="accountFields">
                <div className="accountField"><label htmlFor="profile-name">Display name</label><input id="profile-name" className="sinput" autoComplete="name" value={nameField} onChange={e=>setNameField(e.target.value)}/></div>
                <div className="accountField"><label htmlFor="profile-username">Username</label><input id="profile-username" className="sinput" autoComplete="username" value={usernameField} onChange={e=>setUsernameField(e.target.value)}/></div>
                <div className="accountField"><label htmlFor="profile-email">Email</label><input id="profile-email" className="sinput" type="email" value={accountEmail} readOnly/></div>
              </div>
              <details className="settingsDetails"><summary>Change password</summary>
                <label className="lab" htmlFor="account-new-password">New password</label>
                <div className="srow"><input id="account-new-password" className="sinput" type="password" autoComplete="new-password" aria-describedby="new-password-help" value={newPassword} onChange={e=>setNewPassword(e.target.value)}/><button className="ghostbtn" onClick={changePassword}>Update password</button></div>
                <p id="new-password-help" className="hint" style={{marginTop:8}}>At least 8 characters.</p>
              </details>
              {accountSignedIn&&<div className="settingsActions"><button className="ghostbtn" onClick={disconnectAccount}>Sign out</button></div>}
            </section>
            <section className="settingsCard">
              <h2>Appearance</h2>
              <label className="lab" htmlFor="device-display">Display size · this device</label>
              <select id="device-display" className="sinput" value={deviceDisplay} onChange={event=>setDeviceDisplay(event.target.value)}><option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="roomy">Large</option></select>
              <p className="hint">Applies immediately on this device. Browser zoom still works.</p>
              <label className="lab" htmlFor="background-theme">Background</label>
              <select id="background-theme" className="sinput" value={backgroundTheme} onChange={e=>setBackgroundTheme(e.target.value)}>
                <option value="weave">Woven white</option><option value="neutral">Neutral grey</option><option value="paper">Warm paper</option><option value="graphite">Soft graphite</option><option value="atmospheric">Soft colour wash</option><option value="aurora">Aurora</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option>
              </select>
              <p style={{marginTop:10}}>Preview a background here, then save your choice.</p>
            </section>
            <section className="settingsCard" id="daily-content" tabIndex="-1">
              <h2>Daily content</h2>
              <p>Choose which shared tiles get daily content. Saved content stays for the whole day; applying preferences only fills missing tiles. Add tiles to Today in the Library.</p>
              <div className="genTileList">{SHARED_AI_TILES.map(([id,label])=><label key={id} className={"genTileRow"+(genEnabled(id)?" on":"")}><input id={"daily-enabled-"+id} type="checkbox" checked={genEnabled(id)} onChange={()=>toggleGenTile(id)}/><span>{label}</span></label>)}</div>
              <div className="settingsActions"><button type="button" className="ghostbtn" onClick={applyGenNow} disabled={genCfgBusy}>{genCfgBusy?"Applying…":"Apply preferences"}</button><button type="button" className="linklike" onClick={verifyGenConfig}>Check connection</button></div>
              <p role="status" aria-live="polite" style={{marginTop:10}}>{genCfgStatus||"These preferences save separately from your profile."}</p>
              <details className="settingsHelp" open={showServiceSetup} onToggle={event=>setShowServiceSetup(event.currentTarget.open)}><summary>Service connection setup</summary><p>Shared daily tiles need the service’s Claude key and its daily-save coordinator. A personal key powers Study, Memory filing and Philosophy replies.</p><p>The app owner can <a href="https://github.com/ferreolv/the_dashboard/blob/main/worker/README-deploy.md" target="_blank" rel="noreferrer">follow the worker deployment guide</a> to connect the coordinator and service key. Today’s saved tiles are kept.</p></details>
            </section>
            <section className="settingsCard">
              <h2>API keys</h2>
              <p>Your Claude key is needed for Study, Memory filing and Philosophy replies. Shared daily tiles use the service key; Weather needs no key.</p>
              <label className="lab" htmlFor="claude-key">Claude API key</label><input id="claude-key" className="sinput" type="password" autoComplete="off" spellCheck="false" placeholder="Paste your API key" value={keyField} onChange={e=>setKeyField(e.target.value)}/>
              <label className="lab" htmlFor="garmin-key">Garmin Connect key</label><input id="garmin-key" className="sinput" type="password" autoComplete="off" spellCheck="false" placeholder="Optional" value={garminKeyField} onChange={e=>setGarminKeyField(e.target.value)}/>
            </section>
            <section className="settingsCard">
              <h2>Location</h2>
              <p>For your clock and weather.</p>
              <div className="locationBadge">{locationProfile.name}{locationProfile.region?` · ${locationProfile.region}`:""} · {locationProfile.country}</div>
              <form onSubmit={e=>{e.preventDefault();findLocations();}}><label className="lab" htmlFor="location-search">Find a city</label><div className="srow"><input id="location-search" className="sinput" placeholder="City name" aria-describedby="location-feedback" value={locationQuery} onChange={e=>setLocationQuery(e.target.value)}/><button type="submit" className="ghostbtn" disabled={locationBusy}>{locationBusy?"Searching…":"Search"}</button></div></form>
              <p id="location-feedback" role="status" aria-live="polite" style={{marginTop:8}}>{locationFeedback}</p>
              {!!locationMatches.length&&<div className="placeResults">{locationMatches.map((place,i)=><button key={`${place.name}-${i}`} className="placeOption" onClick={()=>pickLocation(place)}><b>{place.name}{place.region?`, ${place.region}`:""}</b><span>{place.country} · {place.timezone}</span></button>)}</div>}
            </section>
            <section className="settingsCard">
              <h2>Health</h2>
              <p>Connect Garmin to bring in your daily health summary.</p>
              {healthToken?<><label className="lab" htmlFor="health-token">Connected token</label><input id="health-token" className="sinput" type="password" autoComplete="off" readOnly value={healthToken} onFocus={e=>e.target.select()}/><div className="settingsActions"><button className="ghostbtn" onClick={syncHealthNow} disabled={healthBusy}>{healthBusy?"Syncing…":"Sync now"}</button><button className="linklike" onClick={disableHealthToken}>Disconnect</button></div></>:<><label className="lab" htmlFor="health-token">Garmin sync token</label><input id="health-token" className="sinput" type="password" autoComplete="off" placeholder="Token from your Garmin setup" value={healthTokenField} onChange={e=>setHealthTokenField(e.target.value)}/><div className="settingsActions"><button className="ghostbtn" onClick={connectHealthToken} disabled={healthBusy}>{healthBusy?"Connecting…":"Connect Garmin"}</button></div></>}
              <div className="settingsActions"><button className="ghostbtn" onClick={importHealthJson}>Import Health JSON</button></div>
              <button className="linklike" style={{marginTop:14}} aria-expanded={showHealthHelp} aria-controls="health-setup-help" onClick={()=>setShowHealthHelp(v=>!v)}>{showHealthHelp?"Hide setup guide":"Show setup guide"}</button>
              {showHealthHelp&&<div className="settingsHelp" id="health-setup-help"><ol className="settingsList"><li>Choose a token of at least 8 characters and enter it above.</li><li>Save the same token and your Garmin credentials as secrets for scripts/garmin_to_dashboard.py.</li><li>Run the included GitHub Action on a schedule. Your dashboard checks for new data when it opens.</li></ol><p>An iOS Shortcut can also export Apple Health summaries as JSON.</p></div>}
            </section>
            <section className="settingsCard">
              <h2>Birthdays</h2>
              <p>Import birthdays from your contacts.</p>
              <div className="settingsActions"><button className="ghostbtn" onClick={()=>{const input=document.createElement('input');input.type='file';input.accept='.vcf,.vcard,text/vcard,text/x-vcard,text/directory,*/*';input.onchange=()=>{const file=input.files&&input.files[0];if(file)importVcf(file);};input.click();}}>Import contacts</button><button className="linklike" aria-expanded={showBirthdayHelp} aria-controls="birthday-import-help" onClick={()=>setShowBirthdayHelp(v=>!v)}>{showBirthdayHelp?"Hide guide":"Show guide"}</button></div>
              {showBirthdayHelp&&<div className="settingsHelp" id="birthday-import-help"><ol className="settingsList"><li>Check that your contacts have birthdays saved.</li><li>Export your contacts as a vCard (.vcf) file.</li><li>Choose Import contacts and select the file.</li></ol></div>}
            </section>
            <section className="settingsCard">
              <h2>Backup &amp; restore</h2>
              <p>Keep a copy of your dashboard data.</p>
              <div className="settingsActions"><button className="ghostbtn" onClick={exportBackup}>Download backup</button><button className="ghostbtn" onClick={importBackup}>Restore backup</button></div>
              <details className="settingsDetails"><summary>Delete account</summary><p>This permanently removes your account and its cloud data.</p><button className="link dangerLink" onClick={deleteAccount} disabled={deleteBusy}>{deleteBusy?"Deleting…":"Delete account"}</button></details>
            </section>
          </div>
          <div className="settingsSaveBar"><span className="saveState" role="status" aria-live="polite">{settingsDirty?"You have unsaved changes":"All changes saved"}</span><button className="ghostbtn" onClick={resetLayout}>Reset layout</button><button className="savebtn" onClick={saveSettings} disabled={!settingsDirty}>Save changes</button></div>
        </div>
      )}

      {page==="dashboard" && edit && <div className="edithint">Drag a tile by its handle and drop it where you want it; the others make room.</div>}

      {page==="settings"||page==="insights" ? null : page==="library" ? (
        <div className="libraryShelves">
          <div className="libraryTools">
            <div className="librarySearchRow">
              <div className="librarySearchField" role="search" aria-label="Widget library">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
                <input ref={librarySearchRef} type="search" aria-label="Search widgets" aria-controls="library-results" aria-describedby="library-result-count" placeholder="Find a widget…" value={libraryQuery} onChange={e=>setLibraryQuery(e.target.value)} onKeyDown={e=>{if(e.key==="Escape"){e.preventDefault();setLibraryQuery("");}}} />
                {libraryQuery&&<button className="librarySearchClear" aria-label="Clear widget search" onClick={()=>{setLibraryQuery("");librarySearchRef.current?.focus();}}>×</button>}
              </div>
              <p id="library-result-count" className="libraryResultCount" role="status" aria-live="polite" aria-atomic="true">{libraryIds.length} of {ALL.length} widgets</p>
            </div>
            <div className="libraryCategories" role="group" aria-label="Widget categories">
              {LIBRARY_CATEGORIES.map(category=><button key={category.id} className="libraryCategory" aria-pressed={libraryCategory===category.id} onClick={()=>setLibraryCategory(category.id)}>{category.label}</button>)}
            </div>
          </div>
          <div id="library-results" className="libraryResults">
            {libraryIds.length===0 ? <div className="libraryShelfEmpty libraryNoResults"><p>No widgets match. Try another name or category.</p><button className="ghostbtn" onClick={resetLibraryFilters}>Reset filters</button></div> : <>
              {(!libraryFiltered||libraryResting.length>0)&&<section className="libraryShelf">
                <div className="libraryShelfHead"><div><h2>Not on Today</h2><p>Find a widget, then tap + to add it.</p></div><span className="libraryShelfCount">{libraryResting.length} widget{libraryResting.length===1?"":"s"}</span></div>
                {libraryResting.length ? <div className="grid libraryGrid" style={{gridTemplateColumns:`repeat(${cols},1fr)`}}>{libraryResting.map(id=>widgets[id])}</div> : <div className="libraryShelfEmpty">Every widget is currently on Today.</div>}
              </section>}
              {(!libraryFiltered||libraryActive.length>0)&&<section className="libraryShelf">

/* The language tiles are a conversation: someone talks to you in the language, with the
   meaning under each line, and the flag is the speaker. Your own lines are said before they
   are seen: each shows only its meaning, its words masked, until you tap it. Today's dialogue
   when the lesson has one; otherwise the flag gives the day's point and the words are yours. */
const langChatLines=(dialogue,point,words)=>{
  const lines=(Array.isArray(dialogue)?dialogue:[]).filter(l=>l&&l.text);
  if(lines.length>=2) return Object.assign(lines.slice(0,4).map((l,i)=>({side:i%2?"me":"them",text:l.text,sub:l.sub||""})),{dialogue:true});
  return [point?{side:"them",text:point,sub:""}:null,...(words||[]).map(v=>({side:"me",text:v.text,sub:v.sub||"",after:v.after||""}))].filter(Boolean);
};
function LangChat({lines,country}){
  const [shown,setShown]=useState(()=>new Set());
  const flip=i=>setShown(prev=>{const next=new Set(prev); if(next.has(i))next.delete(i); else next.add(i); return next;});
  return <div className="langChat" data-fit-shrink="">
    {lines.map((l,i)=>{
      const hideable=l.side==="me"&&!!l.sub, open=!hideable||shown.has(i);
      const sub=open&&l.after?`${l.sub} · ${l.after}`:l.sub;
      const body=<><div className="langLine" aria-hidden={open?undefined:"true"}>{hideable?l.text.split(/(\s+)/).map((w,j)=>/\S/.test(w)?<span key={j} className="langMask">{w}</span>:w):l.text}</div>{sub&&<div className="langTrans">{sub}</div>}</>;
      return <div key={i} className={"langMsg "+l.side+(open?"":" masked")} data-fit-drop={String(10+i)}>
        {l.side==="them"&&<span className="langFlag" role="img" aria-label={country}/>}
        {hideable
          ?<button type="button" className="langMsgBubble" aria-pressed={open} aria-label={open?undefined:"Say it, then tap to check: "+l.sub} onClick={()=>flip(i)}>{body}</button>
          :<div className="langMsgBubble">{body}</div>}
      </div>;
    })}
  </div>;
}

const recallAnswerFor=item=>{
  const q=item&&item.quiz?item.quiz:{};
  const option=Array.isArray(q.options)?q.options[Number(q.answer)||0]:"";
  const explain=q.explain||"";
  // The translation (item.meta) belongs on the answer face itself, not in a footnote.
  const detail=[explain,item.meta].filter(Boolean).join(" — ");
  if(option) return {short:option, detail};
  if(detail) return {short:"Answer", detail};
  return {short:item.term||item.title||"Answer", detail:""};
};
const RECALL_TYPE_TAG={word:"Word",lesson:"Knowledge",spanish:"Español",german:"Deutsch",academic:"Study","brain-bank":"Memory"};
const isClozeCard=item=>!!(item&&item.type==="word"&&item.word&&item.word.term);
/* Front: only the cue, never the title or meta (they can give the answer away).
   Word cards show a sentence with a blank; without a sentence yet, the definition. */
function RecallFront({item,tag}){
  if(isClozeCard(item)){
    const parts=clozeParts(clozeFor(item));
    return (<>
      <span className="recallTag">{tag}</span>
      <span className="recallPrompt recallCloze">
        {parts?<>{parts.before}<span className="clozeGap" role="img" aria-label="blank"/>{parts.after}</>
          :<><span className="clozeGap" role="img" aria-label="blank"/>{item.word.def?<> · {item.word.def}</>:null}</>}
      </span>
    </>);
  }
  const prompts=(item.quiz&&item.quiz.prompts&&item.quiz.prompts.length)?item.quiz.prompts:[(item.quiz&&item.quiz.prompt)||item.title||"What do you remember?"];
  return (<><span className="recallTag">{tag}</span><span className="recallPrompt">{prompts[(item.seen||1)%prompts.length]||prompts[0]}</span></>);
}
/* Back: a Word card is its dictionary entry (the word as the sentence used it, the short
   definition, the French equivalent); other cards show their answer and explanation. */
function RecallBack({item,tag}){
  if(isClozeCard(item)){
    const w=item.word, parts=clozeParts(clozeFor(item)), form=parts?parts.form:w.term;
    return (<>
      <span className="recallTag">{tag}</span>
      <span className="recallAnswerBig recallHeadword">{form}</span>
      {w.def?<span className="recallDetail">{form.toLowerCase()!==w.term.toLowerCase()?<><i>{w.term}</i> · </>:null}{w.def}</span>:null}
      {w.fr?<span className="recallFr">— {w.fr}</span>:null}
    </>);
  }
  const answer=recallAnswerFor(item);
  return (<><span className="recallTag">{tag}</span><span className="recallAnswerBig">{answer.short}</span>{answer.detail?<span className="recallDetail">{answer.detail}</span>:null}</>);
}
/* One real flashcard at a time over one row of bars per tile that made the cards, each in
   that tile's colour. Tap the card (or any grade) to see the answer, tap a grade to move
   on. Tap a row to switch to it (its cards keep their order: the bars ahead stay locked),
   tap an earlier bar to look at that card again or change its grade. Every due card is
   in the session; "Again" brings the card back at the end of its row. The tile's expand
   shows the same session big; the session is saved, so a reload resumes it. */
function RecallCard({items,order,onSave,onComplete,onIncomplete}){
  const {expanded}=useTilePresentation();
  const byId=new Map((items||[]).map(x=>[x.id,x]));
  const [session,setSession]=useState(()=>buildRecallSession(items,todayKey,load("recallSession",null)));
  const [active,setActive]=useState(null);
  const [view,setView]=useState(null);
  const [flipped,setFlipped]=useState(false);
  useEffect(()=>{ const raw=JSON.stringify(session); try{ if(localStorage.getItem("fefe_recallSession")===raw) return; }catch{} save("recallSession",session); },[session]);
  const keys=recallRowOrder(session,order);
  const total=recallSessionSize(session), finished=recallSessionDone(session);
  const doneRef=useRef(null);
  useEffect(()=>{ const complete=total===0||finished; if(doneRef.current===complete) return; if(complete) onComplete(); else if(doneRef.current!==null) onIncomplete(); doneRef.current=complete; /* eslint-disable-next-line */ },[total,finished]);
  if(total===0) return <div className="recallDone"><span className="recallDoneGlyph" aria-hidden="true">✦</span><span className="recallDoneText">Nothing due</span></div>;
  // the open row: the one picked after the last grade while it has cards, else the next pick
  const autoRow=()=>active&&recallFrontier(session,active)>=0?active:(recallPickRow(session,keys,active||session.active,byId)||recallOpenRow(session,keys,active||session.active));
  const rowKey=view?view.key:autoRow();
  const row=rowKey?session.rows[rowKey]||[]:[];
  const index=view?view.index:recallFrontier(session,rowKey);
  const entry=index>=0?row[index]:null;
  const live=entry?byId.get(entry.id):null;
  const before=entry&&live?recallStateBefore(session,entry,live):null;
  const shown=live&&before?{...live,seen:before.seen}:live;
  const given=entry?session.grades[recallEntryKey(entry)]:null;
  const tone=COL[recallSourceByKey(rowKey).tile]||COL.recall;
  const tag=live?(RECALL_TYPE_TAG[live.type]||"Recall"):"";
  const rate=rating=>{
    if(!entry||!live) return;
    if(!flipped){ setFlipped(true); return; }
    const result=gradeRecallEntry(session,rowKey,index,rating,live);
    setSession(result.session); onSave(result.item);
    // the next card comes from another source when one has cards left (interleaved, most overdue first)
    setActive(recallPickRow(result.session,keys,rowKey,byId)||rowKey); setView(null); setFlipped(false);
  };
  const openBar=(key,i)=>{
    const e=(session.rows[key]||[])[i]; if(!e) return;
    if(session.grades[recallEntryKey(e)]){ setView({key,index:i}); setFlipped(true); }
    else { setActive(key); setView(null); setFlipped(false); }

  if(d<base) d=new Date(base.getFullYear()+1,Number(b.month)-1,Number(b.day));

    if(d.isNew) setPending(null); else if(d.el){ d.el.classList.remove("dragging","leaving"); d.el.style.setProperty("--x",d.ox); d.el.style.setProperty("--y",d.oy); } };

  const unpin=n=>{ finishWriting(); setFalling(n.id); setTimeout(()=>{ setFalling(null); onChange(matrixRemove(latest.current,n.id)); },440); };

  const boardTap=e=>{ e.stopPropagation(); if(e.target.closest(".pbNote,.pbPad")||wasWriting.current||!e.detail) return;
    const {b,nw}=geom(), id=matrixNewId();

    <span className="pbLbl imp" aria-hidden="true">Important</span><span className="pbLbl urg" aria-hidden="true">Urgent</span>
    {list.map(n=><div key={n.id} className={"pbNote"+(falling===n.id?" falling":"")+(editing===n.id?" editing":"")} style={{"--x":n.x,"--y":n.y,"--r":n.r+"deg"}}

      <button type="button" className="pbPin" aria-label={`Unpin “${n.text||"note"}”`} onClick={e=>{ e.stopPropagation(); if(e.detail===0) unpin(n); }}><span className="pbPinHead"/></button>

            onPointerDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()}
            onFocus={e=>{ const t=e.currentTarget; t.setSelectionRange(t.value.length,t.value.length); }}
            onKeyDown={e=>{ e.stopPropagation(); if((e.key==="Enter"&&!e.shiftKey)||e.key==="Escape"){ e.preventDefault(); e.currentTarget.blur(); } }}

function SustainCard({out,onToggle}){
  const {expanded}=useTilePresentation();

  const dragRef=useRef(null);
  const start=(e,it)=>{ if(e.button!=null&&e.button!==0) return; const el=e.currentTarget; el.setPointerCapture(e.pointerId); el.classList.remove("back");
    dragRef.current={id:it.id,el,pointer:e.pointerId,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),vx:0,vy:0,moved:false}; el.classList.add("dragging"); };
  const move=e=>{ const d=dragRef.current; if(!d||e.pointerId!==d.pointer) return;
    const now=performance.now(), dt=Math.max(1,now-d.t); d.vx=(e.clientX-d.lx)/dt; d.vy=(e.clientY-d.ly)/dt; d.lx=e.clientX; d.ly=e.clientY; d.t=now;
    const dx=e.clientX-d.sx, dy=e.clientY-d.sy; if(Math.hypot(dx,dy)>4) d.moved=true;
    d.el.style.transform=`translate(${dx}px,${dy}px) rotate(${Math.max(-20,Math.min(20,d.vx*25))}deg)`; };
  const end=e=>{ const d=dragRef.current; if(!d||e.pointerId!==d.pointer) return; dragRef.current=null; d.el.classList.remove("dragging");
    const tile=d.el.closest(".tile"), r=d.el.getBoundingClientRect(), tr=tile?tile.getBoundingClientRect():r, cx=r.left+r.width/2, cy=r.top+r.height/2;
    if(d.moved&&sustainRelease({cx,cy,tile:tr,vx:d.vx,vy:d.vy})==="out"){
      const n=Math.hypot(d.vx,d.vy); let ux=n>0.2?d.vx/n:cx-(tr.left+tr.width/2), uy=n>0.2?d.vy/n:cy-(tr.top+tr.height/2); const nn=Math.hypot(ux,uy)||1; ux/=nn; uy/=nn;
      const dx=e.clientX-d.sx, dy=e.clientY-d.sy; d.el.classList.add("out");
      d.el.style.transform=`translate(${dx+ux*tr.width*1.2}px,${dy+uy*tr.height*1.2}px) rotate(${ux*40}deg)`;
      setTimeout(()=>onToggle(d.id,true),360);
    } else { d.el.classList.add("back"); d.el.style.transform=""; }
  };
  return <div className="sustainCard">
    <div className={"sustainTray"+(done?" done":"")} role="group" aria-label={done?"Tray empty: a low‑carbon day":"Things to avoid today: drag one out of the tray when you have"}>
      {done?<SustainFlower/>:SUSTAIN_ITEMS.filter(it=>!(out||[]).includes(it.id)).map(it=>
        <div key={it.id} role="button" tabIndex={0} className="sustainBubble" title={it.label} aria-label={`${it.label}: drag it out of the tray if you avoided it today`}
          style={{"--d":it.d+"cqw",left:`calc(${it.x}% - ${it.d/2}cqw)`,top:`calc(${it.y}% - ${it.d/2}cqw)`}}
          onPointerDown={e=>start(e,it)} onPointerMove={move} onPointerUp={end} onPointerCancel={end}
          onKeyDown={e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onToggle(it.id,true); } }} onClick={e=>e.stopPropagation()}>
          <span aria-hidden="true">{it.emoji}</span>
        </div>)}
    </div>
    <div hidden={!expanded} className="cardExpandedDetails sustainList">
      {SUSTAIN_ITEMS.map(it=>{ const gone=(out||[]).includes(it.id); return <div key={it.id} className={"sustainRow"+(gone?" gone":"")}>
        <span className="sustainRowEmoji" aria-hidden="true">{it.emoji}</span>
        <span className="sustainRowName">{it.label}<small>≈ {it.kg} kg CO₂e · {it.note}</small></span>
        <button type="button" className={"sustainPill"+(gone?" on":"")} aria-pressed={gone} aria-label={(gone?"Avoided today: put ":"In the tray: mark ")+it.label+(gone?" back in the tray":" avoided")} onClick={e=>{e.stopPropagation();onToggle(it.id,!gone);}}>{gone?"Avoided":"In tray"}</button>
      </div>; })}
    </div>
