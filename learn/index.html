<body>
  <div id="root"></div>
  <script type="text/babel">
    const {useEffect,useState}=React;
    const load=(k,fb)=>{try{const v=localStorage.getItem("fefe_"+k);return v==null?fb:JSON.parse(v)}catch{return fb}};
    const save=(k,val)=>{try{localStorage.setItem("fefe_"+k,JSON.stringify(val));schedulePush()}catch(e){}};
    const getKey=()=> (localStorage.getItem("fefe_apiKey")||"").trim();
    const SYNC_URL="https://fefe-sync.fefedashboard.workers.dev";
    const SYNC_EXCLUDE=new Set(["fefe_apiKey","fefe_syncId","fefe_syncStamp"]);
    const getSyncId=()=>localStorage.getItem("fefe_syncId")||"";
    function collectState(){const state={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith("fefe_")&&!SYNC_EXCLUDE.has(key))state[key]=localStorage.getItem(key)}return state}
    let pushTimer=null;
    function schedulePush(){const id=getSyncId();if(!id)return;clearTimeout(pushTimer);pushTimer=setTimeout(async()=>{try{const updatedAt=Date.now(),response=await fetch(SYNC_URL+"/data",{method:"POST",headers:{"Content-Type":"application/json","X-Sync-Code":id},body:JSON.stringify({updatedAt,data:collectState()})});if(response.ok)localStorage.setItem("fefe_syncStamp",String(updatedAt))}catch(e){}},3500)}
    async function pullSync(){const id=getSyncId();if(!id)return false;try{const response=await fetch(SYNC_URL+"/data",{headers:{"X-Sync-Code":id}});if(!response.ok)return false;const doc=await response.json(),local=Number(localStorage.getItem("fefe_syncStamp")||0);if(doc&&doc.updatedAt&&doc.data&&doc.updatedAt>local){Object.entries(doc.data).forEach(([key,value])=>{if(key.startsWith("fefe_")&&!SYNC_EXCLUDE.has(key))localStorage.setItem(key,String(value))});localStorage.setItem("fefe_syncStamp",String(doc.updatedAt));return true}}catch(e){}return false}
    const pad=n=>String(n).padStart(2,"0");

  const recordAnswer=(ok,marker)=>{ if(picked!==null)return; setPicked(marker);setLastOk(ok); const nextCombo=ok?combo+1:0,nextHearts=ok?hearts:Math.max(0,hearts-1); if(ok)setCorrect(v=>v+1); setCombo(nextCombo);setRunBest(v=>Math.max(v,nextCombo));setHearts(nextHearts); if(mode.boss){if(ok)setBossHp(v=>Math.max(0,v-100/deck.length));else if(nextHearts===0)setKnockedOut(true);} const gained=Math.round((ok?10+Math.min(nextCombo,5)*2+(confidence===3?2:0):2)*mode.multiplier);setScore(v=>v+gained); const base=gameCards.find(c=>c.id===card.id)||card,updated=fsrsReview(base,ok?(confidence===3?4:3):1),generalCards=gameCards.map(c=>c.id===base.id?updated:c),prev=data.sessions[todayKey]||{seconds:0,answers:0,correct:0},xp=(data.profile.xp||0)+gained; onChange({...data,generalCards,sessions:{...data.sessions,[todayKey]:{...prev,answers:prev.answers+1,correct:prev.correct+(ok?1:0),lastMode:mode.id}},profile:{...data.profile,xp,level:1+Math.floor(xp/250),lastPlayed:todayKey,bestCombo:Math.max(data.profile.bestCombo||0,nextCombo)}}); };
  const choose=i=>recordAnswer(i===Number(card.answer),i);
  const submitForge=()=>{ if(!card||forgePicks.length!==(card._orderedChunks||[]).length)return; const ok=forgePicks.every((id,i)=>id===card._orderedChunks[i].id); recordAnswer(ok,"forge"); };
  const complete=()=>{ const d=normalizeLearnDB(data),prev=d.sessions[todayKey]||{seconds:0,answers:0,correct:0},wonBoss=mode.boss&&!knockedOut; d.sessions={...d.sessions,[todayKey]:{...prev,seconds:prev.seconds+Math.max(0,elapsed),lastPlayedAt:Date.now(),lastMode:mode.id}}; d.profile={...d.profile,lastPlayed:todayKey,runs:(d.profile.runs||0)+1,bossesBeaten:(d.profile.bossesBeaten||0)+(wonBoss?1:0),bestCombo:Math.max(d.profile.bestCombo||0,runBest)}; d.profile.streak=learningStreak(d);onChange(d);setElapsed(0);setFinished(true); };
  const next=()=>{ if(knockedOut||pos+1>=deck.length)complete(); else {setPos(v=>v+1);setPicked(null);setLastOk(null);setConfidence(2);setForgePicks([]);} };
  const leave=()=>{ if(elapsed>0)flush(data);setPlaying(false);setFinished(false); };
  if(playing&&!finished&&card)return <main className="gameStage">
    <div className="gameTop"><button className="quietBtn" onClick={leave}>← Escape hatch</button><div className="gameMeter"><span style={{width:((pos+1)/deck.length*100)+"%"}}/></div><span className="gameClock">{Math.floor(elapsed/60)}:{String(elapsed%60).padStart(2,"0")}</span></div>
    <div className="gameHud"><span className="gameLives">{mode.boss?"❤️".repeat(hearts):mode.emoji+" "+mode.name}</span><span className={"gameCombo"+(combo>=2?" hot":"")}>⚡ {combo}× combo</span><span className="gameScore">✨ {score} XP</span></div>
    {mode.boss&&<div className="bossArena"><span className="bossFace">{knockedOut?"😵":bossEmoji}</span><div className="bossBody"><div className="bossName">{String(bossName||"THE FORGETTING BLOB").toUpperCase()} · {Math.ceil(bossHp)} HP</div><div className="bossHp"><span style={{width:bossHp+"%"}}/></div></div></div>}
    <article className={"gameCard format-"+(card._format||"choice")}><span className="gameSource">{card._format==="forge"?"🔨 Memory forge":card._format==="link"?"🪐 Connection portal":card._format==="timeline"?"⏳ Time tunnel":card.kind==="academic"?"🎓 Academic loot":"🧠 Brain loot"} · {pos+1}/{deck.length}</span><h2>{card.prompt}</h2><div className="confidenceRow"><span>Gut feeling?</span>{[[1,"😬 Guess"],[2,"🤔 Maybe"],[3,"😎 Sure"]].map(([n,label])=><button key={n} className={confidence===n?"on":""} disabled={picked!==null} onClick={()=>setConfidence(n)}>{label}</button>)}</div>{card._format==="forge"?<div className="forgeGame"><div className={"forgeBuild"+(picked!==null?(lastOk?" correct":" wrong"):"")}>{forgePicks.length?forgePicks.map(id=><button key={id} disabled={picked!==null} onClick={()=>setForgePicks(v=>v.filter(x=>x!==id))}>{(card._chunks.find(x=>x.id===id)||{}).text}</button>):<span>Tap the fragments in the right order…</span>}</div><div className="forgePieces">{(card._chunks||[]).filter(x=>!forgePicks.includes(x.id)).map(x=><button key={x.id} disabled={picked!==null} onClick={()=>setForgePicks(v=>[...v,x.id])}>{x.text}</button>)}</div>{picked===null&&<button className="forgeSubmit" disabled={forgePicks.length!==(card._orderedChunks||[]).length} onClick={submitForge}>Forge this memory 🔨</button>}</div>:<div className={"gameOptions"+(card._format==="link"?" linkOptions":"")}>{(card.options||[]).map((o,i)=><button key={i} className={"gameOption"+(picked!==null?(i===Number(card.answer)?" correct":i===picked?" wrong":""):"")} onClick={()=>choose(i)}><span>{card._format==="timeline"?"⏳":card._format==="link"?"✦":String.fromCharCode(65+i)}</span>{o}</button>)}</div>}{picked!==null&&<><div className="gameExplain">{lastOk?(combo>=2?`⚡ ${combo} hit combo! `:"🎯 Bonk! "):"🩹 Memory patched. "}{card.explain||"Lock in the connection, then move."}</div><div className="gameActions"><button className="playBtn" onClick={next}>{knockedOut?"Grab the loot and retreat":pos+1===deck.length?"Open the treasure chest":"Next weird thing →"}</button></div></>}</article>
  </main>;
  if(playing&&finished)return <main className="gameStage"><article className="gameCard" style={{textAlign:"center"}}><div className="resultSticker">{mode.boss?(knockedOut?"🫠":"🏆"):correct/deck.length>=.7?"🍭":"🧠"}</div><span className="gameSource">{knockedOut?"The blob got away... this time":"Run squished!"}</span><h2>{correct}/{deck.length} memories bonked into place</h2><div className="resultLoot"><span className="lootChip">✨ +{score} XP</span><span className="lootChip">⚡ best combo {runBest}</span><span className="lootChip">{minutes>=5?"🔥 streak safe":`${Math.max(0,5-minutes)} min to streak`}</span></div><div className="gameActions"><button className="playBtn" onClick={()=>start(mode.id)}>Again! Again!</button><button className="quietBtn" onClick={leave}>Back to the playground</button></div></article></main>;
  return <main className="learnShell">
    <section className="learnHero"><div className="learnEyebrow">⚡ The core atlas is open</div><h1>Know the world. Keep it.</h1><p>Big ideas, real mechanisms, no filler. Every run mixes science, history, money, maps, art and systems—then schedules exactly what your memory needs next.</p><div className="learnStats"><div className="learnStat"><b>{minutes}/5 min</b><span>Today</span></div><div className="learnStat"><b>{streak} 🔥</b><span>Streak</span></div><div className="learnStat"><b>Lv {data.profile.level||1}</b><span>{data.profile.xp||0} XP</span></div><div className="learnStat"><b>{mastered}/{gameCards.length}</b><span>Mastered</span></div></div></section>
    <div className="playModes"><button className="modeCard sun" disabled={!gameCards.length||preparing} onClick={()=>start("rush")}><span className="modeTag">~2 min</span><span className="modeEmoji">🍬</span><b>Sugar Rush</b><small>Six fast questions from the atlas. A tiny win that still compounds.</small></button><button className="modeCard gum" disabled={!gameCards.length||preparing} onClick={()=>start("quest")}><span className="modeTag">12 cards</span><span className="modeEmoji">🗺️</span><b>Knowledge Quest</b><small>Mechanisms, connections, timelines and memory-forging across the world.</small></button><button className="modeCard grape" disabled={!gameCards.length||preparing} onClick={()=>start("boss")}><span className="modeTag">{preparing?"mixing…":getKey()?"daily remix":"3 lives"}</span><span className="modeEmoji">{preparing?"🌀":"👾"}</span><b>{preparing?"Building monster…":"Mega Boss"}</b><small>Beat a cross-domain boss. AI remix is constrained to the curated atlas.</small></button></div>
    <div className="learnGrid"><section className="learnPanel"><h2>🌍 Atlas territories</h2><p>{due.length?`${due.length} ideas are at the edge of forgetting.`:"Everything is watered. The next run will introduce or strengthen the next useful ideas."}</p>{roots.length>0&&<div className="knowledgeGalaxy">{roots.map(([name,count],i)=><div className="galaxyNode" key={name} style={{"--i":i}}><span>{["🔬","📜","🌦️","💸","🎨","💻","🌿"][i%7]}</span><b>{name}</b><small>{count}</small></div>)}</div>}<div className="sourceRow"><span className="sourceDot"/><div><b>Curated core atlas</b><span>{gameCards.length} source-linked foundations</span></div></div><div className="sourceRow"><span className="sourceDot" style={{background:"#ef5f9d",boxShadow:"0 0 0 5px #ffe9f2"}}/><div><b>Territories explored</b><span>{domains.length} broad domains in rotation</span></div></div></section><aside className="learnPanel"><h2>🏆 Loot shelf</h2><p>{data.profile.runs||0} runs · {data.profile.bossesBeaten||0} bosses squished · best combo {data.profile.bestCombo||0}×</p><div style={{fontSize:32,letterSpacing:5,margin:"18px 0"}}>{(data.profile.runs||0)>0?"🍬":"◻️"} {(data.profile.bossesBeaten||0)?"👑":"◻️"} {mastered>4?"💎":"◻️"}</div><button className="quietBtn" onClick={onExit}>← Sneak back to today</button></aside></div>
  </main>;
}


    function summaryFor(db){
      const data=normalizeLearnDB(db);
      const seconds=((data.sessions[todayKey]||{}).seconds||0);
      const due=(data.generalCards||[]).filter(c=>!c.fsrs||!c.fsrs.due||c.fsrs.due<=todayKey).length;
      return {date:todayKey,seconds,minutes:Math.floor(seconds/60),streak:learningStreak(data),due,updatedAt:Date.now()};
    }
    function LearnApp(){
      const [db,setDb]=useState(()=>normalizeLearnDB(load("learnDB",null)));
      const persist=nextValue=>setDb(current=>{
        const next=normalizeLearnDB(typeof nextValue==="function"?nextValue(current):nextValue);
        save("learnDB",next);save("learnSummary",summaryFor(next));return next;
      });
      useEffect(()=>{let active=true;pullSync().then(changed=>{if(!active)return;const current=changed?normalizeLearnDB(load("learnDB",null)):db;if(changed)setDb(current);save("learnDB",current);save("learnSummary",summaryFor(current))});return()=>{active=false}},[]);
      return <><nav className="learnAppNav"><div className="learnBrand"><span className="learnBrandMark">✦</span><span>Learn playground</span></div><button className="dashboardLink" onClick={()=>location.href="../#/dashboard"}>Today & Library →</button></nav><LearnHub db={db} onChange={persist} onExit={()=>location.href="../#/dashboard"} /></>;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<LearnApp/>);
  </script>
</body>
